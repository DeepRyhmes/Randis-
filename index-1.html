splay:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.page-head h1{font-size:23px;margin:0;color:var(--navy)}.page-head p{margin:3px 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .value{font-size:25px;font-weight:900;margin-top:7px;color:var(--navy)}.stat .sub{font-size:11px;color:#8b98a9}.panel{margin-top:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.panel h3{margin:0;font-size:15px;color:var(--navy)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;color:#607086;font-weight:800}.field input,.field select,.field textarea,.filters input,.filters select{border:1px solid #dce4ee;background:white;border-radius:9px;padding:9px 11px;min-width:0;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2498df1c}.filters input,.filters select{font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 9px;border-bottom:1px solid #edf0f5;text-align:right;font-size:12px;white-space:nowrap}th{color:#8290a2;background:#f8fafc;font-weight:900}td{color:#344256}.pill{display:inline-block;border-radius:30px;padding:4px 9px;font-size:10px;font-weight:900;background:#edf3fa;color:#49617e}.pill.green{background:#e7f7ef;color:#13865b}.pill.red{background:#fff0f1;color:#c83d4b}.pill.amber{background:#fff5df;color:#a66a08}.pill.blue{background:#e8f5ff;color:#1877b7}.actions{display:flex;gap:5px}.empty{text-align:center;padding:30px;color:#9aa6b7}.modal-back{position:fixed;inset:0;background:#07162b88;z-index:30;display:grid;place-items:center;padding:14px}.modal{background:white;border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px;color:var(--navy);font-size:19px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#1d5891,#102b59 55%,#091a36)}.login-card{background:white;width:min(420px,100%);padding:28px;border-radius:22px;box-shadow:0 24px 80px #0005}.login-card h1{color:var(--navy);margin:10px 0 3px}.login-card p{color:var(--muted);font-size:12px;margin:0 0 20px}.login-card .field{margin:12px 0}.login-card .btn{width:100%;margin-top:10px;padding:12px}.notice{padding:11px 13px;background:#fff7e7;color:#85590b;border:1px solid #f3dfb6;border-radius:11px;font-size:11px;line-height:1.8;margin-top:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.quick{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.money{font-weight:900;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}.mobile-nav{display:none}.toast{position:fixed;bottom:18px;left:18px;background:#142b4e;color:white;padding:12px 16px;border-radius:11px;z-index:60;box-shadow:var(--shadow);font-size:12px}.brand-randis{color:var(--wine)}.brand-box{color:#2695d5}.danger-note{font-size:11px;color:#9a5a00;line-height:1.8}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:15px 12px 85px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat .value{font-size:21px}.top{padding:0 12px}.mobile-nav{display:flex;position:fixed;bottom:0;right:0;left:0;background:white;border-top:1px solid var(--line);z-index:15;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}.mobile-nav button{background:transparent;color:#627187;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}.mobile-nav button.active{color:var(--blue);font-weight:900}.page-head h1{font-size:19px}.two{grid-template-columns:1fr}}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.top small{display:none}.top-actions .btn{padding:7px 9px;font-size:11px}.stat .label{font-size:10px}}

<body>
<div id="loginView" class="login"><div class="login-card"><div class="logo">BX</div><h1>BOX IT <span class="brand-randis">× Randis</span></h1><p>نظام إدارة الشحنات والتوصيل والحسابات</p><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="username" required placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></div><button class="btn dark" type="submit">تسجيل الدخول</button></form><div class="notice">يجب إنشاء الحسابات مسبقاً في Firebase Authentication. لا تشارك كلمة المرور مع أي شخص.</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div class="logo">BX</div><div>BOX IT <span style="color:#f2b9ca">× Randis</span><br><small id="roleLabel">Logistics OS</small></div></div><div class="top-actions"><button class="btn secondary small" id="modeBtn">تبديل الوضع</button><button class="btn small" id="logoutBtn">خروج</button></div></header><div class="layout"><aside><div class="nav" id="sideNav"></div><div class="side-foot">نسخة تشغيل أولية متصلة بـ Firebase<br>العمليات المالية الحساسة تتطلب قواعد وخدمات خادمية.</div></aside><main id="main"></main></div><nav class="mobile-nav" id="mobileNav"></nav></div>
<div id="modalHost"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,addDoc,getDocs,getDoc,setDoc,updateDoc,deleteDoc,query,where,orderBy,limit,serverTimestamp,runTransaction} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDUuf6K80I7HXiT_8CChLH9B5eDpmiDalk',authDomain:'order-manger-848ce.firebaseapp.com',projectId:'order-manger-848ce',storageBucket:'order-manger-848ce.firebasestorage.app',messagingSenderId:'174411866795',appId:'1:174411866795:web:68f53f6fd06c6cd5e7cdee'};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const $=id=>document.getElementById(id);let user=null,role='admin',mode='admin',orders=[],drivers=[],transfers=[],page='dashboard',busy=false;
const STATUSES=['طلب جديد','تم الاستلام','تم التحميل','قيد التوصيل','تم التسليم','تسليم جزئي','رفض استلام','مرتجع','مؤجل','تعذر الوصول','عنوان خطأ','تالف','ملغي'];
const navItems=[['dashboard','▦','الرئيسية','all'],['orders','▤','الطلبيات','all'],['drivers','♙','المندوبون','admin'],['warehouse','▣','المستودع','admin'],['finance','＄','الحسابات والتسويات','admin'],['transfers','⇄','التحويلات','admin'],['reports','▥','التقارير','admin'],['customers','♧','العملاء والشكاوى','admin'],['settings','⚙','الإعدادات','admin']];
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function num(v){return Number(v)||0}function money(v){return num(v).toFixed(2)+' د.أ'}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}function date(v){if(!v)return '—';let d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString('ar-JO')}function stamp(){return new Date().toISOString()}function isAdmin(){return role==='admin'&&mode==='admin'}
function statusClass(s){if(['تم التسليم'].includes(s))return'green';if(['مرتجع','رفض استلام','تالف','ملغي'].includes(s))return'red';if(['قيد التوصيل','تم التحميل','تم الاستلام'].includes(s))return'blue';if(['تسليم جزئي','مؤجل','تعذر الوصول'].includes(s))return'amber';return''}
function nav(){let allowed=navItems.filter(x=>x[3]==='all'||isAdmin());const html=allowed.map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'active':''}"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');$('sideNav').innerHTML=html;$('mobileNav').innerHTML=allowed.slice(0,5).map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'active':''}"><span>${x[1]}</span>${x[2]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});}
async function loadData(){const [o,d,t]=await Promise.all([getDocs(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(500))),getDocs(collection(db,'drivers')),getDocs(query(collection(db,'transfers'),orderBy('createdAt','desc'),limit(200)))]);orders=o.docs.map(x=>({id:x.id,...x.data()}));drivers=d.docs.map(x=>({id:x.id,...x.data()}));transfers=t.docs.map(x=>({id:x.id,...x.data()}));if(role!=='admin')orders=orders.filter(x=>x.createdBy===user.uid||x.merchantUid===user.uid||x.merchantEmail===user.email);}
function pageHead(title,desc,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,sub=''){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function dashboard(){let delivered=orders.filter(x=>x.status==='تم التسليم'),pending=orders.filter(x=>!['تم التسليم','مرتجع','ملغي'].includes(x.status)),cod=delivered.reduce((a,x)=>a+num(x.deliveredAmount??x.price),0),fees=delivered.reduce((a,x)=>a+num(x.deliveryFee),0);return pageHead('لوحة التحكم','ملخص حركة الشحنات والحسابات',`<button class="btn" onclick="window.openOrder()">＋ طلبية جديدة</button>`)+`<section class="grid">${stat('إجمالي الطلبيات',orders.length,'كل الشحنات المسجلة')}${stat('قيد التنفيذ',pending.length,'تحتاج متابعة')}${stat('تم التسليم',delivered.length,'الشحنات المكتملة')}${stat('تحصيل COD المسجل',money(cod),'المبلغ المدخل فعلياً فقط')}</section><div class="two"><div class="panel"><div class="panel-head"><h3>آخر الطلبيات</h3><button class="btn secondary small" onclick="window.go('orders')">عرض الكل</button></div>${orders.slice(0,6).map(orderRow).join('')||'<div class="empty">لا توجد طلبيات بعد</div>'}</div><div class="panel"><div class="panel-head"><h3>ملخص التشغيل</h3></div><p>أجرة التوصيل المسجلة على الشحنات المسلمة: <b>${money(fees)}</b></p><p>عدد المندوبين: <b>${drivers.length}</b></p><p>عدد التحويلات المسجلة: <b>${transfers.length}</b></p><div class="notice">قيمة COD أمانة للتاجر وليست إيراداً للشركة. لا تعتمد الأرقام المالية كتسوية نهائية قبل تفعيل Cloud Functions وقواعد Firestore الآمنة.</div></div></div>`}
function orderRow(o){return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f5"><div style="min-width:0"><b>${esc(o.customer||'بدون اسم')}</b><div class="muted" style="font-size:10px">${esc(o.area||'')} · ${esc(o.trackingId||o.id.slice(0,8))}</div></div><div style="text-align:left"><span class="pill ${statusClass(o.status)}">${esc(o.status||'طلب جديد')}</span><div class="muted" style="font-size:10px;margin-top:4px">${money(o.price)}</div></div></div>`}
function ordersPage(){let rows=orders.map(o=>`<tr><td><b>${esc(o.customer||'—')}</b><div class="muted">${esc(o.phone||'')}</div></td><td>${esc(o.area||'—')}</td><td>${esc(o.trackingId||o.id.slice(0,8))}</td><td>${money(o.price)}</td><td>${money(o.deliveredAmount||0)}</td><td><span class="pill ${statusClass(o.status)}">${esc(o.status||'طلب جديد')}</span></td><td>${date(o.createdAt)}</td><td><div class="actions"><button class="btn secondary small" onclick="window.editOrder('${o.id}')">تعديل</button><button class="btn small" onclick="window.changeStatus('${o.id}')">الحالة</button></div></td></tr>`).join('');return pageHead('إدارة الطلبيات','إنشاء وتتبع وتحديث الشحنات',`<button class="btn" onclick="window.openOrder()">＋ إضافة طلبية</button>`)+`<div class="panel"><div class="filters"><input id="orderSearch" placeholder="بحث بالاسم أو الهاتف أو التتبع" oninput="window.filterOrders()"><select id="statusFilter" onchange="window.filterOrders()"><option value="">كل الحالات</option>${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn secondary small" onclick="window.exportOrders()">تصدير CSV</button></div><div class="table-wrap"><table id="ordersTable"><thead><tr><th>العميل</th><th>المنطقة</th><th>رقم التتبع</th><th>قيمة الطلب</th><th>المحصل فعلياً</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">لا توجد بيانات</td></tr>'}</tbody></table></div></div>`}
function driversPage(){return pageHead('المندوبون','إدارة بيانات المندوبين وإسناد الشحنات',`<button class="btn" onclick="window.addDriver()">＋ مندوب جديد</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>المنطقة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${drivers.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.phone)}</td><td>${esc(d.area)}</td><td><span class="pill ${d.active===false?'red':'green'}">${d.active===false?'غير نشط':'نشط'}</span></td><td><button class="btn secondary small" onclick="window.assignDriver('${d.id}')">إسناد شحنات</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا يوجد مندوبون</td></tr>'}</tbody></table></div></div>`}
function warehouse(){let stages=['طلب جديد','تم الاستلام','تم التحميل','قيد التوصيل','مرتجع'];return pageHead('المستودع والفرز','متابعة حركة الشحنات بين الاستلام والتحميل والتوزيع')+`<div class="grid">${stages.map(s=>stat(s,orders.filter(o=>o.status===s).length,'شحنة')).join('')}</div><div class="panel"><h3>الشحنات الموجودة في دورة المستودع</h3><div class="table-wrap"><table><thead><tr><th>التتبع</th><th>العميل</th><th>المنطقة</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody>${orders.filter(o=>['طلب جديد','تم الاستلام','تم التحميل','مرتجع'].includes(o.status)).map(o=>`<tr><td>${esc(o.trackingId||o.id.slice(0,8))}</td><td>${esc(o.customer)}</td><td>${esc(o.area)}</td><td>${esc(o.status)}</td><td><button class="btn small" onclick="window.changeStatus('${o.id}')">تحديث الحالة</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد شحنات</td></tr>'}</tbody></table></div></div>`}
function finance(){let delivered=orders.filter(o=>o.status==='تم التسليم'),cod=delivered.reduce((a,o)=>a+num(o.deliveredAmount),0),fee=delivered.reduce((a,o)=>a+num(o.deliveryFee),0),merchant=cod-fee;return pageHead('الحسابات والتسويات','ملخص تشغيلي مبدئي — لا يمثل دفتر أستاذ معتمداً',`<button class="btn" onclick="window.addTransfer()">＋ تسجيل تحويل</button>`)+`<div class="grid">${stat('COD المحصل فعلياً',money(cod),'من الشحنات المسلمة')}${stat('أجور توصيل مسجلة',money(fee),'إيراد توصيل مبدئي')}${stat('صافي مستحق التاجر',money(merchant),'قبل الخصومات والتسويات الأخرى')}${stat('التحويلات المسجلة',transfers.length,'عدد الحركات')}</div><div class="notice">المعادلة المعروضة تقديرية: المحصل فعلياً − أجرة التوصيل. لا تخصم أو تسوّي تلقائياً. تسجيل التحويل هنا يسجل الحركة فقط ولا يثبت وصول المال للبنك.</div><div class="panel"><div class="panel-head"><h3>سجل التحويلات</h3></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الطرف</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظة</th></tr></thead><tbody>${transfers.map(t=>`<tr><td>${date(t.createdAt)}</td><td>${esc(t.type)}</td><td>${esc(t.party)}</td><td>${money(t.amount)}</td><td>${esc(t.method)}</td><td>${esc(t.note||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد تحويلات</td></tr>'}</tbody></table></div></div>`}
function transfersPage(){return finance()}
function reports(){let by={};orders.forEach(o=>by[o.status||'طلب جديد']=(by[o.status||'طلب جديد']||0)+1);return pageHead('التقارير','ملخص الحالات والأداء')+`<div class="panel"><h3>توزيع الشحنات حسب الحالة</h3>${Object.entries(by).map(([s,n])=>`<div style="display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #eee"><span>${esc(s)}</span><b>${n}</b></div>`).join('')||'<div class="empty">لا بيانات</div>'}</div><div class="panel"><h3>تصدير البيانات</h3><p class="muted">يمكنك تنزيل قائمة الشحنات بصيغة CSV وفتحها في Excel.</p><button class="btn" onclick="window.exportOrders()">تصدير الطلبيات CSV</button></div>`}
function customers(){return pageHead('العملاء والشكاوى','قائمة أرقام العملاء المسجلة في الشحنات')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>العميل</th><th>الهاتف</th><th>عدد الطلبات</th><th>مرات الرفض/المرتجع</th></tr></thead><tbody>${Object.values(orders.reduce((a,o)=>{let k=o.phone||o.customer||'غير معروف';a[k]??={name:o.customer,phone:o.phone,n:0,r:0};a[k].n++;if(['رفض استلام','مرتجع'].includes(o.status))a[k].r++;return a},{})).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.n}</td><td>${c.r}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا بيانات</td></tr>'}</tbody></table></div></div>`}
function settings(){return pageHead('الإعدادات','معلومات النظام والاتصال')+`<div class="panel"><h3>الحساب الحالي</h3><p>${esc(user.email)}</p><p>الصلاحية: ${role==='admin'?'مدير':'تاجر'}</p><p>الوضع الحالي: ${mode==='admin'?'إدارة Box It':'وضع التاجر'}</p></div><div class="panel"><h3>مجموعات Firebase المستخدمة</h3><p class="muted">orders · drivers · transfers · accounting_history · accounting/current</p><p class="muted">المجموعات الإضافية تُنشأ عند الحاجة: customers · complaints · audit_logs · expenses · settlements</p></div><div class="notice">لا توجد في هذا الملف مفاتيح خادم. مفتاح Firebase Web API ظاهر بطبيعته في تطبيق الويب. الحماية الحقيقية يجب أن تكون في Firestore Rules وCloud Functions وApp Check.</div>`}
function render(){nav();$('roleLabel').textContent=(role==='admin'?'مدير Box It':'حساب Randis')+' · '+(mode==='admin'?'الإدارة':'التاجر');let html={dashboard,orders:ordersPage,drivers:driversPage,warehouse,finance,transfers:transfersPage,reports,customers,settings}[page]||dashboard;$('main').innerHTML=html();}
function modal(title,body,saveText,saveFn){$('modalHost').innerHTML=`<div class="modal-back" id="backdrop"><div class="modal"><h2>${title}</h2>${body}<div class="modal-actions"><button class="btn" id="modalSave">${saveText||'حفظ'}</button><button class="btn secondary" id="modalCancel">إلغاء</button></div></div></div>`;$('modalCancel').onclick=closeModal;$('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeModal()};$('modalSave').onclick=async()=>{if(busy)return;busy=true;$('modalSave').disabled=true;try{await saveFn();closeModal();await loadData();render();}catch(e){console.error(e);toast('تعذر الحفظ: '+(e.message||e.code||'خطأ'))}finally{busy=false}}}function closeModal(){$('modalHost').innerHTML=''}
window.openOrder=(o={})=>{let edit=!!o.id;modal(edit?'تعديل الطلبية':'إضافة طلبية جديدة',`<div class="form-grid"><div class="field"><label>اسم العميل *</label><input id="fCustomer" required value="${esc(o.customer||'')}"></div><div class="field"><label>رقم الهاتف *</label><input id="fPhone" value="${esc(o.phone||'')}"></div><div class="field"><label>المنطقة *</label><input id="fArea" value="${esc(o.area||'')}"></div><div class="field"><label>قيمة الطلب (COD)</label><input id="fPrice" type="number" step="0.01" value="${num(o.price)}"></div><div class="field"><label>أجرة التوصيل</label><input id="fFee" type="number" step="0.01" value="${num(o.deliveryFee??2)}"></div><div class="field"><label>المبلغ المحصل فعلياً</label><input id="fCollected" type="number" step="0.01" value="${num(o.deliveredAmount)}"></div><div class="field"><label>الحالة</label><select id="fStatus">${STATUSES.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>رقم التتبع</label><input id="fTracking" value="${esc(o.trackingId||('BX'+Date.now().toString().slice(-9)))}"></div><div class="field wide"><label>ملاحظات</label><textarea id="fNotes" rows="2">${esc(o.notes||'')}</textarea></div></div>`,edit?'حفظ التعديلات':'إنشاء الطلبية',async()=>{let customer=$('fCustomer').value.trim(),phone=$('fPhone').value.trim(),area=$('fArea').value.trim();if(!customer||!phone||!area)throw Error('أدخل الاسم والهاتف والمنطقة');let data={customer,phone,area,price:num($('fPrice').value),deliveryFee:num($('fFee').value),deliveredAmount:num($('fCollected').value),status:$('fStatus').value,trackingId:$('fTracking').value.trim(),notes:$('fNotes').value.trim(),updatedAt:serverTimestamp()};if(edit){await updateDoc(doc(db,'orders',o.id),data)}else{data.createdAt=serverTimestamp();data.createdBy=user.uid;data.merchantUid=user.uid;data.merchantEmail=user.email;data.originalPrice=data.price;await addDoc(collection(db,'orders'),data)}})};
window.editOrder=id=>{let o=orders.find(x=>x.id===id);if(o)window.openOrder(o)};
window.changeStatus=id=>{let o=orders.find(x=>x.id===id);if(!o)return;modal('تحديث حالة الشحنة',`<div class="field"><label>الحالة الجديدة</label><select id="newStatus">${STATUSES.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>المبلغ المستلم فعلياً من العميل</label><input id="newCollected" type="number" step="0.01" value="${num(o.deliveredAmount)}"></div><div class="danger-note">تغيير الحالة إلى تم التسليم لا يعني أن المبلغ تم تحصيله تلقائياً. أدخل المبلغ الذي استلمه المندوب فعلياً.</div>`,'تحديث',async()=>{let s=$('newStatus').value,c=num($('newCollected').value);await updateDoc(doc(db,'orders',id),{status:s,deliveredAmount:c,updatedAt:serverTimestamp(),...(s==='تم التسليم'?{deliveredAt:serverTimestamp()}:{})});await addDoc(collection(db,'accounting_history'),{orderId:id,action:'status_update',status:s,deliveredAmount:c,by:user.uid,createdAt:serverTimestamp()})})};
window.addDriver=()=>modal('إضافة مندوب',`<div class="form-grid"><div class="field"><label>الاسم</label><input id="dName"></div><div class="field"><label>الهاتف</label><input id="dPhone"></div><div class="field"><label>المنطقة</label><input id="dArea"></div></div>`,'إضافة',async()=>{let name=$('dName').value.trim();if(!name)throw Error('أدخل اسم المندوب');await addDoc(collection(db,'drivers'),{name,phone:$('dPhone').value,area:$('dArea').value,active:true,createdAt:serverTimestamp()})});
window.assignDriver=id=>{let d=drivers.find(x=>x.id===id);modal('إسناد شحنات إلى '+esc(d.name),`<div class="field"><label>اختر الطلبية</label><select id="assignOrder">${orders.filter(o=>!o.driverId&&!['تم التسليم','مرتجع','ملغي'].includes(o.status)).map(o=>`<option value="${o.id}">${esc(o.customer)} — ${esc(o.area)} — ${esc(o.trackingId||o.id.slice(0,8))}</option>`).join('')}</select></div>`,'إسناد',async()=>{let oid=$('assignOrder').value;if(!oid)throw Error('لا توجد طلبية متاحة');await updateDoc(doc(db,'orders',oid),{driverId:id,driverName:d.name,assignedAt:serverTimestamp(),status:'تم التحميل',updatedAt:serverTimestamp()})})};
window.addTransfer=()=>modal('تسجيل حركة مالية',`<div class="form-grid"><div class="field"><label>نوع الحركة</label><select id="tType"><option>تحويل للتاجر</option><option>توريد عهدة مندوب</option><option>مصروف</option><option>إيداع صندوق</option><option>تسوية</option></select></div><div class="field"><label>الطرف</label><input id="tParty" placeholder="Randis / اسم المندوب"></div><div class="field"><label>المبلغ</label><input id="tAmount" type="number" min="0.01" step="0.01"></div><div class="field"><label>طريقة الدفع</label><select id="tMethod"><option>نقداً</option><option>تحويل بنكي</option><option>محفظة إلكترونية</option></select></div><div class="field wide"><label>ملاحظة / رقم مرجعي</label><input id="tNote"></div></div><div class="danger-note">هذه الحركة تسجل كبيان فقط. لا تُعد تسوية آمنة أو خصماً نهائياً من رصيد التاجر.</div>`,'تسجيل الحركة',async()=>{let amount=num($('tAmount').value);if(amount<=0)throw Error('أدخل مبلغاً صحيحاً');let t={type:$('tType').value,party:$('tParty').value,amount,method:$('tMethod').value,note:$('tNote').value,createdAt:serverTimestamp(),createdBy:user.uid};await addDoc(collection(db,'transfers'),t);await addDoc(collection(db,'accounting_history'),{...t,action:'transfer_recorded'})});
window.go=p=>{page=p;render()};window.filterOrders=()=>{let s=$('orderSearch')?.value.toLowerCase()||'',st=$('statusFilter')?.value||'';document.querySelectorAll('#ordersTable tbody tr').forEach(tr=>{let txt=tr.innerText.toLowerCase();tr.style.display=(!s||txt.includes(s))&&(!st||txt.includes(st))?'':'none'})};window.exportOrders=()=>{let cols=['customer','phone','area','trackingId','price','deliveryFee','deliveredAmount','status','notes'];let csv='\ufeff'+cols.join(',')+'\n'+orders.map(o=>cols.map(k=>'"'+String(o[k]??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='boxit-orders.csv';a.click();URL.revokeObjectURL(a.href)};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('loginEmail').value.trim(),$('loginPassword').value)}catch(err){toast('فشل الدخول: '+(err.code||err.message))}});
$('logoutBtn').onclick=()=>signOut(auth);$('modeBtn').onclick=()=>{if(role!=='admin'){toast('هذا الحساب لا يملك صلاحية الإدارة');return}mode=mode==='admin'?'merchant':'admin';page='dashboard';render()};
onAuthStateChanged(auth,async u=>{user=u;if(!u){$('app').classList.add('hidden');$('loginView').classList.remove('hidden');return}role=['bahaa@boxit.app'].includes((u.email||'').toLowerCase())?'admin':'merchant';mode=role==='admin'?'admin':'merchant';$('loginView').classList.add('hidden');$('app').classList.remove('hidden');try{await loadData();render()}catch(e){console.error(e);toast('تعذر تحميل البيانات. افحص صلاحيات Firestore: '+(e.code||e.message));$('main').innerHTML='<div class="panel"><h3>تعذر تحميل البيانات</h3><p>تحقق من Firestore Rules وأن المستخدم مسموح له بالقراءة.</p></div>'}});
</script>
</body></html>
