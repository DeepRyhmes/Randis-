
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142b59">
<title>Randis × Box It</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#202b40;font-family:Cairo,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#102653,#2476d2)}
.login-card{background:white;border-radius:22px;padding:25px;width:100%;max-width:390px;box-shadow:0 15px 50px #071a3b55}
.brand{text-align:center;margin-bottom:25px}
.brand h1{color:#142b59;margin:0;font-size:27px}
.brand p{color:#78849a;margin:5px 0;font-size:13px}
.role-choice{display:block;width:100%;padding:18px;border:0;border-radius:14px;margin:12px 0;text-align:right;color:white;font-weight:800;font-size:18px}
.role-choice small{display:block;font-size:12px;font-weight:400;margin-top:3px}
.role-randis{background:#862c4c}
.role-boxit{background:#142b59}
.field{margin:12px 0}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dfe5ee;border-radius:10px;background:white;outline:none}
.field input:focus,.field select:focus{border-color:#2476d2}
.btn{padding:10px 15px;border:0;border-radius:9px;font-weight:700}
.primary{background:#2476d2;color:white}
.dark{background:#142b59;color:white}
.wine{background:#862c4c;color:white}
.light{background:#eaf4ff;color:#142b59}
.danger{background:#fff0f0;color:#b52e40}
#loginError{color:#c33d4d;font-size:12px;min-height:20px}
.topbar{background:#142b59;color:white;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.topbar h2{margin:0;font-size:17px}
.topbar small{opacity:.8}
.layout{display:flex;max-width:1400px;margin:auto;min-height:calc(100vh - 55px)}
.sidebar{width:210px;background:white;padding:12px;border-left:1px solid #e5e9f0;flex-shrink:0}
.nav{display:block;width:100%;text-align:right;border:0;background:white;padding:10px;border-radius:9px;margin:3px 0;color:#344056;font-weight:700}
.nav.active{background:#eaf4ff;color:#142b59}
.main{padding:18px;width:100%;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.page-head h2{margin:0;font-size:21px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:15px}
.stat,.panel{background:white;border:1px solid #e5e9f0;border-radius:14px;padding:14px;margin-bottom:12px}
.stat small{color:#778196}
.stat strong{display:block;font-size:21px;margin-top:5px}
.stat.pink strong{color:#862c4c}
.stat.blue strong{color:#2476d2}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{padding:9px;border:1px solid #dfe5ee;border-radius:9px;background:white}
.table-wrap{overflow-x:auto;background:white;border:1px solid #e5e9f0;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:680px;font-size:13px}
th,td{padding:10px;text-align:right;border-bottom:1px solid #e9edf3;white-space:nowrap}
th{background:#f7f9fc;color:#536078}
.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#eef2f8;font-size:11px}
.pill.done{background:#e6f7ee;color:#167747}
.pill.bad{background:#fff0f0;color:#b52e40}
.pill.wait{background:#fff6df;color:#8c6410}
.actions{display:flex;gap:5px}
.actions button{border:0;border-radius:7px;padding:6px 9px;font-size:11px}
.empty{text-align:center;padding:25px;color:#778196}
.notice{padding:11px;border-radius:10px;background:#fff8e6;color:#785b18;font-size:12px;margin:10px 0}
.modal-bg{position:fixed;inset:0;background:#09152c88;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:white;width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px;padding:17px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.modal-head h3{margin:0}
.close{border:0;background:#f0f2f6;border-radius:8px;padding:7px 11px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.detail{background:#f7f9fc;padding:9px;border-radius:9px}
.detail small{display:block;color:#778196}
.muted{color:#778196;font-size:12px}
@media(max-width:720px){
 .layout{display:block}.sidebar{width:100%;display:flex;overflow-x:auto;padding:6px;gap:4px}
 .nav{white-space:nowrap;width:auto;padding:8px 11px;font-size:12px}
 .main{padding:11px}.topbar{padding:10px 12px}
 .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login">
 <div class="login-card">
  <div class="brand">
   <h1>Randis × Box It</h1>
   <p>نظام إدارة الطلبات والحسابات</p>
  </div>

  <div id="roleChoices">
   <button type="button" class="role-choice role-randis" id="chooseRandis">
    Randis
    <small>الدخول إلى حساب المتجر</small>
   </button>
   <button type="button" class="role-choice role-boxit" id="chooseBoxit">
    Box It
    <small>الدخول إلى الإدارة والتوصيل</small>
   </button>
  </div>

  <div id="passwordArea" class="hidden">
   <h3 id="loginTitle">تسجيل الدخول</h3>
   <form id="loginForm">
    <div class="field">
     <label>كلمة المرور</label>
     <input id="loginPassword" type="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
    </div>
    <button id="loginButton" type="submit" class="btn primary" style="width:100%">دخول</button>
   </form>
   <button type="button" id="backButton" class="btn light" style="width:100%;margin-top:9px">رجوع لاختيار الحساب</button>
  </div>
  <p id="loginError"></p>
 </div>
</section>

<section id="app" class="hidden">
 <header class="topbar">
  <div><h2>Randis × Box It</h2><small id="userLabel"></small></div>
  <button id="logoutButton" class="btn light">تسجيل خروج</button>
 </header>
 <div class="layout">
  <aside class="sidebar" id="sidebar">
   <button class="nav active" data-page="dashboard">الرئيسية</button>
   <button class="nav" data-page="orders">كل الطلبات</button>
   <button class="nav admin-only" data-page="add">إضافة طلب</button>
   <button class="nav" data-page="delivered">الطلبات المسلّمة</button>
   <button class="nav" data-page="shipping">قيد التوصيل</button>
   <button class="nav" data-page="returns">المرتجعات</button>
   <button class="nav" data-page="accounts">الحسابات</button>
   <button class="nav" data-page="transfers">سجل التحويلات</button>
   <button class="nav" data-page="archive">الأرشيف</button>
   <button class="nav admin-only" data-page="drivers">السائقون</button>
   <button class="nav" data-page="reports">التقارير</button>
  </aside>
  <main class="main" id="content"></main>
 </div>
</section>

<div id="modalRoot"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,
 onSnapshot,serverTimestamp,runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* بيانات مشروع Firebase الأصلي */
const firebaseConfig={
 apiKey:"AIzaSyDUuf6K7I7HXiT_8CChLH9B5eDpmiDalk",
 authDomain:"order-manger-848ce.firebaseapp.com",
 projectId:"order-manger-848ce",
 messagingSenderId:"174411866795",
 appId:"1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

const EMAILS={
 store:"rand@randis.app",
 boxit:"bahaa@boxit.app"
};

let selectedRole=null;
let role=null;
let user=null;
let orders=[];
let transfers=[];
let drivers=[];
let currentPage="dashboard";
let editingId=null;
let unsubscribers=[];
let searchTerm="";
let statusFilter="";

const $=id=>document.getElementById(id);
const money=n=>(Number(n)||0).toFixed(2)+" د.أ";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const dateText=v=>{
 if(!v)return "—";
 const d=v.toDate?v.toDate():new Date(v);
 return isNaN(d.getTime())?"—":d.toLocaleString("ar-JO");
};
const timeOf=v=>v?.toMillis?v.toMillis():v?new Date(v).getTime():0;
const isAdmin=()=>role==="boxit";
const gross=o=>Number(o.price)||0;
const fee=o=>Number(o.deliveryFee)||0;
const net=o=>gross(o)-fee(o);
const isDelivered=o=>["تم التسليم","تسليم جزئي"].includes(o.status);
const isEligible=o=>isDelivered(o)&&o.accounted!==true;
const statuses=["جديد","قيد التوصيل","تم التسليم","تسليم جزئي","رفض الاستلام","مرتجع","ملغي"];

function totals(list){
 return list.reduce((a,o)=>{
  a.gross+=gross(o);
  a.fees+=fee(o);
  a.net+=net(o);
  return a;
 },{gross:0,fees:0,net:0});
}

/* تسجيل الدخول: اختيار الحساب أولاً، ثم كلمة المرور */
$("chooseRandis").addEventListener("click",()=>selectRole("store"));
$("chooseBoxit").addEventListener("click",()=>selectRole("boxit"));
$("backButton").addEventListener("click",backToRoles);
$("loginForm").addEventListener("submit",login);
$("logoutButton").addEventListener("click",()=>signOut(auth));

function selectRole(r){
 selectedRole=r;
 $("roleChoices").classList.add("hidden");
 $("passwordArea").classList.remove("hidden");
 $("loginTitle").textContent=r==="store"?"تسجيل دخول Randis":"تسجيل دخول Box It";
 $("loginPassword").value="";
 $("loginError").textContent="";
 $("loginPassword").focus();
}

function backToRoles(){
 selectedRole=null;
 $("roleChoices").classList.remove("hidden");
 $("passwordArea").classList.add("hidden");
 $("loginError").textContent="";
}

async function login(e){
 e.preventDefault();
 if(!selectedRole){
  $("loginError").textContent="اختار الحساب أولاً";
  return;
 }
 const password=$("loginPassword").value.trim();
 if(!password){
  $("loginError").textContent="اكتب كلمة المرور";
  return;
 }
 const button=$("loginButton");
 button.disabled=true;
 button.textContent="جاري تسجيل الدخول...";
 $("loginError").textContent="";
 try{
  await signInWithEmailAndPassword(auth,EMAILS[selectedRole],password);
 }catch(error){
  $("loginError").textContent=authError(error.code);
 }finally{
  button.disabled=false;
  button.textContent="دخول";
 }
}

function authError(code){
 const messages={
  "auth/invalid-credential":"كلمة المرور أو بيانات الحساب غير صحيحة.",
  "auth/wrong-password":"كلمة المرور غير صحيحة.",
  "auth/user-not-found":"الحساب غير موجود في Firebase.",
  "auth/invalid-api-key":"مفتاح Firebase غير صحيح.",
  "auth/too-many-requests":"محاولات كثيرة. حاول بعد قليل.",
  "auth/network-request-failed":"تحقق من اتصال الإنترنت.",
  "auth/operation-not-allowed":"تسجيل الدخول بالبريد وكلمة المرور غير مفعّل في Firebase.",
  "auth/invalid-email":"البريد الإلكتروني المرتبط بالحساب غير صحيح."
 };
 return messages[code]||("تعذر تسجيل الدخول: "+code);
}

onAuthStateChanged(auth,u=>{
 if(!u){
  user=null;
  role=null;
  cleanup();
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  return;
 }

 user=u;
 if(u.email===EMAILS.store)role="store";
 else if(u.email===EMAILS.boxit)role="boxit";
 else{
  signOut(auth);
  return;
 }

 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("userLabel").textContent=role==="store"?"حساب Randis":"حساب Box It - الإدارة";

 document.querySelectorAll(".admin-only").forEach(el=>{
  el.classList.toggle("hidden",!isAdmin());
 });

 startListeners();
 showPage("dashboard");
});

function cleanup(){
 unsubscribers.forEach(fn=>fn());
 unsubscribers=[];
}

function startListeners(){
 cleanup();

 unsubscribers.push(onSnapshot(collection(db,"orders"),snap=>{
  orders=snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
 },showError));

 unsubscribers.push(onSnapshot(collection(db,"transfers"),snap=>{
  transfers=snap.docs.map(d=>({id:d.id,...d.data()}));
  transfers.sort((a,b)=>timeOf(b.createdAt)-timeOf(a.createdAt));
  render();
 },showError));

 if(isAdmin()){
  unsubscribers.push(onSnapshot(collection(db,"drivers"),snap=>{
   drivers=snap.docs.map(d=>({id:d.id,...d.data()}));
   render();
  },showError));
 }
}

function showError(e){
 console.error(e);
 alert("حدث خطأ: "+(e.message||e.code||"تعذر تنفيذ العملية"));
}

/* التنقل بين الصفحات */
$("sidebar").addEventListener("click",e=>{
 const b=e.target.closest("[data-page]");
 if(!b)return;
 const p=b.dataset.page;
 if(p==="add"&&!isAdmin())return;
 if(p==="drivers"&&!isAdmin())return;
 showPage(p);
});

function showPage(p){
 currentPage=p;
 editingId=null;
 searchTerm="";
 statusFilter="";
 document.querySelectorAll(".nav").forEach(b=>{
  b.classList.toggle("active",b.dataset.page===p);
 });
 render();
}

function header(title,extra=""){
 return `<div class="page-head"><h2>${title}</h2>${extra}</div>`;
}
function render(){
 if(!user)return;
 const c=$("content");
 if(currentPage==="dashboard")c.innerHTML=dashboardHTML();
 else if(currentPage==="orders")c.innerHTML=ordersHTML(orders);
 else if(currentPage==="delivered")c.innerHTML=ordersHTML(orders.filter(isDelivered));
 else if(currentPage==="shipping")c.innerHTML=ordersHTML(orders.filter(o=>o.status==="قيد التوصيل"));
 else if(currentPage==="returns")c.innerHTML=ordersHTML(orders.filter(o=>["مرتجع","رفض الاستلام"].includes(o.status)));
 else if(currentPage==="add")c.innerHTML=orderFormHTML();
 else if(currentPage==="accounts")c.innerHTML=accountsHTML();
 else if(currentPage==="transfers")c.innerHTML=transfersHTML();
 else if(currentPage==="archive")c.innerHTML=archiveHTML();
 else if(currentPage==="drivers")c.innerHTML=driversHTML();
 else if(currentPage==="reports")c.innerHTML=reportsHTML();
}

/* الصفحة الرئيسية */
function dashboardHTML(){
 const bal=totals(orders.filter(isEligible));
 return `${header("الرئيسية")}
 <div class="cards">
  <div class="stat blue"><small>إجمالي الطلبات</small><strong>${orders.length}</strong></div>
  <div class="stat"><small>تم التسليم</small><strong>${orders.filter(isDelivered).length}</strong></div>
  <div class="stat"><small>قيد التوصيل</small><strong>${orders.filter(o=>o.status==="قيد التوصيل").length}</strong></div>
  <div class="stat"><small>المرتجعات</small><strong>${orders.filter(o=>["مرتجع","رفض الاستلام"].includes(o.status)).length}</strong></div>
  <div class="stat pink"><small>رصيد Randis الحالي</small><strong>${money(bal.net)}</strong></div>
 </div>
 <div class="panel">
  <h3>ملخص الحسابات</h3>
  <div class="grid2">
   <div>إجمالي الأسعار <h3>${money(bal.gross)}</h3></div>
   <div>أجور التوصيل <h3>${money(bal.fees)}</h3></div>
   <div>صافي مستحقات Randis <h3 style="color:#862c4c">${money(bal.net)}</h3></div>
   <div>عدد التحويلات <h3>${transfers.length}</h3></div>
  </div>
  <button class="btn light" data-action="accounts">عرض الحسابات</button>
 </div>
 <div class="panel"><h3>آخر الطلبات</h3>${ordersTable(orders.slice().sort((a,b)=>timeOf(b.createdAt)-timeOf(a.createdAt)).slice(0,6))}</div>`;
}

/* الطلبات */
function ordersHTML(list){
 return `${header("الطلبات",isAdmin()?'<button class="btn primary" data-action="add">+ إضافة طلب</button>':"")}
 <div class="toolbar">
  <input id="searchOrders" placeholder="بحث بالاسم أو الهاتف أو المنطقة" value="${esc(searchTerm)}">
  <select id="filterStatus"><option value="">كل الحالات</option>${statuses.map(s=>`<option value="${s}" ${statusFilter===s?"selected":""}>${s}</option>`).join("")}</select>
 </div>
 <div id="ordersTable">${ordersTable(filterOrders(list))}</div>`;
}
function filterOrders(list){
 return list.filter(o=>{
  const q=searchTerm.toLowerCase();
  const match=!q||[o.customer,o.phone,o.area,o.barcode].some(v=>String(v||"").toLowerCase().includes(q));
  return match&&(!statusFilter||o.status===statusFilter);
 });
}
function ordersTable(list){
 if(!list.length)return '<div class="empty">لا توجد طلبات لعرضها</div>';
 return `<div class="table-wrap"><table>
 <thead><tr><th>الاسم</th><th>الهاتف</th><th>المنطقة</th><th>السعر</th><th>التوصيل</th><th>الصافي</th><th>الحالة</th><th>إجراءات</th></tr></thead>
 <tbody>${list.map(o=>`<tr>
 <td>${esc(o.customer)}</td><td>${esc(o.phone)}</td><td>${esc(o.area)}</td>
 <td>${money(gross(o))}</td><td>${money(fee(o))}</td><td><b>${money(net(o))}</b></td>
 <td>${statusPill(o.status)}</td>
 <td><div class="actions">
 <button class="light" data-action="view-order" data-id="${o.id}">عرض</button>
 ${isAdmin()?`<button class="light" data-action="edit-order" data-id="${o.id}">تعديل</button>`:""}
 </div></td></tr>`).join("")}</tbody></table></div>`;
}
function statusPill(s){
 const cls=isDelivered({status:s})?"done":["مرتجع","رفض الاستلام","ملغي"].includes(s)?"bad":"wait";
 return `<span class="pill ${cls}">${esc(s||"جديد")}</span>`;
}

$("content").addEventListener("input",e=>{
 if(e.target.id==="searchOrders"){
  searchTerm=e.target.value;
  refreshTable();
 }
});
$("content").addEventListener("change",e=>{
 if(e.target.id==="filterStatus"){
  statusFilter=e.target.value;
  refreshTable();
 }
});
function refreshTable(){
 let list=orders;
 if(currentPage==="delivered")list=orders.filter(isDelivered);
 if(currentPage==="shipping")list=orders.filter(o=>o.status==="قيد التوصيل");
 if(currentPage==="returns")list=orders.filter(o=>["مرتجع","رفض الاستلام"].includes(o.status));
 const el=$("ordersTable");
 if(el)el.innerHTML=ordersTable(filterOrders(list));
}

/* إضافة وتعديل الطلب */
function orderFormHTML(o={}){
 return `${header(o.id?"تعديل الطلب":"إضافة طلب")}
 <div class="panel">
 <form id="orderForm">
 <div class="grid2">
  <div class="field"><label>اسم العميل *</label><input name="customer" required value="${esc(o.customer)}"></div>
  <div class="field"><label>رقم الهاتف</label><input name="phone" value="${esc(o.phone)}"></div>
  <div class="field"><label>المنطقة *</label><input name="area" required value="${esc(o.area)}"></div>
  <div class="field"><label>رقم الطلب / الباركود</label><input name="barcode" value="${esc(o.barcode)}"></div>
  <div class="field"><label>السعر الإجمالي *</label><input name="price" type="number" min="0" step=".01" required value="${o.price??""}"></div>
  <div class="field"><label>أجرة التوصيل *</label><input name="deliveryFee" type="number" min="0" step=".01" required value="${o.deliveryFee??"2"}"></div>
  <div class="field"><label>حالة الطلب</label><select name="status">${statuses.map(s=>`<option ${o.status===s?"selected":(!o.status&&s==="جديد")?"selected":""}>${s}</option>`).join("")}</select></div>
  <div class="field"><label>ملاحظات</label><input name="notes" value="${esc(o.notes)}"></div>
 </div>
 <div class="notice">صافي المتجر = السعر الإجمالي − أجرة التوصيل. الطلبات المسلّمة والتسليم الجزئي تدخل في الحسابات.</div>
 <button class="btn primary" type="submit">حفظ الطلب</button>
 <button class="btn light" type="button" data-action="orders">إلغاء</button>
 </form></div>`;
}

$("content").addEventListener("submit",async e=>{
 if(e.target.id!=="orderForm")return;
 e.preventDefault();
 if(!isAdmin())return;
 const f=new FormData(e.target);
 const price=Number(f.get("price"));
 const deliveryFee=Number(f.get("deliveryFee"));
 if(price<0||deliveryFee<0||deliveryFee>price){
  alert("تأكد من السعر وأجرة التوصيل. لا يمكن أن تكون أجرة التوصيل أكبر من السعر.");
  return;
 }
 const data={
  customer:f.get("customer").trim(),
  phone:f.get("phone").trim(),
  area:f.get("area").trim(),
  barcode:f.get("barcode").trim(),
  price,deliveryFee,
  status:f.get("status"),
  notes:f.get("notes").trim(),
  updatedAt:serverTimestamp()
 };
 try{
  if(editingId){
   await updateDoc(doc(db,"orders",editingId),data);
  }else{
   data.accounted=false;
   data.createdAt=serverTimestamp();
   await addDoc(collection(db,"orders"),data);
  }
  editingId=null;
  showPage("orders");
 }catch(err){showError(err)}
});

/* النقرات داخل التطبيق */
$("content").addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");
 if(!b)return;
 const action=b.dataset.action;
 const id=b.dataset.id;
 if(action==="add"&&isAdmin())showPage("add");
 if(action==="orders")showPage("orders");
 if(action==="accounts")showPage("accounts");
 if(action==="view-order")viewOrder(id);
 if(action==="edit-order")editOrder(id);
 if(action==="open-transfer")openTransfer();
 if(action==="transfers")showPage("transfers");
 if(action==="view-transfer")viewTransfer(id);
 if(action==="drivers")showPage("drivers");
 if(action==="add-driver")addDriver();
 if(action==="remove-driver")removeDriver(id);
 if(action==="confirm-transfer")confirmTransfer();
 if(action==="close-modal")closeModal();
 if(action==="change-status")changeOrderStatus(id);
});

function editOrder(id){
 if(!isAdmin())return;
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 editingId=id;
 $("content").innerHTML=orderFormHTML(o);
}
function detail(k,v){
 return `<div class="detail"><small>${k}</small><b>${esc(v||"—")}</b></div>`;
}
function viewOrder(id){
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 $("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal">
 <div class="modal-head"><h3>تفاصيل الطلب</h3><button class="close" data-action="close-modal">✕</button></div>
 <div class="detail-grid">
 ${detail("اسم العميل",o.customer)}${detail("رقم الهاتف",o.phone)}
 ${detail("المنطقة",o.area)}${detail("رقم الطلب",o.barcode)}
 ${detail("السعر",money(gross(o)))}${detail("أجرة التوصيل",money(fee(o)))}
 ${detail("الصافي",money(net(o)))}${detail("الحالة",o.status)}
 ${detail("الملاحظات",o.notes)}${detail("تاريخ الإضافة",dateText(o.createdAt))}
 ${detail("الحالة المحاسبية",o.accounted?"تم تحويله":"غير محوّل")}
 </div>
 ${isAdmin()?`<div class="field"><label>تغيير الحالة</label><select id="changeStatus">${statuses.map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
 <button class="btn primary" data-action="change-status" data-id="${o.id}">حفظ الحالة</button>`:""}
 </div></div>`;
}
async function changeOrderStatus(id){
 if(!isAdmin())return;
 const status=$("changeStatus")?.value;
 if(!status)return;
 try{
  await updateDoc(doc(db,"orders",id),{status,updatedAt:serverTimestamp()});
  closeModal();
 }catch(e){showError(e)}
}
function closeModal(){$("modalRoot").innerHTML=""}

/* الحسابات */

 const t=totals(eligible);
 const transferred=transfers.reduce((a,x)=>a+(Number(x.amount)||0),0);

 <div class="cards">
  <div class="stat"><small>إجمالي أسعار الطلبات المستحقة</small><strong>${money(t.gross)}</strong></div>
  <div class="stat"><small>أجور التوصيل</small><strong>${money(t.fees)}</strong></div>
  <div class="stat pink"><small>صافي مستحقات Randis</small><strong>${money(t.net)}</strong></div>
  <div class="stat blue"><small>التحويلات السابقة</small><strong>${money(transferred)}</strong></div>
 </div>
 <div class="panel">
  <h3>الرصيد الحالي غير المحوّل</h3>
  <h2 style="color:#862c4c;font-size:30px">${money(t.net)}</h2>

  ${isAdmin()?'<button class="btn primary" data-action="open-transfer">تحويل كامل الرصيد وتصفيره</button>':'<span class="pill">حساب للعرض فقط</span>'}
 </div>

/* تسجيل التحويل وتصفير الطلبات */
function openTransfer(){
 if(!isAdmin())return;
 const list=orders.filter(isEligible);
 const t=totals(list);
 if(!list.length||t.net<=0){
  alert("لا يوجد رصيد مستحق للتحويل حالياً");
  return;
 }
 $("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal">
 <div class="modal-head"><h3>تأكيد تحويل الرصيد</h3><button class="close" data-action="close-modal">✕</button></div>
 <div class="notice">سيتم تسجيل تحويل بقيمة ${money(t.net)} وحفظ تفاصيل ${list.length} طلب، ثم تصفير رصيدها المحاسبي.</div>
 <div class="field"><label>مبلغ التحويل</label><input id="transferAmount" value="${t.net.toFixed(2)}" readonly></div>
 <div class="field"><label>طريقة التحويل</label><select id="transferMethod"><option>كاش</option><option>CliQ</option><option>تحويل بنكي</option><option>أخرى</option></select></div>
 <div class="field"><label>رقم المرجع</label><input id="transferReference"></div>
 <div class="field"><label>ملاحظات</label><textarea id="transferNote" rows="2"></textarea></div>
 <button class="btn primary" data-action="confirm-transfer">تأكيد التحويل وتصفير الحساب</button>
 <button class="btn light" data-action="close-modal">إلغاء</button>
 </div></div>`;
}
async function confirmTransfer(){
 if(!isAdmin())return;
 const amount=Number($("transferAmount")?.value);
 const method=$("transferMethod")?.value;
 const reference=$("transferReference")?.value.trim()||"";
 const note=$("transferNote")?.value.trim()||"";
 const selected=orders.filter(isEligible);
 if(!selected.length)return alert("لا توجد طلبات مستحقة.");
 if(!confirm("هل أنت متأكد من تسجيل التحويل وتصفير رصيد الطلبات؟"))return;

 try{
  const transferRef=doc(collection(db,"transfers"));
  await runTransaction(db,async tx=>{
   const fresh=[];
   for(const o of selected){
    const ref=doc(db,"orders",o.id);
    const snap=await tx.get(ref);
    if(!snap.exists())throw new Error("أحد الطلبات لم يعد موجوداً.");
    const data=snap.data();
    if(data.accounted===true||!["تم التسليم","تسليم جزئي"].includes(data.status)){
     throw new Error("تغيرت حالة أحد الطلبات. حدّث الصفحة وحاول مجدداً.");
    }
    fresh.push({ref,data,id:o.id});
   }
   const sum=fresh.reduce((a,x)=>a+(Number(x.data.price)||0)-(Number(x.data.deliveryFee)||0),0);
   if(Math.abs(sum-amount)>.009)throw new Error("تغير الرصيد. حدّث الصفحة وحاول مجدداً.");

   const snapshot=fresh.map(x=>({
    id:x.id,
    customer:x.data.customer||"",
    phone:x.data.phone||"",
    area:x.data.area||"",
    barcode:x.data.barcode||"",
    price:Number(x.data.price)||0,
    deliveryFee:Number(x.data.deliveryFee)||0,
    netPrice:(Number(x.data.price)||0)-(Number(x.data.deliveryFee)||0),
    status:x.data.status||"",
    notes:x.data.notes||""
   }));

   tx.set(transferRef,{
    amount:sum,method,reference,note,
    createdAt:serverTimestamp(),
    createdBy:user.email,
    orders:snapshot,
    totalGross:snapshot.reduce((a,o)=>a+o.price,0),
    totalFees:snapshot.reduce((a,o)=>a+o.deliveryFee,0),
    totalNet:sum
   });

   fresh.forEach(x=>tx.update(x.ref,{
    accounted:true,
    transferId:transferRef.id,
    accountedAt:serverTimestamp()
   }));
  });

  closeModal();
  alert("تم تسجيل التحويل وتصفير الرصيد بنجاح.");
  showPage("accounts");
 }catch(e){showError(e)}
}

/* سجل التحويلات وتفاصيلها */
function transfersHTML(){
 return `${header("سجل التحويلات")}
 <div class="panel"><p class="muted">كل التحويلات السابقة محفوظة، وحساب Randis يستطيع مشاهدة تفاصيلها.</p>${transferTable(transfers)}</div>`;
}
function transferTable(list){
 if(!list.length)return '<div class="empty">لا توجد تحويلات مسجلة</div>';
 return `<div class="table-wrap"><table>
 <thead><tr><th>التاريخ</th><th>المبلغ</th><th>الطريقة</th><th>عدد الطلبات</th><th>المرجع</th><th>التفاصيل</th></tr></thead>
 <tbody>${list.map(t=>`<tr>
 <td>${dateText(t.createdAt)}</td><td><b>${money(t.amount)}</b></td>
 <td>${esc(t.method)}</td><td>${t.orders?.length||0}</td>
 <td>${esc(t.reference||"—")}</td>
 <td><button class="btn light" data-action="view-transfer" data-id="${t.id}">عرض التحويل</button></td>
 </tr>`).join("")}</tbody></table></div>`;
}
function viewTransfer(id){

 const list=t.orders||[];
 const totalGross=t.totalGross??list.reduce((a,o)=>a+(Number(o.price)||0),0);
 const totalFees=t.totalFees??list.reduce((a,o)=>a+(Number(o.deliveryFee)||0),0);
 const totalNet=t.totalNet??t.amount;

 $("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal">
 <div class="modal-head"><h3>تفاصيل التحويل</h3><button class="close" data-action="close-modal">✕</button></div>
 <div class="cards">
  <div class="stat"><small>تاريخ التحويل</small><strong style="font-size:14px">${dateText(t.createdAt)}</strong></div>
  <div class="stat pink"><small>مبلغ التحويل</small><strong>${money(t.amount)}</strong></div>
  <div class="stat"><small>طريقة التحويل</small><strong style="font-size:15px">${esc(t.method)}</strong></div>
  <div class="stat"><small>رقم المرجع</small><strong style="font-size:14px">${esc(t.reference||"—")}</strong></div>
 </div>
 <p>ملاحظات: ${esc(t.note||"لا يوجد")}</p>
 <h3>الطلبات المشمولة (${list.length})</h3>
 <div class="table-wrap"><table>
 <thead><tr><th>العميل</th><th>الهاتف</th><th>المنطقة</th><th>السعر</th><th>التوصيل</th><th>الصافي</th><th>الحالة</th></tr></thead>
 <tbody>${list.map(o=>`<tr>
 <td>${esc(o.customer)}</td><td>${esc(o.phone)}</td><td>${esc(o.area)}</td>
 <td>${money(o.price)}</td><td>${money(o.deliveryFee)}</td>
 <td><b>${money(o.netPrice)}</b></td><td>${esc(o.status)}</td>
 </tr>`).join("")}</tbody></table></div>
 <div class="panel" style="margin-top:12px">
 <p>إجمالي الأسعار: <b>${money(totalGross)}</b></p>
 <p>إجمالي التوصيل: <b>${money(totalFees)}</b></p>
 <p>صافي التحويل: <b style="color:#862c4c">${money(totalNet)}</b></p>
 </div>
 </div></div>`;
}

/* الأرشيف */

async function addDriver(){
 if(!isAdmin())return;
 const name=prompt("اسم السائق");
 if(!name)return;
 const phone=prompt("رقم الهاتف")||"";
 const notes=prompt("ملاحظات")||"";
 try{
  await addDoc(collection(db,"drivers"),{name,phone,notes,createdAt:serverTimestamp()});
 }catch(e){showError(e)}
}
async function removeDriver(id){
 if(!isAdmin()||!confirm("هل تريد حذف السائق؟"))return;
 try{await deleteDoc(doc(db,"drivers",id))}
 catch(e){showError(e)}
}
