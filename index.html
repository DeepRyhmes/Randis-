
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<title>Randis | إدارة الطلبيات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#172554;color:white;padding:18px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:23px}
header small{opacity:.8}
main{max-width:850px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 2px 9px #0000000b}
h2{font-size:17px;margin:0 0 13px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d8deea;border-radius:9px;font-size:15px;background:white;margin:5px 0 11px}
textarea{min-height:105px;resize:vertical}
label{font-size:13px;color:#596579}
button{border:0;border-radius:9px;padding:11px 13px;font-size:14px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.primary{background:#172554;color:white}
.secondary{background:#e8edf8;color:#172554}
.green{background:#16834a;color:white}
.red{background:#b83232;color:white}
.orange{background:#fff0d5;color:#8a5100}
.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:#f3f6fc;border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:#172554}
.stat span{font-size:12px;color:#647087}
.order{border:1px solid #e4e8f0;border-radius:12px;padding:13px;margin:10px 0}
.order-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.order h3{font-size:16px;margin:0 0 6px}
.order p{font-size:13px;color:#536078;margin:5px 0}
.price{font-size:19px;font-weight:bold;color:#172554}
.status{display:inline-block;background:#edf1f8;color:#34415b;padding:5px 9px;border-radius:20px;font-size:12px;margin:5px 0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1;min-width:90px}
.menu-wrap{position:relative}
.menu{background:white;border:1px solid #ddd;padding:7px;border-radius:10px;min-width:145px;position:absolute;left:0;top:40px;z-index:5;box-shadow:0 5px 18px #0002}
.menu button{width:100%;text-align:right;background:white;margin:2px 0}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal-box{background:white;border-radius:15px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal-box h2{margin-bottom:15px}
.muted{font-size:12px;color:#788398}
#app{display:none}
#login{max-width:420px;margin:55px auto;padding:15px}
.notice{padding:10px;border-radius:9px;background:#eef3ff;color:#263c70;font-size:13px;margin:8px 0}
.empty{text-align:center;color:#788398;padding:25px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Randis</h1>
    <small>إدارة الطلبيات والحسابات</small>
  </div>
  <button class="secondary" id="logoutBtn" style="display:none">تسجيل خروج</button>
</header>

<section id="login">
  <div class="card">
    <h2>تسجيل الدخول</h2>
    <label>اسم المستخدم</label>
    <select id="username">
      <option value="bahaa">بهاء</option>
      <option value="rand">رند</option>
    </select>
    <label>كلمة المرور</label>
    <input id="password" type="password" placeholder="كلمة المرور">
    <button class="primary full" id="loginBtn">دخول</button>
    <p id="loginError" class="muted"></p>
  </div>
</section>

<div id="app">
<main>
  <div class="card">
    <h2>ملخص الطلبيات</h2>
    <div class="stats">
      <div class="stat"><b id="totalCount">0</b><span>كل الطلبيات</span></div>
      <div class="stat"><b id="deliveredCount">0</b><span>تم التسليم</span></div>
      <div class="stat"><b id="pendingCount">0</b><span>قيد التنفيذ</span></div>
      <div class="stat"><b id="failedCount">0</b><span>فشل / ملغي</span></div>
    </div>
  </div>

  <div class="card">
    <h2 id="formTitle">إضافة طلبية جديدة</h2>
    <form id="orderForm">
      <label>رقم الباركود</label>
      <div class="row">
        <input id="barcode" placeholder="رقم الباركود">
        <button type="button" class="secondary" id="scanBtn" style="flex:0 0 auto">مسح بالكاميرا</button>
      </div>
      <video id="camera" class="hidden" autoplay playsinline style="width:100%;border-radius:10px"></video>
      <label>اسم الزبون</label>
      <input id="customer" required placeholder="اسم الزبون">
      <label>رقم الهاتف</label>
      <input id="phone" placeholder="07xxxxxxxx" inputmode="tel">
      <label>المنطقة</label>
      <input id="area" placeholder="المنطقة">
      <label>السعر (دينار)</label>
      <input id="price" type="number" step="0.01" min="0" required placeholder="0.00">
      <label>ملاحظات</label>
      <textarea id="notes" placeholder="ملاحظات إضافية"></textarea>
      <div class="row">
        <button type="submit" class="primary" id="saveBtn">إضافة الطلبية</button>
        <button type="button" class="secondary hidden" id="cancelEditBtn">إلغاء التعديل</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>الطلبيات</h2>
    <input id="search" placeholder="بحث بالاسم أو الهاتف أو الباركود...">
    <select id="filter">
      <option value="">كل الحالات</option>
      <option>طلب جديد</option>
      <option>قيد التوصيل</option>
      <option>تم التسليم</option>
      <option>تسليم جزئي</option>
      <option>فشل التوصيل</option>
      <option>مؤجل</option>
      <option>ملغي</option>
      <option>قيد التوصيل القديم</option>
    </select>
    <div id="ordersList"><div class="empty">جاري تحميل الطلبيات...</div></div>
  </div>
</main>
</div>

<div id="actionModal" class="modal hidden">
  <div class="modal-box">
    <h2 id="actionTitle">تحديث حالة الطلبية</h2>
    <div id="actionFields"></div>
    <div class="row">
      <button class="primary" id="confirmAction">تأكيد</button>
      <button class="secondary" id="closeAction">رجوع</button>
    </div>
  </div>
</div>

<div id="messageModal" class="modal hidden">
  <div class="modal-box">
    <h2>رسالة الزبون</h2>
    <p class="muted">تقدر تعدّل الرسالة قبل فتح واتساب أو الرسائل.</p>
    <textarea id="messageText"></textarea>
    <div class="row">
      <button class="green" id="whatsappBtn">فتح واتساب</button>
      <button class="primary" id="smsBtn">رسالة SMS</button>
    </div>
    <button class="secondary full" id="closeMessage" style="margin-top:8px">إغلاق</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, doc,
  onSnapshot, serverTimestamp, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUuf6K80I7XH_iT_8CChLH9B5eDpmiDalk",
  authDomain: "order-manger-848ce.firebaseapp.com",
  projectId: "order-manger-848ce",
  storageBucket: "order-manger-848ce.firebasestorage.app",
  messagingSenderId: "174411866795",
  appId: "1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

const accounts = {
  bahaa: "bahaa@boxit.app",
  rand: "rand@randis.app"
};

let orders = [];
let editingId = null;
let currentAction = null;
let selectedOrder = null;
let cameraStream = null;
let currentUser = null;

const $ = id => document.getElementById(id);
const money = value => Number(value || 0).toFixed(2);
const escapeText = value => String(value ?? "");

function showError(error) {
  alert(error?.message || "صار خطأ، حاول مرة ثانية.");
}

$("loginBtn").addEventListener("click", async () => {
  const email = accounts[$("username").value];
  const password = $("password").value;
  $("loginError").textContent = "";
  if (!password) {
    $("loginError").textContent = "اكتب كلمة المرور أولاً.";
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    $("loginError").textContent = "تعذّر تسجيل الدخول. تأكد من كلمة المرور.";
  }
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    $("login").style.display = "none";
    $("app").style.display = "block";
    $("logoutBtn").style.display = "block";
    listenOrders();
  } else {
    $("login").style.display = "block";
    $("app").style.display = "none";
    $("logoutBtn").style.display = "none";
    orders = [];
  }
});

function listenOrders() {
  onSnapshot(collection(db, "orders"), snapshot => {
    orders = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
    render();
  }, showError);
}

function resetForm() {
  editingId = null;
  $("orderForm").reset();
  $("formTitle").textContent = "إضافة طلبية جديدة";
  $("saveBtn").textContent = "إضافة الطلبية";
  $("cancelEditBtn").classList.add("hidden");
}

$("cancelEditBtn").addEventListener("click", resetForm);

$("orderForm").addEventListener("submit", async event => {
  event.preventDefault();
  const barcode = $("barcode").value.trim();
  const customer = $("customer").value.trim();
  const phone = $("phone").value.trim();
  const area = $("area").value.trim();
  const price = Number($("price").value);
  const notes = $("notes").value.trim();

  if (!customer || !Number.isFinite(price) || price < 0) {
    alert("تأكد من الاسم والسعر.");
    return;
  }

  try {
    if (barcode) {
      const duplicate = orders.find(o => o.barcode === barcode && o.id !== editingId);
      if (duplicate) {
        alert("رقم الباركود موجود مسبقاً.");
        return;
      }
    }

    if (editingId) {
      const old = orders.find(o => o.id === editingId);
      const data = {
        barcode, customer, phone, area, price, notes,
        updatedAt: serverTimestamp()
      };
      if (old && old.originalPrice == null && Number(old.price) !== price) {
        data.originalPrice = Number(old.price || 0);
      }
      await updateDoc(doc(db, "orders", editingId), data);
      alert("تم تعديل الطلبية.");
    } else {
      await addDoc(collection(db, "orders"), {
        barcode, customer, phone, area, price, notes,
        status: "طلب جديد",
        feePaid: false,
        deferredDate: "",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        createdBy: currentUser.uid,
        originalDate: new Date().toISOString()
      });
      alert("تمت إضافة الطلبية.");
    }
    resetForm();
  } catch (error) {
    showError(error);
  }
});

function editOrder(id) {
  const order = orders.find(o => o.id === id);
  if (!order) return;
  editingId = id;
  $("barcode").value = order.barcode || "";
  $("customer").value = order.customer || "";
  $("phone").value = order.phone || "";
  $("area").value = order.area || "";
  $("price").value = order.price ?? "";
  $("notes").value = order.notes || "";
  $("formTitle").textContent = "تعديل الطلبية";
  $("saveBtn").textContent = "حفظ التعديلات";
  $("cancelEditBtn").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function makeButton(label, className, callback) {
  const button = document.createElement("button");
  button.textContent = label;
  button.className = className;
  button.addEventListener("click", callback);
  return button;
}

function addText(parent, tag, value, className = "") {
  const el = document.createElement(tag);
  el.textContent = escapeText(value);
  if (className) el.className = className;
  parent.appendChild(el);
  return el;
}

function render() {
  const total = orders.length;
  const delivered = orders.filter(o => ["تم التسليم", "تسليم كامل", "تسليم جزئي"].includes(o.status)).length;
  const failed = orders.filter(o => ["فشل التوصيل", "ملغي", "رفض بعد الوصول"].includes(o.status)).length;
  const pending = orders.filter(o => !["تم التسليم", "تسليم كامل", "تسليم جزئي", "فشل التوصيل", "ملغي", "رفض بعد الوصول"].includes(o.status)).length;

  $("totalCount").textContent = total;
  $("deliveredCount").textContent = delivered;
  $("pendingCount").textContent = pending;
  $("failedCount").textContent = failed;

  const term = $("search").value.trim().toLowerCase();
  const filter = $("filter").value;

  const filtered = orders.filter(o => {
    const haystack = [o.customer, o.phone, o.barcode, o.area].join(" ").toLowerCase();
    const matchesSearch = haystack.includes(term);
    const matchesFilter = !filter ||
      (filter === "قيد التوصيل القديم" && o.status === "قيد التوصيل") ||
      o.status === filter;
    return matchesSearch && matchesFilter;
  }).sort((a,b) => {
    const at = a.createdAt?.seconds || 0;
    const bt = b.createdAt?.seconds || 0;
    return bt - at;
  });

  const list = $("ordersList");
  list.replaceChildren();

  if (!filtered.length) {
    addText(list, "div", "ما في طلبيات مطابقة.", "empty");
    return;
  }

  filtered.forEach(order => {
    const card = document.createElement("div");
    card.className = "order";

    const top = document.createElement("div");
    top.className = "order-top";
    const info = document.createElement("div");
    addText(info, "h3", order.customer || "بدون اسم");
    addText(info, "p", "الهاتف: " + (order.phone || "غير مسجل"));
    addText(info, "p", "المنطقة: " + (order.area || "غير محددة"));
    if (order.barcode) addText(info, "p", "الباركود: " + order.barcode);
    top.appendChild(info);

    const priceBox = document.createElement("div");
    addText(priceBox, "div", money(order.price) + " د.أ", "price");
    if (order.originalPrice != null && Number(order.originalPrice) !== Number(order.price)) {
      addText(priceBox, "p", "السعر الأصلي: " + money(order.originalPrice), "muted");
    }
    top.appendChild(priceBox);
    card.appendChild(top);

    addText(card, "span", order.status || "حالة غير محددة", "status");
    if (order.status === "فشل التوصيل" || order.status === "رفض بعد الوصول") {
      addText(card, "p", "أجرة التوصيل مدفوعة: " + (order.feePaid ? "نعم" : "لا"));
    }
    if (order.status === "مؤجل" && order.deferredDate) {
      addText(card, "p", "موعد التأجيل: " + order.deferredDate);
    }
    if (order.notes) addText(card, "p", "ملاحظات: " + order.notes);

    const actions = document.createElement("div");
    actions.className = "actions";

    if (order.status === "طلب جديد") {
      actions.appendChild(makeButton("استلام الطلبية", "primary", () => updateStatus(order, "قيد التوصيل")));
    } else if (order.status === "قيد التوصيل") {
      actions.appendChild(makeButton("تم التوصيل", "green", () => openDelivery(order)));
    }

    actions.appendChild(makeButton("واتساب / SMS", "secondary", () => openMessage(order)));
    actions.appendChild(makeButton("تعديل", "secondary", () => editOrder(order.id)));

    const menuWrap = document.createElement("div");
    menuWrap.className = "menu-wrap";
    const menuButton = makeButton("⋮", "secondary", () => {
      const menu = menuWrap.querySelector(".menu");
      menu.classList.toggle("hidden");
    });
    menuWrap.appendChild(menuButton);

    const menu = document.createElement("div");
    menu.className = "menu hidden";
    [
      ["فشل التوصيل", () => openFailure(order)],
      ["مؤجل", () => openDeferred(order)],
      ["ملغي", () => confirmCancel(order)]
    ].forEach(([label, callback]) => {
      menu.appendChild(makeButton(label, "", callback));
    });
    menuWrap.appendChild(menu);
    actions.appendChild(menuWrap);
    card.appendChild(actions);
    list.appendChild(card);
  });
}

$("search").addEventListener("input", render);
$("filter").addEventListener("change", render);

async function updateStatus(order, status, extra = {}) {
  try {
    await updateDoc(doc(db, "orders", order.id), {
      status,
      ...extra,
      updatedAt: serverTimestamp()
    });
  } catch (error) {
    showError(error);
  }
}

function openAction(title, fields, callback) {
  currentAction = callback;
  $("actionTitle").textContent = title;
  const container = $("actionFields");
  container.replaceChildren();
  fields(container);
  $("actionModal").classList.remove("hidden");
}

function closeAction() {
  $("actionModal").classList.add("hidden");
  currentAction = null;
}
$("closeAction").addEventListener("click", closeAction);

$("confirmAction").addEventListener("click", async () => {
  if (!currentAction) return;
  const action = currentAction;
  $("confirmAction").disabled = true;
  try {
    await action();
    closeAction();
  } catch (error) {
    showError(error);
  } finally {
    $("confirmAction").disabled = false;
  }
});

function openDelivery(order) {
  openAction("تأكيد التسليم", container => {
    addText(container, "label", "نوع التسليم");
    const type = document.createElement("select");
    type.id = "deliveryType";
    ["تسليم كامل", "تسليم جزئي"].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      type.appendChild(option);
    });
    container.appendChild(type);

    addText(container, "label", "السعر النهائي بعد التسليم (دينار)");
    const price = document.createElement("input");
    price.id = "finalPrice";
    price.type = "number";
    price.min = "0";
    price.step = "0.01";
    price.value = order.price ?? 0;
    container.appendChild(price);

    addText(container, "p", "إذا تغير السعر، سيتم الاحتفاظ بالسعر الأصلي أيضاً.", "muted");
  }, async () => {
    const finalPrice = Number($("finalPrice").value);
    if (!Number.isFinite(finalPrice) || finalPrice < 0) {
      alert("أدخل سعراً صحيحاً.");
      throw new Error("السعر غير صحيح");
    }
    const type = $("deliveryType").value;
    const data = {
      status: type === "تسليم كامل" ? "تم التسليم" : "تسليم جزئي",
      price: finalPrice,
      updatedAt: serverTimestamp()
    };
    if (order.originalPrice == null) data.originalPrice = Number(order.price || 0);
    await updateDoc(doc(db, "orders", order.id), data);
  });
}

function openFailure(order) {
  openAction("فشل التوصيل", container => {
    addText(container, "label", "هل تم دفع أجرة التوصيل؟");
    const select = document.createElement("select");
    select.id = "feePaidChoice";
    [
      ["no", "لا"],
      ["yes", "نعم"]
    ].forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    });
    select.value = order.feePaid ? "yes" : "no";
    container.appendChild(select);
  }, async () => {
    await updateStatus(order, "فشل التوصيل", {
      feePaid: $("feePaidChoice").value === "yes"
    });
  });
}

function openDeferred(order) {
  openAction("تأجيل الطلبية", container => {
    addText(container, "label", "موعد التوصيل الجديد");
    const date = document.createElement("input");
    date.type = "date";
    date.id = "deferredDateInput";
    date.value = order.deferredDate || "";
    container.appendChild(date);
  }, async () => {
    const date = $("deferredDateInput").value;
    if (!date) {
      alert("حدد موعد التأجيل.");
      throw new Error("لم يتم تحديد التاريخ");
    }
    await updateStatus(order, "مؤجل", { deferredDate: date });
  });
}

function confirmCancel(order) {
  if (confirm("تأكيد إلغاء الطلبية؟ ستبقى محفوظة في السجل.")) {
    updateStatus(order, "ملغي");
  }
}

function normalizeJordanPhone(phone) {
  let value = String(phone || "").replace(/[^\d+]/g, "");
  if (value.startsWith("+")) value = value.slice(1);
  if (value.startsWith("07")) value = "962" + value.slice(1);
  else if (value.startsWith("7")) value = "962" + value;
  return value;
}

function openMessage(order) {
  selectedOrder = order;
  $("messageText").value =
`مرحباً ${order.customer || ""} 🌸

طلبك من Randis جاهز للتوصيل.

قيمة الطلب: ${money(order.price)} دينار.

يُرجى إرسال موقعك لتسهيل عملية التوصيل، والانتباه للهاتف خلال الساعات القادمة.`;
  $("messageModal").classList.remove("hidden");
}

$("closeMessage").addEventListener("click", () => {
  $("messageModal").classList.add("hidden");
});

$("whatsappBtn").addEventListener("click", () => {
  if (!selectedOrder) return;
  const phone = normalizeJordanPhone(selectedOrder.phone);
  if (!phone) {
    alert("رقم الهاتف غير مسجل.");
    return;
  }
  const message = encodeURIComponent($("messageText").value);
  window.open("https://wa.me/" + phone + "?text=" + message, "_blank");
});

$("smsBtn").addEventListener("click", () => {
  if (!selectedOrder) return;
  const phone = String(selectedOrder.phone || "").replace(/[^\d+]/g, "");
  if (!phone) {
    alert("رقم الهاتف غير مسجل.");
    return;
  }
  const message = encodeURIComponent($("messageText").value);
  window.location.href = "sms:" + phone + "?body=" + message;
});

// مسح الباركود بالكاميرا عند دعم المتصفح
$("scanBtn").addEventListener("click", async () => {
  const video = $("camera");
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
    video.classList.add("hidden");
    $("scanBtn").textContent = "مسح بالكاميرا";
    return;
  }
  try {
    if (!("BarcodeDetector" in window)) {
      alert("المتصفح لا يدعم قراءة الباركود مباشرة. أدخل الرقم يدوياً.");
      return;
    }
    const detector = new BarcodeDetector();
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = cameraStream;
    video.classList.remove("hidden");
    $("scanBtn").textContent = "إيقاف الكاميرا";
    await video.play();

    const scan = async () => {
      if (!cameraStream) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          $("barcode").value = codes[0].rawValue;
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
          video.classList.add("hidden");
          $("scanBtn").textContent = "مسح بالكاميرا";
          return;
        }
      } catch (error) {}
      if (cameraStream) requestAnimationFrame(scan);
    };
    scan();
  } catch (error) {
    alert("تعذّر تشغيل الكاميرا. تأكد من السماح باستخدامها.");
    cameraStream = null;
  }
});
</script>
