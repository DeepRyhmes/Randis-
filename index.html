 <script type="module">
/* Shared, side-effect-free business rules. All money is integer fils. */
'use strict';
const S=Object.freeze({NEW:'طلب جديد',PICKUP:'طلب استلام',RECEIVED:'تم الاستلام',SORTED:'تم الفرز',LOADED:'تم التحميل',PROGRESS:'قيد التوصيل',DELIVERED:'مسلمة بالكامل',PARTIAL:'مسلمة جزئياً',DEFERRED:'مؤجل',UNREACHABLE:'تعذر التسليم',CANCELLED:'ملغي',RETURNED:'مرتجع',DAMAGED:'تالف'});
const R=Object.freeze({NEW:'طلب مرتجع جديد',WAITING:'بانتظار إسناد مندوب',ASSIGNED:'مسند للمندوب',PICKED:'تم الاستلام / في الطريق للمتجر',CONVERTED:'محول إلى شحنة',DONE:'تم التسليم للمتجر'});
const CLOSED=[S.DELIVERED,S.PARTIAL,S.CANCELLED,S.RETURNED];
function check(ok,message){if(!ok)throw new Error(message);}
function text(v,max=200,required=false){check(typeof v==='string','قيمة نصية غير صالحة');v=v.trim();check(v.length<=max&&(!required||v.length>0),'النص مطلوب أو أطول من المسموح');return v;}
function fils(v){check((typeof v==='number'||typeof v==='string')&&String(v).trim()!==''&&/^\d+(\.\d{1,3})?$/.test(String(v)),'أدخل مبلغاً موجباً أو صفراً بثلاث منازل كحد أقصى');const n=Math.round(Number(v)*1000);check(Number.isSafeInteger(n)&&n<=1e12,'المبلغ خارج النطاق');return n;}
function legacyMoney(v){const n=Number(v??0);check(Number.isFinite(n)&&Math.abs(n)<=1e9,'قيمة مالية قديمة غير صالحة؛ تحتاج مراجعة');return Math.round(n*1000);}
function phone(v){let n=String(v??'').replace(/[\s()+-]/g,'');if(n.startsWith('00962'))n=n.slice(2);if(/^07[789]\d{7}$/.test(n))n='962'+n.slice(1);check(/^9627[789]\d{7}$/.test(n),'أدخل رقم هاتف أردني صحيح');return n;}
function finance(o){
 if(o.financeExcluded)return {collected:0,fees:0,merchant:0};
 const fee=o.feeFils??legacyMoney(o.deliveryFee);
 const price=o.priceFils??legacyMoney(o.price);
 let collected=0,fees=0,merchant=0;
 if(o.kind==='return'){
  if([R.PICKED,R.DONE,R.CONVERTED].includes(o.status)){collected=o.collectionFils??legacyMoney(o.price);fees=fee;merchant=collected-fee;}
 }else if([S.DELIVERED,S.PARTIAL].includes(o.status)){
  collected=o.status===S.DELIVERED?price:(o.collectedFils??legacyMoney(o.collectedAmount??o.deliveredAmount));fees=fee;merchant=collected-fee;
 }else if(o.refused===true){fees=fee;collected=o.feePaid===true?fee:0;merchant=o.feePaid===true?0:-fee;}
 return {collected,fees,merchant};
}
function delta(a,b){return {collected:b.collected-a.collected,fees:b.fees-a.fees,merchant:b.merchant-a.merchant};}
function terminal(o){return o.kind==='return'?[R.DONE,R.CONVERTED].includes(o.status):CLOSED.includes(o.status);}
function statusPatch(o,p,role){
 const status=text(p.status,80,true);check(Object.values(S).includes(status),'حالة غير معروفة');
 check(role==='admin'||[S.PROGRESS,S.DELIVERED,S.PARTIAL,S.DEFERRED,S.UNREACHABLE,S.CANCELLED,S.RETURNED,S.DAMAGED].includes(status),'هذه الحالة للإدارة فقط');
 check(role==='admin'||(!terminal(o)&&!o.pendingReview),'الطلب مغلق أو بانتظار مراجعة الإدارة');
 const note=text(p.note??'',1500);if([S.DEFERRED,S.UNREACHABLE,S.CANCELLED,S.RETURNED,S.DAMAGED].includes(status))check(note.length>0,'سبب التحديث مطلوب');
 const price=o.priceFils??legacyMoney(o.price);let collected=0;
 if(status===S.DELIVERED)collected=price;
 if(status===S.PARTIAL){check(price>0,'الطلب الصفري يُسلّم بالكامل');collected=fils(p.collected);check(collected<price,'التحصيل الجزئي يجب أن يكون أقل من قيمة الطرد');}
 const refused=p.refused===true;check(!refused||[S.UNREACHABLE,S.CANCELLED,S.RETURNED].includes(status),'رسوم الرفض متاحة لحالة رفض تسليم فقط');
 return {status,collectedFils:collected,collectedAmount:collected/1000,deliveredAmount:collected/1000,note,refused,feePaid:refused&&p.feePaid===true,pendingReview:role!=='admin'&&[S.UNREACHABLE,S.DAMAGED].includes(status)};
}
function allocation(items,amount){
 check(Number.isSafeInteger(amount)&&amount>0,'مبلغ التسوية غير صالح');
 const ids=new Set();let available=0;
 for(const x of items){check(!ids.has(x.id),'طلب مكرر في التسوية');ids.add(x.id);check(Number.isSafeInteger(x.due)&&x.due>=0,'رصيد الطلب غير صالح');available+=x.due;}
 check(amount<=available,'المبلغ أكبر من مستحقات الطلبات المختارة');let left=amount;
 return items.map(x=>{const n=Math.min(left,x.due);left-=n;return {id:x.id,amount:n};}).filter(x=>x.amount>0);
}
const D={S,R,CLOSED,check,text,fils,legacyMoney,phone,finance,delta,terminal,statusPatch,allocation};

// Firestore Web transactions. Every mutation reads and increments a shared clock.
// Query documents are re-read inside the transaction; clock conflicts retry the query.
function clientDatabase(sdk,firestore,getUid){
 const ref=(name,id)=>{const native=sdk.doc(sdk.collection(firestore,name),id);return wrapRef(native);};
 const wrapRef=native=>({native,key:native.path,id:native.id,parent:{id:native.parent.id},get:async()=>snap(await sdk.getDocFromServer(native)),set:async(data,options)=>sdk.setDoc(native,data,options)});
 const snap=native=>({id:native.id,ref:wrapRef(native.ref),exists:native.exists(),data:()=>native.data()});
 function collection(name,filters=[],max=null){
  let native=sdk.collection(firestore,name);if(filters.length||max)native=sdk.query(native,...filters.map(([k,op,v])=>sdk.where(k,op,v)),...(max?[sdk.limit(max)]:[]));
  const get=async()=>{const s=await sdk.getDocsFromServer(native);return {docs:s.docs.map(snap),size:s.size};};
  return {native,name,doc:id=>id?ref(name,id):wrapRef(sdk.doc(sdk.collection(firestore,name))),where:(k,op,v)=>collection(name,[...filters,[k,op,v]],max),limit:n=>collection(name,filters,n),get,count:()=>({get:async()=>{const s=await get();return {data:()=>({count:s.size})};}})};
 }
 return {collection,runTransaction:fn=>sdk.runTransaction(firestore,async raw=>{
  const clockRef=ref('settings','current'),clockNative=await raw.get(clockRef.native),clock=clockNative.data()||{};
  const writes=new Map();
  function queue(kind,r,values,options){const old=writes.get(r.key);writes.set(r.key,{kind:old?.kind==='create'?'create':kind,ref:r,values:{...(old?.values||{}),...values},options});}
  const tx={
   get:async r=>{
    if(r.key===clockRef.key)return snap(clockNative);
    if(r.key)return snap(await raw.get(r.native));
    const outside=await sdk.getDocsFromServer(r.native),docs=[];
    for(const item of outside.docs){const inside=await raw.get(item.ref);if(inside.exists())docs.push(snap(inside));}
    return {docs,size:docs.length};
   },
   create:(r,v)=>queue('create',r,v),update:(r,v)=>queue('update',r,v),set:(r,v,o)=>queue('set',r,v,o),
   link:(id,fields)=>{for(const w of writes.values())if(w.ref.id===id&&['orders','returns','expenses','transfers','complaints'].includes(w.ref.parent.id))Object.assign(w.values,fields);}
   ,source:id=>[...writes.values()].find(w=>w.ref.id===id&&['orders','returns','expenses','transfers','complaints','drivers','archives'].includes(w.ref.parent.id))?.ref.parent.id||'unknown'
  };
  const result=await fn(tx);
  // No aggregate balances are writable by the browser. Totals come from immutable events.
  const clockWrite=writes.get(clockRef.key);writes.delete(clockRef.key);
  for(const w of writes.values()){
   if(w.ref.parent.id==='merchant_accounts')continue;
   if(w.kind==='update')raw.update(w.ref.native,w.values);
   else if(w.options?.merge)raw.set(w.ref.native,w.values,{merge:true});
   else raw.set(w.ref.native,w.values);
  }
  const combined={...clock,...clockWrite?.values};
  raw.set(clockRef.native,{schemaReady:combined.schemaReady===true,schemaVersion:2,revision:(clock.revision||0)+1,updatedAt:sdk.serverTimestamp(),actorUid:getUid()},{merge:false});
  return result;
 },{maxAttempts:5})};
}

function createApi({sdk,firestore,auth}){
const ADMIN='wWsiPhxWGGemKjpcA1oI2jtrDij1',MERCHANT='HcftY3kcqrat3HybvnVCd9R7t5B3';
const db=clientDatabase(sdk,firestore,()=>auth.currentUser?.uid);
class HttpsError extends Error{constructor(code,message){super(message);this.code=code;}}
const stamp=()=>sdk.serverTimestamp();
const ref=(c,id)=>db.collection(c).doc(id);
const cleanId=v=>{D.check(typeof v==='string'&&/^[A-Za-z0-9_-]{1,128}$/.test(v),'معرّف غير صالح');return v;};
const hash=v=>{D.check(/^[A-Z0-9_-]{1,120}$/.test(v),'الباركود يجب أن يحتوي حروفاً إنجليزية أو أرقاماً أو - أو _');return v;};
const moneyKeys=['collected','fees','merchant','expense','settled'];
const zero=()=>Object.fromEntries(moneyKeys.map(k=>[k,0]));
const add=(a,b)=>Object.fromEntries(moneyKeys.map(k=>[k,(a?.[k]||0)+(b?.[k]||0)]));
async function actor(uid,email){
 if(uid===ADMIN)return {uid,role:'admin'};
 if(uid===MERCHANT){D.check(String(email||'').toLowerCase()==='rand@randis.app','UID المتجر لا يطابق البريد المعتمد');return {uid,role:'store',merchantId:MERCHANT};}
 const d=await ref('drivers',uid).get();D.check(d.exists&&d.data().active===true,'الحساب غير مفعّل');return {uid,role:'driver',driver:d.data()};
}
function admin(a){D.check(a.role==='admin','هذا الإجراء للإدارة فقط');}
function own(a,o){D.check(a.role==='admin'||(a.role==='store'&&o.merchantId===a.uid)||(a.role==='driver'&&o.driverUid===a.uid),'غير مصرح لهذا السجل');}
function notify(tx,a,o,entityId,title){
 const recipients=new Set([ADMIN,o.merchantId,o.driverUid].filter(Boolean));
 for(const uid of recipients)tx.create(db.collection('notifications').doc(),{recipientUid:uid,title,message:title,entityId,entityType:o.entityType||(o.kind==='return'?'returns':'orders'),read:false,createdAt:stamp()});
}
function audit(tx,a,action,id,before,after){const r=db.collection('accounting_history').doc();tx.create(r,{actorUid:a.uid,role:a.role,action,entityId:id,sourceCollection:tx.source(id),before:before||null,after:after||null,createdAt:stamp()});tx.link(id,{lastAuditId:r.id});}
function history(tx,a,o,id,action,note=''){const r=db.collection('order_events').doc();tx.create(r,{orderId:id,merchantId:o.merchantId,driverUid:o.driverUid||null,action,status:o.status,note,actorUid:a.uid,createdAt:stamp()});tx.link(id,{lastHistoryId:r.id});}
function ledger(tx,a,id,change,merchantId,extra={}){const r=db.collection('financial_events').doc();tx.create(r,{entityId:id,sourceCollection:String(extra.type||'').startsWith('return_')?'returns':'orders',merchantId,actorUid:a.uid,createdAt:stamp(),postingId:null,...zero(),...change,...extra});tx.link(id,{lastFinancialEventId:r.id});}
function patchTotals(){/* Derived from financial_events; no balance writes. */}
async function accountTotal(tx){const events=await tx.get(db.collection('financial_events').where('merchantId','==',MERCHANT));let total=zero();for(const e of events.docs)total=add(total,e.data());return total;}
async function getRecord(tx,c,id){const snap=await tx.get(ref(c,cleanId(id)));D.check(snap.exists,'السجل غير موجود');return {ref:snap.ref,id:snap.id,data:snap.data()};}
function orderFields(p){
 const priceFils=D.fils(p.price),feeFils=D.fils(p.fee??2);
 const governorate=D.text(p.governorate,40,true);
 D.check(['عمان','الزرقاء','إربد','البلقاء','مادبا','الطفيلة','معان','العقبة','المفرق','جرش','عجلون','الكرك'].includes(governorate),'المحافظة غير صالحة');
 return {customer:D.text(p.customer,150,true),phone:D.phone(p.phone),area:D.text(p.area,300,true),governorate,priceFils,feeFils,price:priceFils/1000,deliveryFee:feeFils/1000,netMerchant:(priceFils-feeFils)/1000,notes:D.text(p.notes??'',2000),isUrgent:p.isUrgent===true};
}
// Spark client service. Authorization and driver financial invariants are enforced by firestore.rules.
const api=async request=>{
 if(!request.auth)throw new HttpsError('unauthenticated','سجّل الدخول أولاً');
 try{

 const a=await actor(request.auth.uid,request.auth.token.email),p=request.data?.payload??{},action=request.data?.action;
 if(action==='profile')return {uid:a.uid,role:a.role,merchantId:a.role==='driver'?null:MERCHANT};
 if(action==='migrationPreview'){admin(a);const counts={};for(const c of ['orders','returns','expenses','transfers'])counts[c]=(await db.collection(c).count().get()).data().count;const barcodes=new Map(),duplicates=[];const orders=await db.collection('orders').get();for(const o of orders.docs){const barcode=String(o.data().trackingId||o.data().barcode||'').trim().toUpperCase();if(!barcode)continue;if(barcodes.has(barcode))duplicates.push({barcode,ids:[barcodes.get(barcode),o.id]});else barcodes.set(barcode,o.id);}return {...counts,duplicates};}
 if(action==='migrate'){admin(a);return await migrate(a);}
 let authDriver=null;
 if(action==='saveDriver'){admin(a);authDriver={uid:cleanId(p.uid),email:D.text(p.email,200,true),disabled:false};D.check(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authDriver.email),'البريد غير صالح');D.check(authDriver.uid!==ADMIN&&authDriver.uid!==MERCHANT&&!authDriver.disabled,'حساب غير صالح للسائق');}
 const requestId=cleanId(request.data?.requestId);D.check(requestId.length>=16,'معرّف العملية قصير');
 const receipt=ref('operation_requests',a.uid+'_'+requestId);
 return await db.runTransaction(async tx=>{
  const receiptSnap=await tx.get(receipt);if(receiptSnap.exists)return receiptSnap.data().result;
  if(a.role==='driver'){const driverSnap=await tx.get(ref('drivers',a.uid));D.check(driverSnap.exists&&driverSnap.data().active===true,'حساب السائق غير مفعّل');}
  const currentSnap=await tx.get(ref('settings','current'));const current=currentSnap.data()||{};
  D.check(current.schemaReady===true,'يلزم تجهيز البيانات القديمة من صفحة الإدارة أولاً');
  const acc=action==='settle'?await accountTotal(tx):zero();
  let result={ok:true};
  const done=()=>{tx.create(receipt,{action,actorUid:a.uid,createdAt:stamp(),result});return result;};
  if(action==='createOrder'){
   D.check(a.role!=='driver','السائق لا ينشئ طلبات');
   const fields=orderFields(p),barcode=D.text(p.barcode??'',120),id=db.collection('orders').doc().id;
   const trackingId=(barcode||'BX-'+id).toUpperCase();const bRef=ref('barcodes',hash(trackingId.toUpperCase()));const b=await tx.get(bRef);D.check(!b.exists,'الباركود مستخدم');
   const data={...fields,schemaVersion:2,kind:'order',merchantId:MERCHANT,trackingId,createdBy:a.uid,createdAt:stamp(),updatedAt:stamp(),status:a.role==='store'?D.S.NEW:D.S.RECEIVED,collectedFils:0,collectedAmount:0,settledFils:0,archived:false};
   tx.create(ref('orders',id),data);tx.create(bRef,{orderId:id,trackingId});audit(tx,a,action,id,null,fields);history(tx,a,data,id,action,'إنشاء الشحنة');notify(tx,a,data,id,'تم إنشاء شحنة');result.id=id;return done();
  }
  if(['status','editOrder','restore'].includes(action)){
   const o=await getRecord(tx,'orders',p.id);own(a,o.data);let changes;
   if(action==='status'){
    D.check(a.role!=='store','المتجر لا يغيّر نتائج التسليم');changes=D.statusPatch(o.data,p,a.role);changes.archived=D.terminal({...o.data,...changes});
    if(!o.data.collectedAt&&[D.S.DELIVERED,D.S.PARTIAL].includes(changes.status))changes.collectedAt=stamp();
   }else if(action==='editOrder'){

    const s=await tx.get(snap.ref);if(!s.exists||s.data().schemaVersion===2)return;const o=s.data();
    const periodSnap=await tx.get(ref('settings','current'));const period=periodSnap.data()||{},acc=zero();

const empty=m=>`<div class="card empty">${m}</div>`;
const input=(name,label,value='',type='text',required=true)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.001"':''}></label>`;
const textarea=(name,label,value='',required=false)=>`<label>${label}<textarea name="${name}" ${required?'required':''}>${esc(value)}</textarea></label>`;
const select=(name,label,items,value='')=>`<label>${label}<select name="${name}">${items.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`;}).join('')}</select></label>`;
function toast(m){$('toast').textContent=m;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',6500);}
function close(){stopCamera?.();stopCamera=null;if(modalUrl)URL.revokeObjectURL(modalUrl);modalUrl=null;$('modalHost').innerHTML='';}
function modal(title,html){close();$('modalHost').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h3>${esc(title)}</h3>${action('إغلاق ✕','close')}</div>${html}</div></div>`;$('modalHost').querySelector('input,select,button')?.focus();}
function form(title,actionName,html,extra={}){modal(title,`<form id="modalForm">${html}<p class="error" id="formError" role="alert"></p><button class="primary full">حفظ وتأكيد</button></form>`);const f=$('modalForm');const requestId=crypto.randomUUID();f.onsubmit=async e=>{e.preventDefault();if(busy)return;const p={...Object.fromEntries(new FormData(f)),...extra};for(const el of f.querySelectorAll('input[type=checkbox]'))p[el.name]=el.checked;
 if(actionName==='status'&&p.status===S.PARTIAL&&f.elements.collected)p.collected=f.elements.collected.value;
 if(actionName==='settle'||actionName==='reviewLegacyTransfer'){p.ids=[...f.querySelectorAll('[name=orderKey]:checked')].map(x=>x.value);p.confirmed=f.elements.confirmed.checked;}
 try{await mutate(actionName,p,requestId);close();toast('تم الحفظ بنجاح');}catch(err){$('formError')&&($('formError').textContent=err.message);}};return f;}
async function mutate(actionName,payload={},requestId=crypto.randomUUID()){
 if(busy)throw Error('يوجد إجراء قيد التنفيذ');busy=true;const controls=[...document.querySelectorAll('button')].map(b=>[b,b.disabled]);controls.forEach(([b])=>b.disabled=true);
 try{return (await call({action:actionName,payload,requestId})).data;}finally{busy=false;controls.forEach(([b,disabled])=>{if(b.isConnected)b.disabled=disabled;});render();}
}
function watch(name,source){const token=generation;unsubs.push(onSnapshot(source,s=>{if(token!==generation)return;loaded.add(name);data[name]=s.docs?s.docs.map(d=>({id:d.id,...d.data()})):(s.data()||{});render();},e=>{if(token===generation)toast('تعذر تحميل '+name+': '+e.message);}));}
function subscribe(){
 const c=n=>collection(db,n),scoped=n=>admin()?c(n):query(c(n),where(profile.role==='store'?'merchantId':'driverUid','==',user.uid));
 watch('orders',scoped('orders'));watch('history',scoped('order_events'));watch('returns',scoped('returns'));watch('complaints',scoped('complaints'));
 watch('notifications',query(c('notifications'),where('recipientUid','==',user.uid)));
 if(admin()){
  watch('drivers',c('drivers'));watch('transfers',c('transfers'));watch('expenses',c('expenses'));watch('archives',c('archives'));watch('events',c('financial_events'));watch('audit',c('accounting_history'));watch('settings',doc(db,'settings','current'));
 }else if(store()){watch('transfers',query(c('transfers'),where('merchantId','==',user.uid)));watch('events',query(c('financial_events'),where('merchantId','==',user.uid)));}

}
$('loginForm').elements.account.onchange=e=>$('driverEmailLabel').hidden=e.target.value!=='driver';
$('loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;$('loginError').textContent='';try{const email=f.elements.account.value==='driver'?f.elements.email.value.trim():f.elements.account.value;await signInWithEmailAndPassword(auth,email,f.elements.password.value);f.elements.password.value='';}catch(err){$('loginError').textContent='تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.';}finally{b.disabled=false;}};
onAuthStateChanged(auth,async u=>{const token=++generation;unsubs.forEach(f=>f());unsubs=[];loaded.clear();close();for(const k of Object.keys(data))data[k]=['account','settings'].includes(k)?{}:[];user=u;profile=null;preview='';page='home';$('login').hidden=!!u;$('app').hidden=!u;if(!u)return;
 try{const p=(await call({action:'profile'})).data;if(token!==generation)return;profile=p;subscribe();render();}catch(e){if(token===generation){toast('تعذر التعرف على صلاحيات الحساب: '+e.message);await signOut(auth);}}
});
function tabs(){let t=[['home','الرئيسية'],['orders','الشحنات'],['returns','المرتجعات'],['archives','الأرشيف'],['complaints','الشكاوى'],['notifications','الإشعارات']];if(!driver())t.splice(3,0,['finance','المالية'],['reports','التقارير']);if(admin()&&!preview)t.push(['drivers','السائقون'],['audit','سجل التدقيق']);return t;}
function render(){if(!profile)return;data.account=data.events.reduce((a,e)=>{for(const k of ['collected','fees','merchant','settled'])a[k]+=Number(e[k]||0);return a;},{collected:0,fees:0,merchant:0,settled:0});data.settings.totalExpense=data.events.reduce((a,e)=>a+Number(e.expense||0),0);document.body.classList.toggle('store',store());$('brand').innerHTML=store()?'Randis<small>بوابة المتجر</small>':driver()?'Box It Driver<small>لوحة السائق</small>':'Box It<small>إدارة العمليات والتوصيل</small>';
 $('mode').innerHTML=admin()?`<div class="actions">${action('وضع الإدارة','adminMode','',!preview?'active':'')}<select id="previewDriver"><option value="">معاينة حساب سائق</option>${data.drivers.filter(d=>d.active).map(d=>`<option value="${esc(d.id)}" ${preview===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>`:'';
 const t=tabs();if(!t.some(([k])=>k===page))page='home';const unread=data.notifications.filter(n=>!n.read).length;
 $('tabs').innerHTML=t.map(([k,l])=>action(l+(k==='notifications'&&unread?' ('+unread+')':''),'page',k,page===k?'active':'')).join('');
 $('bottom').innerHTML=[action('الرئيسية','page','home'),action('الشحنات','page','orders'),...(!driver()?[action('＋ إضافة','newOrder','','primary'),action('الحسابات','page','finance')]:[action('المرتجعات','page','returns')])].join('');
 $('systemNotice').innerHTML=admin()&&loaded.has('settings')&&!data.settings.schemaReady?`<div class="notice">يلزم تجهيز البيانات القديمة قبل تفعيل الكتابة. تبقى بياناتك محفوظة.${action('معاينة وتجهيز البيانات','migration')}</div>`:'';
 const views={home:homeHtml,orders:ordersHtml,archives:archivesHtml,returns:returnsHtml,finance:financeHtml,reports:reportsHtml,drivers:driversHtml,complaints:complaintsHtml,notifications:notificationsHtml,audit:auditHtml};$('content').innerHTML=(!loaded.has('orders')||(!driver()&&['finance','reports'].includes(page)&&!loaded.has('events')))?empty('جارٍ تحميل البيانات…'):views[page]();
 if(busy)document.querySelectorAll('button').forEach(b=>b.disabled=true);
}
function orderStats(list){return `<div class="grid">${stat('إجمالي الطلبات',list.length)}${stat('نشطة',list.filter(o=>!CLOSED.includes(o.status)).length)}${stat('مسلمة بالكامل',list.filter(o=>o.status===S.DELIVERED).length)}${stat('مسلمة جزئياً',list.filter(o=>o.status===S.PARTIAL).length)}${stat('مؤجلة',list.filter(o=>o.status===S.DEFERRED).length)}${stat('ملغاة',list.filter(o=>o.status===S.CANCELLED).length)}${stat('التحصيل الفعلي',money(list.reduce((n,o)=>n+finance(o).collected,0)))}</div>`;}
function homeHtml(){return `<h2>${driver()?'إحصاءات السائق':store()?'لوحة Randis':'لوحة عمليات Box It'}</h2>${orderStats(scopedOrders())}<div class="card"><h3>إجراءات سريعة</h3><div class="actions">${!driver()?action('إنشاء شحنة','newOrder','','primary'):''}${action('عرض الشحنات','page','orders')}${!driver()?action('طلب مرتجع','newReturn'):''}</div></div>`;}
function matches(o){return [o.customer,o.phone,o.trackingId,o.area,o.id].some(x=>String(x??'').toLowerCase().includes(search.toLowerCase()));}
function searchBar(){return `<input id="search" value="${esc(search)}" placeholder="بحث بالاسم أو الهاتف أو الباركود"><div class="filters">${select('statusFilter','الحالة',[['','كل الحالات'],...Object.values(S)],filter)}</div>`;}
function orderCard(o,archive=false){return `<div class="card order"><div class="order-top"><strong>${esc(o.customer)}</strong><span class="badge ${CLOSED.includes(o.status)?'closed':o.status===S.DEFERRED?'deferred':''}">${esc(o.status)}</span></div><div class="muted">${esc(o.area)} · ${esc(o.phone)}<br>باركود: ${esc(o.trackingId||o.id)}<br>تاريخ الطلب: ${date(o.createdAt)}${o.archiveBatchId?'<br>الترحيل: '+date(o.archivedAt):''}</div><p><b>${money(o.priceFils??Math.round(Number(o.price||0)*1000))}</b>${o.isUrgent?' <span class="badge">مستعجل</span>':''}</p><div class="actions">${action('التفاصيل والسجل','details',o.id)}${!store()&&!archive&&!preview?action('تحديث الحالة','status',o.id,'primary'):''}${!driver()&&!archive?action('تعديل','editOrder',o.id):''}${admin()&&!preview&&!archive?action('إسناد','assignOne',o.id):''}${admin()&&!preview&&archive?action('استعادة','restore',o.id):''}${action('اتصال وتواصل','contact',o.id)}${action('شكوى','newComplaint',o.id)}</div>${admin()&&!preview&&!archive?`<label><input type="checkbox" name="bulk" value="${esc(o.id)}">تحديد للإسناد الجماعي</label>`:''}</div>`;}
function ordersHtml(){let list=scopedOrders().filter(o=>!CLOSED.includes(o.status)&&!o.archived);if(filter)list=list.filter(o=>o.status===filter);list=list.filter(matches).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));return `<h2>إدارة الشحنات</h2><div class="actions">${!driver()?action('شحنة جديدة','newOrder','','primary'):''}${admin()&&!preview?action('إسناد المحدد','assignBulk'):''}${action('تصدير CSV','export')}</div>${searchBar()}${list.map(o=>orderCard(o)).join('')||empty('لا توجد شحنات مطابقة')}`;}
function archivesHtml(){let list=scopedOrders().filter(o=>CLOSED.includes(o.status)||o.archived).filter(matches);if(filter)list=list.filter(o=>o.status===filter);return `<h2>الأرشيف</h2><p class="muted">تواريخ الطلب والتحصيل والترحيل تبقى محفوظة. استعادة الطلب تسجل تسوية محاسبية عند الحاجة.</p>${searchBar()}${list.sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)).map(o=>orderCard(o,true)).join('')||empty('الأرشيف فارغ')}`;}
function driverOptions(){return data.drivers.filter(d=>d.active).map(d=>[d.id,d.name]);}
function driversHtml(){return `<h2>إدارة السائقين</h2>${action('إضافة حساب سائق','newDriver','','primary')}${data.drivers.map(d=>`<div class="card"><h3>${esc(d.name)}</h3><div class="muted">${esc(d.email)} · ${esc(d.phone)}<br>UID: ${esc(d.uid||d.id)} · ${d.active?'نشط':'غير نشط'}</div><p>العبء النشط: ${data.orders.filter(o=>o.driverUid===d.id&&!CLOSED.includes(o.status)).length}</p>${action('تعديل وتفعيل','editDriver',d.id)}</div>`).join('')||empty('لا يوجد سائقون. أضف حساب Firebase Authentication موجوداً باستخدام UID.')}`;}
function periodTotals(){const out={collected:0,fees:0,merchant:0,expense:0,settled:0};for(const e of data.events.filter(e=>e.postingId===null))for(const k of Object.keys(out))out[k]+=Number(e[k]||0);return out;}
function financeHtml(){const p=periodTotals(),a=data.account;return `<h2>${store()?'كشف حساب Randis':'المالية والمحاسبة'}</h2><h3>الفترة الحالية</h3><div class="grid">${stat('التحصيل الفعلي',money(p.collected))}${stat('أجور التوصيل',money(p.fees))}${stat('صافي التاجر للفترة',money(p.merchant))}${!store()?stat('المصروفات',money(p.expense)):''}</div><h3>الرصيد التراكمي — لا يلغيه الترحيل</h3><div class="grid">${stat('صافي مستحقات المتجر',money(a.merchant))}${stat('التسويات المدفوعة',money(a.settled))}${stat('الرصيد القائم',money((a.merchant||0)-(a.settled||0)))}${!store()?stat('صافي تشغيل Box It',money((a.fees||0)-(data.settings.totalExpense||0))):''}</div><div class="actions">${admin()&&!preview?action('ترحيل','post','','primary')+action('تسجيل تسوية CliQ','settle')+action('مصروف تشغيلي','expense'):''}${action('سجل الحركات المالية','ledger')}</div>${data.transfers.some(t=>t.legacyReviewRequired&&!t.reviewed)?'<div class="notice">توجد تحويلات قديمة تحتاج مراجعة وربط قبل الاعتماد على الرصيد.</div>':''}<h3>التحويلات</h3>${data.transfers.map(t=>`<div class="card"><b>${esc(t.title||t.type||'تحويل')}</b> · ${money(t.amountFils??Number(t.amount||0)*1000)}<div class="muted">${date(t.createdAt)} · ${esc(t.reference||t.refNo||'')} · ${esc(t.transferDate||'')}${t.legacyReviewRequired&&!t.reviewed?' — بانتظار مراجعة':''}</div>${admin()&&t.legacyReviewRequired&&!t.reviewed?action('مراجعة التحويل القديم','reviewTransfer',t.id):''}</div>`).join('')||empty('لا توجد تحويلات')}`;}
function ledgerHtml(){const entries=[...data.events.map(x=>({...x,entry:'event'})),...data.archives.filter(x=>x.type==='period_posting').map(x=>({...x,entry:'posting'}))].sort((a,b)=>ms(b.createdAt)-ms(a.createdAt));return entries.map(x=>`<div class="card"><h3>${x.entry==='posting'?'ترحيل فترة مالية':esc(({settlement:'تسوية CliQ',expense:'مصروف',legacy_opening:'رصيد افتتاحي',status:'تحديث نتيجة تسليم',restore:'استعادة وتسوية',editOrder:'تعديل طلب'})[x.type]||x.type)}</h3><div class="muted">${date(x.createdAt)}<br>المرجع: ${esc(x.id)} · ${esc(x.reference||x.entityId||'')}</div>${x.entry==='posting'?`<p>عدد الطلبات: ${esc(x.orderCount)}</p><p>تحصيل: ${money(x.collected??Number(x.collectedAmount||0)*1000)}</p><p>الأجور: ${money(x.fees??Number(x.deliveryFees||0)*1000)}</p><p>صافي التاجر: ${money(x.merchant??Number(x.merchantNet||0)*1000)}</p><p>المصروفات: ${money(x.expense??Number(x.expenses||0)*1000)}</p><p class="muted">إقفال فترة؛ لا يعني دفع مستحقات.</p>`:`<p>تحصيل: ${money(x.collected)} · أجور: ${money(x.fees)} · صافي التاجر: ${money(x.merchant)}</p>${x.expense?'<p>مصروف: '+money(x.expense)+'</p>':''}${x.settled?'<p>تسوية مدفوعة: '+money(x.settled)+'</p>':''}<div class="muted">${x.postingId?'مرحّل: '+esc(x.postingId):'ضمن الفترة الحالية'}</div>`}</div>`).join('')||empty('لا توجد حركات');}
function returnsHtml(){return `<h2>المرتجعات</h2>${!driver()?action('طلب مرتجع جديد','newReturn','','primary'):''}${scopedReturns().map(r=>`<div class="card"><div class="order-top"><b>${esc(r.customer)}</b><span class="badge">${esc(r.status)}</span></div><p>${esc(r.details)}</p><div class="muted">${esc(r.phone)} · ${esc(r.area)} · ${date(r.createdAt)}<br>التحصيل: ${money(r.collectionFils??Number(r.price||0)*1000)} · الرسوم: ${money(r.feeFils??Number(r.deliveryFee||0)*1000)}<br>${esc(r.driverName||'غير مسند')}</div><div class="actions">${admin()&&!preview&&[R.NEW,R.WAITING,R.ASSIGNED].includes(r.status)?action('إسناد','assignReturn',r.id):''}${!store()&&!preview&&r.status===R.ASSIGNED?action('تأكيد الاستلام','pickupReturn',r.id):''}${admin()&&!preview&&r.status===R.PICKED?action('تسليم للمتجر','completeReturn',r.id)+action('تحويل لشحنة صفرية','convertReturn',r.id):''}${admin()&&!preview?action('تعديل المبلغ والرسوم','editReturn',r.id):''}</div></div>`).join('')||empty('لا توجد مرتجعات')}`;}
function complaintsHtml(){return `<h2>الشكاوى</h2>${data.complaints.map(c=>`<div class="card"><b>${esc(c.category)} — ${esc(c.status)}</b><p>${esc(c.description)}</p><div class="muted">طلب: ${esc(c.orderId)} · ${date(c.createdAt)}</div><p>${esc(c.resolution||'')}</p>${admin()&&!preview?action('معالجة الشكوى','resolveComplaint',c.id):''}</div>`).join('')||empty('لا توجد شكاوى. يمكنك إضافة شكوى من بطاقة الطلب.')}`;}
function notificationsHtml(){return `<h2>الإشعارات</h2>${[...data.notifications].sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)).map(n=>`<div class="card"><b>${n.read?'':'● '}${esc(n.title)}</b><div class="muted">${date(n.createdAt)}</div>${action('فتح','openNotification',n.id)}</div>`).join('')||empty('لا توجد إشعارات')}`;}
function auditHtml(){return `<h2>سجل التدقيق</h2>${[...data.audit].sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)).map(a=>`<div class="card"><b>${esc(a.action)}</b><div class="muted">${date(a.createdAt)} · ${esc(a.role)} · ${esc(a.actorUid)}<br>السجل: ${esc(a.entityId)}</div>${action('القيم السابقة والجديدة','auditDetail',a.id)}</div>`).join('')||empty('لا توجد تغييرات مسجلة')}`;}
let reportFrom='',reportTo='';
function reportData(){const inRange=v=>{const d=day(v);return d&&(!reportFrom||d>=reportFrom)&&(!reportTo||d<=reportTo);};return {orders:scopedOrders().filter(o=>inRange(o.createdAt)),events:data.events.filter(e=>inRange(e.createdAt)),returns:scopedReturns().filter(r=>inRange(r.createdAt))};}
function reportsHtml(){const r=reportData(),totals={collected:0,fees:0,merchant:0,expense:0,settled:0};for(const e of r.events)for(const k of Object.keys(totals))totals[k]+=e[k]||0;return `<h2>التقارير</h2><div class="card"><div class="actions">${action('اليوم','reportPreset','day')}${action('آخر 7 أيام','reportPreset','week')}${action('هذا الشهر','reportPreset','month')}${action('كل الفترات','reportPreset','all')}</div><div class="row">${input('reportFrom','من تاريخ',reportFrom,'date',false)}${input('reportTo','إلى تاريخ',reportTo,'date',false)}</div><p class="muted">الأعداد بحسب تاريخ إنشاء الطلب؛ الحركات بحسب تاريخ تسجيلها المحاسبي. تشمل التعديلات الموجبة والسالبة.</p></div>${orderStats(r.orders)}<div class="grid">${stat('تحصيل حركات الفترة',money(totals.collected))}${stat('أجور الفترة',money(totals.fees))}${stat('صافي التاجر',money(totals.merchant))}${stat('تسويات الفترة',money(totals.settled))}${!store()?stat('المصروفات',money(totals.expense)):''}${stat('المرتجعات',r.returns.length)}</div>${action('تصدير الطلبات ضمن الفترة CSV','exportReport','','primary')}${admin()?`<h3>أداء السائقين ضمن الفترة</h3>${data.drivers.map(d=>`<div class="card"><b>${esc(d.name)}</b>${orderStats(r.orders.filter(o=>o.driverUid===d.id))}</div>`).join('')}`:''}`;}
const governorates=['عمان','الزرقاء','إربد','البلقاء','مادبا','الطفيلة','معان','العقبة','المفرق','جرش','عجلون','الكرك'];
function orderForm(o={}){return `<div class="row">${input('customer','اسم العميل',o.customer)}${input('phone','الهاتف',o.phone,'tel')}</div><div class="row">${select('governorate','المحافظة',governorates,o.governorate==='السلط'?'البلقاء':o.governorate)}${input('area','المنطقة',o.area)}</div><div class="row">${input('price','قيمة الطرد (تشمل أجرة التوصيل)',(o.priceFils??Number(o.price||0)*1000)/1000,'number')}${input('fee','أجرة التوصيل',(o.feeFils??Number(o.deliveryFee??2)*1000)/1000,'number')}</div><div class="notice" id="netPreview"></div>${!o.id?input('barcode','الباركود (اختياري؛ يولد تلقائياً إذا ترك فارغاً)','','text',false)+action('مسح بالكاميرا','scan'):''}${textarea('notes','الملاحظات',o.notes)}<label><input type="checkbox" name="isUrgent" ${o.isUrgent?'checked':''}>مستعجل</label>`;}
function netPreview(){const f=$('modalForm');if(f?.elements.price&&$('netPreview'))$('netPreview').textContent='صافي التاجر المتوقع: '+money(Math.round((Number(f.elements.price.value)-Number(f.elements.fee.value))*1000));}
function findOrder(id){const o=data.orders.find(o=>o.id===id);if(!o)throw Error('الطلب غير متاح');return o;}
async function details(id){const o=findOrder(id),f=finance(o);modal('تفاصيل الشحنة',`<div class="card"><h3>${esc(o.customer)}</h3><p>${esc(o.phone)} · ${esc(o.area)}</p><p>الباركود: ${esc(o.trackingId||o.id)}</p><p>قيمة الطرد: ${money(o.priceFils??Number(o.price||0)*1000)}</p><p>التحصيل الفعلي: ${money(f.collected)}</p>${!driver()?`<p>أجرة التوصيل: ${money(f.fees)} · صافي التاجر: ${money(f.merchant)}</p><p>المسوّى من الطلب: ${money(o.settledFils)}</p>`:''}<p>الحالة: ${esc(o.status)}</p><p>المندوب: ${esc(o.driverName||'غير مسند')}</p><p>الملاحظات: ${esc(o.notes||'—')}</p><div class="muted">إنشاء: ${date(o.createdAt)}<br>تحصيل أصلي: ${date(o.collectedAt)}<br>ترحيل: ${date(o.archivedAt)}</div></div>${data.history.filter(h=>h.orderId===id).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt)).map(h=>`<div class="card">${esc(h.status)} · ${esc(h.note)}<div class="muted">${date(h.createdAt)}</div></div>`).join('')}${(o.events||[]).map(e=>`<div class="card">${esc(e.status)} · ${esc(e.note)}<div class="muted">${esc(e.by)} · ${esc(e.at)}</div></div>`).join('')}${admin()?data.audit.filter(a=>a.entityId===id).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt)).map(a=>`<div class="card">${esc(a.action)} · ${date(a.createdAt)} · ${esc(a.actorUid)}</div>`).join(''):''}${o.proofId?action('عرض صورة الإثبات','viewProof',id):''}${!store()&&!preview?action('رفع صورة إثبات','proof',id):''}`);}
function statusForm(id){const o=findOrder(id);const statuses=admin()?Object.values(S):[S.PROGRESS,S.DELIVERED,S.PARTIAL,S.DEFERRED,S.UNREACHABLE,S.CANCELLED,S.RETURNED,S.DAMAGED];const f=form('تحديث التسليم','status',select('status','الحالة',statuses,o.status)+`<div id="partial"></div>`+textarea('note','السبب / الملاحظة')+`<div id="refusal"></div>`,{id});
 const change=()=>{const s=f.elements.status.value;const price=o.priceFils??Number(o.price||0)*1000;$('partial').innerHTML=s===S.PARTIAL?input('collected','المبلغ المحصل فعلياً','','number'):(s===S.DELIVERED?`<div class="notice">سيعتمد تحصيل ${money(price)} تلقائياً.</div>`:'');$('refusal').innerHTML=[S.UNREACHABLE,S.CANCELLED,S.RETURNED].includes(s)?'<label><input type="checkbox" name="refused">رفض العميل بعد وصول السائق (تطبق رسوم التوصيل)</label><label><input type="checkbox" name="feePaid">دفع العميل أجرة التوصيل</label>':'';if(f.elements.note)f.elements.note.required=[S.DEFERRED,S.UNREACHABLE,S.CANCELLED,S.RETURNED,S.DAMAGED].includes(s);};f.elements.status.onchange=change;change();}
function settlementForm(){const list=[...data.orders.map(o=>({...o,key:'orders:'+o.id})),...data.returns.map(o=>({...o,key:'returns:'+o.id}))].map(o=>({...o,due:Math.max(0,finance(o).merchant-(o.settledFils||0))})).filter(o=>o.due>0);form('تسجيل تسوية CliQ فعلية','settle',`<div class="notice">التطبيق يسجل تحويلك الفعلي ولا ينفذ الدفع. يمكنك تسوية كامل الرصيد أو جزء منه مع تحديد الطلبات.</div>${input('amount','المبلغ','','number')}${input('reference','مرجع CliQ الفريد')}${input('date','تاريخ التحويل',day(Date.now()),'date')}<h3>الطلبات المشمولة</h3>${list.map(o=>`<label><input name="orderKey" type="checkbox" value="${esc(o.key)}" checked>${esc(o.customer)} — ${money(o.due)}</label>`).join('')||empty('لا توجد مستحقات موجبة')}<label><input name="confirmed" type="checkbox" required>أؤكد تنفيذ التحويل فعلياً</label>`);}
function returnForm(){form('طلب مرتجع','createReturn',input('customer','اسم العميل')+input('phone','الهاتف','','tel')+input('area','المنطقة')+textarea('details','تفاصيل المرتجع','',true)+input('amount','مبلغ التحصيل',0,'number')+input('fee','أجرة التوصيل',2,'number')+textarea('notes','الملاحظات'));}
function driverForm(id){const d=data.drivers.find(d=>d.id===id)||{};form('حساب سائق موجود في Authentication','saveDriver',input('uid','Firebase UID من Authentication',d.uid||'')+input('email','بريد السائق من Authentication',d.email||'','email')+input('name','اسم السائق',d.name)+input('phone','الهاتف',d.phone,'tel')+input('vehicle','المركبة',d.vehicle,'text',false)+`<label><input name="active" type="checkbox" ${d.active!==false?'checked':''}>حساب نشط</label>`);}
function exportCSV(list){const safe=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const rows=[['باركود','العميل','الهاتف','المنطقة','قيمة الطرد','التحصيل','الأجور','صافي التاجر','الحالة','تاريخ الطلب','تاريخ التحصيل','تاريخ الترحيل'],...list.map(o=>{const f=finance(o);return [o.trackingId||o.id,o.customer,o.phone,o.area,(o.priceFils??Number(o.price||0)*1000)/1000,f.collected/1000,driver()?'':f.fees/1000,driver()?'':f.merchant/1000,o.status,date(o.createdAt),date(o.collectedAt),date(o.archivedAt)];})];const url=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='randis-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function scan(){if(!('BarcodeDetector' in window)){toast('المسح بالكاميرا غير مدعوم بهذا المتصفح؛ أدخل الباركود يدوياً.');return;}const f=$('modalForm');if(!f)return;const video=document.createElement('video');video.setAttribute('playsinline','');video.muted=true;f.prepend(video);const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;await video.play();let stopped=false;stopCamera=()=>{stopped=true;stream.getTracks().forEach(t=>t.stop());video.remove();};const detector=new window.BarcodeDetector();const tick=async()=>{if(stopped)return;try{const codes=await detector.detect(video);if(codes.length){f.elements.barcode.value=codes[0].rawValue;stopCamera();stopCamera=null;return;}}catch(e){stopCamera();toast('تعذر المسح؛ أدخل الباركود يدوياً');return;}if(!stopped)setTimeout(tick,300);};tick();}
async function proof(id){modal('رفع صورة إثبات',`<input id="proofFile" type="file" accept="image/jpeg,image/png,image/webp"><div class="notice">تضغط الصورة تلقائياً لحجم صغير ضمن حدود Firestore المجانية.</div>${action('رفع الصورة','uploadProof',id,'primary')}`);}
document.addEventListener('input',e=>{if(['price','fee'].includes(e.target.name))netPreview();if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{if(e.target.name==='statusFilter'){filter=e.target.value;render();}if(e.target.id==='previewDriver'){preview=e.target.value;page='home';render();}if(['reportFrom','reportTo'].includes(e.target.name)){if(e.target.name==='reportFrom')reportFrom=e.target.value;else reportTo=e.target.value;if(reportFrom&&reportTo&&reportFrom>reportTo){toast('تاريخ البداية بعد النهاية');return;}render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
document.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button||busy)return;e.preventDefault();const a=button.dataset.action,id=button.dataset.id;
 try{
 if(a==='close')return close();if(a==='logout')return await signOut(auth);if(a==='page'){page=id;search='';filter='';return render();}if(a==='adminMode'){preview='';return render();}
 if(a==='newOrder'){form('إنشاء شحنة','createOrder',orderForm());return netPreview();}
 if(a==='editOrder'){form('تعديل الشحنة','editOrder',orderForm(findOrder(id)),{id});return netPreview();}
 if(a==='details')return await details(id);if(a==='status')return statusForm(id);
 if(a==='restore')return form('استعادة الطلب من الأرشيف','restore','<div class="notice">تسجل أي فروقات مالية كحركة جديدة؛ سجل الترحيل السابق لا يتغير.</div>'+textarea('reason','سبب الاستعادة','',true),{id});
 if(a==='contact'){const o=findOrder(id),n=phone(o.phone),message=encodeURIComponent(`مرحبا ${o.customer}\n\nمعك بهاء الدين من Box It 🚚\n\nلديك طرد بقيمة ${(o.priceFils??Number(o.price||0)*1000)/1000} دينار من Randis.\n\nأرجو إرسال الموقع والانتباه للهاتف خلال الساعات القادمة.`);return modal('التواصل',`<div class="actions"><a class="button" href="tel:+${n}">اتصال</a><a class="button" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${message}">WhatsApp</a><a class="button" href="sms:+${n}?body=${message}">SMS</a></div>`);}
 if(a==='assignOne'||a==='assignBulk'){const ids=a==='assignOne'?[id]:[...document.querySelectorAll('[name=bulk]:checked')].map(x=>x.value);if(!ids.length)throw Error('حدد طلباً واحداً على الأقل');if(!driverOptions().length)throw Error('أضف سائقاً نشطاً أولاً');return form('إسناد الشحنات','assign',select('driverUid','السائق',driverOptions()),{ids});}
 if(a==='newDriver'||a==='editDriver')return driverForm(id);
 if(a==='newReturn')return returnForm();
 if(a==='assignReturn')return form('إسناد المرتجع','returnAction',select('driverUid','السائق',driverOptions()),{id,operation:'assign'});
 if(a==='pickupReturn'||a==='completeReturn')return form('تأكيد حركة المرتجع','returnAction','<p>تأكيد تحديث حالة المرتجع؟</p>',{id,operation:a==='pickupReturn'?'pickup':'complete'});
 if(a==='editReturn'){const r=data.returns.find(r=>r.id===id);return form('تعديل مالية المرتجع','returnAction',input('amount','المبلغ',(r.collectionFils??Number(r.price||0)*1000)/1000,'number')+input('fee','الأجرة',(r.feeFils??Number(r.deliveryFee||0)*1000)/1000,'number')+textarea('reason','سبب التعديل','',true),{id,operation:'edit'});}
 if(a==='convertReturn'){const r=data.returns.find(r=>r.id===id);form('تحويل المرتجع لشحنة مرتبطة','returnAction','<div class="notice">تم احتساب مالية المرتجع عند الاستلام. الشحنة المرتبطة صفرية دون رسوم جديدة لمنع التكرار.</div>'+orderForm({...r,price:0,priceFils:0,deliveryFee:0,feeFils:0,governorate:'عمان'}),{id,operation:'convert'});return netPreview();}
 if(a==='expense')return form('مصروف تشغيلي','expense',input('title','وصف المصروف')+input('amount','المبلغ','','number')+select('category','التصنيف',['وقود','صيانة','رواتب','إيجار','تشغيل','أخرى']));
 if(a==='settle')return settlementForm();
 if(a==='ledger')return modal('سجل الحركات المالية والترحيل',ledgerHtml());
 if(a==='post')return form('تأكيد ترحيل الفترة','post','<div class="notice">ترحيل الطلبات المنتهية والحركات الحالية. تبدأ عدادات الفترة من الصفر وتبقى المستحقات غير المدفوعة قائمة. لا يتم تحويل أموال.</div>');
 if(a==='newComplaint')return form('شكوى مرتبطة بالشحنة','complaint',select('category','الفئة',['تأخير','تحصيل','سلوك مندوب','تلف','أخرى'])+textarea('description','الوصف','',true),{orderId:id});
 if(a==='resolveComplaint')return form('معالجة الشكوى','resolveComplaint',select('status','الحالة',['قيد المعالجة','مغلقة'])+textarea('resolution','الحل / ملاحظات المعالجة','',true),{id});
 if(a==='openNotification'){const n=data.notifications.find(n=>n.id===id);await mutate('readNotification',{id});if(n.entityType==='orders'&&data.orders.some(o=>o.id===n.entityId))return await details(n.entityId);page=n.entityType==='returns'?'returns':'finance';return render();}
 if(a==='auditDetail'){const r=data.audit.find(r=>r.id===id);return modal('القيم السابقة والجديدة',`<h3>قبل</h3><pre dir="ltr">${esc(JSON.stringify(r.before,null,2))}</pre><h3>بعد</h3><pre dir="ltr">${esc(JSON.stringify(r.after,null,2))}</pre>`);}
 if(a==='reportPreset'){const now=new Date(),ymd=d=>day(d.getTime());reportTo=ymd(now);reportFrom=id==='day'?reportTo:id==='week'?ymd(new Date(now.getTime()-6*86400000)):id==='month'?reportTo.slice(0,7)+'-01':'';if(id==='all')reportTo='';return render();}
 if(a==='export'||a==='exportReport')return exportCSV(a==='exportReport'?reportData().orders:scopedOrders());
 if(a==='scan')return await scan();if(a==='proof')return await proof(id);
 if(a==='uploadProof'){const file=$('proofFile').files[0];if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>12*1024*1024)throw Error('اختر صورة حتى 12 ميغابايت');button.disabled=true;const image=await compressPhoto(file);await mutate('attachProof',{id,image});close();return toast('تم حفظ الإثبات المضغوط');}
 if(a==='viewProof'){const o=findOrder(id);const proof=await firestoreSdk.getDoc(firestoreSdk.doc(db,'proof_images',o.proofId));if(!proof.exists())throw Error('صورة الإثبات غير موجودة');modal('صورة الإثبات','<img id="proofImage" class="proof" alt="إثبات محاولة التسليم">');$('proofImage').src=proof.data().image;return;}
 if(a==='migration'){const counts=(await call({action:'migrationPreview'})).data;return modal('تجهيز البيانات القديمة',`<div class="notice">العملية تضيف حقولاً محاسبية ولا تحذف السجلات. احتفظ بنسخة احتياطية قبل التشغيل. التحويلات القديمة ستبقى بانتظار مراجعة.</div><p>طلبات: ${counts.orders} · مرتجعات: ${counts.returns} · مصروفات: ${counts.expenses} · تحويلات: ${counts.transfers}</p>${action('تنزيل نسخة احتياطية JSON','backup')} ${counts.duplicates?.length?'<div class="error">يوجد باركود مكرر يحتاج معالجة قبل التجهيز: '+counts.duplicates.map(d=>esc(d.barcode)).join('، ')+'</div>':action('بدء التجهيز','runMigration','','primary')}`);}
 if(a==='backup'){if(!admin())throw Error('النسخ الاحتياطي للإدارة فقط');button.disabled=true;const collections=['orders','drivers','transfers','expenses','returns','archives','accounting','audit_logs','accounting_history','complaints','notifications','financial_events','order_events','proof_images','settings','barcodes','operation_requests','settlement_references','merchant_accounts'];const backup={project:'order-manger-848ce',exportedAt:new Date().toISOString(),collections:{}};for(const name of collections){toast('نسخ '+name);const snapshots=await firestoreSdk.getDocsFromServer(firestoreSdk.collection(db,name));backup.collections[name]=snapshots.docs.map(d=>({id:d.id,data:d.data()}));}const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='randis-backup-'+day(Date.now())+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);button.disabled=false;return toast('تم تنزيل النسخة الاحتياطية؛ احتفظ بها بمكان آمن.');}
 if(a==='runMigration'){let r;do{r=await mutate('migrate');toast('تجهيز البيانات: '+r.converted+' سجل في الدفعة');}while(r.more);close();return toast('تم تجهيز البيانات. راجع التحويلات القديمة وأسناد السائقين قبل التشغيل.');}
 if(a==='reviewTransfer')return form('مراجعة تحويل قديم','reviewLegacyTransfer','<div class="notice">لا تؤكد إلا تحويل مستحقات Randis المدفوع فعلياً. قيود عهدة السائق أو السجلات المكررة لا تعتبر دفعاً للمتجر.</div><label><input name="confirmed" type="checkbox">هذا تحويل فعلي للمتجر</label>'+textarea('reason','سبب الاعتماد أو الاستبعاد','',true)+'<h3>الطلبات المشمولة عند اعتماد التحويل</h3>'+[...data.orders.map(o=>({...o,key:'orders:'+o.id})),...data.returns.map(o=>({...o,key:'returns:'+o.id}))].filter(o=>finance(o).merchant>(o.settledFils||0)).map(o=>`<label><input name="orderKey" type="checkbox" value="${esc(o.key)}">${esc(o.customer)} — ${money(finance(o).merchant-(o.settledFils||0))}</label>`).join(''),{id});
 }catch(err){toast(err.message||'تعذر تنفيذ الإجراء');button.disabled=false;}
});

async function compressPhoto(file){const bitmap=await createImageBitmap(file);try{const scale=Math.min(1,1000/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);for(const quality of [.75,.55,.35,.2]){const url=canvas.toDataURL('image/jpeg',quality);if(url.length<140000)return url;}throw Error('الصورة كبيرة بعد الضغط؛ قص الجزء المهم وحاول ثانية');}finally{bitmap.close();}}

</script>
