
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randis × Box It</title>
<style>
:root{--blue:#0879c9;--navy:#102b46;--pale:#eaf6ff;--bg:#f4f8fc;--line:#dce7f0;--text:#183247;--muted:#718397;--red:#d93045;--green:#14845b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,system-ui,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:bold;background:var(--blue);color:white}
.secondary{background:#e8f2fa;color:var(--navy)}
.success{background:#e7f7ef;color:var(--green)}
.danger{background:#fff0f1;color:var(--red)}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.brand{font-weight:900;font-size:22px;color:var(--navy)}
.brand span{color:var(--blue)}
.muted{color:var(--muted);font-size:13px}
.login{max-width:420px;margin:9vh auto}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;font-weight:bold}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--text)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--pale);border-radius:14px;padding:13px}
.stat b{display:block;font-size:20px;margin-top:5px}
.tabs{display:flex;gap:8px;overflow:auto;padding:6px 0}
.tabs button{white-space:nowrap}
.tabs button.active{background:var(--navy)}
.order{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;background:white}
.order.urgent{border:2px solid var(--red);background:#fffafb}
.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#edf3f8;font-size:12px;font-weight:bold}
.pill.red{background:#ffe7ea;color:var(--red)}
.pill.green{background:#e3f6ed;color:var(--green)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.actions button{padding:9px 11px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modal{position:fixed;inset:0;background:#0b2239a6;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.modalbox{background:white;border-radius:18px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:18px}
.modalhead{display:flex;justify-content:space-between;align-items:center}
.error{color:var(--red);font-size:13px;white-space:pre-wrap}
.small{font-size:12px}
@media(max-width:600px){
.stats{grid-template-columns:1fr}
.grid2{grid-template-columns:1fr}
.wrap{padding:10px}
.card{padding:13px}
}
</style>
</head>
<body>

<div id="loginView" class="wrap login">
 <div class="card">
  <div class="brand">RANDIS <span>× BOX IT</span></div>
  <p class="muted">نظام إدارة الطلبيات والحسابات</p>

  <div class="field">
   <label>البريد الإلكتروني</label>
   <input id="email" type="email" autocomplete="username" placeholder="name@example.com">
  </div>

  <div class="field">
   <label>كلمة المرور</label>
   <input id="password" type="password" autocomplete="current-password">
  </div>

  <button id="loginBtn" style="width:100%">تسجيل الدخول</button>
  <p id="loginError" class="error"></p>
 </div>
</div>

<div id="appView" class="hidden">
 <header class="wrap top">
  <div>
   <div class="brand">RANDIS <span>× BOX IT</span></div>
   <div id="roleLabel" class="muted"></div>
  </div>
  <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
 </header>

 <main class="wrap">
  <section id="stats" class="stats"></section>
  <nav class="tabs" id="tabs"></nav>
  <section id="toolbar" class="top"></section>
  <section id="orders"></section>
  <section id="accounting" class="card hidden"></section>
  <section id="transfers" class="card hidden"></section>
 </main>
</div>

<div id="modal" class="modal hidden">
 <div class="modalbox">
  <div class="modalhead">
   <h3>إضافة طلبية</h3>
   <button id="closeModal" class="secondary">✕</button>
  </div>

  <form id="orderForm">
   <div class="grid2">
    <div class="field">
     <label>اسم الزبون *</label>
     <input id="customer" required>
    </div>
    <div class="field">
     <label>رقم الهاتف *</label>
     <input id="phone" required inputmode="tel">
    </div>
    <div class="field">
     <label>المنطقة / الحي *</label>
     <input id="area" required>
    </div>
    <div class="field">
     <label>سعر الطلب (دينار) *</label>
     <input id="price" type="number" min="0" step="0.01" required>
    </div>
    <div class="field">
     <label>سعر التوصيل (دينار) *</label>
     <input id="deliveryFee" type="number" min="0" step="0.01" required>
    </div>
   </div>

   <div class="field">
    <label>ملاحظات</label>
    <textarea id="notes" rows="2"></textarea>
   </div>

   <div class="field">
    <label>
     <input id="urgent" type="checkbox" style="width:auto">
     طلب مستعجل – ضروري يتسلّم بنفس اليوم
    </label>
   </div>

   <p id="formError" class="error"></p>
   <div class="actions">
    <button type="submit">حفظ الطلبية</button>
    <button type="button" id="cancelModal" class="secondary">إلغاء</button>
   </div>
  </form>
 </div>
</div>

<div id="resultModal" class="modal hidden">
 <div class="modalbox">
  <div class="modalhead">
   <h3>تحديث نتيجة الطلب</h3>
   <button id="closeResult" class="secondary">✕</button>
  </div>

  <form id="resultForm">
   <input id="resultOrderId" type="hidden">

   <div class="field">
    <label>النتيجة</label>
    <select id="resultStatus">
     <option value="تم التسليم">تم التسليم</option>
     <option value="تسليم جزئي">تسليم جزئي</option>
     <option value="مرتجع">مرتجع</option>
     <option value="مؤجل">مؤجل</option>
     <option value="ملغي">ملغي</option>
    </select>
   </div>

   <div class="field" id="collectedWrap">
    <label>المبلغ المحصّل فعلياً</label>
    <input id="collected" type="number" min="0" step="0.01">
   </div>

   <div class="field hidden" id="returnedWrap">
    <label>قيمة الجزء المرتجع</label>
    <input id="returned" type="number" min="0" step="0.01">
   </div>

   <div class="field hidden" id="feePaidWrap">
    <label>
     <input id="feePaid" type="checkbox" style="width:auto">
     تم دفع أجرة التوصيل عند الإرجاع
    </label>
   </div>

   <div class="field hidden" id="deferWrap">
    <label>تاريخ التأجيل</label>
    <input id="deferredDate" type="date">
   </div>

   <p class="muted small">
    في التسليم الجزئي أدخل المبلغ المستلم وقيمة الجزء المرتجع.
   </p>

   <p id="resultError" class="error"></p>

   <div class="actions">
    <button type="submit">حفظ النتيجة</button>
    <button type="button" id="cancelResult" class="secondary">إلغاء</button>
   </div>
  </form>
 </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 addDoc,
 updateDoc,
 onSnapshot,
 runTransaction,
 serverTimestamp,
 query,
 orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* إعدادات مشروع Firebase السابق */

const firebaseConfig = {
 apiKey: "AIzaSyDU6f80K6I7HXiT_8CChLH9B5eDpmiDalk",
 authDomain: "order-manger-848ce.firebaseapp.com",
 projectId: "order-manger-848ce",
 storageBucket: "order-manger-848ce.firebasestorage.app",
 messagingSenderId: "174411866795",
 appId: "1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

/* حسابات الدخول المعتمدة */

const APPROVED_USERS = {
 "bahaa@boxit.app": "boxit",
 "rand@randis.app": "randis"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let currentUser = null;
let role = null;
let orders = [];
let activeTab = "active";
let unsubOrders = null;
let unsubAccounting = null;
let unsubTransfers = null;
let accounting = {collected:0,fees:0};
let transferRows = [];

const money = n => (Number(n)||0).toFixed(2);

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
}[c]));

function showLoginError(e){
 console.error("Firebase Login Error:",e);
 $("loginError").textContent =
  "تعذر تسجيل الدخول\nرمز الخطأ: "+(e?.code||"unknown")+
  "\nالتفاصيل: "+(e?.message||"لا توجد تفاصيل");
}

$("loginBtn").onclick = async () => {
 $("loginError").textContent = "";

 const email = $("email").value.trim().toLowerCase();
 const password = $("password").value;

 if(!email || !password){
  $("loginError").textContent = "أدخل البريد الإلكتروني وكلمة المرور.";
  return;
 }

 $("loginBtn").disabled = true;
 $("loginBtn").textContent = "جارٍ التحقق...";

 try{
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  showLoginError(e);
 }finally{
  $("loginBtn").disabled = false;
  $("loginBtn").textContent = "تسجيل الدخول";
 }
};

$("password").addEventListener("keydown",e=>{
 if(e.key==="Enter") $("loginBtn").click();
});

$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth,user=>{
 stopListeners();

 currentUser = user;
 role = user ? APPROVED_USERS[(user.email||"").toLowerCase()] : null;

 if(!user){
  $("loginView").classList.remove("hidden");
  $("appView").classList.add("hidden");
  return;
 }

 if(!role){
  $("loginView").classList.remove("hidden");
  $("appView").classList.add("hidden");
  $("loginError").textContent =
   "هذا الحساب غير معتمد. تحقق من البريد الإلكتروني.";
  signOut(auth);
  return;
 }

 $("loginView").classList.add("hidden");
 $("appView").classList.remove("hidden");

 $("roleLabel").textContent =
  role==="boxit" ? "واجهة Box It" : "واجهة Randis";

 startListeners();
 render();
});

function stopListeners(){
 if(unsubOrders) unsubOrders();
 if(unsubAccounting) unsubAccounting();
 if(unsubTransfers) unsubTransfers();

 unsubOrders = null;
 unsubAccounting = null;
 unsubTransfers = null;
}

function startListeners(){

 unsubOrders = onSnapshot(
  query(collection(db,"orders"),orderBy("createdAt","desc")),
  snap=>{
   orders = snap.docs.map(d=>({id:d.id,...d.data()}));
   render();
  },
  e=>console.error("Orders error:",e)
 );

 unsubAccounting = onSnapshot(
  doc(db,"accounting","current"),
  snap=>{
   accounting = snap.exists()
    ? snap.data()
    : {collected:0,fees:0};
   renderAccounting();
  },
  e=>console.error("Accounting error:",e)
 );

 unsubTransfers = onSnapshot(
  query(collection(db,"transfers"),orderBy("createdAt","desc")),
  snap=>{
   transferRows = snap.docs.map(d=>({id:d.id,...d.data()}));
   renderTransfers();
  },
  e=>console.error("Transfers error:",e)
 );
}

function visibleOrders(){
 return orders.filter(o=>!!o.archived === (activeTab==="archive"));
}

function render(){

 const tabs = role==="boxit"
 ? [
  ["active","الطلبات الحالية"],
  ["neighborhood","حسب الحي"],
  ["archive","الأرشيف"],
  ["accounting","المحاسبة"],
  ["transfers","سجل التحويلات"]
 ]
 : [
  ["active","الطلبات"],
  ["archive","الأرشيف"]
 ];

 $("tabs").innerHTML = tabs.map(([id,label])=>
  `<button class="${activeTab===id?"active":""}" data-tab="${id}">${label}</button>`
 ).join("");

 $("tabs").querySelectorAll("[data-tab]").forEach(b=>{
  b.onclick=()=>{
   activeTab=b.dataset.tab;
   render();
  };
 });

 const active=orders.filter(o=>!o.archived);
 const delivered=active.filter(o=>
  o.status==="تم التسليم" || o.status==="تسليم جزئي"
 );

 if(role==="boxit"){
  $("stats").innerHTML=`
   <div class="stat">الطلبات الحالية<b>${active.length}</b></div>
   <div class="stat">تم التسليم / جزئي<b>${delivered.length}</b></div>
   <div class="stat">الطلبات المستعجلة<b>${active.filter(o=>o.isUrgent&&!["تم التسليم","مرتجع","ملغي"].includes(o.status)).length}</b></div>`;
 }else{
  $("stats").innerHTML=`
   <div class="stat">كل الطلبات<b>${active.length}</b></div>
   <div class="stat">تم التسليم<b>${delivered.length}</b></div>
   <div class="stat">صافي المستحق<b>${money((Number(accounting.collected)||0)-(Number(accounting.fees)||0))} د.أ</b></div>`;
 }

 $("toolbar").innerHTML =
  role==="randis" && activeTab==="active"
  ? '<button id="addOrderBtn">＋ إضافة طلبية</button>'
  : '<span class="muted">إدارة الطلبات</span>';

 if($("addOrderBtn")) $("addOrderBtn").onclick=openAddModal;

 $("orders").classList.toggle("hidden",activeTab==="accounting"||activeTab==="transfers");
 $("accounting").classList.toggle("hidden",!(role==="boxit"&&activeTab==="accounting"));
 $("transfers").classList.toggle("hidden",!(role==="boxit"&&activeTab==="transfers"));

 if(activeTab==="accounting"||activeTab==="transfers") return;

 if(activeTab==="neighborhood"&&role==="boxit"){
  renderByArea();
  return;
 }

 const list=visibleOrders();

 $("orders").innerHTML=list.length
  ? list.map(orderCard).join("")
  : '<div class="card muted">لا توجد طلبيات في هذا القسم.</div>';

 bindOrderActions();
}

function orderCard(o){

 const urgent=o.isUrgent &&
  !["تم التسليم","مرتجع","ملغي"].includes(o.status);

 const details = role==="boxit"
 ? `<p>سعر الطلب: <b>${money(o.price)}</b> د.أ · أجرة التوصيل: <b>${money(o.deliveryFee)}</b> د.أ</p>`
 : `<p>قيمة الطلب: <b>${money(o.price)}</b> د.أ</p>`;

 return `
 <article class="order ${urgent?"urgent":""}">
  <div class="order-head">
   <b>${esc(o.customer)}</b>
   <span class="pill">${esc(o.status||"طلب جديد")}</span>
  </div>

  ${urgent?'<p><span class="pill red">مستعجل اليوم</span></p>':""}

  <p>المنطقة: ${esc(o.area)} · الهاتف: ${esc(o.phone)}</p>
  ${details}

  ${o.notes?`<p class="muted">ملاحظات: ${esc(o.notes)}</p>`:""}

  ${o.status==="تسليم جزئي"
   ? `<p class="muted">المحصّل: ${money(o.collected)} · المرتجع: ${money(o.returned)}</p>`
   : ""}

  <div class="actions">
   <button class="secondary" data-wa="${o.id}">واتساب</button>

   ${role==="boxit"&&!o.archived
    ? `<button class="success" data-accept="${o.id}">قبول / قيد التوصيل</button>
       <button data-result="${o.id}">تحديث النتيجة</button>`
    : ""}

   <button class="secondary" data-archive="${o.id}">
    ${o.archived?"استعادة":"أرشفة"}
   </button>
  </div>
 </article>`;
}

function bindOrderActions(){

 document.querySelectorAll("[data-wa]").forEach(b=>{
  b.onclick=()=>{
   const o=orders.find(x=>x.id===b.dataset.wa);
   if(!o)return;

   let p=String(o.phone||"").replace(/[^\d]/g,"");
   if(p.startsWith("0"))p="962"+p.slice(1);
   else if(p.startsWith("962")){}
   else if(p.startsWith("7"))p="962"+p;

   const msg=`مرحباً ${o.customer} 🌸

طلبك من Randis جاهز للتوصيل.

قيمة الطلب: ${money(o.price)} دينار.

يُرجى إرسال موقعك لتسهيل عملية التوصيل، والانتباه للهاتف خلال الساعات القادمة.`;

   window.open(
    `https://wa.me/${p}?text=${encodeURIComponent(msg)}`,
    "_blank"
   );
  };
 });

 document.querySelectorAll("[data-accept]").forEach(b=>{
  b.onclick=async()=>{
   try{
    await updateDoc(doc(db,"orders",b.dataset.accept),{
     status:"قيد التوصيل",
     acceptedAt:serverTimestamp()
    });
   }catch(e){
    alert("تعذر تحديث الطلب: "+e.message);
   }
  };
 });

 document.querySelectorAll("[data-result]").forEach(b=>{
  b.onclick=()=>openResult(b.dataset.result);
 });

 document.querySelectorAll("[data-archive]").forEach(b=>{
  b.onclick=async()=>{
   const o=orders.find(x=>x.id===b.dataset.archive);
   if(!o)return;
   try{
    await updateDoc(doc(db,"orders",o.id),{
     archived:!o.archived
    });
   }catch(e){
    alert("تعذر الأرشفة: "+e.message);
   }
  };
 });
}

function renderByArea(){

 const grouped={};

 orders.filter(o=>!o.archived).forEach(o=>{
  const area=(o.area||"غير مصنف").trim()||"غير مصنف";
  if(!grouped[area])grouped[area]=[];
  grouped[area].push(o);
 });

 $("orders").innerHTML=Object.keys(grouped)
  .sort((a,b)=>a.localeCompare(b,"ar"))
  .map(area=>`
   <div class="card">
    <h3>${esc(area)} · ${grouped[area].length} طلب</h3>
    ${grouped[area].map(orderCard).join("")}
   </div>
  `).join("") || '<div class="card">لا توجد طلبيات.</div>';

 bindOrderActions();
}

function renderAccounting(){

 if(role!=="boxit")return;

 const collected=Number(accounting.collected)||0;
 const fees=Number(accounting.fees)||0;
 const net=collected-fees;

 $("accounting").innerHTML=`
  <h3>المحاسبة الحالية</h3>

  <div class="stats">
   <div class="stat">المبلغ المحصّل<b>${money(collected)} د.أ</b></div>
   <div class="stat">أجور التوصيل<b>${money(fees)} د.أ</b></div>
   <div class="stat">صافي رند<b>${money(net)} د.أ</b></div>
  </div>

  <p class="muted">عند تسجيل التحويل يتم تصفير الأرصدة مع الاحتفاظ بسجل العملية.</p>

  <button id="transferBtn" ${net<=0?"disabled":""}>
   تم التحويل – ${money(net)} د.أ
  </button>
 `;

 $("transferBtn").onclick=confirmTransfer;
}

async function confirmTransfer(){

 const collected=Number(accounting.collected)||0;
 const fees=Number(accounting.fees)||0;
 const net=collected-fees;

 if(net<=0){
  alert("لا يوجد مبلغ موجب للتحويل.");
  return;
 }

 if(!confirm(`تأكيد تحويل ${money(net)} دينار إلى Randis؟`))return;

 try{

  await runTransaction(db,async tx=>{

   const ref=doc(db,"accounting","current");
   const snap=await tx.get(ref);

   const a=snap.exists()
    ? snap.data()
    : {collected:0,fees:0};

   const c=Number(a.collected)||0;
   const f=Number(a.fees)||0;
   const n=c-f;

   if(n<=0)throw new Error("لا يوجد رصيد للتحويل.");

   tx.set(ref,{
    collected:0,
    fees:0,
    updatedAt:serverTimestamp()
   },{merge:true});

   const transferRef=doc(collection(db,"transfers"));

   tx.set(transferRef,{
    collected:c,
    fees:f,
    net:n,
    createdAt:serverTimestamp(),
    actorUid:currentUser.uid
   });

  });

  alert("تم تسجيل التحويل وتصفير الأرصدة.");

 }catch(e){
  alert("تعذر تسجيل التحويل: "+e.message);
 }
}

function renderTransfers(){

 if(role!=="boxit")return;

 $("transfers").innerHTML=`
  <h3>سجل التحويلات</h3>
  ${
   transferRows.length
   ? `<table style="width:100%;text-align:right">
      <tr><th>التاريخ</th><th>المحصّل</th><th>التوصيل</th><th>الصافي</th></tr>
      ${transferRows.map(t=>`
       <tr>
        <td>${t.createdAt?.toDate?t.createdAt.toDate().toLocaleString("ar-JO"):"—"}</td>
        <td>${money(t.collected)}</td>
        <td>${money(t.fees)}</td>
        <td>${money(t.net)}</td>
       </tr>
      `).join("")}
     </table>`
   : '<p class="muted">لا توجد تحويلات مسجلة.</p>'
  }
 `;
}

function openAddModal(){
 $("orderForm").reset();
 $("formError").textContent="";
 $("modal").classList.remove("hidden");
}

function closeAddModal(){
 $("modal").classList.add("hidden");
}

$("closeModal").onclick=closeAddModal;
$("cancelModal").onclick=closeAddModal;

$("orderForm").onsubmit=async e=>{

 e.preventDefault();

 $("formError").textContent="";

 const price=Number($("price").value);
 const fee=Number($("deliveryFee").value);

 if(!Number.isFinite(price)||price<0||
    !Number.isFinite(fee)||fee<0){
  $("formError").textContent="تأكد من صحة السعر وأجرة التوصيل.";
  return;
 }

 const data={
  customer:$("customer").value.trim(),
  phone:$("phone").value.trim(),
  area:$("area").value.trim(),
  price,
  deliveryFee:fee,
  notes:$("notes").value.trim(),
  isUrgent:$("urgent").checked,
  status:"طلب جديد",
  archived:false,
  accounted:false,
  createdAt:serverTimestamp(),
  createdBy:currentUser.uid
 };

 try{
  await addDoc(collection(db,"orders"),data);
  closeAddModal();
 }catch(err){
  $("formError").textContent="تعذر حفظ الطلبية: "+err.message;
 }
};

function openResult(id){

 $("resultForm").reset();
 $("resultOrderId").value=id;
 $("resultError").textContent="";
 $("resultModal").classList.remove("hidden");

 updateResultFields();
}

function updateResultFields(){

 const s=$("resultStatus").value;

 $("collectedWrap").classList.toggle(
  "hidden",!["تم التسليم","تسليم جزئي"].includes(s)
 );

 $("returnedWrap").classList.toggle(
  "hidden",s!=="تسليم جزئي"
 );

 $("feePaidWrap").classList.toggle(
  "hidden",s!=="مرتجع"
 );

 $("deferWrap").classList.toggle(
  "hidden",s!=="مؤجل"
 );
}

$("resultStatus").onchange=updateResultFields;

function closeResultModal(){
 $("resultModal").classList.add("hidden");
}

$("closeResult").onclick=closeResultModal;
$("cancelResult").onclick=closeResultModal;

$("resultForm").onsubmit=async e=>{

 e.preventDefault();

 const id=$("resultOrderId").value;
 const status=$("resultStatus").value;
 const collected=Number($("collected").value||0);
 const returned=Number($("returned").value||0);

 $("resultError").textContent="";

 if(collected<0||returned<0||
    !Number.isFinite(collected)||!Number.isFinite(returned)){
  $("resultError").textContent="أدخل مبالغ صحيحة.";
  return;
 }

 try{

  await runTransaction(db,async tx=>{

   const orderRef=doc(db,"orders",id);
   const snap=await tx.get(orderRef);

   if(!snap.exists())throw new Error("الطلب غير موجود.");

   const old=snap.data();

   if(old.accounted){
    throw new Error("تمت محاسبة هذه الطلبية مسبقاً.");
   }

   const accountRef=doc(db,"accounting","current");
   const asnap=await tx.get(accountRef);

   const a=asnap.exists()
    ? asnap.data()
    : {collected:0,fees:0};

   let addCollected=0;
   let addFees=0;

   let patch={
    status,
    accounted:false,
    updatedAt:serverTimestamp()
   };

   if(status==="تم التسليم"||status==="تسليم جزئي"){

    if(collected>Number(old.price||0)+0.001){
     throw new Error("المبلغ المحصّل أكبر من سعر الطلب.");
    }

    if(status==="تسليم جزئي" &&
       collected+returned>Number(old.price||0)+0.001){
     throw new Error("المحصّل والمرتجع يتجاوزان سعر الطلب.");
    }

    addCollected=collected;
    addFees=Number(old.deliveryFee)||0;

    patch={
     ...patch,
     collected,
     returned:status==="تسليم جزئي"?returned:0,
     accounted:true
    };

   }else if(status==="مرتجع"){

    patch.feePaid=$("feePaid").checked;
    patch.accounted=true;

    if(patch.feePaid){
     addFees=Number(old.deliveryFee)||0;
    }

   }else if(status==="مؤجل"){

    patch.deferredDate=$("deferredDate").value;
    patch.accounted=false;

   }

   tx.update(orderRef,patch);

   if(addCollected||addFees){

    tx.set(accountRef,{
     collected:(Number(a.collected)||0)+addCollected,
     fees:(Number(a.fees)||0)+addFees,
     updatedAt:serverTimestamp()
    },{merge:true});

   }

  });

  closeResultModal();

 }catch(err){

  $("resultError").textContent=
   "تعذر حفظ النتيجة: "+err.message;

 }

};

</script>
</body>
</html>
