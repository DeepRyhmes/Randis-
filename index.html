
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12295a">
<title>Randis × Box It</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#12295a;
  --blue:#238bd1;
  --sky:#e8f5ff;
  --burgundy:#762c48;
  --pink:#f4dce5;
  --white:#fff;
  --bg:#f4f6fa;
  --text:#1e293b;
  --muted:#718096;
  --border:#e5eaf1;
  --green:#16865b;
  --red:#d33b4b;
  --orange:#c47a17;
  --shadow:0 8px 28px rgba(20,35,70,.07);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Cairo',sans-serif;font-size:14px
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(145deg,#10234e,#1d4c85)
}
.login-card{
  width:100%;max-width:410px;background:white;border-radius:24px;
  padding:30px;box-shadow:0 20px 60px #07163255
}
.logo{text-align:center;margin-bottom:25px}
.logo-mark{
  width:64px;height:64px;margin:auto;border-radius:19px;
  background:var(--navy);color:white;display:grid;place-items:center;
  font-size:25px;font-weight:800
}
.logo h1{margin:12px 0 0;font-size:23px;color:var(--navy)}
.logo p{margin:3px;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--border);border-radius:11px;
  padding:11px 12px;background:#fff;outline:none;color:var(--text)
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px #238bd11a
}
.field textarea{min-height:75px;resize:vertical}
.btn{
  border:0;border-radius:10px;padding:10px 15px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px
}
.btn-primary{background:var(--navy);color:white}
.btn-blue{background:var(--blue);color:white}
.btn-store{background:var(--burgundy);color:white}
.btn-light{background:#eef2f7;color:#344054}
.btn-green{background:var(--green);color:white}
.btn-red{background:#fff0f1;color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.login-role{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px
}
.role-option{
  border:2px solid var(--border);border-radius:12px;padding:13px 8px;
  text-align:center;font-weight:800;cursor:pointer
}
.role-option.active.boxit{border-color:var(--blue);background:var(--sky);color:var(--navy)}
.role-option.active.randis{border-color:var(--burgundy);background:#fff1f5;color:var(--burgundy)}
#app{min-height:100vh}
.topbar{
  background:var(--navy);color:white;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;box-shadow:var(--shadow)
}
.top-brand{font-size:18px;font-weight:800}
.top-brand span{color:#75caff}
.top-user{display:flex;align-items:center;gap:10px}
.top-user small{opacity:.8}
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{
  width:225px;background:white;border-left:1px solid var(--border);
  padding:15px 10px;flex-shrink:0
}
.nav-btn{
  width:100%;border:0;background:transparent;padding:11px 13px;
  text-align:right;border-radius:10px;margin:2px 0;color:#526078;
  font-weight:700
}
.nav-btn.active{background:var(--sky);color:var(--navy)}
.nav-btn.store-active{background:#fff0f4;color:var(--burgundy)}
.main{padding:22px;width:100%;min-width:0;max-width:1500px;margin:auto}
.page-title{font-size:22px;font-weight:800;margin:0 0 5px}
.page-sub{color:var(--muted);margin:0 0 20px}
.stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;
  margin-bottom:20px
}
.stat{
  background:white;border:1px solid var(--border);border-radius:15px;
  padding:17px;box-shadow:var(--shadow)
}
.stat small{color:var(--muted);font-weight:700}
.stat strong{display:block;font-size:24px;margin-top:6px;color:var(--navy)}
.panel{
  background:white;border:1px solid var(--border);border-radius:15px;
  padding:17px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-bottom:13px
}
.panel-head h3{margin:0;font-size:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar input,.toolbar select{
  border:1px solid var(--border);border-radius:9px;padding:9px;
  background:white;min-width:130px
}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:11px 9px;border-bottom:1px solid var(--border);text-align:right}
th{font-size:12px;color:var(--muted);background:#f8fafc;white-space:nowrap}
td{font-size:13px}
tr:last-child td{border-bottom:0}
.badge{
  display:inline-block;padding:4px 9px;border-radius:30px;
  background:#edf1f6;color:#526078;font-size:11px;font-weight:800
}
.badge.green{background:#e6f7ef;color:#16865b}
.badge.red{background:#fff0f1;color:#c73545}
.badge.orange{background:#fff5e5;color:#a66a13}
.badge.blue{background:#e8f5ff;color:#176ca8}
.badge.pink{background:#fff0f5;color:#963b5c}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions button{padding:6px 9px;font-size:11px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.modal-backdrop{
  position:fixed;inset:0;background:#07132999;z-index:50;
  display:flex;align-items:center;justify-content:center;padding:14px
}
.modal{
  width:100%;max-width:650px;max-height:92vh;overflow:auto;
  background:white;border-radius:18px;padding:20px
}
.modal h3{margin:0 0 16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.toast{
  position:fixed;bottom:20px;left:20px;z-index:100;
  background:#152746;color:white;padding:12px 17px;border-radius:11px;
  box-shadow:var(--shadow);max-width:90%
}
.toast.error{background:#a92d3a}
.amount{font-weight:800;color:var(--navy);white-space:nowrap}
.readonly-note{
  background:#fff5e5;color:#8b5c16;border-radius:10px;padding:10px;
  margin-bottom:14px;font-size:12px
}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{background:#f7f9fc;padding:10px;border-radius:9px}
.detail-item small{display:block;color:var(--muted)}
.detail-item strong{display:block;margin-top:3px;overflow-wrap:anywhere}
.mobile-nav{display:none}
@media(max-width:850px){
  .layout{display:block}
  .sidebar{display:none}
  .main{padding:13px 11px 85px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .stat{padding:13px}
  .stat strong{font-size:20px}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;right:0;left:0;z-index:30;
    background:white;border-top:1px solid var(--border);
    overflow-x:auto;padding:7px;gap:5px
  }
  .mobile-nav .nav-btn{white-space:nowrap;width:auto;flex:1;font-size:11px;padding:9px 7px}
  .topbar{padding:10px 12px}
  .top-brand{font-size:15px}
  .top-user small{display:none}
  .grid-2{grid-template-columns:1fr}
}
@media(max-width:430px){
  .details-grid{grid-template-columns:1fr}
  .login-card{padding:23px}
}
</style>
</head>

<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="logo">
      <div class="logo-mark">R × B</div>
      <h1>Randis × Box It</h1>
      <p>نظام إدارة الطلبات والحسابات</p>
    </div>

    <div class="login-role">
      <div class="role-option active boxit" id="roleBox" onclick="chooseRole('boxit')">
        Box It<br><small>إدارة التوصيل</small>
      </div>
      <div class="role-option randis" id="roleRand" onclick="chooseRole('randis')">
        Randis<br><small>حساب المتجر</small>
      </div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>كلمة المرور</label>
        <input id="loginPassword" type="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn" type="submit">تسجيل الدخول</button>
    </form>
    <p style="text-align:center;color:#8a94a6;font-size:11px;margin:18px 0 0">نظام خاص لإدارة Randis × Box It</p>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="top-brand">Randis <span>×</span> Box It</div>
    <div class="top-user">
      <small id="userLabel"></small>
      <button class="btn btn-light" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="desktopNav"></aside>
    <main class="main" id="mainContent"></main>
  </div>
  <nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, runTransaction,
  getDoc, getDocs, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase config الأصلي من مشروعك */
const firebaseConfig = {
  apiKey: "AIzaSyDUuf6K7I7HXiT_8CChLH9B5eDpmiDalk",
  authDomain: "order-manger-848ce.firebaseapp.com",
  projectId: "order-manger-848ce",
  storageBucket: "order-manger-848ce.firebasestorage.app",
  messagingSenderId: "174411866795",
  appId: "1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const ACCOUNTS = {
  boxit: { email:"bahaa@boxit.app", role:"boxit", label:"Box It" },
  randis: { email:"rand@randis.app", role:"randis", label:"Randis" }
};

const STATUS = {
  NEW:"طلب جديد",
  PICKUP:"استلام من المتجر",
  RECEIVED:"تم الاستلام",
  SORTED:"تم الفرز",
  LOADED:"تم التحميل",
  PROGRESS:"قيد التوصيل",
  DELIVERED:"تم التسليم",
  PARTIAL:"استلام جزئي",
  REJECTED:"رفض الاستلام",
  RETURNED:"راجع",
  ZERO:"صفر"
};
const ACCOUNTED_STATUSES = ["DELIVERED","PARTIAL"];

let selectedRole = "boxit";
let currentUser = null;
let currentRole = null;
let currentPage = "dashboard";
let orders = [];
let transfers = [];
let drivers = [];
let unsubscribers = [];
let selectedTransfer = null;
let editingOrderId = null;

const $ = id => document.getElementById(id);
const money = n => (Number(n)||0).toFixed(2) + " د.أ";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const dateText = value => {
  if(!value) return "—";
  const d = value.toDate ? value.toDate() : new Date(value);
  return isNaN(d) ? "—" : d.toLocaleString("ar-JO");
};
const isBox = () => currentRole === "boxit";

function toast(message,error=false){
  const el=$("toastRoot");
  el.innerHTML=`<div class="toast ${error?"error":""}">${esc(message)}</div>`;
  setTimeout(()=>el.innerHTML="",3500);
}
function stopListeners(){
  unsubscribers.forEach(fn=>{try{fn()}catch{}});
  unsubscribers=[];
}
function chooseRole(role){
  selectedRole=role;
  $("roleBox").classList.toggle("active",role==="boxit");
  $("roleRand").classList.toggle("active",role==="randis");
  $("loginBtn").className="btn btn-block "+(role==="boxit"?"btn-primary":"btn-store");
}
function clearSession(){
  stopListeners();
  orders=[];transfers=[];drivers=[];
  currentUser=null;currentRole=null;
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("loginBtn");
  btn.disabled=true;btn.textContent="جاري تسجيل الدخول...";
  try{
    const account=ACCOUNTS[selectedRole];
    await signInWithEmailAndPassword(auth,account.email,$("loginPassword").value);
  }catch(error){
    console.error(error);
    toast(authError(error.code),true);
  }finally{
    btn.disabled=false;btn.textContent="تسجيل الدخول";
  }
});
function authError(code){
  const messages={
    "auth/invalid-credential":"كلمة المرور غير صحيحة أو بيانات الدخول غير صحيحة.",
    "auth/wrong-password":"كلمة المرور غير صحيحة.",
    "auth/user-not-found":"الحساب غير موجود في Firebase Authentication.",
    "auth/too-many-requests":"محاولات كثيرة. انتظر قليلاً ثم حاول.",
    "auth/network-request-failed":"تأكد من اتصال الإنترنت.",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"مفتاح Firebase غير مقبول. راجع قيمة apiKey في إعدادات المشروع.",
    "auth/operation-not-allowed":"تسجيل الدخول بالبريد وكلمة المرور غير مفعّل في Firebase."
  };
  return messages[code] || `تعذر تسجيل الدخول: ${code || "خطأ غير معروف"}`;
}

onAuthStateChanged(auth,user=>{
  if(!user){clearSession();return;}
  const found=Object.values(ACCOUNTS).find(a=>a.email.toLowerCase()===user.email?.toLowerCase());
  if(!found){signOut(auth);toast("هذا الحساب غير مصرح له بالدخول.",true);return;}
  currentUser=user;
  currentRole=found.role;
  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("userLabel").textContent=found.label;
  buildNavigation();
  startListeners();
});

async function logout(){
  stopListeners();
  await signOut(auth);
  $("loginPassword").value="";
}

function buildNavigation(){
  const items=[
    ["dashboard","⌂","الرئيسية"],
    ["orders","▤","الطلبات"],
    ["accounting","د.أ","الحسابات"],
    ["transfers","⇄","التحويلات"],
    ["archive","▣","الأرشيف"],
    ["drivers","♙","السائقون"],
    ["reports","▥","التقارير"]
  ];
  const visible=items.filter(([key])=>isBox()||["dashboard","orders","accounting","transfers"].includes(key));
  const html=visible.map(([key,icon,label])=>
    `<button class="nav-btn" data-page="${key}" onclick="goPage('${key}')">${icon} ${label}</button>`
  ).join("");
  $("desktopNav").innerHTML=html;
  $("mobileNav").innerHTML=html;
  markNav();
}
function markNav(){
  document.querySelectorAll("[data-page]").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===currentPage&&!isBox());
    b.classList.toggle("store-active",b.dataset.page===currentPage&&isBox());
  });
}
function goPage(page){
  if(!isBox()&&!["dashboard","orders","accounting","transfers"].includes(page))return;
  currentPage=page;markNav();render();
}
function startListeners(){
  stopListeners();
  unsubscribers.push(onSnapshot(
    query(collection(db,"orders"),orderBy("createdAt","desc")),
    snap=>{orders=snap.docs.map(d=>({id:d.id,...d.data()}));render();},
    err=>toast("خطأ تحميل الطلبات: "+err.message,true)
  ));
  unsubscribers.push(onSnapshot(
    query(collection(db,"transfers"),orderBy("createdAt","desc")),
    snap=>{transfers=snap.docs.map(d=>({id:d.id,...d.data()}));render();},
    err=>toast("خطأ تحميل التحويلات: "+err.message,true)
  ));
  if(isBox()){
    unsubscribers.push(onSnapshot(collection(db,"drivers"),snap=>{
      drivers=snap.docs.map(d=>({id:d.id,...d.data()}));render();
    },err=>toast("خطأ تحميل السائقين: "+err.message,true)));
  }
}

function eligibleOrders(){
  return orders.filter(o=>ACCOUNTED_STATUSES.includes(o.status)&&o.accounted!==true);
}
function totalOf(list,key){
  return list.reduce((s,o)=>s+(Number(o[key])||0),0);
}
function balance(){
  return totalOf(eligibleOrders(),"netPrice");
}
function statusBadge(status){
  const color={
    DELIVERED:"green",PARTIAL:"orange",REJECTED:"red",RETURNED:"red",
    PROGRESS:"blue",NEW:"pink",ZERO:"red"
  }[status]||"";
  return `<span class="badge ${color}">${esc(STATUS[status]||status||"—")}</span>`;
}
function pageHeader(title,sub=""){
  return `<h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p>`;
}
function statCard(label,value){
  return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`;
}

function render(){
  if(!currentUser)return;
  markNav();
  const pages={
    dashboard:renderDashboard,
    orders:renderOrders,
    accounting:renderAccounting,
    transfers:renderTransfers,
    archive:renderArchive,
    drivers:renderDrivers,
    reports:renderReports
  };
  (pages[currentPage]||renderDashboard)();
}

function renderDashboard(){
  const delivered=orders.filter(o=>o.status==="DELIVERED").length;
  const partial=orders.filter(o=>o.status==="PARTIAL").length;
  const progress=orders.filter(o=>!["DELIVERED","PARTIAL","REJECTED","RETURNED","ZERO"].includes(o.status)).length;
  $("mainContent").innerHTML=`
    ${pageHeader("الرئيسية","ملخص حركة الطلبات والحسابات")}
    <div class="stats">
      ${statCard("إجمالي الطلبات",orders.length)}
      ${statCard("تم التسليم",delivered)}
      ${statCard("استلام جزئي",partial)}
      ${statCard("قيد التنفيذ",progress)}
    </div>
    <div class="stats">
      ${statCard("رصيد Randis الحالي",money(balance()))}
      ${statCard("عدد التحويلات",transfers.length)}
      ${statCard("إجمالي المحوّل",money(totalOf(transfers,"amount")))}
      ${statCard("السائقون",drivers.length)}
    </div>
    <section class="panel">
      <div class="panel-head"><h3>آخر الطلبات</h3><button class="btn btn-light" onclick="goPage('orders')">كل الطلبات</button></div>
      ${ordersTable(orders.slice(0,8),false)}
    </section>
    ${isBox()?`<section class="panel"><div class="panel-head"><h3>الحسابات</h3><button class="btn btn-primary" onclick="goPage('accounting')">إدارة الحسابات</button></div><h2 class="amount">${money(balance())}</h2><small>المبلغ المستحق للمتجر حالياً</small></section>`:""}
  `;
}

function ordersTable(list,withActions=true){
  if(!list.length)return `<div class="empty">لا توجد طلبات لعرضها</div>`;
  return `<div class="table-wrap"><table>
  <thead><tr><th>الاسم</th><th>المنطقة</th><th>الهاتف</th><th>السعر</th><th>التوصيل</th><th>الصافي</th><th>الحالة</th><th>الحساب</th>${withActions?'<th>إجراءات</th>':''}</tr></thead>
  <tbody>${list.map(o=>`<tr>
    <td>${esc(o.customer)}</td><td>${esc(o.area)}</td><td>${esc(o.phone)}</td>
    <td>${money(o.price)}</td><td>${money(o.deliveryFee)}</td>
    <td class="amount">${money(o.netPrice)}</td><td>${statusBadge(o.status)}</td>
    <td>${o.accounted?'<span class="badge green">تم التحويل</span>':'<span class="badge orange">غير محاسب</span>'}</td>
    ${withActions?`<td><div class="actions">
      <button class="btn btn-light" onclick="viewOrder('${o.id}')">عرض</button>
      ${isBox()&&!o.accounted?`<button class="btn btn-blue" onclick="editOrder('${o.id}')">تعديل</button><button class="btn btn-red" onclick="removeOrder('${o.id}')">حذف</button>`:""}
    </div></td>`:""}
  </tr>`).join("")}</tbody></table></div>`;
}

function renderOrders(){
  $("mainContent").innerHTML=`
    ${pageHeader("الطلبات","إدارة الطلبات ومتابعة حالتها")}
    <section class="panel">
      <div class="panel-head">
        <h3>قائمة الطلبات (${orders.length})</h3>
        <div class="toolbar">
          <input id="orderSearch" placeholder="بحث بالاسم أو الهاتف أو المنطقة..." oninput="filterOrders()">
          ${isBox()?'<button class="btn btn-primary" onclick="newOrder()">+ إضافة طلب</button>':""}
        </div>
      </div>
      <div id="ordersTable">${ordersTable(orders)}</div>
    </section>`;
}
function filterOrders(){
  const term=$("orderSearch")?.value.toLowerCase()||"";
  const filtered=orders.filter(o=>
    [o.customer,o.phone,o.area,o.barcode].some(v=>String(v||"").toLowerCase().includes(term))
  );
  $("ordersTable").innerHTML=ordersTable(filtered);
}

      <div class="field"><label>الباركود / رقم الطلب</label><input name="barcode" value="${esc(o.barcode||"")}"></div>
      <div class="field"><label>السعر الإجمالي *</label><input name="price" type="number" min="0" step=".01" required value="${o.price??""}"></div>
      <div class="field"><label>أجرة التوصيل *</label><input name="deliveryFee" type="number" min="0" step=".01" required value="${o.deliveryFee??"2"}"></div>

function newOrder(){
  if(!isBox())return;
  editingOrderId=null;
  openModal("إضافة طلب جديد",orderFormHtml({status:"NEW"}));

}
function editOrder(id){
  if(!isBox())return;
  const o=orders.find(x=>x.id===id);
  if(!o||o.accounted){toast("لا يمكن تعديل طلب تم تحويله.",true);return;}
  editingOrderId=id;
  openModal("تعديل الطلب",orderFormHtml(o));
  bindOrderForm();
}
function bindOrderForm(){
  $("orderForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const price=Number(fd.get("price"));
    const deliveryFee=Number(fd.get("deliveryFee"));
    if(!Number.isFinite(price)||!Number.isFinite(deliveryFee)||price<0||deliveryFee<0){
      toast("تأكد من السعر وأجرة التوصيل.",true);return;
    }
    if(deliveryFee>price){toast("أجرة التوصيل لا يمكن أن تكون أكبر من السعر.",true);return;}
    const data={
      customer:fd.get("customer").trim(),
      phone:fd.get("phone").trim(),
      area:fd.get("area").trim(),
      barcode:fd.get("barcode").trim(),
      price,deliveryFee,netPrice:Number((price-deliveryFee).toFixed(2)),
      status:fd.get("status"),
      driverId:fd.get("driverId"),
      notes:fd.get("notes").trim(),
      updatedAt:serverTimestamp()
    };
    try{
      if(editingOrderId){
        const old=orders.find(o=>o.id===editingOrderId);
        if(!old||old.accounted)throw new Error("هذا الطلب تم تحويله ولا يمكن تعديله.");
        await updateDoc(doc(db,"orders",editingOrderId),data);
        toast("تم تعديل الطلب.");
      }else{
        data.accounted=false;
        data.createdAt=serverTimestamp();
        data.createdBy=currentUser.uid;
        await addDoc(collection(db,"orders"),data);
        toast("تمت إضافة الطلب.");
      }
      closeModal();
    }catch(err){toast(err.message,true);}
  });
}

async function makeTransfer(){
  if(!isBox())return;
  const eligible=eligibleOrders();
  if(!eligible.length){toast("لا يوجد رصيد مستحق للتحويل.");return;}
  const total=totalOf(eligible,"netPrice");
  openModal("تأكيد تحويل الرصيد",`
    <div class="details-grid">
      ${detail("عدد الطلبات",eligible.length)}
      ${detail("إجمالي صافي التحويل",money(total))}
    </div>
    <form id="transferForm" style="margin-top:15px">
      <div class="field"><label>طريقة التحويل</label>
        <select name="method" required>
          <option value="كاش">كاش</option><option value="CliQ">CliQ</option>
          <option value="تحويل بنكي">تحويل بنكي</option><option value="أخرى">أخرى</option>
        </select>
      </div>
      <div class="field"><label>المرجع / رقم الحوالة</label><input name="reference"></div>
      <div class="field"><label>ملاحظات</label><textarea name="note"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-green" type="submit">تأكيد التحويل وتصفير الرصيد</button>
        <button class="btn btn-light" type="button" onclick="closeModal()">إلغاء</button>
      </div>
    </form>`);
  $("transferForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const btn=e.submitter;btn.disabled=true;btn.textContent="جاري تسجيل التحويل...";
    try{
      await runTransaction(db,async tx=>{
        const fresh=[];
        for(const item of eligible){
          const ref=doc(db,"orders",item.id);
          const snap=await tx.get(ref);
          if(!snap.exists())throw new Error("أحد الطلبات لم يعد موجوداً. أعد تحميل الصفحة.");
          const data=snap.data();
          if(data.accounted===true||!ACCOUNTED_STATUSES.includes(data.status)){
            throw new Error("تغيرت حالة أحد الطلبات. أعد المحاولة بعد تحديث الصفحة.");
          }
          fresh.push({ref,data,id:item.id});
        }
        const snapshot=fresh.map(({data,id})=>({
          id,customer:data.customer||"",phone:data.phone||"",area:data.area||"",
          barcode:data.barcode||"",price:Number(data.price)||0,
          deliveryFee:Number(data.deliveryFee)||0,
          netPrice:Number(data.netPrice ?? ((Number(data.price)||0)-(Number(data.deliveryFee)||0))),
          status:data.status,notes:data.notes||""
        }));
        const totalNet=Number(snapshot.reduce((s,o)=>s+o.netPrice,0).toFixed(2));
        const totalGross=Number(snapshot.reduce((s,o)=>s+o.price,0).toFixed(2));
        const totalFees=Number(snapshot.reduce((s,o)=>s+o.deliveryFee,0).toFixed(2));
        const transferRef=doc(collection(db,"transfers"));
        tx.set(transferRef,{
          amount:totalNet,method:fd.get("method"),
          reference:fd.get("reference").trim(),note:fd.get("note").trim(),
          createdAt:serverTimestamp(),createdBy:currentUser.uid,
          orders:snapshot,totalGross,totalFees,totalNet
        });
        fresh.forEach(({ref})=>{
          tx.update(ref,{accounted:true,transferId:transferRef.id,accountedAt:serverTimestamp()});
        });
      });
      closeModal();toast("تم تسجيل التحويل وتصفير الرصيد بنجاح.");
    }catch(err){btn.disabled=false;btn.textContent="تأكيد التحويل وتصفير الرصيد";toast(err.message,true);}
  });
}
