
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b68">
<title>Randis × Box It</title>

<style>
:root{
 --navy:#123b68;--blue:#2585c5;--bg:#f3f7fa;
 --white:#fff;--text:#263746;--muted:#7b8995;
 --line:#e2eaf0;--green:#16845b;--red:#c43d4d;
 --orange:#b87516;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,Tahoma,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{
 background:linear-gradient(120deg,var(--navy),var(--blue));
 color:white;padding:17px;border-radius:0 0 20px 20px
}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:23px;font-weight:900}
.logo small{display:block;font-size:10px;opacity:.8}
.wrap{max-width:950px;margin:auto;padding:15px 12px 90px}
.panel,.card,.stat,.order{
 background:white;border:1px solid var(--line);
 border-radius:14px;padding:14px;
 box-shadow:0 4px 15px #123b680c;margin-bottom:10px
}
.login{max-width:420px;margin:9vh auto;padding:12px}
.login .panel{padding:23px}
h2{font-size:19px}
h3{font-size:15px}
.muted{color:var(--muted);font-size:12px}
.field{margin:11px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea,.search{
 width:100%;padding:11px;border:1px solid var(--line);
 border-radius:9px;background:white;outline:none
}
.field textarea{min-height:70px}
.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}
.primary{background:var(--blue);color:white}
.dark{background:var(--navy);color:white}
.soft{background:#e5f4fc;color:var(--navy)}
.outline{background:white;color:var(--navy);border:1px solid var(--line)}
.danger{background:#ffedf0;color:var(--red)}
.success{background:#e5f7ef;color:var(--green)}
.full{width:100%}
.small{font-size:12px;padding:7px 9px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.error{color:var(--red);font-size:12px;line-height:1.7}
.section{
 display:flex;justify-content:space-between;
 align-items:center;gap:10px;margin:20px 2px 10px
}
.section h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat .label{font-size:12px;color:var(--muted)}
.stat .value{
 font-size:21px;font-weight:900;color:var(--navy);margin-top:7px
}
.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.module{
 background:white;border:1px solid var(--line);
 border-radius:14px;padding:16px 10px;text-align:center;
 color:var(--navy);font-weight:bold;
 box-shadow:0 4px 15px #123b680c
}
.module span{display:block;font-size:24px;margin-bottom:7px}
.tabs{display:flex;gap:6px;overflow:auto;padding:5px 0 12px}
.tab{
 white-space:nowrap;border:1px solid var(--line);
 background:white;border-radius:20px;padding:8px 11px;font-size:12px
}
.tab.active{background:var(--navy);color:white}
.order{padding:12px}
.orderhead{display:flex;justify-content:space-between;gap:8px}
.ordername{font-weight:bold}
.badge{border-radius:20px;padding:5px 8px;font-size:11px;background:#edf2f5}
.b-done{background:#e5f7ef;color:var(--green)}
.b-progress{background:#e5f4fc;color:var(--navy)}
.b-new{background:#fff4df;color:var(--orange)}
.b-return{background:#ffedf0;color:var(--red)}
.meta{
 display:flex;flex-wrap:wrap;gap:8px 12px;
 color:var(--muted);font-size:12px;margin:10px 0
}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.empty{
 background:white;border:1px dashed var(--line);
 border-radius:12px;padding:25px;text-align:center;color:var(--muted)
}
.bottom{
 position:fixed;bottom:0;left:0;right:0;
 background:#ffffffed;border-top:1px solid var(--line);
 padding:10px 13px;z-index:5
}
.modalback{
 position:fixed;inset:0;background:#10283d88;
 display:flex;align-items:center;justify-content:center;
 padding:12px;z-index:20
}
.modal{
 width:min(100%,520px);max-height:92vh;
 overflow:auto;background:white;border-radius:16px;padding:16px
}
.modalhead{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:12px
}
.toast{
 position:fixed;top:14px;left:14px;right:14px;
 max-width:450px;margin:auto;padding:12px;
 background:#172d40;color:white;border-radius:10px;
 text-align:center;z-index:50
}
.formgrid{display:grid;grid-template-columns:1fr;gap:0 10px}
.preview{
 background:#eaf5fb;border-radius:12px;
 padding:13px;color:var(--navy);margin:12px 0
}
.preview strong{font-size:22px}
@media(min-width:650px){
 .grid{grid-template-columns:repeat(3,1fr)}
 .modules{grid-template-columns:repeat(3,1fr)}
 .formgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginView" class="login">
 <div class="panel">
  <div class="logo" style="color:#123b68">
   RANDIS
   <small style="color:#7b8995">STORE × BOX IT DELIVERY</small>
  </div>
  <h2>تسجيل الدخول</h2>
  <p class="muted">أدخل بيانات حسابك</p>

  <div class="field">
   <label>البريد الإلكتروني</label>
   <input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني">
  </div>

  <div class="field">
   <label>كلمة المرور</label>
   <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
  </div>

  <button id="loginBtn" class="btn primary full">دخول</button>
  <p id="loginError" class="error"></p>
 </div>
</div>

<!-- APPLICATION -->
<div id="appView" class="hidden">

 <header>
  <div class="top">
   <div class="logo" id="brand">
    BOX IT<small>DELIVERY MANAGEMENT</small>
   </div>
   <button id="logoutBtn" class="btn outline small">تسجيل خروج</button>
  </div>

  <div id="roleLine" style="font-size:12px;margin-top:8px"></div>

  <div id="modeSwitch" class="actions hidden" style="margin-top:10px">
   <button id="adminMode" class="btn dark small">وضع الإدارة</button>
   <button id="driverMode" class="btn outline small">وضع السائق</button>
  </div>
 </header>

 <main class="wrap">

  <div id="dashboard"></div>

  <div id="homeModules">
   <div class="section"><h2>الأقسام الرئيسية</h2></div>

   <div class="modules">
    <button class="module" data-page="orders"><span>📦</span>الطلبات</button>
    <button class="module" data-page="delivered"><span>✅</span>تم التسليم</button>
    <button class="module" data-page="progress"><span>🚚</span>قيد التوصيل</button>
    <button class="module" data-page="returned"><span>↩️</span>المرتجعات</button>

    <button class="module" data-page="accounts"><span>💰</span>الحسابات</button>

    <button class="module adminOnly" data-page="transfers"><span>💳</span>التحويلات</button>
    <button class="module adminOnly" data-page="archive"><span>🗄️</span>الأرشيف</button>
    <button class="module adminOnly" data-page="drivers"><span>🧑‍✈️</span>السائقون</button>
    <button class="module adminOnly" data-page="reports"><span>📊</span>التقارير</button>

    <button class="module" data-page="new"><span>➕</span>إضافة طلب</button>
   </div>
  </div>

  <section id="pageArea" class="hidden">
   <div class="section">
    <h2 id="pageTitle"></h2>
    <button id="backHome" class="btn outline small">رجوع</button>
   </div>
   <div id="pageContent"></div>
  </section>

 </main>

 <div class="bottom">
  <button id="bottomAction" class="btn primary full">＋ إضافة طلبية</button>
 </div>

</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script type="module">

import {initializeApp}
 from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,collection,addDoc,doc,getDoc,getDocs,
 setDoc,updateDoc,onSnapshot,serverTimestamp,
 runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig={
 apiKey:"AIzaSyDUuf6K7I7HXiT_8CChLH9B5eDpmiDalk",
 authDomain:"order-manger-848ce.firebaseapp.com",
 projectId:"order-manger-848ce",
 storageBucket:"order-manger-848ce.firebasestorage.app",
 messagingSenderId:"174411866795",
 appId:"1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* HELPERS */

const $=id=>document.getElementById(id);

const money=n=>(Number(n)||0).toFixed(2)+" د.أ";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
}[c]));

const statuses={
 NEW:"طلب جديد",
 PICKUP:"طلب استلام",
 RECEIVED:"تم الاستلام",
 SORTED:"تم الفرز",
 LOADED:"تم التحميل",
 PROGRESS:"قيد التوصيل",
 DELIVERED:"تم التسليم",
 PARTIAL:"تسليم جزئي",
 RETURNED:"مرتجع",
 DEFERRED:"مؤجل",
 UNREACHABLE:"تعذر الوصول",
 CANCELLED:"ملغي",
 DAMAGED:"تالف"
};

const terminal=[
 "DELIVERED","PARTIAL","RETURNED","CANCELLED","DAMAGED"
];

let user=null;
let role=null;
let mode="admin";

let orders=[];
let transfers=[];
let drivers=[];
let unsubs=[];

let page="home";
let filter="all";


/* BASIC FUNCTIONS */

function toast(s){
 $("toastHost").innerHTML=
 `<div class="toast">${esc(s)}</div>`;

 setTimeout(()=>{
  $("toastHost").innerHTML="";
 },2800);
}

function modal(title,body){
 $("modalHost").innerHTML=`
 <div class="modalback" id="modalback">
  <div class="modal">
   <div class="modalhead">
    <b>${title}</b>
    <button class="btn outline small" id="closeModal">إغلاق</button>
   </div>
   ${body}
  </div>
 </div>`;

 $("closeModal").onclick=closeModal;

 $("modalback").onclick=e=>{
  if(e.target.id==="modalback")closeModal();
 };
}

function closeModal(){
 $("modalHost").innerHTML="";
}

function isAdmin(){
 return role==="boxit"&&mode==="admin";
}

function canSeeAdmin(){
 return role==="boxit";
}

function deliveryOf(o){
 if(o.deliveryFee!==undefined&&o.deliveryFee!==null)
  return Number(o.deliveryFee)||0;

 if(o.netPrice!==undefined&&o.netPrice!==null)
  return Math.max(0,(Number(o.price)||0)-Number(o.netPrice));

 return 0;
}

function netOf(o){
 if(o.netPrice!==undefined&&o.netPrice!==null)
  return Number(o.netPrice)||0;

 return Math.max(0,(Number(o.price)||0)-deliveryOf(o));
}

function cleanup(){
 unsubs.forEach(f=>f());
 unsubs=[];
}


/* LOGIN AND ROLES */

function setRole(u){
 const email=(u.email||"").toLowerCase();

 if(email==="rand@randis.app")return "store";
 if(email==="bahaa@boxit.app")return "boxit";

 return null;
}

function showError(e){
 const code=e?.code||"";

 const map={
  "auth/invalid-credential":"البريد الإلكتروني أو كلمة المرور غير صحيحة",
  "auth/user-not-found":"هذا الحساب غير موجود",
  "auth/wrong-password":"كلمة المرور غير صحيحة",
  "auth/invalid-email":"البريد الإلكتروني غير صحيح",
  "auth/too-many-requests":"محاولات كثيرة، حاول لاحقاً",
  "auth/network-request-failed":"تحقق من اتصال الإنترنت",
  "auth/operation-not-allowed":"فعّل Email/Password من Firebase Authentication"
 };

 return map[code]||e?.message||"حدث خطأ غير معروف";
}

$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim().toLowerCase();
 const password=$("password").value;

 $("loginError").textContent="";

 if(!email||!password){
  $("loginError").textContent="أدخل البريد وكلمة المرور";
  return;
 }

 $("loginBtn").disabled=true;
 $("loginBtn").textContent="جارٍ الدخول...";

 try{
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  $("loginError").textContent=showError(e);
 }finally{
  $("loginBtn").disabled=false;
  $("loginBtn").textContent="دخول";
 }
};

$("password").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("loginBtn").click();
});

$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 cleanup();
 user=u;

 if(!u){
  $("loginView").classList.remove("hidden");
  $("appView").classList.add("hidden");
  return;
 }

 role=setRole(u);

 if(!role){
  await signOut(auth);
  $("loginError").textContent="هذا الحساب غير مصرح له بالدخول";
  return;
 }

 mode="admin";

 $("loginView").classList.add("hidden");
 $("appView").classList.remove("hidden");

 $("roleLine").textContent=
  role==="store"
   ?"حساب Randis – المتجر"
   :"حساب Box It – الإدارة والسائق";

 $("brand").innerHTML=role==="store"
  ?"RANDIS<small>STORE MANAGEMENT</small>"
  :"BOX IT<small>DELIVERY MANAGEMENT</small>";

 $("modeSwitch").classList.toggle("hidden",role!=="boxit");

 document.querySelectorAll(".adminOnly").forEach(x=>{
  x.classList.toggle("hidden",role!=="boxit");
 });

 listenData();
 home();
});


/* FIRESTORE LISTENERS */

function listenData(){

 unsubs.push(onSnapshot(collection(db,"orders"),snap=>{
  orders=snap.docs.map(d=>({id:d.id,...d.data()}));

  orders.sort((a,b)=>
   (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
  );

  if(page==="home")renderDashboard();
  else renderPage();

 },e=>toast("خطأ تحميل الطلبات: "+e.message)));


 // التحويلات متاحة للقراءة عند Randis وBox It
 unsubs.push(onSnapshot(collection(db,"transfers"),snap=>{
  transfers=snap.docs.map(d=>({id:d.id,...d.data()}));

  transfers.sort((a,b)=>
   (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
  );

  if(page==="home")renderDashboard();
  else if(page==="accounts"||page==="transfers")renderPage();

 },e=>toast("خطأ تحميل التحويلات: "+e.message)));


 if(role==="boxit"){

  unsubs.push(onSnapshot(collection(db,"drivers"),snap=>{
   drivers=snap.docs.map(d=>({id:d.id,...d.data()}));

   if(page==="drivers")renderPage();

  },()=>{}));

 }

}


/* ACCOUNTING */

function pendingAccountOrders(){
 return orders.filter(o=>
  ["DELIVERED","PARTIAL"].includes(o.status)&&
  o.accounted!==true
 );
}

function accountTotals(){

 const items=pendingAccountOrders();

 const collected=items.reduce((s,o)=>
  s+Number(o.price||0),0
 );

 const fees=items.reduce((s,o)=>
  s+deliveryOf(o),0
 );

 const net=items.reduce((s,o)=>
  s+netOf(o),0
 );

 const transferred=transfers.reduce((s,t)=>
  s+Number(t.amount||0),0
 );

 return {
  collected,
  fees,
  net,
  transferred,
  balance:net,
  items
 };
}


/* DASHBOARD */

function renderDashboard(){

 const active=orders.filter(o=>!terminal.includes(o.status));

 const delivered=orders.filter(o=>
  ["DELIVERED","PARTIAL"].includes(o.status)
 );

 const returned=orders.filter(o=>o.status==="RETURNED");

 let html=`
 <div class="section">
  <h2>لوحة التحكم</h2>
  <span class="muted">${new Date().toLocaleDateString("ar-JO")}</span>
 </div>

 <div class="grid">

  <div class="stat">
   <div class="label">كل الطلبات</div>
   <div class="value">${orders.length}</div>
  </div>

  <div class="stat">
   <div class="label">الطلبات النشطة</div>
   <div class="value">${active.length}</div>
  </div>

  <div class="stat">
   <div class="label">تم التسليم</div>
   <div class="value">${delivered.length}</div>
  </div>

  <div class="stat">
   <div class="label">المرتجعات</div>
   <div class="value">${returned.length}</div>
  </div>
 `;

 const a=accountTotals();

 if(role==="store"||isAdmin()){
  html+=`
  <div class="stat">
   <div class="label">مستحق Randis الحالي</div>
   <div class="value">${money(a.balance)}</div>
  </div>

  <div class="stat">
   <div class="label">الطلبات غير المحاسبة</div>
   <div class="value">${a.items.length}</div>
  </div>`;
 }

 html+="</div>";

 $("dashboard").innerHTML=html;
}


/* NAVIGATION */

function home(){
 page="home";

 $("homeModules").classList.remove("hidden");
 $("pageArea").classList.add("hidden");
 $("bottomAction").classList.remove("hidden");

 $("bottomAction").onclick=()=>openAdd();

 renderDashboard();
}

$("backHome").onclick=home;
$("bottomAction").onclick=()=>openAdd();

document.querySelectorAll("[data-page]").forEach(b=>{
 b.onclick=()=>openPage(b.dataset.page);
});

$("adminMode").onclick=()=>{
 mode="admin";
 updateMode();
 home();
};

$("driverMode").onclick=()=>{
 mode="driver";
 updateMode();
 home();
};

function updateMode(){

 $("adminMode").className=
  "btn small "+(mode==="admin"?"dark":"outline");

 $("driverMode").className=
  "btn small "+(mode==="driver"?"dark":"outline");

 document.querySelectorAll(".adminOnly").forEach(x=>{
  x.classList.toggle("hidden",mode!=="admin");
 });
}

function openPage(p){

 if(
  (p==="accounts"&&role==="boxit"&&!isAdmin())||
  (["transfers","archive","drivers","reports"].includes(p)&&!isAdmin())
 ){
  toast("هذا القسم غير متاح في وضعك الحالي");
  return;
 }

 page=p;

 $("homeModules").classList.add("hidden");
 $("pageArea").classList.remove("hidden");

 $("bottomAction").classList.toggle(
  "hidden",p!=="orders"
 );

 $("pageTitle").textContent=({
  orders:"الطلبات",
  delivered:"الطلبات المسلّمة",
  progress:"قيد التوصيل",
  returned:"المرتجعات",
  accounts:"الحسابات",
  transfers:"التحويلات",
  archive:"الأرشيف",
  drivers:"السائقون",
  reports:"التقارير",
  new:"إضافة طلب"
 })[p]||"";

 if(p==="new"){
  openAdd();
  return;
 }

 renderPage();
}


/* ORDER DISPLAY */

function statusBadge(s){

 let cls=terminal.includes(s)
  ?"b-done"
  :s==="PROGRESS"||s==="LOADED"
   ?"b-progress"
   :"b-new";

 if(s==="RETURNED")cls="b-return";

 return `<span class="badge ${cls}">
  ${esc(statuses[s]||s||"غير محدد")}
 </span>`;
}

function orderCard(o){

 return `
 <div class="order">

  <div class="orderhead">
   <div>
    <div class="ordername">${esc(o.customer||"بدون اسم")}</div>
    <div class="muted">${esc(o.id)}</div>
   </div>
   ${statusBadge(o.status)}
  </div>

  <div class="meta">
   <span>📍 ${esc(o.area||"-")}</span>
   <span>📞 ${esc(o.phone||"-")}</span>
   <span>💰 ${money(o.price)}</span>
  </div>

  <div class="meta">
   <span>التوصيل: ${money(deliveryOf(o))}</span>
   <span>صافي المتجر: ${money(netOf(o))}</span>
  </div>

  <div class="meta">
   <span>السائق: ${esc(o.driver||"غير محدد")}</span>
   <span>باركود: ${esc(o.barcode||"-")}</span>
  </div>

  ${o.accounted===true?
   `<div class="meta"><span class="badge b-done">تمت المحاسبة</span></div>`:""}

  <div class="actions">
   <button class="btn soft small" data-view="${o.id}">التفاصيل</button>

   ${isAdmin()&&!o.accounted?
    `<button class="btn outline small" data-edit="${o.id}">تعديل</button>`:""}

   <button class="btn primary small" data-result="${o.id}">تحديث الحالة</button>

   <button class="btn outline small" data-wa="${o.id}">واتساب</button>
  </div>

 </div>`;
}


/* RENDER PAGES */

function renderPage(){

 const c=$("pageContent");
 if(!c)return;

 if(["orders","delivered","progress","returned"].includes(page)){

  let list=orders.filter(o=>{

   if(page==="delivered")
    return ["DELIVERED","PARTIAL"].includes(o.status);

   if(page==="progress")
    return ["PROGRESS","LOADED"].includes(o.status);

   if(page==="returned")
    return o.status==="RETURNED";

   return true;
  });

  c.innerHTML=`
   <input id="orderSearch" class="search"
    placeholder="ابحث بالاسم أو الهاتف أو رقم الطلب أو الباركود">

   <div class="tabs">
    <button class="tab active" data-filter="all">الكل</button>
    <button class="tab" data-filter="active">النشطة</button>
    <button class="tab" data-filter="NEW">جديد</button>
    <button class="tab" data-filter="PROGRESS">قيد التوصيل</button>

/* CREATE TRANSFER AND RESET ACCOUNT */

function openTransfer(){

 if(!isAdmin()){
  toast("هذه العملية للإدارة فقط");
  return;
 }

 const a=accountTotals();

 if(!a.items.length||a.balance<=0){
  toast("لا يوجد رصيد مستحق للتحويل");
  return;
 }

 modal("تسجيل تحويل وتصفير الحساب",`

  <div class="panel">
   <div class="muted">المبلغ المستحق حالياً</div>
   <h2>${money(a.balance)}</h2>
   <div class="muted">${a.items.length} طلب داخل بالحسبة</div>
  </div>

  <div class="field">
   <label>قيمة التحويل</label>
   <input id="tAmount" type="number" min="0" step=".01" value="${a.balance.toFixed(2)}">
  </div>

  <div class="field">
   <label>طريقة التحويل</label>
   <select id="tMethod">
    <option>كاش</option>
    <option>CliQ</option>
    <option>تحويل بنكي</option>
    <option>أخرى</option>
   </select>
  </div>

  <div class="field">
   <label>رقم مرجعي</label>
   <input id="tReference">
  </div>

  <div class="field">
   <label>ملاحظات</label>
   <textarea id="tNote"></textarea>
  </div>

  <button id="saveTransfer" class="btn primary full">
   تأكيد التحويل وتصفير الحساب
  </button>
 `);

 $("saveTransfer").onclick=async()=>{

  const amount=Number($("tAmount").value);

  if(Math.abs(amount-a.balance)>0.009){
   toast("يجب أن يساوي التحويل كامل المستحق لتصفير الحساب");
   return;
  }

  const btn=$("saveTransfer");
  btn.disabled=true;
  btn.textContent="جارٍ حفظ التحويل...";

  try{

   const transferRef=doc(collection(db,"transfers"));

   await runTransaction(db,async tx=>{

    // إعادة قراءة الطلبات للتأكد من عدم احتساب أي طلب مرتين
    const snapshots=[];

    for(const item of a.items){
     const ref=doc(db,"orders",item.id);
     const snap=await tx.get(ref);
     snapshots.push({ref,snap});
    }

    const current=[];

    for(const entry of snapshots){
     if(!entry.snap.exists())continue;

     const o={id:entry.snap.id,...entry.snap.data()};

     if(
      ["DELIVERED","PARTIAL"].includes(o.status)&&
      o.accounted!==true
     ){
      current.push(o);
     }
    }

    const currentBalance=current.reduce((s,o)=>s+netOf(o),0);

    if(
     current.length!==a.items.length||
     Math.abs(currentBalance-amount)>0.009
    ){
     throw new Error("تغيرت الحسابات أثناء العملية. أغلق النافذة وافتحها مجدداً.");
    }

    const items=current.map(o=>({
     id:o.id,
     customer:o.customer||"",
     phone:o.phone||"",
     area:o.area||"",
     price:Number(o.price||0),
     deliveryFee:deliveryOf(o),
     netPrice:netOf(o),
     status:o.status||"",
     barcode:o.barcode||""
    }));

    // حفظ التحويل مع نسخة ثابتة من تفاصيل الطلبات
    tx.set(transferRef,{
     amount,
     method:$("tMethod").value,
     reference:$("tReference").value.trim(),
     note:$("tNote").value.trim(),
     items,
     orderCount:items.length,
     createdAt:serverTimestamp(),
     createdBy:user.email
    });

    // اعتماد الطلبات الداخلة في التحويل
    for(const entry of snapshots){
     const o=entry.snap.data();

     if(
      entry.snap.exists()&&
      ["DELIVERED","PARTIAL"].includes(o.status)&&
      o.accounted!==true
     ){
      tx.update(entry.ref,{
       accounted:true,
       accountedAt:serverTimestamp(),
       transferId:transferRef.id
      });
     }
    }

   });

   closeModal();
   toast("تم تسجيل التحويل وتصفير الحساب بنجاح");

  }catch(e){

   toast("تعذر تسجيل التحويل: "+e.message);

   btn.disabled=false;
   btn.textContent="تأكيد التحويل وتصفير الحساب";
  }
 };
}

 const t=transfers.find(x=>x.id===id);
 if(!t)return;

/* ACCOUNTING ARCHIVE */

async function loadArchive(){

 try{

  const snap=await getDocs(collection(db,"accounting_history"));

  const arr=snap.docs.map(d=>({id:d.id,...d.data()}));

  arr.sort((a,b)=>
   (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)
  );

  if(page!=="archive")return;

  $("historyList").innerHTML=arr.length?
   arr.map(x=>`
    <div class="card">
     <b>دورة ${esc(x.cycleNumber||"-")}</b>
     <div class="meta">
      <span>صافي الدورة: ${money(x.net)}</span>
      <span>التحويلات: ${money(x.transferred)}</span>
      <span>الرصيد: ${money(x.balance)}</span>
     </div>
     <div class="muted">
      ${esc(x.createdAt?.toDate?
       x.createdAt.toDate().toLocaleString("ar-JO"):"")}
     </div>
     <div class="muted">${esc(x.reason||"")}</div>
    </div>
   `).join("")
   :`<div class="empty">لا يوجد أرشيف بعد</div>`;

 }catch(e){
  $("historyList").textContent="تعذر تحميل الأرشيف: "+e.message;
 }
}


/* OPTIONAL MANUAL ARCHIVE */

async function openArchive(){

 if(!isAdmin())return;

 const a=accountTotals();

 modal("حفظ ملخص الحساب",`

  <div class="panel">
   <p>المستحق الحالي: <b>${money(a.balance)}</b></p>
   <p class="muted">
    الأرشفة تحفظ ملخصاً فقط ولا تصفر الحساب.
    لتصفير الحساب استخدم تسجيل التحويل.
   </p>
  </div>

  <div class="field">
   <label>ملاحظة</label>
   <textarea id="archiveReason"></textarea>
  </div>

  <button class="btn primary full" id="confirmArchive">
   حفظ الأرشيف
  </button>
 `);

 $("confirmArchive").onclick=async()=>{

  try{

   const snap=await getDoc(doc(db,"accounting","current"));

   const cycleNumber=(Number(snap.data()?.cycleNumber)||0)+1;

   await addDoc(collection(db,"accounting_history"),{
    cycleNumber,
    collected:a.collected,
    fees:a.fees,
    net:a.net,
    transferred:a.transferred,
    balance:a.balance,
    orderCount:a.items.length,
    reason:$("archiveReason").value.trim(),
    createdAt:serverTimestamp(),
    createdBy:user.email
   });

   await setDoc(doc(db,"accounting","current"),{
    cycleNumber,
    archivedAt:serverTimestamp(),
    archivedBy:user.email
   },{merge:true});

   closeModal();
   toast("تم حفظ الأرشيف");

  }catch(e){
   toast("تعذر الأرشفة: "+e.message);
  }
 };
}

</script>
