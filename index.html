<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b68">
<title>Randis × Box It</title>
<style>
:root{--navy:#123b68;--blue:#2585c5;--bg:#f3f7fa;--white:#fff;--text:#263746;--muted:#7b8995;--line:#e2eaf0;--green:#16845b;--red:#c43d4d;--orange:#b87516}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{background:linear-gradient(120deg,var(--navy),var(--blue));color:white;padding:17px;border-radius:0 0 20px 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:23px;font-weight:900}.logo small{display:block;font-size:10px;opacity:.8}
.wrap{max-width:950px;margin:auto;padding:15px 12px 90px}
.panel,.card,.stat,.order{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 15px #123b680c;margin-bottom:10px}
.login{max-width:420px;margin:9vh auto;padding:12px}.login .panel{padding:23px}
h2{font-size:19px}h3{font-size:15px}.muted{color:var(--muted);font-size:12px}
.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea,.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;outline:none}
.field textarea{min-height:70px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}
.primary{background:var(--blue);color:white}.dark{background:var(--navy);color:white}.soft{background:#e5f4fc;color:var(--navy)}
.outline{background:white;color:var(--navy);border:1px solid var(--line)}.danger{background:#ffedf0;color:var(--red)}
.success{background:#e5f7ef;color:var(--green)}.full{width:100%}.small{font-size:12px;padding:7px 9px}
.error{color:var(--red);font-size:12px;line-height:1.7}
.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 2px 10px}
.section h2{margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:21px;font-weight:900;color:var(--navy);margin-top:7px}
.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.module{background:white;border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;color:var(--navy);font-weight:bold;box-shadow:0 4px 15px #123b680c}
.module span{display:block;font-size:24px;margin-bottom:7px}
.tabs{display:flex;gap:6px;overflow:auto;padding:5px 0 12px}
.tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:20px;padding:8px 11px;font-size:12px}
.tab.active{background:var(--navy);color:white}
.order{padding:12px}.orderhead{display:flex;justify-content:space-between;gap:8px}
.ordername{font-weight:bold}.badge{border-radius:20px;padding:5px 8px;font-size:11px;background:#edf2f5}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;color:var(--muted);font-size:12px;margin:10px 0}
.actions{display:flex;flex-wrap:wrap;gap:6px}.empty{background:white;border:1px dashed var(--line);border-radius:12px;padding:25px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);padding:10px 13px;z-index:5}
.modalback{position:fixed;inset:0;background:#10283d88;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}
.modal{width:min(100%,520px);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:16px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.toast{position:fixed;top:14px;left:14px;right:14px;max-width:450px;margin:auto;padding:12px;background:#172d40;color:white;border-radius:10px;text-align:center;z-index:50}
.formgrid{display:grid;grid-template-columns:1fr;gap:0 10px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.modules{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="loginView" class="login">
 <div class="panel">
  <div class="logo" style="color:#123b68">RANDIS<small style="color:#7b8995">STORE × BOX IT DELIVERY</small></div>
  <h2>تسجيل الدخول</h2>
  <p class="muted">أدخل بيانات حسابك</p>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني"></div>
  <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
  <button id="loginBtn" class="btn primary full">دخول</button>
  <p id="loginError" class="error"></p>
 </div>
</div>

<div id="appView" class="hidden">
 <header>
  <div class="top">
   <div class="logo" id="brand">BOX IT<small>DELIVERY MANAGEMENT</small></div>
   <button id="logoutBtn" class="btn outline small">تسجيل خروج</button>
  </div>
  <div id="roleLine" style="font-size:12px;margin-top:8px"></div>
  <div id="modeSwitch" class="actions hidden" style="margin-top:10px">
   <button id="adminMode" class="btn dark small">وضع الإدارة</button>
   <button id="driverMode" class="btn outline small">وضع السائق</button>
  </div>
 </header>

 <main class="wrap">
  <div id="dashboard"></div>
  <div id="homeModules">
   <div class="section"><h2>الأقسام الرئيسية</h2></div>
   <div class="modules">
    <button class="module" data-page="orders"><span>📦</span>الطلبات</button>
    <button class="module" data-page="delivered"><span>✅</span>تم التسليم</button>
    <button class="module" data-page="progress"><span>🚚</span>قيد التوصيل</button>
    <button class="module" data-page="returned"><span>↩️</span>المرتجعات</button>
    <button class="module adminOnly" data-page="accounts"><span>💰</span>الحسابات</button>
    <button class="module adminOnly" data-page="transfers"><span>💳</span>التحويلات</button>
    <button class="module adminOnly" data-page="archive"><span>🗄️</span>الأرشيف</button>
    <button class="module adminOnly" data-page="drivers"><span>🧑‍✈️</span>السائقون</button>
    <button class="module adminOnly" data-page="reports"><span>📊</span>التقارير</button>
    <button class="module" data-page="new"><span>➕</span>إضافة طلب</button>
   </div>
  </div>
  <section id="pageArea" class="hidden">
   <div class="section"><h2 id="pageTitle"></h2><button id="backHome" class="btn outline small">رجوع</button></div>
   <div id="pageContent"></div>
  </section>
 </main>
 <div class="bottom"><button id="bottomAction" class="btn primary full">＋ إضافة طلبية</button></div>
</div>

<div id="modalHost"></div><div id="toastHost"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,collection,addDoc,doc,getDoc,setDoc,updateDoc,
 onSnapshot,serverTimestamp,query,orderBy,runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDUuf6K7I7HXiT_8CChLH9B5eDpmiDalk",
 authDomain:"order-manger-848ce.firebaseapp.com",
 projectId:"order-manger-848ce",
 storageBucket:"order-manger-848ce.firebasestorage.app",
 messagingSenderId:"174411866795",
 appId:"1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);
const money=n=>(Number(n)||0).toFixed(2)+" د.أ";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const statuses={
 NEW:"طلب جديد",PICKUP:"طلب استلام",RECEIVED:"تم الاستلام",
 SORTED:"تم الفرز",LOADED:"تم التحميل",PROGRESS:"قيد التوصيل",
 DELIVERED:"تم التسليم",PARTIAL:"تسليم جزئي",RETURNED:"مرتجع",
 DEFERRED:"مؤجل",UNREACHABLE:"تعذر الوصول",CANCELLED:"ملغي",DAMAGED:"تالف"
};
const terminal=["DELIVERED","PARTIAL","RETURNED","CANCELLED","DAMAGED"];
let user=null,role=null,mode="admin",orders=[],transfers=[],drivers=[],unsubs=[],page="home",filter="all";

function toast(s){
 $("toastHost").innerHTML=`<div class="toast">${esc(s)}</div>`;
 setTimeout(()=>$("toastHost").innerHTML="",2800);
}
function modal(title,body){
 $("modalHost").innerHTML=`<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><b>${title}</b><button class="btn outline small" id="closeModal">إغلاق</button></div>${body}</div></div>`;
 $("closeModal").onclick=closeModal;
 $("modalback").onclick=e=>{if(e.target.id==="modalback")closeModal()};
}
function closeModal(){$("modalHost").innerHTML=""}
function isAdmin(){return role==="boxit"&&mode==="admin"}
function canSeeAdmin(){return role==="boxit"}
function showError(e){
 const code=e?.code||"";
 const map={
 "auth/invalid-credential":"البريد الإلكتروني أو كلمة المرور غير صحيحة",
 "auth/user-not-found":"هذا الحساب غير موجود",
 "auth/wrong-password":"كلمة المرور غير صحيحة",
 "auth/invalid-email":"البريد الإلكتروني غير صحيح",
 "auth/too-many-requests":"محاولات كثيرة، حاول لاحقاً",
 "auth/network-request-failed":"تحقق من اتصال الإنترنت",
 "auth/operation-not-allowed":"فعّل Email/Password من Firebase Authentication"
 };
 return map[code]||e?.message||"حدث خطأ غير معروف";
}
function cleanup(){
 unsubs.forEach(f=>f());unsubs=[];
}
function setRole(u){
 const email=(u.email||"").toLowerCase();
 if(email==="rand@randis.app")return "store";
 if(email==="bahaa@boxit.app")return "boxit";
 return null;
}
$("loginBtn").onclick=async()=>{
 const email=$("email").value.trim().toLowerCase();
 const password=$("password").value;
 $("loginError").textContent="";
 if(!email||!password){$("loginError").textContent="أدخل البريد وكلمة المرور";return}
 $("loginBtn").disabled=true;
 $("loginBtn").textContent="جارٍ الدخول...";
 try{
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){$("loginError").textContent=showError(e)}
 finally{$("loginBtn").disabled=false;$("loginBtn").textContent="دخول"}
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 cleanup();user=u;
 if(!u){
  $("loginView").classList.remove("hidden");$("appView").classList.add("hidden");return;
 }
 role=setRole(u);
 if(!role){
  await signOut(auth);
  $("loginError").textContent="هذا الحساب غير مصرح له بالدخول";
  return;
 }
 mode="admin";
 $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");
 $("roleLine").textContent=role==="store"?"حساب Randis – المتجر":"حساب Box It – الإدارة والسائق";
 $("brand").innerHTML=role==="store"?"RANDIS<small>STORE MANAGEMENT</small>":"BOX IT<small>DELIVERY MANAGEMENT</small>";
 $("modeSwitch").classList.toggle("hidden",role!=="boxit");
 document.querySelectorAll(".adminOnly").forEach(x=>x.classList.toggle("hidden",role!=="boxit"));
 listenData();home();
});

function listenData(){
 const ordersRef=collection(db,"orders");
 unsubs.push(onSnapshot(ordersRef,snap=>{
  orders=snap.docs.map(d=>({id:d.id,...d.data()}));
  orders.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if(page==="home")renderDashboard();
  else renderPage();
 },e=>toast("خطأ تحميل الطلبات: "+e.message)));

 if(role==="boxit"){
  unsubs.push(onSnapshot(collection(db,"transfers"),snap=>{
   transfers=snap.docs.map(d=>({id:d.id,...d.data()}));
   if(page!=="home")renderPage();
  },e=>toast("خطأ تحميل التحويلات")));
  unsubs.push(onSnapshot(collection(db,"drivers"),snap=>{
   drivers=snap.docs.map(d=>({id:d.id,...d.data()}));
   if(page==="drivers")renderPage();
  },()=>{}));
 }
}

function accountTotals(){
 let collected=0,fees=0;
 orders.forEach(o=>{
  if(o.accounted===true){
   collected+=Number(o.accountedCollected||0);
   fees+=Number(o.accountedFee||0);
  }
 });
 const transferred=transfers.reduce((s,t)=>s+Number(t.amount||0),0);
 return {collected,fees,net:collected-fees,transferred,balance:collected-fees-transferred};
}
function renderDashboard(){
 const active=orders.filter(o=>!terminal.includes(o.status));
 const delivered=orders.filter(o=>o.status==="DELIVERED"||o.status==="PARTIAL");
 const returned=orders.filter(o=>o.status==="RETURNED");
 let html=`<div class="section"><h2>لوحة التحكم</h2><span class="muted">${new Date().toLocaleDateString("ar-JO")}</span></div>
 <div class="grid">
 <div class="stat"><div class="label">كل الطلبات</div><div class="value">${orders.length}</div></div>
 <div class="stat"><div class="label">الطلبات النشطة</div><div class="value">${active.length}</div></div>
 <div class="stat"><div class="label">تم التسليم</div><div class="value">${delivered.length}</div></div>
 <div class="stat"><div class="label">المرتجعات</div><div class="value">${returned.length}</div></div>`;
 if(isAdmin()){
  const a=accountTotals();
  html+=`<div class="stat"><div class="label">صافي الحساب</div><div class="value">${money(a.balance)}</div></div>
  <div class="stat"><div class="label">مجموع التحصيل</div><div class="value">${money(a.collected)}</div></div>`;
 }
 html+="</div>";
 $("dashboard").innerHTML=html;
}
function home(){
 page="home";$("homeModules").classList.remove("hidden");
 $("pageArea").classList.add("hidden");$("bottomAction").classList.remove("hidden");
 $("bottomAction").onclick=()=>openAdd();renderDashboard();
}
$("backHome").onclick=home;
$("bottomAction").onclick=()=>openAdd();
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>openPage(b.dataset.page));
$("adminMode").onclick=()=>{mode="admin";updateMode();home()};
$("driverMode").onclick=()=>{mode="driver";updateMode();home()};
function updateMode(){
 $("adminMode").className="btn small "+(mode==="admin"?"dark":"outline");
 $("driverMode").className="btn small "+(mode==="driver"?"dark":"outline");
 document.querySelectorAll(".adminOnly").forEach(x=>x.classList.toggle("hidden",mode!=="admin"));
}
function openPage(p){
 if(p==="accounts"||p==="transfers"||p==="archive"||p==="drivers"||p==="reports"){
  if(!isAdmin()){toast("هذا القسم للإدارة فقط");return}
 }
 page=p;$("homeModules").classList.add("hidden");$("pageArea").classList.remove("hidden");
 $("bottomAction").classList.toggle("hidden",p!=="orders"&&p!=="home");
 $("pageTitle").textContent=({
 orders:"الطلبات",delivered:"الطلبات المسلّمة",progress:"قيد التوصيل",
 returned:"المرتجعات",accounts:"الحسابات",transfers:"التحويلات",
 archive:"الأرشيف",drivers:"السائقون",reports:"التقارير",new:"إضافة طلب"
 })[p]||"";
 if(p==="new"){openAdd();return}
 renderPage();
}
function statusBadge(s){
 let cls=terminal.includes(s)?"b-done":s==="PROGRESS"||s==="LOADED"?"b-progress":"b-new";
 if(s==="RETURNED")cls="b-return";
 return `<span class="badge ${cls}">${esc(statuses[s]||s||"غير محدد")}</span>`;
}
function orderCard(o){
 return `<div class="order">
 <div class="orderhead"><div><div class="ordername">${esc(o.customer||"بدون اسم")}</div><div class="muted">${esc(o.id)}</div></div>${statusBadge(o.status)}</div>
 <div class="meta"><span>📍 ${esc(o.area||"-")}</span><span>📞 ${esc(o.phone||"-")}</span><span>💰 ${money(o.price)}</span></div>
 <div class="meta"><span>السائق: ${esc(o.driver||"غير محدد")}</span><span>باركود: ${esc(o.barcode||"-")}</span></div>
 <div class="actions">
 <button class="btn soft small" data-view="${o.id}">التفاصيل</button>
 ${isAdmin()?`<button class="btn outline small" data-edit="${o.id}">تعديل</button>`:""}
 <button class="btn primary small" data-result="${o.id}">تحديث الحالة</button>
 <button class="btn outline small" data-wa="${o.id}">واتساب</button>
 </div></div>`;
}
function renderPage(){
 const c=$("pageContent");if(!c)return;
 if(["orders","delivered","progress","returned"].includes(page)){
  let list=orders.filter(o=>{
   if(page==="delivered")return ["DELIVERED","PARTIAL"].includes(o.status);
   if(page==="progress")return ["PROGRESS","LOADED"].includes(o.status);
   if(page==="returned")return o.status==="RETURNED";
   return true;
  });
  c.innerHTML=`<input id="orderSearch" class="search" placeholder="ابحث بالاسم أو الهاتف أو رقم الطلب أو الباركود">
  <div class="tabs">
   <button class="tab active" data-filter="all">الكل</button>
   <button class="tab" data-filter="active">النشطة</button>
   <button class="tab" data-filter="NEW">جديد</button>
   <button class="tab" data-filter="PROGRESS">قيد التوصيل</button>
   <button class="tab" data-filter="DEFERRED">مؤجل</button>
  </div><div id="orderList"></div>`;
  function draw(){
   let q=$("orderSearch").value.toLowerCase();
   let f=list.filter(o=>{
    let match=[o.customer,o.phone,o.id,o.barcode,o.trackingId,o.area].some(x=>String(x||"").toLowerCase().includes(q));
    if(filter==="active")return match&&!terminal.includes(o.status);
    if(filter!=="all")return match&&o.status===filter;
    return match;
   });
   $("orderList").innerHTML=f.length?f.map(orderCard).join(""):`<div class="empty">لا توجد طلبات</div>`;
   bindOrderButtons();
  }
  $("orderSearch").oninput=draw;
  c.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
   filter=b.dataset.filter;c.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));draw();
  });
  draw();return;
 }
 if(page==="accounts"){
  const a=accountTotals();
  c.innerHTML=`<div class="grid">
   <div class="stat"><div class="label">المبالغ المحصلة</div><div class="value">${money(a.collected)}</div></div>
   <div class="stat"><div class="label">أجور التوصيل</div><div class="value">${money(a.fees)}</div></div>
   <div class="stat"><div class="label">صافي مستحق المتجر</div><div class="value">${money(a.net)}</div></div>
   <div class="stat"><div class="label">التحويلات</div><div class="value">${money(a.transferred)}</div></div>
   <div class="stat"><div class="label">الرصيد الحالي</div><div class="value">${money(a.balance)}</div></div>
  </div>
  <div class="panel"><p class="muted">الحساب يعتمد على الطلبات التي تم اعتماد نتائجها محاسبياً، ويخصم التحويلات المسجلة.</p>
  <button class="btn primary" id="addTransfer">تسجيل تحويل</button>
  <button class="btn outline" id="archiveCycle">أرشفة دورة الحساب</button></div>`;
  $("addTransfer").onclick=openTransfer;
  $("archiveCycle").onclick=openArchive;return;
 }
 if(page==="transfers"){
  c.innerHTML=`<button class="btn primary full" id="addTransfer">＋ تسجيل تحويل جديد</button><div style="margin-top:12px"></div>`+
  (transfers.length?transfers.slice().sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).map(t=>
   `<div class="card"><b>${money(t.amount)}</b><div class="meta"><span>${esc(t.method||"غير محدد")}</span><span>${esc(t.reference||"")}</span></div><div class="muted">${esc(t.note||"")} – ${t.createdAt?.toDate?t.createdAt.toDate().toLocaleString("ar-JO"):""}</div></div>`).join(""):`<div class="empty">لا توجد تحويلات مسجلة</div>`);
  $("addTransfer").onclick=openTransfer;return;
 }
 if(page==="archive"){
  c.innerHTML=`<div class="panel"><h3>أرشيف الحسابات</h3><p class="muted">الدورات المؤرشفة محفوظة في accounting_history. لا يتم حذف الطلبات أو التحويلات.</p></div><div id="historyList">تحميل الأرشيف...</div>`;
  onSnapshot(collection(db,"accounting_history"),snap=>{
   if(page!=="archive")return;
   const arr=snap.docs.map(d=>({id:d.id,...d.data()}));
   $("historyList").innerHTML=arr.length?arr.map(x=>`<div class="card"><b>دورة ${esc(x.cycleNumber||"-")}</b><div class="meta">صافي الدورة: ${money(x.net)} – التحويلات: ${money(x.transferred)}</div><div class="muted">${esc(x.reason||"")}</div></div>`).join(""):`<div class="empty">لا يوجد أرشيف بعد</div>`;
  },e=>$("historyList").textContent=e.message);return;
 }
 if(page==="drivers"){
  c.innerHTML=`<button class="btn primary" id="addDriver">＋ إضافة سائق</button><div style="margin-top:12px"></div>`+
  (drivers.length?drivers.map(d=>`<div class="card"><b>${esc(d.name)}</b><div class="meta">${esc(d.phone||"")}</div></div>`).join(""):`<div class="empty">لا يوجد سائقون مسجلون</div>`);
  $("addDriver").onclick=()=>modal("إضافة سائق",`<div class="field"><label>اسم السائق</label><input id="dName"></div><div class="field"><label>رقم الهاتف</label><input id="dPhone"></div><button id="saveDriver" class="btn primary full">حفظ</button>`);
  $("modalHost").onclick=async e=>{if(e.target.id==="saveDriver"){try{await addDoc(collection(db,"drivers"),{name:$("dName").value,phone:$("dPhone").value,createdAt:serverTimestamp()});closeModal();toast("تمت إضافة السائق")}catch(x){toast(x.message)}}};return;
 }
 if(page==="reports"){
  const delivered=orders.filter(o=>["DELIVERED","PARTIAL"].includes(o.status)).length;
  const ret=orders.filter(o=>o.status==="RETURNED").length;
  const pending=orders.filter(o=>!terminal.includes(o.status)).length;
  c.innerHTML=`<div class="grid">
  <div class="stat"><div class="label">إجمالي الطلبات</div><div class="value">${orders.length}</div></div>
  <div class="stat"><div class="label">المسلّمة</div><div class="value">${delivered}</div></div>
  <div class="stat"><div class="label">المرتجعة</div><div class="value">${ret}</div></div>
  <div class="stat"><div class="label">المعلقة</div><div class="value">${pending}</div></div>
  </div><div class="panel">نسبة التسليم: ${orders.length?(delivered/orders.length*100).toFixed(1):0}%</div>`;return;
 }
 c.innerHTML=`<div class="empty">اختر قسماً من القائمة</div>`;
}

function bindOrderButtons(){
 document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showOrder(b.dataset.view));
 document.querySelectorAll("[data-result]").forEach(b=>b.onclick=()=>resultModal(b.dataset.result));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editOrder(b.dataset.edit));
 document.querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>sendWhatsApp(b.dataset.wa));
}
function getOrder(id){return orders.find(o=>o.id===id)}
function showOrder(id){
 const o=getOrder(id);if(!o)return;
 modal("تفاصيل الطلب",`<div class="panel"><h3>${esc(o.customer)}</h3>
 <p>رقم الهاتف: ${esc(o.phone||"-")}</p><p>المنطقة: ${esc(o.area||"-")}</p>
 <p>السعر: ${money(o.price)}</p><p>صافي السعر: ${money(o.netPrice??o.price)}</p>
 <p>الحالة: ${esc(statuses[o.status]||o.status)}</p><p>السائق: ${esc(o.driver||"-")}</p>
 <p>الباركود: ${esc(o.barcode||"-")}</p><p>ملاحظات: ${esc(o.notes||"-")}</p></div>`);
}
function openAdd(){
 modal("إضافة طلب جديد",`
 <div class="formgrid">
 <div class="field"><label>اسم الزبون</label><input id="fCustomer"></div>
 <div class="field"><label>رقم الهاتف</label><input id="fPhone"></div>
 <div class="field"><label>المنطقة</label><input id="fArea"></div>
 <div class="field"><label>السعر</label><input id="fPrice" type="number" step="0.01"></div>
 <div class="field"><label>صافي السعر</label><input id="fNet" type="number" step="0.01"></div>
 <div class="field"><label>الباركود / رقم التتبع</label><input id="fBarcode"></div>
 </div>
 <div class="field"><label>ملاحظات</label><textarea id="fNotes"></textarea></div>
 <button id="saveOrder" class="btn primary full">حفظ الطلب</button>`);
 $("saveOrder").onclick=saveOrder;
}
async function saveOrder(){
 const customer=$("fCustomer").value.trim();
 const price=Number($("fPrice").value);
 if(!customer||!Number.isFinite(price)){toast("أدخل اسم الزبون والسعر");return}
 const data={
  customer,phone:$("fPhone").value.trim(),area:$("fArea").value.trim(),
  price,netPrice:$("fNet").value===""?price:Number($("fNet").value),
  originalPrice:price,barcode:$("fBarcode").value.trim(),
  trackingId:$("fBarcode").value.trim(),notes:$("fNotes").value.trim(),
  status:"NEW",feePaid:false,accounted:false,driver:"",
  createdAt:serverTimestamp(),updatedAt:serverTimestamp(),
  createdBy:user.email,originalDate:new Date().toISOString()
 };
 try{await addDoc(collection(db,"orders"),data);closeModal();toast("تم حفظ الطلب");home()}
 catch(e){toast("تعذر الحفظ: "+e.message)}
}
function editOrder(id){
 const o=getOrder(id);if(!o)return;
 modal("تعديل الطلب",`<div class="field"><label>اسم الزبون</label><input id="eCustomer" value="${esc(o.customer)}"></div>
 <div class="field"><label>الهاتف</label><input id="ePhone" value="${esc(o.phone)}"></div>
 <div class="field"><label>المنطقة</label><input id="eArea" value="${esc(o.area)}"></div>
 <div class="field"><label>السعر</label><input id="ePrice" type="number" value="${Number(o.price)||0}"></div>
 <div class="field"><label>ملاحظات</label><textarea id="eNotes">${esc(o.notes)}</textarea></div>
 <button class="btn primary full" id="saveEdit">حفظ التعديلات</button>`);
 $("saveEdit").onclick=async()=>{
  try{await updateDoc(doc(db,"orders",id),{customer:$("eCustomer").value,phone:$("ePhone").value,area:$("eArea").value,price:Number($("ePrice").value),notes:$("eNotes").value,updatedAt:serverTimestamp()});closeModal();toast("تم التعديل")}
  catch(e){toast(e.message)}
 };
}
function resultModal(id){
 const o=getOrder(id);if(!o)return;
 const opts=Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v}</option>`).join("");
 modal("تحديث نتيجة الطلب",`
 <div class="field"><label>حالة الطلب</label><select id="rStatus">${opts}</select></div>
 <div class="field"><label>المبلغ الذي تم تحصيله فعلياً</label><input id="rCollected" type="number" step=".01" value="${Number(o.deliveredAmount)||0}"></div>
 <div class="field"><label>أجرة التوصيل المحتسبة للشركة</label><input id="rFee" type="number" step=".01" value="${Number(o.deliveryFee)||0}"></div>
 <div class="field"><label>اسم السائق</label><input id="rDriver" value="${esc(o.driver||"")}"></div>
 <div class="field"><label>موعد التأجيل إن وجد</label><input id="rDeferred" type="date" value="${esc(o.deferredDate||"")}"></div>
 <div class="field"><label>ملاحظات / سبب الإرجاع</label><textarea id="rNotes">${esc(o.notes||"")}</textarea></div>
 <button id="saveResult" class="btn primary full">حفظ النتيجة</button>`);
 $("saveResult").onclick=async()=>{
  const status=$("rStatus").value;
  const collected=Number($("rCollected").value)||0;
  const fee=Number($("rFee").value)||0;
  try{
   await updateDoc(doc(db,"orders",id),{
    status,deliveredAmount:collected,returnedAmount:status==="RETURNED"?Number(o.price)||0:0,
    deliveryFee:fee,driver:$("rDriver").value.trim(),
    deferredDate:$("rDeferred").value,notes:$("rNotes").value,
    accounted:false,updatedAt:serverTimestamp()
   });
   closeModal();toast("تم تحديث الطلب. راجع الحسابات لاعتماد العملية.");
  }catch(e){toast(e.message)}
 };
}
function sendWhatsApp(id){
 const o=getOrder(id);if(!o)return;
 const msg=`مرحباً ${o.customer||""} 🌸
معك بهاء الدين من Box It 🚚

إلك طلب من Randis بقيمة ${o.price||0} دينار 📦

يا ريت تبعت الموقع وتنتبه للهاتف خلال الساعات القادمة.

شكراً إلك ❤️`;
 location.href="https://wa.me/"+String(o.phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent(msg);
}
function openTransfer(){
 modal("تسجيل تحويل",`
 <div class="field"><label>قيمة التحويل</label><input id="tAmount" type="number" min=".01" step=".01"></div>
 <div class="field"><label>طريقة التحويل</label><select id="tMethod"><option>كاش</option><option>CliQ</option><option>تحويل بنكي</option><option>أخرى</option></select></div>
 <div class="field"><label>رقم مرجعي</label><input id="tReference"></div>
 <div class="field"><label>ملاحظات</label><textarea id="tNote"></textarea></div>
 <button id="saveTransfer" class="btn primary full">تأكيد التحويل</button>`);
 $("saveTransfer").onclick=async()=>{
  const amount=Number($("tAmount").value);
  if(!(amount>0)){toast("أدخل مبلغاً صحيحاً");return}
  try{
   await addDoc(collection(db,"transfers"),{
    amount,method:$("tMethod").value,reference:$("tReference").value,
    note:$("tNote").value,createdAt:serverTimestamp(),createdBy:user.email
   });
   closeModal();toast("تم تسجيل التحويل");
  }catch(e){toast(e.message)}
 };
}
async function openArchive(){
 const a=accountTotals();
 modal("أرشفة دورة الحساب",`
 <div class="panel"><p>صافي المستحق الحالي: <b>${money(a.balance)}</b></p>
 <p class="muted">الأرشفة تحفظ ملخص الدورة ولا تحذف الطلبات أو التحويلات. لا تستخدمها لتصفير حساب غير مسدد.</p></div>
 <div class="field"><label>سبب الأرشفة / ملاحظة</label><textarea id="archiveReason"></textarea></div>
 <button class="btn primary full" id="confirmArchive">تأكيد الأرشفة</button>`);
 $("confirmArchive").onclick=async()=>{
  if(Math.abs(a.balance)>0.009&&!$("archiveReason").value.trim()){
   toast("الرصيد غير مسدد. اكتب سبباً واضحاً قبل الأرشفة");return;
  }
  try{
   const snap=await getDoc(doc(db,"accounting","current"));
   const cycleNumber=(Number(snap.data()?.cycleNumber)||0)+1;
   await addDoc(collection(db,"accounting_history"),{
    cycleNumber,collected:a.collected,fees:a.fees,net:a.net,
    transferred:a.transferred,balance:a.balance,
    reason:$("archiveReason").value,createdAt:serverTimestamp(),
    createdBy:user.email
   });
   await setDoc(doc(db,"accounting","current"),{
    cycleNumber,archivedAt:serverTimestamp(),archivedBy:user.email
   },{merge:true});
   closeModal();toast("تم حفظ أرشيف الدورة");
  }catch(e){toast("تعذر الأرشفة: "+e.message)}
 };
}
</script>
