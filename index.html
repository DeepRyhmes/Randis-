<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randis | Box It</title>
<style>
:root {
  --blue:#38a9e8;
  --sky:#eaf7ff;
  --navy:#123b60;
  --ink:#20384d;
  --muted:#7890a3;
  --bg:#f4f8fc;
  --white:#fff;
  --red:#e34d59;
  --green:#15976a;
  --line:#e5edf4;
  --shadow:0 8px 28px rgba(18,59,96,.08);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
header{
  background:linear-gradient(120deg,var(--navy),#168bd2);
  color:white;padding:20px 18px 25px;
  border-radius:0 0 25px 25px;box-shadow:var(--shadow)
}
.top{
  max-width:1000px;margin:auto;display:flex;
  align-items:center;justify-content:space-between;gap:12px
}
.brand{font-size:23px;font-weight:800}
.sub{font-size:12px;opacity:.8;margin-top:3px}
main{max-width:1000px;margin:18px auto;padding:0 14px 45px}
.login{
  max-width:400px;margin:12vh auto;background:white;
  padding:25px;border-radius:22px;box-shadow:var(--shadow)
}
.login h2{color:var(--navy)}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
input,select,textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:var(--ink);outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px #38a9e81a
}
.btn{
  padding:11px 15px;border-radius:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px
}
.primary{background:var(--blue);color:white}
.soft{background:var(--sky);color:var(--navy)}
.white{background:white;color:var(--navy)}
.danger{background:#fff0f1;color:var(--red)}
.success{background:#e8f8f0;color:var(--green)}
.full{width:100%}
.muted{color:var(--muted);font-size:12px}
.page-title{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;margin:8px 0 15px
}
.page-title h2{margin:0;color:var(--navy)}
.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;margin:14px 0
}
.stat{
  background:white;padding:15px;border:1px solid var(--line);
  border-radius:17px;box-shadow:var(--shadow)
}
.stat small{color:var(--muted)}
.stat strong{
  display:block;font-size:23px;color:var(--navy);margin-top:5px
}
.accounting{
  background:white;border:1px solid var(--line);
  border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:15px 0
}
.accounting h3{color:var(--navy);margin:0 0 12px}
.money-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px
}
.money-cell{background:var(--sky);padding:12px;border-radius:14px;min-width:0}
.money-cell span{display:block;color:#55768f;font-size:11px}
.money-cell b{
  display:block;color:var(--navy);font-size:18px;
  margin-top:5px;overflow-wrap:anywhere
}
.toolbar{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}
.toolbar .btn{white-space:nowrap;font-size:12px}
.section-title{color:var(--navy);margin:20px 0 9px;font-size:16px}
.order{
  background:white;border:1px solid var(--line);border-radius:17px;
  padding:15px;margin:10px 0;box-shadow:var(--shadow)
}
.order.urgent{
  border:2px solid var(--red);
  box-shadow:0 0 0 3px #e34d5910
}
.order-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.order h3{font-size:16px;margin:0 0 5px}
.tag{
  display:inline-block;padding:5px 9px;border-radius:30px;
  background:#edf3f8;color:#587187;font-size:11px;margin:3px 2px
}
.tag.red{background:#ffeaec;color:#c52f3d}
.tag.green{background:#e8f8f0;color:#13875d}
.tag.blue{background:var(--sky);color:#1478b2}
.order-info{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;margin:12px 0;font-size:13px
}
.order-actions{display:flex;gap:7px;flex-wrap:wrap}
.order-actions .btn{font-size:12px;padding:9px 11px}
.empty{
  text-align:center;padding:32px;color:var(--muted);
  background:white;border-radius:16px
}
.modal{
  position:fixed;inset:0;background:#071d32a8;z-index:10;
  display:flex;align-items:center;justify-content:center;padding:12px
}
.modal-box{
  background:white;width:100%;max-width:480px;max-height:93vh;
  overflow:auto;border-radius:22px;padding:20px;
  box-shadow:0 20px 60px #001a3033
}
.modal-box h3{color:var(--navy);margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{
  display:flex;align-items:center;gap:9px;background:#fff4f4;
  padding:11px;border-radius:12px;margin:12px 0
}
.check input{width:auto;margin:0}
.check label{margin:0;color:#bd3541}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions>*{flex:1}
.balance-note{
  background:#f6faff;border:1px solid var(--line);
  padding:11px;border-radius:12px;margin:12px 0;
  font-size:12px;color:#607b91
}
.area-heading{
  padding:12px;background:#eaf7ff;color:#123b60;
  border-radius:12px;margin-top:17px;font-weight:800
}
.history-item{
  padding:12px;border-bottom:1px solid var(--line);font-size:13px
}
@media(min-width:700px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .money-grid{gap:12px}
  .money-cell{padding:16px}
  .money-cell b{font-size:22px}
}
@media(max-width:420px){
  .money-grid{grid-template-columns:1fr 1fr}
  .money-cell:last-child{grid-column:span 2}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login" class="login">
  <h2>Randis <span style="color:#38a9e8">×</span> Box It</h2>
  <p class="muted">سجّل الدخول إلى حسابك</p>
  <label>البريد الإلكتروني</label>
  <input id="email" type="email" autocomplete="username">
  <label>كلمة المرور</label>
  <input id="password" type="password" autocomplete="current-password">
  <button class="btn primary full" id="loginBtn">تسجيل الدخول</button>
  <p id="loginError" class="muted"></p>
</section>

<div id="application" class="hidden">
<header>
  <div class="top">
    <div>
      <div class="brand" id="brand">Randis</div>
      <div class="sub" id="roleCaption">إدارة الطلبات</div>
    </div>
    <button class="btn white" id="logoutBtn">تسجيل خروج</button>
  </div>
</header>

<main>
  <div class="page-title">
    <div>
      <h2 id="welcome">لوحة التحكم</h2>
      <div class="muted">إدارة الطلبات والحسابات بكل سهولة</div>
    </div>
    <button class="btn primary hidden" id="addBtn">＋ إضافة طلبية</button>
  </div>

  <div id="accountingBox" class="accounting hidden"></div>
  <div id="stats" class="stats"></div>
  <div class="toolbar" id="filters"></div>
  <div id="areas"></div>
  <h3 class="section-title" id="listHeading">الطلبات</h3>
  <div id="orders"></div>
</main>
</div>

<!-- إضافة طلبية -->
<div id="addModal" class="modal hidden">
<div class="modal-box">
<h3>إضافة طلبية جديدة</h3>
<p class="muted">سيتم تسجيل الطلب تلقائياً بحالة طلب جديد</p>
<form id="addForm">
<label>اسم الزبون</label>
<input id="customer" required>

<div class="form-row">
  <div>
    <label>رقم الهاتف</label>
    <input id="phone" inputmode="tel" required placeholder="07xxxxxxxx">
  </div>
  <div>
    <label>المنطقة / الحي</label>
    <input id="area" required placeholder="الرابية">
  </div>
</div>

<div class="form-row">
  <div>
    <label>قيمة الطلب (د.أ)</label>
    <input id="price" type="number" min="0" step=".01" required>
  </div>
  <div>
    <label>سعر التوصيل (د.أ)</label>
    <input id="fee" type="number" min="0" step=".01" value="2" required>
  </div>
</div>

<label>ملاحظات</label>
<textarea id="notes" rows="2"></textarea>

<div class="check">
  <input id="urgent" type="checkbox">
  <label for="urgent">طلب مستعجل – ضروري يتسلّم بنفس اليوم</label>
</div>

<div class="modal-actions">
  <button class="btn primary" type="submit">حفظ الطلبية</button>
  <button class="btn soft" type="button" id="cancelAdd">إلغاء</button>
</div>
</form>
</div>
</div>

<!-- تحديث نتيجة التوصيل -->
<div id="resultModal" class="modal hidden">
<div class="modal-box">
<h3>تحديث نتيجة التوصيل</h3>
<p class="muted" id="resultCustomer"></p>
<input id="resultOrderId" type="hidden">

<label>حالة الطلب</label>
<select id="resultStatus">
  <option>تم التسليم</option>
  <option>تسليم جزئي</option>
  <option>مرتجع</option>
  <option>مؤجل</option>
  <option>ملغي</option>
</select>

<div id="amountInputs">
  <div class="form-row">
    <div>
      <label>المبلغ المحصّل فعلياً</label>
      <input id="collected" type="number" min="0" step=".01">
    </div>
    <div>
      <label>المبلغ المرتجع</label>
      <input id="returned" type="number" min="0" step=".01" value="0">
    </div>
  </div>
</div>

<div id="feePaidWrap" class="check hidden">
  <input id="feePaid" type="checkbox">
  <label for="feePaid">تم دفع أجرة التوصيل عند الإرجاع</label>
</div>

<div id="deferWrap" class="hidden">
  <label>موعد التوصيل الجديد</label>
  <input id="deferDate" type="date">
</div>

<label>ملاحظات النتيجة</label>
<textarea id="resultNote" rows="2"></textarea>

<div class="modal-actions">
  <button class="btn primary" id="saveResult">حفظ النتيجة</button>
  <button class="btn soft" id="cancelResult">إلغاء</button>
</div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc,
  onSnapshot, runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDU6f80K6I7HXiT_8CChLH9B5eDpmiDalk",
  authDomain: "order-manger-848ce.firebaseapp.com",
  projectId: "order-manger-848ce",
  storageBucket: "order-manger-848ce.firebasestorage.app",
  messagingSenderId: "174411866795",
  appId: "1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);
const ordersRef = collection(db,"orders");
const accountRef = doc(db,"accounting","current");

const roles = {
  "bahaa@boxit.app":"boxit",
  "rand@randis.app":"randis"
};

let role=null, user=null, orders=[], account={
  collected:0, deliveryFees:0, net:0, transfers:[]
};
let filter="current", areaFilter=null;
let stopOrders=null, stopAccount=null;

const $ = id => document.getElementById(id);
const money = n => (Number(n)||0).toFixed(2)+" د.أ";
const active = s => ["طلب جديد","قيد التوصيل","مؤجل"].includes(s);
const delivered = s => ["تم التسليم","تسليم جزئي"].includes(s);

const esc = value => String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

$("loginBtn").onclick=async()=>{
  try {
    $("loginError").textContent="جاري تسجيل الدخول...";

    const email=$("email").value.trim().toLowerCase();
    const password=$("password").value;

    await signInWithEmailAndPassword(auth,email,password);

  } catch(e) {
    console.error("Firebase Login Error:",e);

    $("loginError").textContent =
      "خطأ الدخول: " + e.code + " — " + e.message;
  }
};$("loginBtn").onclick=async()=>{
  try {
    
  }

  $("login").classList.add("hidden");
  $("application").classList.remove("hidden");
  $("brand").textContent=role==="boxit"?"Box It":"Randis";
  $("roleCaption").textContent=role==="boxit"?"إدارة التوصيل والمحاسبة":"إدارة المتجر والطلبات";
  $("welcome").textContent=role==="boxit"?"لوحة Box It":"لوحة Randis";
  $("addBtn").classList.toggle("hidden",role!=="randis");
  $("accountingBox").classList.toggle("hidden",false);

  stopListeners();

  stopOrders=onSnapshot(ordersRef,snap=>{
    orders=snap.docs.map(d=>({id:d.id,...d.data()}));
    orders.sort((a,b)=>
      (b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)
    );
    render();
  },err=>alert("تعذر تحميل الطلبات. راجع صلاحيات Firebase."));

  stopAccount=onSnapshot(accountRef,snap=>{
    account=snap.exists()?snap.data():{
      collected:0,deliveryFees:0,net:0,transfers:[]
    };
    renderAccount();
  },err=>console.error(err));
});

$("addForm").onsubmit=async e=>{
  e.preventDefault();
  if(role!=="randis")return;

  const price=Number($("price").value);
  const fee=Number($("fee").value);

  if(price<0||fee<0){alert("تأكد من المبالغ.");return}

  const data={
    customer:$("customer").value.trim(),
    phone:$("phone").value.trim(),
    area:$("area").value.trim(),
    price,deliveryFee:fee,
    notes:$("notes").value.trim(),
    isUrgent:$("urgent").checked,
    status:"طلب جديد",
    collectedAmount:0,
    returnedAmount:0,
    feePaid:false,
    archived:false,
    createdBy:user.uid,
    createdAt:serverTimestamp(),
    updatedAt:serverTimestamp()
  };

  try{
    await addDoc(ordersRef,data);
    $("addForm").reset();
    $("fee").value=2;
    $("addModal").classList.add("hidden");
  }catch(err){
    alert("لم يتم حفظ الطلبية. تأكد من الاتصال والصلاحيات.");
  }
};

function renderAccount(){
  const collected=Number(account.collected)||0;
  const fees=Number(account.deliveryFees)||0;
  const net=Number(account.net ?? collected-fees)||0;

  if(role==="boxit"){
    $("accountingBox").innerHTML=`
      <h3>الحساب والتحويلات</h3>
      <div class="money-grid">
        <div class="money-cell">
          <span>المبلغ المحصّل</span><b>${money(collected)}</b>
        </div>
        <div class="money-cell">
          <span>أجور التوصيل</span><b>${money(fees)}</b>
        </div>
        <div class="money-cell">
          <span>صافي رند</span><b>${money(net)}</b>
        </div>
      </div>
      <p class="balance-note">صافي رند = المبلغ المحصّل − أجور التوصيل</p>
      <button class="btn primary full" id="transferBtn">تم التحويل</button>
      <h3 style="margin-top:20px">سجل التحويلات</h3>
      <div id="transferHistory"></div>
    `;
    $("transferBtn").onclick=transferMoney;
    renderTransferHistory();
  }else{
    $("accountingBox").innerHTML=`
      <h3>حساب Randis</h3>
      <div class="money-grid" style="grid-template-columns:1fr">
        <div class="money-cell">
          <span>صافي المبلغ المستحق بعد خصم أجور التوصيل</span>
          <b>${money(net)}</b>
        </div>
      </div>
      <p class="balance-note">يتم تحديث الرصيد تلقائياً عند تسجيل نتائج التوصيل، ويُصفّر بعد تأكيد التحويل من Box It.</p>
      <h3 style="margin-top:15px">سجل التحويلات</h3>
      <div id="transferHistory"></div>
    `;
    renderTransferHistory();
  }
}

function renderTransferHistory(){
  const target=$("transferHistory");
  if(!target)return;
  const history=account.transfers||[];
  target.innerHTML=history.length?history.slice().reverse().map(t=>`
    <div class="history-item">
      <b>${money(t.net)}</b>
      <div class="muted">محصّل: ${money(t.collected)} · أجور: ${money(t.fees)}</div>
      <div class="muted">${esc(t.dateText||"تاريخ التحويل محفوظ")}</div>
    </div>
  `).join(""):'<p class="muted">لا توجد تحويلات سابقة.</p>';
}

async function transferMoney(){
  if(role!=="boxit")return;
  const collected=Number(account.collected)||0;
  const fees=Number(account.deliveryFees)||0;
  const net=Number(account.net ?? collected-fees)||0;

  if(collected<=0){
    alert("لا يوجد مبلغ محصّل لتحويله.");
    return;
  }
  if(!confirm(
    `تأكيد تسجيل التحويل؟\n\nالمبلغ المحصّل: ${money(collected)}\nأجور التوصيل: ${money(fees)}\nصافي رند: ${money(net)}\n\nسيتم تصفير الأرصدة عند الطرفين.`
  ))return;

  try{
    await runTransaction(db,async tx=>{
      const snap=await tx.get(accountRef);
      const current=snap.exists()?snap.data():{
        collected:0,deliveryFees:0,net:0,transfers:[]
      };
      const c=Number(current.collected)||0;
      const f=Number(current.deliveryFees)||0;
      const n=Number(current.net ?? c-f)||0;

      if(c<=0)throw new Error("EMPTY");

      const history=current.transfers||[];
      const now=new Date();
      const dateText=now.toLocaleString("ar-JO");

      tx.set(accountRef,{
        collected:0,
        deliveryFees:0,
        net:0,
        transfers:[...history,{
          collected:c,fees:f,net:n,
          dateText,
          createdAt:now.toISOString(),
          by:user.uid
        }]
      });
    });
    alert("تم تسجيل التحويل وتصفير الحساب عند الطرفين.");
  }catch(e){
    alert(e.message==="EMPTY"?"لا يوجد رصيد للتحويل.":"تعذر تسجيل التحويل. حاول مرة أخرى.");
  }
}

function statsHTML(items){
  return items.map(x=>`
    <div class="stat" ${x.filter?`onclick="window.setFilter('${x.filter}')"`:""}>
      <small>${x.label}</small><strong>${x.value}</strong>
    </div>
  `).join("");
}

function render(){
  const visible=orders.filter(o=>!o.archived);
  const newCount=visible.filter(o=>o.status==="طلب جديد").length;
  const progress=visible.filter(o=>o.status==="قيد التوصيل").length;
  const done=visible.filter(o=>delivered(o.status)).length;
  const returns=visible.filter(o=>["مرتجع","تسليم جزئي"].includes(o.status)).length;

  $("stats").innerHTML=statsHTML([
    {label:"طلبات جديدة",value:newCount,filter:"new"},
    {label:"قيد التوصيل",value:progress,filter:"progress"},
    {label:"تم التسليم",value:done,filter:"delivered"},
    {label:"المرتجعات",value:returns,filter:"returns"}
  ]);

  const filters=[
    ["current","الحالية"],["new","الجديدة"],["progress","قيد التوصيل"],
    ["delivered","تم التسليم"],["returns","المرتجعات"],
    ["deferred","المؤجلة"],["archive","الأرشيف"],["all","الكل"]
  ];
  $("filters").innerHTML=filters.map(([v,t])=>`
    <button class="btn ${filter===v?"primary":"soft"}" onclick="window.setFilter('${v}')">${t}</button>
  `).join("");

  const list=filteredOrders();
  $("listHeading").textContent=filter==="archive"?"أرشيف الطلبات السابقة":
    filter==="returns"?"المرتجعات":filter==="delivered"?"الطلبات المسلّمة":"الطلبات";

  if(role==="boxit"&&filter==="areas"){
    renderAreas();
    return;
  }
  $("areas").innerHTML="";
  $("orders").innerHTML=list.length?list.map(orderCard).join(""):'<div class="empty">لا توجد طلبات في هذا القسم</div>';
}

function filteredOrders(){
  let list=orders;
  if(filter==="archive")return list.filter(o=>o.archived);
  list=list.filter(o=>!o.archived);
  if(filter==="current")return list.filter(o=>active(o.status));
  if(filter==="new")return list.filter(o=>o.status==="طلب جديد");
  if(filter==="progress")return list.filter(o=>o.status==="قيد التوصيل");
  if(filter==="delivered")return list.filter(o=>delivered(o.status));
  if(filter==="returns")return list.filter(o=>["مرتجع","تسليم جزئي"].includes(o.status));
  if(filter==="deferred")return list.filter(o=>o.status==="مؤجل");
  return list;
}

function orderCard(o){
  const urgent=o.isUrgent&&!["تم التسليم","تسليم جزئي","مرتجع","ملغي"].includes(o.status);
  const archiveButton=o.archived?
    `<button class="btn success" onclick="window.archiveOrder('${o.id}',false)">استرجاع</button>`:
    `<button class="btn soft" onclick="window.archiveOrder('${o.id}',true)">أرشفة</button>`;

  return `<article class="order ${urgent?"urgent":""}">
    <div class="order-head">
      <div><h3>${esc(o.customer)}</h3><div class="muted">${esc(o.phone)}</div></div>
      <span class="tag">${esc(o.status||"طلب جديد")}</span>
    </div>
    ${urgent?'<span class="tag red">مستعجل اليوم</span>':""}
    <span class="tag blue">${esc(o.area||"غير مصنفة")}</span>
    <div class="order-info">
      <div>قيمة الطلب: <b>${money(o.price)}</b></div>
      <div>أجرة التوصيل: <b>${money(o.deliveryFee)}</b></div>
      <div>المحصّل: <b>${money(o.collectedAmount)}</b></div>
      <div>المرتجع: <b>${money(o.returnedAmount)}</b></div>
    </div>
    ${o.deferredDate?`<p class="muted">موعد التأجيل: ${esc(o.deferredDate)}</p>`:""}
    ${o.notes?`<p class="muted">${esc(o.notes)}</p>`:""}
    ${o.resultNote?`<p class="muted">${esc(o.resultNote)}</p>`:""}
    <div class="order-actions">
      ${role==="boxit"&&!o.archived&&o.status==="طلب جديد"?
        `<button class="btn primary" onclick="window.acceptOrder('${o.id}')">استلام للتوصيل</button>`:""}
      ${role==="boxit"&&!o.archived&&["قيد التوصيل","مؤجل"].includes(o.status)?
        `<button class="btn primary" onclick="window.openResult('${o.id}')">تحديث النتيجة</button>`:""}
      <button class="btn soft" onclick="window.sendWhatsApp('${esc(o.phone)}','${esc(o.customer)}',${Number(o.price)||0})">واتساب</button>
      ${archiveButton}
    </div>
  </article>`;
}

window.setFilter=f=>{
  filter=f;
  areaFilter=null;
  render();
};

window.acceptOrder=async id=>{
  if(role!=="boxit")return;
  try{
    await updateDoc(doc(db,"orders",id),{
      status:"قيد التوصيل",updatedAt:serverTimestamp()
    });
  }catch(e){alert("تعذر تحديث الطلب.");}
};

window.archiveOrder=async(id,archived)=>{
  const action=archived?"أرشفة":"استرجاع";
  if(!confirm(`تأكيد ${action} الطلبية؟`))return;
  try{
    await updateDoc(doc(db,"orders",id),{
      archived,updatedAt:serverTimestamp()
    });
  }catch(e){alert("تعذر تنفيذ العملية.");}
};

window.openResult=id=>{
  if(role!=="boxit")return;
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  $("resultOrderId").value=id;
  $("resultCustomer").textContent=o.customer+" — "+o.area;
  $("resultStatus").value="تم التسليم";
  $("collected").value=Number(o.price)||0;
  $("returned").value=0;
  $("feePaid").checked=false;
  $("deferDate").value="";
  $("resultNote").value="";
  toggleResultFields();
  $("resultModal").classList.remove("hidden");
};

function toggleResultFields(){
  const s=$("resultStatus").value;
  $("amountInputs").classList.toggle("hidden",!["تم التسليم","تسليم جزئي"].includes(s));
  $("feePaidWrap").classList.toggle("hidden",s!=="مرتجع"&&s!=="ملغي");
  $("deferWrap").classList.toggle("hidden",s!=="مؤجل");
}
$("resultStatus").onchange=toggleResultFields;

$("saveResult").onclick=async()=>{
  if(role!=="boxit")return;
  const id=$("resultOrderId").value;
  const o=orders.find(x=>x.id===id);
  if(!o)return;

  const status=$("resultStatus").value;
  const collected=Number($("collected").value)||0;
  const returned=Number($("returned").value)||0;
  const fee=Number(o.deliveryFee)||0;

  if(["تم التسليم","تسليم جزئي"].includes(status)){
    if(collected<0||returned<0||collected+returned>Number(o.price)+0.001){
      alert("تأكد من المبالغ. مجموع المحصّل والمرتجع لا يجوز أن يتجاوز قيمة الطلب.");
      return;
    }
  }

  if(status==="تم التسليم"&&collected<=0){
    alert("أدخل المبلغ المحصّل.");
    return;
  }

  if(status==="تسليم جزئي"&&(collected<=0||returned<=0)){
    alert("أدخل المبلغ المحصّل والمبلغ المرتجع للتسليم الجزئي.");
    return;
  }

  if(status==="مؤجل"&&!$("deferDate").value){
    alert("حدد موعد التوصيل الجديد.");
    return;
  }

  const nextCollected=
    status==="تم التسليم"||status==="تسليم جزئي"?collected:0;
  const nextReturned=
    status==="مرتجع"?Number(o.price):
    status==="تسليم جزئي"?returned:0;

  try{
    await runTransaction(db,async tx=>{
      const orderRef=doc(db,"orders",id);
      const accountSnap=await tx.get(accountRef);
      const orderSnap=await tx.get(orderRef);
      if(!orderSnap.exists())throw new Error("ORDER_MISSING");

      const latest=orderSnap.data();
      if(latest.accounted===true)throw new Error("ALREADY_ACCOUNTED");

      const oldAccount=accountSnap.exists()?accountSnap.data():{
        collected:0,deliveryFees:0,net:0,transfers:[]
      };

      let addCollected=nextCollected;
      let addFees=0;

      if(status==="تم التسليم"||status==="تسليم جزئي"){
        addFees=fee;
      }else if(status==="مرتجع"&&$("feePaid").checked){
        addCollected=fee;
        addFees=fee;
      }

      const totalCollected=(Number(oldAccount.collected)||0)+addCollected;
      const totalFees=(Number(oldAccount.deliveryFees)||0)+addFees;

      tx.update(orderRef,{
        status,
        collectedAmount:nextCollected,
        returnedAmount:nextReturned,
        feePaid:$("feePaid").checked,
        deferredDate:status==="مؤجل"?$("deferDate").value:"",
        resultNote:$("resultNote").value.trim(),
        accounted:true,
        updatedAt:serverTimestamp()
      });

      tx.set(accountRef,{
        collected:totalCollected,
        deliveryFees:totalFees,
        net:totalCollected-totalFees,
        transfers:oldAccount.transfers||[]
      });
    });

    $("resultModal").classList.add("hidden");
  }catch(e){
    if(e.message==="ALREADY_ACCOUNTED"){
      alert("تمت محاسبة هذه الطلبية مسبقاً.");
    }else{
      alert("تعذر حفظ نتيجة التوصيل أو تحديث الحساب. حاول مرة أخرى.");
    }
  }
};

window.sendWhatsApp=(phone,name,price)=>{
  let n=String(phone||"").replace(/\D/g,"");
  if(n.startsWith("0"))n="962"+n.slice(1);
  else if(n.startsWith("962")){}
  else if(n.startsWith("7"))n="962"+n;
  const msg=`مرحباً ${name} 🌸

طلبك من Randis جاهز للتوصيل.

قيمة الطلب: ${price} دينار.

يُرجى إرسال موقعك لتسهيل عملية التوصيل، والانتباه للهاتف خلال الساعات القادمة.`;
  window.open("https://wa.me/"+n+"?text="+encodeURIComponent(msg),"_blank");
};

window.showAreas=()=>{
  filter="areas";
  renderAreas();
};

function normalizeArea(s){
  return String(s||"").trim().replace(/\s+/g," ").replace(/[أإآ]/g,"ا");
}

function renderAreas(){
  if(role!=="boxit")return;
  const activeOrders=orders.filter(o=>!o.archived&&active(o.status));
  const groups={};
  activeOrders.forEach(o=>{
    const key=normalizeArea(o.area)||"منطقة غير مصنفة";
    (groups[key]??=[]).push(o);
  });

  const names=Object.keys(groups).sort((a,b)=>a.localeCompare(b,"ar"));
  $("areas").innerHTML=names.length?names.map(name=>`
    <div class="area-heading" onclick="window.openArea('${encodeURIComponent(name)}')">
      ${esc(name)} <span style="float:left">${groups[name].length} طلب</span>
    </div>
  `).join(""):'<div class="empty">لا توجد طلبات حالية حسب الأحياء</div>';

  $("orders").innerHTML="";
  $("listHeading").textContent="الطلبات حسب الأحياء";
}

window.openArea=encoded=>{
  const name=decodeURIComponent(encoded);
  const list=orders.filter(o=>!o.archived&&active(o.status)&&normalizeArea(o.area)===name);
  $("listHeading").textContent="طلبيات "+name;
  $("orders").innerHTML=list.length?list.map(orderCard).join(""):'<div class="empty">لا توجد طلبات بهذا الحي</div>';
  $("areas").innerHTML='<button class="btn soft" onclick="window.showAreas()">رجوع لكل الأحياء</button>';
};
</script>
</body>
