
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172c48">
<title>Randis × Box It | Logistics OS</title>
<style>
:root{
--navy:#172c48;--blue:#2796d2;--pink:#d85d86;--burgundy:#70243e;
--bg:#f3f6fa;--white:#fff;--text:#202b3c;--muted:#788397;
--green:#16865c;--red:#c94d56;--orange:#c98228;--line:#e7ebf1
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Tahoma,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
header{background:var(--navy);color:white;padding:15px 17px;position:sticky;top:0;z-index:4}
header.store{background:var(--burgundy)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:21px;font-weight:800}
.brand small{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:4px}
.container{max-width:1150px;margin:auto;padding:16px 13px 100px}
.muted{color:var(--muted);font-size:12px}
h2{font-size:19px;margin:20px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.btn{padding:11px 13px;border-radius:11px;font-weight:700;background:#e9edf3;color:var(--navy)}
.primary{background:var(--blue);color:white}
.dark{background:var(--navy);color:white}
.danger{background:#ffebed;color:var(--red)}
.success{background:#e5f5ed;color:var(--green)}
.outline{background:transparent;border:1px solid #dce2eb;color:inherit}
.small{padding:7px 9px;font-size:12px}
.full{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:white;border-radius:15px;padding:14px;box-shadow:0 2px 12px #172c4809;margin-bottom:11px}
.stat .number{font-size:23px;font-weight:800;margin-top:7px}
.stat .label{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.actions button{flex:1;min-width:105px}
.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 12px}
.tab{white-space:nowrap;border-radius:25px;padding:9px 13px;background:white;color:#536174;font-size:12px}
.tab.active{background:var(--navy);color:white}
input,select,textarea{width:100%;padding:11px;border:1px solid #dce2eb;border-radius:10px;background:white;margin:5px 0 12px;outline:none;color:var(--text)}
label{font-size:12px;font-weight:700;display:block}
textarea{min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.order{border-right:4px solid var(--blue)}
.order.store-order{border-right-color:var(--pink)}
.order-top{display:flex;justify-content:space-between;gap:8px}
.order-name{font-weight:800}
.badge{font-size:11px;padding:6px 9px;border-radius:20px;background:#e9edf3;white-space:nowrap}
.b-new{background:#e5f1ff;color:#2872b6}
.b-progress{background:#fff2da;color:#a36a14}
.b-done{background:#e1f5e9;color:#16865c}
.b-return{background:#ffe8e8;color:#bd414b}
.b-delay{background:#f1eaff;color:#7954ae}
.b-cancel{background:#eee;color:#777}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e4e8ef;padding:9px;display:flex;gap:7px;justify-content:center;z-index:5}
.bottom button{flex:1;max-width:210px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:#10182799;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.modal{background:white;width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:19px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.login{max-width:420px;margin:12vh auto;padding:16px}
.login .card{padding:24px}
.toast{position:fixed;bottom:80px;left:15px;right:15px;max-width:430px;margin:auto;background:#172c48;color:white;padding:13px;border-radius:12px;text-align:center;z-index:20}
.line{height:1px;background:#edf0f4;margin:11px 0}
.timeline{border-right:2px solid #dce4ed;padding-right:14px;margin:14px 4px}
.event{position:relative;margin-bottom:14px;font-size:13px}
.event:before{content:"";position:absolute;right:-20px;top:3px;width:9px;height:9px;background:var(--blue);border-radius:50%}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.notice{padding:11px;border-radius:10px;background:#fff6df;color:#8a621b;font-size:12px;line-height:1.7;margin:10px 0}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted)}
.pill{display:inline-block;border-radius:30px;padding:4px 8px;background:#edf1f6;font-size:11px}
a.btn{text-decoration:none;display:inline-block;text-align:center}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal-bg{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>

<div id="loginScreen" class="login">
<div class="card">
<div class="brand" style="color:#172c48">Randis × Box It
<small class="muted">LOGISTICS & DELIVERY MANAGEMENT</small></div>
<h2>تسجيل الدخول</h2>
<label>الحساب</label>
<select id="account">
<option value="rand">Randis – المتجر</option>
<option value="bahaa">Box It – الإدارة</option>
</select>
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button class="btn primary full" id="loginBtn">تسجيل الدخول</button>
<p id="loginError" class="muted"></p>
</div>
</div>

<div id="app" class="hidden">
<header id="header">
<div class="head">
<div class="brand" id="brandName">Box It</div>
<button class="btn outline small" id="logoutBtn">خروج</button>
</div>
<div id="roleInfo" class="muted" style="color:#ffffffb5;margin-top:7px"></div>
</header>
<main class="container">
<div id="modeSwitch" class="actions hidden">
<button class="btn dark" id="adminMode">وضع الإدارة</button>
<button class="btn" id="driverMode">وضع المندوب</button>
</div>
<div class="tabs" id="navTabs"></div>
<section id="pageContent"></section>
</main>
<nav class="bottom">
<button class="btn" onclick="go('home')">⌂ الرئيسية</button>
<button class="btn" onclick="go('orders')">▤ الشحنات</button>
<button class="btn primary" id="bottomAdd">＋ إضافة</button>
<button class="btn" onclick="go('finance')">▣ الحسابات</button>
</nav>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
getFirestore,collection,addDoc,doc,updateDoc,onSnapshot,serverTimestamp,
query,where,getDocs,runTransaction,writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDUuf6K80I7HXiT_8CChLH9B5eDpmiDalk",
authDomain:"order-manger-848ce.firebaseapp.com",
projectId:"order-manger-848ce",
storageBucket:"order-manger-848ce.firebasestorage.app",
messagingSenderId:"174411866795",
appId:"1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const refs={
orders:collection(db,"orders"),
drivers:collection(db,"drivers"),
transfers:collection(db,"transfers"),
expenses:collection(db,"expenses"),
accounting:collection(db,"accounting_history"),
complaints:collection(db,"complaints"),
blacklist:collection(db,"blacklist"),
audit:collection(db,"audit_logs"),
notifications:collection(db,"notifications"),
rounds:collection(db,"driver_rounds"),
settlements:collection(db,"settlements")
};

const accounts={
rand:{email:"rand@randis.app",role:"store",name:"Randis"},
bahaa:{email:"bahaa@boxit.app",role:"admin",name:"Box It"}
};
const S={
NEW:"طلب جديد",PICKUP:"طلب استلام",RECEIVED:"تم الاستلام",SORTED:"تم الفرز",
LOADED:"تم التحميل",PROGRESS:"قيد التوصيل",DELIVERED:"تم التسليم",
PARTIAL:"استلام جزئي",RETURNED:"مرتجع",DEFERRED:"مؤجل",
UNREACHABLE:"تعذر الوصول",CANCELLED:"ملغي",DAMAGED:"تالف"
};
const FINAL=[S.DELIVERED,S.PARTIAL,S.RETURNED,S.CANCELLED,S.DAMAGED];

let user=null,role="",mode="admin",page="home";
let orders=[],drivers=[],transfers=[],expenses=[],complaints=[],blacklist=[],settlements=[],rounds=[];
let unsubs=[],activeFilter="all",searchTerm="",selectedDriverId="",showDriverArchive=false;
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toFixed(2)+" د.أ";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isStore=()=>role==="store";
const isDriver=()=>role==="admin"&&mode==="driver";
function dateMs(v){if(!v)return 0;if(v.toDate)return v.toDate().getTime();const d=new Date(v);return isNaN(d)?0:d.getTime()}
function dateText(v){return dateMs(v)?new Date(dateMs(v)).toLocaleString("ar-JO"):"—"}
function toast(m){$("toastHost").innerHTML=`<div class="toast">${esc(m)}</div>`;setTimeout(()=>$("toastHost").innerHTML="",3500)}
function closeModal(){$("modalHost").innerHTML=""}
window.closeModal=closeModal;
function modal(title,html){
$("modalHost").innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn small" onclick="closeModal()">إغلاق ✕</button></div>${html}</div></div>`;
$("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal()};
}
function cleanPhone(raw){
let n=String(raw||"").trim().replace(/[^\d+]/g,"");
if(n.startsWith("00"))n=n.slice(2);
n=n.replace(/\D/g,"");
if(n.startsWith("962"))return n;
if(n.startsWith("0"))return "962"+n.slice(1);
if(n.length===9&&n.startsWith("7"))return "962"+n;
return n;
}
function whatsappUrl(phone,message=""){
const n=cleanPhone(phone);
if(n.length<10)return "";
return "https://wa.me/"+n+(message?"?text="+encodeURIComponent(message):"");
}
function contactButtons(phone,trackingId=""){
const n=cleanPhone(phone),wa=whatsappUrl(phone,`مرحبا، بخصوص الشحنة رقم ${trackingId}`);
return `<div class="actions">
<a class="btn success small" href="tel:+${n}">اتصال</a>
${wa?`<a class="btn primary small" target="_blank" rel="noopener" href="${wa}">واتساب</a>`:`<button class="btn small" onclick="toast('رقم الهاتف غير صالح للواتساب')">واتساب</button>`}
<a class="btn small" href="sms:+${n}">رسالة</a>
</div>`;
}
function statusClass(s){
if([S.DELIVERED,S.PARTIAL].includes(s))return "b-done";
if([S.RETURNED,S.DAMAGED].includes(s))return "b-return";
if(s===S.DEFERRED)return "b-delay";
if([S.NEW,S.PICKUP,S.RECEIVED].includes(s))return "b-new";
if(s===S.CANCELLED)return "b-cancel";
return "b-progress";
}
function stat(label,value){return `<div class="card stat"><div class="label">${label}</div><div class="number">${value}</div></div>`}
function deliveredOrders(list=orders){return list.filter(o=>[S.DELIVERED,S.PARTIAL].includes(o.status))}
function activeOrders(list=orders){return list.filter(o=>!FINAL.includes(o.status))}
function actualCollected(o){return Number(o.collectedAmount??o.deliveredAmount??0)}
function merchantNet(o){return Math.max(0,actualCollected(o)-Number(o.deliveryFee||0)-Number(o.merchantDeduction||0))}
function storeOrders(){return orders.filter(o=>o.createdBy===user.uid)}
function driverOrders(){
if(!selectedDriverId)return [];
return orders.filter(o=>o.driverId===selectedDriverId&&!o.driverArchived);
}
function driverArchivedOrders(){
if(!selectedDriverId)return [];
return orders.filter(o=>o.driverId===selectedDriverId&&o.driverArchived);
}
function logEvent(o,status,note){
return [...(Array.isArray(o.events)?o.events:[]),{status,note,by:user.email,at:new Date().toISOString()}];
}

/* Login */
$("loginBtn").onclick=async()=>{
const account=accounts[$("account").value],password=$("password").value;
$("loginError").textContent="";
try{await signInWithEmailAndPassword(auth,account.email,password)}
catch(e){$("loginError").textContent="تعذر تسجيل الدخول. تأكد من كلمة المرور ووجود الحساب في Firebase."}
};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
unsubs.forEach(f=>f());unsubs=[];
if(!u){user=null;$("loginScreen").classList.remove("hidden");$("app").classList.add("hidden");return}
user=u;
const a=Object.values(accounts).find(x=>x.email===u.email);
if(!a){await signOut(auth);return}
role=a.role;mode=role==="store"?"store":"admin";
selectedDriverId="";
$("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");
subscribeData();
});

/* Realtime database */
function listen(ref,callback,onError=()=>{}){
unsubs.push(onSnapshot(ref,callback,onError));
}
function subscribeData(){
const oq=isStore()?query(refs.orders,where("createdBy","==",user.uid)):query(refs.orders);
listen(oq,s=>{
orders=s.docs.map(d=>({id:d.id,...d.data()}));
orders.sort((a,b)=>dateMs(b.createdAt)-dateMs(a.createdAt));render();
},e=>toast("تعذر تحميل الشحنات: "+e.message));
if(!isStore()){
listen(refs.drivers,s=>{drivers=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="drivers"||isDriver())render()});
listen(refs.transfers,s=>{transfers=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="finance")render()});
listen(refs.expenses,s=>{expenses=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="finance"||page==="reports")render()});
listen(refs.complaints,s=>{complaints=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="complaints")render()});
listen(refs.blacklist,s=>{blacklist=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="blacklist")render()});
listen(refs.rounds,s=>{rounds=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="rounds"||isDriver())render()});
listen(refs.settlements,s=>{settlements=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="finance")render()});
}else{
listen(query(refs.settlements,where("merchantId","==",user.uid)),s=>{
settlements=s.docs.map(d=>({id:d.id,...d.data()}));if(page==="finance")render()
},()=>{});
}
}
async function auditLog(action,details){
try{await addDoc(refs.audit,{action,details,user:user?.email||"",userId:user?.uid||"",createdAt:serverTimestamp()})}
catch(e){console.warn("Audit log error",e)}
}

/* Navigation */
function renderTabs(){
let tabs=isStore()
?[["home","الرئيسية"],["orders","الشحنات"],["finance","كشف الحساب"],["complaints","الشكاوى"]]
:isDriver()
?[["orders","طرودي النشطة"],["driverArchive","أرشيفي"],["rounds","الجولات"]]
:[["home","الرئيسية"],["orders","الشحنات"],["drivers","المندوبون"],["warehouse","المستودع"],["finance","المالية"],["reports","التقارير"],["complaints","الشكاوى"],["blacklist","القائمة السوداء"],["rounds","الجولات"]];
$("navTabs").innerHTML=tabs.map(([k,n])=>`<button class="tab ${page===k?"active":""}" onclick="go('${k}')">${n}</button>`).join("");
}
window.go=p=>{page=p;render()};
$("adminMode").onclick=()=>{mode="admin";page="home";render()};
$("driverMode").onclick=()=>{mode="driver";page="orders";activeFilter="all";render()};
$("bottomAdd").onclick=()=>isDriver()?scanHelp():newOrder();

/* Render */
function render(){
if(!user)return;
$("header").className=isStore()?"store":"";
$("brandName").innerHTML=isStore()?"Randis<small>STORE PORTAL</small>":"Box It<small>LOGISTICS OPERATIONS</small>";
$("roleInfo").textContent=isStore()?"بوابة التاجر":isDriver()?"واجهة المندوب":"إدارة العمليات والتوصيل";
$("modeSwitch").classList.toggle("hidden",isStore());
$("adminMode").className=mode==="admin"?"btn primary":"btn";
$("driverMode").className=mode==="driver"?"btn primary":"btn";
renderTabs();
const c=$("pageContent");
const pages={home:homeHtml,orders:ordersHtml,driverArchive:driverArchiveHtml,drivers:driversHtml,warehouse:warehouseHtml,finance:financeHtml,reports:reportsHtml,complaints:complaintsHtml,blacklist:blacklistHtml,rounds:roundsHtml};
c.innerHTML=(pages[page]||homeHtml)();
}

/* Dashboard */
function homeHtml(){
if(isDriver()){
const list=driverOrders(),done=deliveredOrders(list);
return `<h2>واجهة المندوب</h2>
${driverPickerHtml()}
<div class="grid">
${stat("الطرود النشطة",list.length)}
${stat("تم التوصيل",done.length)}
${stat("التحصيل الفعلي",money(done.reduce((a,o)=>a+actualCollected(o),0)))}
${stat("بالسيارة",list.filter(o=>[S.LOADED,S.PROGRESS].includes(o.status)).length)}
</div>
<div class="card"><h3>إجراءات المندوب</h3>
<div class="actions">
<button class="btn primary" onclick="scanHelp()">بحث / مسح كود</button>
<button class="btn" onclick="go('orders')">طرودي النشطة</button>
<button class="btn" onclick="go('driverArchive')">أرشيفي</button>
<button class="btn success" onclick="endRound()">إنهاء الجولة</button>
</div></div>`;
}
const list=isStore()?storeOrders():orders,d=deliveredOrders(list),a=activeOrders(list);
if(isStore())return `<h2>لوحة Randis</h2><div class="grid">
${stat("إجمالي الشحنات",list.length)}${stat("الشحنات النشطة",a.length)}
${stat("تم التسليم",d.length)}${stat("المرتجعات",list.filter(o=>o.status===S.RETURNED).length)}
${stat("التحصيل الفعلي",money(d.reduce((x,o)=>x+actualCollected(o),0)))}
${stat("المستحق بعد التوصيل",money(d.reduce((x,o)=>x+merchantNet(o),0)))}
</div><div class="card"><h3>إجراءات المتجر</h3><div class="actions">
<button class="btn primary" onclick="newOrder()">إضافة شحنة</button><button class="btn" onclick="go('orders')">الشحنات</button><button class="btn" onclick="go('finance')">كشف الحساب</button>
</div></div>`;
return `<h2>لوحة عمليات Box It</h2><div class="grid">
${stat("إجمالي الشحنات",orders.length)}${stat("الشحنات النشطة",a.length)}
${stat("طلبات جديدة",orders.filter(o=>o.status===S.NEW).length)}
${stat("طلبات الاستلام",orders.filter(o=>o.status===S.PICKUP).length)}
${stat("قيد التوصيل",orders.filter(o=>o.status===S.PROGRESS).length)}
${stat("تم التسليم",d.length)}
${stat("المرتجعات",orders.filter(o=>o.status===S.RETURNED).length)}
${stat("التحصيل الفعلي",money(d.reduce((x,o)=>x+actualCollected(o),0)))}
</div><div class="card"><h3>إجراءات سريعة</h3><div class="actions">
<button class="btn primary" onclick="newOrder()">إضافة شحنة</button>
<button class="btn" onclick="newDriver()">إضافة مندوب</button>
<button class="btn" onclick="newExpense()">تسجيل مصروف</button>
<button class="btn" onclick="go('reports')">التقارير</button>
</div></div><div class="notice">تحصيل COD أمانة للتاجر وليس إيراداً للشركة. إيراد Box It هو أجرة التوصيل والرسوم المعتمدة.</div>`;
}

/* Driver selector */
function driverPickerHtml(){
return `<div class="card"><label>اختيار حساب المندوب لعرض طروده</label>
<select id="activeDriver" onchange="selectDriver(this.value)">
<option value="">اختر المندوب</option>
${drivers.map(d=>`<option value="${esc(d.id)}" ${selectedDriverId===d.id?"selected":""}>${esc(d.name||d.phone||d.id)}</option>`).join("")}
</select><div class="muted">هذه النسخة تعرض وضع المندوب من حساب الإدارة. حساب دخول مستقل لكل مندوب يحتاج إنشاء مستخدم Firebase وصلاحياته.</div></div>`;
}
window.selectDriver=id=>{selectedDriverId=id;render()};

/* Orders */
function ordersHtml(){
let list=isStore()?storeOrders():isDriver()?driverOrders():[...orders];
if(isDriver()&&!selectedDriverId)return driverPickerHtml()+`<div class="card empty">اختر المندوب لعرض الطرود المسندة إليه.</div>`;
if(activeFilter!=="all"){
const map={new:S.NEW,pickup:S.PICKUP,received:S.RECEIVED,loaded:S.LOADED,progress:S.PROGRESS,delivered:"done",returned:S.RETURNED};
const f=map[activeFilter];
list=list.filter(o=>f==="done"?[S.DELIVERED,S.PARTIAL].includes(o.status):o.status===f);
}
if(searchTerm)list=list.filter(o=>[o.customer,o.phone,o.area,o.trackingId,o.id,o.barcode].some(v=>String(v||"").toLowerCase().includes(searchTerm.toLowerCase())));
const filters=[["all","الكل"],["new","جديدة"],["pickup","استلام"],["received","مستلمة"],["loaded","محمّلة"],["progress","قيد التوصيل"],["delivered","مسلمة"],["returned","مرتجعة"]];
return `${isDriver()?driverPickerHtml():""}
<h2>${isDriver()?"طرودي النشطة":"إدارة الشحنات"}</h2>

/* Create order */
window.newOrder=()=>{
modal("إنشاء شحنة",`
<div class="row"><div><label>اسم المستلم</label><input id="fCustomer"></div><div><label>رقم الهاتف</label><input id="fPhone" inputmode="tel"></div></div>
<div class="row"><div><label>المنطقة</label><input id="fArea"></div><div><label>قيمة التحصيل COD</label><input id="fPrice" type="number" min="0" step=".01"></div></div>
<div class="row"><div><label>أجرة التوصيل</label><input id="fFee" type="number" min="0" step=".01" value="2"></div>
<div><label>طريقة الدفع</label><select id="fPay"><option>نقداً</option><option>محفظة إلكترونية</option><option>تحويل بنكي</option></select></div></div>
<label>العنوان التفصيلي والملاحظات</label><textarea id="fNotes"></textarea>
<label><input id="fUrgent" type="checkbox" style="width:auto"> شحنة مستعجلة</label>
<button class="btn primary full" id="saveOrder">حفظ الشحنة</button>`);
$("saveOrder").onclick=saveOrder;
};
async function saveOrder(){
const customer=$("fCustomer").value.trim(),phone=$("fPhone").value.trim(),area=$("fArea").value.trim();
const price=Number($("fPrice").value),fee=Number($("fFee").value||0);
if(!customer||!phone||!area||!Number.isFinite(price)||price<0||!Number.isFinite(fee)||fee<0)return toast("أكمل البيانات وتأكد من المبالغ");
const status=isStore()?S.NEW:S.RECEIVED;
try{
const ref=await addDoc(refs.orders,{
customer,phone,area,price,deliveryFee:fee,paymentMethod:$("fPay").value,
notes:$("fNotes").value.trim(),isUrgent:$("fUrgent").checked,status,
feePaid:false,accounted:false,collectedAmount:0,merchantDeduction:0,
driverArchived:false,settledAmount:0,
createdBy:user.uid,createdByEmail:user.email,createdAt:serverTimestamp(),
events:[{status,note:"إنشاء الشحنة",by:user.email,at:new Date().toISOString()}]
});
const trackingId="BX"+Date.now().toString().slice(-9);
await updateDoc(doc(db,"orders",ref.id),{trackingId});
await auditLog("CREATE_ORDER",{orderId:ref.id,trackingId});
closeModal();toast("تم إنشاء الشحنة");
}catch(e){toast("تعذر الحفظ: "+e.message)}
}

/* Status changes */
window.changeStatus=id=>{
const o=orders.find(x=>x.id===id);if(!o)return;
const choices=isDriver()?[S.PROGRESS,S.DELIVERED,S.PARTIAL,S.RETURNED,S.DEFERRED,S.UNREACHABLE,S.DAMAGED]:Object.values(S);
modal("تحديث حالة الشحنة",`
<label>الحالة الجديدة</label><select id="newStatus">${choices.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select>
<label>المبلغ المحصل فعلياً من العميل</label><input id="collected" type="number" min="0" step=".01" value="${actualCollected(o)}">
<label>خصم متفق عليه من مستحق التاجر (إن وجد)</label><input id="deduction" type="number" min="0" step=".01" value="${Number(o.merchantDeduction||0)}">
<label>ملاحظة التحديث</label><textarea id="statusNote"></textarea>
<button class="btn primary full" onclick="saveStatus('${id}')">تأكيد التحديث</button>`);
};
window.saveStatus=async id=>{
const o=orders.find(x=>x.id===id);if(!o)return;
const status=$("newStatus").value,amount=Number($("collected").value||0),deduction=Number($("deduction").value||0),note=$("statusNote").value.trim();
if(!Number.isFinite(amount)||amount<0||!Number.isFinite(deduction)||deduction<0)return toast("تحقق من المبالغ");
if([S.DELIVERED,S.PARTIAL].includes(status)&&amount<=0)return toast("أدخل المبلغ الذي استلمته فعلياً");
if(amount>Number(o.price||0)&&[S.DELIVERED,S.PARTIAL].includes(status))return toast("المبلغ المحصل أكبر من قيمة COD. راجع القيمة.");
const patch={status,events:logEvent(o,status,note),updatedAt:serverTimestamp()};
if([S.DELIVERED,S.PARTIAL].includes(status)){patch.collectedAmount=amount;patch.deliveredAmount=amount;patch.merchantDeduction=deduction;patch.collectedAt=serverTimestamp();patch.collectedBy=user.uid}
try{
await updateDoc(doc(db,"orders",id),patch);
await auditLog("UPDATE_ORDER_STATUS",{orderId:id,oldStatus:o.status,newStatus:status,collectedAmount:amount});
closeModal();toast("تم تحديث حالة الشحنة");
}catch(e){toast("فشل التحديث: "+e.message)}
};

function roundsHtml(){
if(isDriver()&&!selectedDriverId)return driverPickerHtml()+`<div class="card empty">اختر المندوب لعرض جولاته.</div>`;
const list=isDriver()?rounds.filter(r=>r.driverId===selectedDriverId):rounds;
return `<h2>سجل الجولات</h2>${isDriver()?driverPickerHtml():""}
${list.sort((a,b)=>dateMs(b.endedAt)-dateMs(a.endedAt)).map(r=>`<div class="card"><div class="order-top"><b>${esc(r.driverName||"مندوب")}</b><span class="badge b-done">منتهية</span></div><p>عدد الطرود: ${Number(r.orderCount||0)}</p><p>التحصيل الفعلي: ${money(r.collectedTotal)}</p><div class="muted">بدأت: ${dateText(r.startedAt)} · انتهت: ${dateText(r.endedAt)}</div><div class="muted">رقم الجولة: ${esc(r.id)}</div></div>`).join("")||'<div class="card empty">لا توجد جولات مسجلة</div>'}`;

window.endRound=()=>{
if(!selectedDriverId)return toast("اختر المندوب أولاً");
const list=driverOrders();
if(!list.length)return toast("لا توجد طرود نشطة لهذا المندوب");
const done=list.filter(o=>FINAL.includes(o.status));
const collected=done.reduce((a,o)=>a+actualCollected(o),0);
modal("إنهاء جولة المندوب",`
<div class="notice">سيتم إخراج طرود هذه الجولة من قائمة المندوب النشطة ووضعها في أرشيفه. لن تُحذف الطلبات، وستظل ظاهرة للإدارة والتاجر. الطلبات غير المنجزة ستبقى بحالتها نفسها في سجلات الإدارة والتاجر.</div>
<div class="grid">${stat("طرود الجولة",list.length)}${stat("طرود منتهية",done.length)}${stat("التحصيل المسجل",money(collected))}</div>
<label>ملاحظات الجولة</label><textarea id="roundNote"></textarea>
<button class="btn success full" onclick="confirmEndRound()">تأكيد إنهاء الجولة</button>`);
};
window.confirmEndRound=async()=>{
const list=driverOrders();if(!list.length)return toast("لا توجد طرود للجولة");
const d=drivers.find(x=>x.id===selectedDriverId);
try{
const batch=writeBatch(db);
list.forEach(o=>batch.update(doc(db,"orders",o.id),{
driverArchived:true,driverArchivedAt:serverTimestamp(),
events:logEvent(o,o.status,"إغلاق الجولة وأرشفة من قائمة المندوب")
}));
const roundRef=doc(refs.rounds);
batch.set(roundRef,{
driverId:selectedDriverId,driverName:d?.name||"مندوب",
orderIds:list.map(o=>o.id),orderCount:list.length,
deliveredCount:list.filter(o=>[S.DELIVERED,S.PARTIAL].includes(o.status)).length,
collectedTotal:list.reduce((a,o)=>a+actualCollected(o),0),
note:$("roundNote").value.trim(),
startedAt:serverTimestamp(),endedAt:serverTimestamp(),
createdBy:user.uid,createdByEmail:user.email
});
await batch.commit();
await auditLog("END_DRIVER_ROUND",{roundId:roundRef.id,driverId:selectedDriverId,orderCount:list.length});
closeModal();showDriverArchive=false;page="driverArchive";toast("انتهت الجولة وتمت أرشفة طرودها عند المندوب فقط");render();
}catch(e){toast("تعذر إنهاء الجولة: "+e.message)}
};

function storeFinanceHtml(){

const cod=d.reduce((a,o)=>a+actualCollected(o),0);
const fees=d.reduce((a,o)=>a+Number(o.deliveryFee||0),0);
const net=d.reduce((a,o)=>a+merchantNet(o),0);

${stat("أجور التوصيل",money(fees))}

</div><div class="notice">هذا الكشف مبني على التحصيل الفعلي المسجل لكل شحنة فقط. الطلبات التي لم يسجل لها تحصيل فعلي لا تدخل ضمن المستحقات.</div>
<h3>تفاصيل الشحنات المسلّمة</h3>
${d.map(o=>`<div class="card"><b>${esc(o.customer)} · ${esc(o.trackingId||o.id)}</b><p>التحصيل: ${money(actualCollected(o))}</p><p>التوصيل: ${money(o.deliveryFee)}</p><p>الخصم: ${money(o.merchantDeduction)}</p><p><b>صافي المستحق: ${money(merchantNet(o))}</b></p><span class="badge ${o.settlementId?"b-done":"b-progress"}">${o.settlementId?"تمت التسوية":"بانتظار التسوية"}</span></div>`).join("")||'<div class="card empty">لا توجد شحنات مسلّمة بتحصيل فعلي</div>'}

}

/* Safe settlement: transaction marks each eligible order once */
window.createSettlement=()=>{
const eligible=deliveredOrders().filter(o=>actualCollected(o)>0&&!o.settlementId&&merchantNet(o)>0);
if(!eligible.length)return toast("لا توجد مستحقات فعلية غير مسواة");
const amount=eligible.reduce((a,o)=>a+merchantNet(o),0);
modal("تسوية مستحقات التاجر",`
<div class="notice">سيتم ضم ${eligible.length} شحنة غير مسواة فقط. سيتم تسجيل رقم التسوية على كل شحنة لمنع احتسابها مرة ثانية. تأكد من دفع المبلغ فعلياً قبل التأكيد.</div>
<div class="card"><b>المبلغ المستحق: ${money(amount)}</b></div>
<label>طريقة الدفع</label><select id="settleMethod"><option>نقداً</option><option>تحويل بنكي</option><option>محفظة إلكترونية</option></select>
<label>رقم مرجعي / ملاحظات</label><textarea id="settleNote"></textarea>
<button class="btn primary full" onclick="confirmSettlement()">تأكيد تسجيل التسوية</button>`);
};
window.confirmSettlement=async()=>{
const eligible=deliveredOrders().filter(o=>actualCollected(o)>0&&!o.settlementId&&merchantNet(o)>0);
if(!eligible.length)return toast("لا توجد طلبات متاحة للتسوية");
if(eligible.length>450)return toast("قسّم التسوية إلى دفعات أصغر");
const amount=eligible.reduce((a,o)=>a+merchantNet(o),0);
const method=$("settleMethod").value,note=$("settleNote").value.trim();
try{
await runTransaction(db,async tx=>{
const refsToRead=eligible.map(o=>doc(db,"orders",o.id));
const snaps=[];
for(const r of refsToRead)snaps.push(await tx.get(r));
const stillEligible=[];
snaps.forEach((snap,i)=>{
if(!snap.exists())return;
const data=snap.data();
if(!data.settlementId&&[S.DELIVERED,S.PARTIAL].includes(data.status)&&Number(data.collectedAmount??data.deliveredAmount??0)>0){
stillEligible.push({ref:refsToRead[i],data});
}
});
if(!stillEligible.length)throw new Error("تمت تسوية هذه الطلبات مسبقاً");
const total=stillEligible.reduce((a,x)=>a+Math.max(0,Number(x.data.collectedAmount??x.data.deliveredAmount??0)-Number(x.data.deliveryFee||0)-Number(x.data.merchantDeduction||0)),0);
const settlementRef=doc(refs.settlements);
tx.set(settlementRef,{
title:"تسوية مستحقات Randis",merchantId:stillEligible[0].data.createdBy,
merchantEmail:stillEligible[0].data.createdByEmail||"rand@randis.app",
amount:total,method,note,status:"مسجلة",
orderIds:stillEligible.map(x=>x.ref.id),
createdAt:serverTimestamp(),createdBy:user.uid,createdByEmail:user.email
});
stillEligible.forEach(x=>{
const net=Math.max(0,Number(x.data.collectedAmount??x.data.deliveredAmount??0)-Number(x.data.deliveryFee||0)-Number(x.data.merchantDeduction||0));
tx.update(x.ref,{settlementId:settlementRef.id,settledAmount:net,settledAt:serverTimestamp()});
});
});
await auditLog("MERCHANT_SETTLEMENT",{amount,method,orderCount:eligible.length});
closeModal();toast("تم تسجيل التسوية بنجاح");
}catch(e){toast("تعذر تسجيل التسوية: "+e.message)}
};

<label>ملاحظات</label><textarea id="xNote"></textarea><button class="btn primary full" onclick="saveExpense()">حفظ المصروف</button>`);

<label>ملاحظات أو رقم مرجعي</label><textarea id="tNote"></textarea><button class="btn primary full" onclick="saveTransfer()">حفظ الحركة</button>`);

window.showLedger=()=>{
const all=[...transfers.map(x=>({...x,kind:"تحويل"})),...expenses.map(x=>({...x,kind:"مصروف"}))].sort((a,b)=>dateMs(b.createdAt)-dateMs(a.createdAt));

/* Reports */
function reportsHtml(){
const d=deliveredOrders(),total=d.reduce((a,o)=>a+actualCollected(o),0),fees=d.reduce((a,o)=>a+Number(o.deliveryFee||0),0);
return `<h2>التقارير</h2><div class="grid">
${stat("عدد الشحنات",orders.length)}
${stat("نسبة التسليم",orders.length?Math.round(d.length/orders.length*100)+"%":"0%")}

${stat("المرتجعات",orders.filter(o=>o.status===S.RETURNED).length)}

</div><button class="btn primary full" onclick="exportOrders()">تصدير تقرير الشحنات CSV</button>`;

/* Blacklist */
function blacklistHtml(){return `<h2>قائمة العملاء المحظورين</h2><button class="btn primary" onclick="newBlacklist()">＋ إضافة عميل للقائمة</button>${blacklist.map(b=>`<div class="card"><b>${esc(b.name||"عميل")}</b><div class="muted">${esc(b.phone||"")}</div><p>${esc(b.reason||"")}</p></div>`).join("")||'<div class="card empty">القائمة فارغة</div>'}`}

};

/* Export */
window.exportOrders=()=>{
const list=isStore()?storeOrders():orders;
const rows=[["رقم التتبع","الاسم","الهاتف","المنطقة","قيمة COD","أجرة التوصيل","المبلغ المحصل","صافي التاجر","الحالة","المندوب","أرشيف المندوب","رقم التسوية"],
...list.map(o=>[o.trackingId||o.id,o.customer,o.phone,o.area,o.price,o.deliveryFee,actualCollected(o),merchantNet(o),o.status,o.driverName||"",o.driverArchived?"نعم":"لا",o.settlementId||""])];
const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="boxit-orders.csv";a.click();URL.revokeObjectURL(a.href);
};

/* Store pickup request */
window.requestPickup=async()=>{
const pending=storeOrders().filter(o=>o.status===S.NEW);
if(!pending.length)return toast("لا توجد شحنات جديدة");
try{
const batch=writeBatch(db);
pending.forEach(o=>batch.update(doc(db,"orders",o.id),{status:S.PICKUP,events:logEvent(o,S.PICKUP,"طلب استلام من المتجر")}));
await batch.commit();toast("تم إرسال طلبات الاستلام");
}catch(e){toast("تعذر تنفيذ العملية: "+e.message)}
};

<p class="muted">البحث الحالي يدوي. يمكن إضافة المسح بالكاميرا لاحقاً.</p>`);
window.findTracking=()=>{
const code=$("scanCode").value.trim();
const o=orders.find(x=>x.trackingId===code||x.id===code||x.barcode===code);
if(!o)return toast("لم يتم العثور على الشحنة");
closeModal();details(o.id);
};

render();
