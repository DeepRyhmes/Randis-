<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142b4a" id="themeMeta">
<title>Randis × Box It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--primary:#142b4a;--accent:#55b9e9;--soft:#eaf7fd;--bg:#f4f6fa;--text:#202938;--muted:#788395;--border:#e6eaf0;--green:#16865b;--red:#d44848;--orange:#d88a22}
body.theme-store{--primary:#741e3c;--accent:#e58aa9;--soft:#f9e7ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0002}
.brand{font-size:18px;font-weight:800;letter-spacing:.5px}
.brand span{color:var(--accent)}
.container{max-width:1100px;margin:auto;padding:14px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--soft),#fff)}
.login-card{background:#fff;width:100%;max-width:420px;padding:26px;border-radius:22px;box-shadow:0 10px 40px #0001;animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.login-logo{text-align:center;font-size:26px;font-weight:800;color:var(--primary)}
.login-logo span{color:var(--accent)}
.login-card h2{text-align:center;margin:8px 0 4px}
.role-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.role-option{padding:12px;border:2px solid var(--border);border-radius:14px;background:#fff;font-weight:700;transition:.2s}
.role-option.active{border-color:var(--accent);background:var(--soft);color:var(--primary)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:11px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.field textarea{min-height:70px}
.check{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600}
.check input{width:18px;height:18px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-accent{background:var(--soft);color:var(--primary);border:1px solid var(--accent)}
.btn-danger{background:#fdeaea;color:var(--red)}
.btn-success{background:#e4f5ed;color:var(--green)}
.btn-light{background:#edf0f5;color:var(--text)}
.btn-block{width:100%}
.btn-sm{padding:6px 10px;font-size:12px}
.nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0;position:sticky;top:56px;background:var(--bg);z-index:8;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;border:0;border-radius:11px;padding:9px 13px;background:#fff;color:var(--muted);font-weight:700;border:1px solid var(--border)}
.nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.stat{background:#fff;padding:14px;border-radius:15px;border:1px solid var(--border);border-inline-start:4px solid var(--accent)}
.stat.green{border-inline-start-color:var(--green)}.stat.red{border-inline-start-color:var(--red)}.stat.orange{border-inline-start-color:var(--orange)}
.stat .number{font-size:22px;font-weight:800;margin-top:2px}
.stat .label{font-size:12px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--border);border-radius:15px;padding:14px;margin-bottom:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 10px}
.section-title h2{font-size:18px;margin:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input,.toolbar select{padding:9px;border:1px solid var(--border);border-radius:10px;background:#fff;flex:1;min-width:120px}
.order-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:9px;animation:rise .25s ease}
.order-top{display:flex;justify-content:space-between;gap:10px}
.order-name{font-weight:800}
.order-meta{font-size:12px;color:var(--muted);margin-top:3px}
.order-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#edf0f5;white-space:nowrap}
.badge.green{background:#e2f5eb;color:#14774e}.badge.red{background:#fde8e8;color:#bd3535}.badge.orange{background:#fff1db;color:#a66b12}
.badge.blue{background:#e3f4fc;color:#176d99}.badge.pink{background:#f9e7ee;color:#8d3151}
.amounts{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{text-align:center;color:var(--muted);padding:28px}
.loading{text-align:center;color:var(--muted);padding:28px}
.loading:before{content:"";display:block;width:26px;height:26px;margin:0 auto 8px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:#101828a0;z-index:30;display:grid;place-items:center;padding:12px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:17px;animation:rise .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h3{margin:0}
.close{border:0;background:#eee;border-radius:8px;padding:4px 11px;font-size:18px}
.modal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:460px;font-size:13px}
th,td{padding:9px;border-bottom:1px solid var(--border);text-align:right}
th{background:#f7f8fa}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px}
.row span:first-child{color:var(--muted)}
.hist{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px dashed var(--border)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172b45;color:#fff;padding:11px 17px;border-radius:11px;z-index:100;max-width:92vw;text-align:center;animation:rise .25s ease}
.toast.err{background:#b83232}.toast.ok{background:#14774e}
#qrBox{display:flex;justify-content:center;padding:10px}
#reader{width:100%;max-width:400px;margin:auto}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.hbar .hl{width:92px;flex-shrink:0}
.hbar .ht{flex:1;background:#edf0f5;border-radius:8px;height:12px;overflow:hidden}
.hbar .hf{height:100%;background:var(--accent);border-radius:8px;transition:width .5s}
.vbars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px}
.vcol .vb{width:100%;max-width:34px;background:var(--accent);border-radius:7px 7px 0 0;min-height:2px;transition:height .5s}
hr{border:0;border-top:1px solid var(--border);margin:12px 0}
@media(max-width:700px){.container{padding:11px}.grid{grid-template-columns:repeat(2,1fr)}.grid.g3{grid-template-columns:repeat(2,1fr)}.stat{padding:11px}.stat .number{font-size:19px}}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
 <div class="login-card">
  <div class="login-logo">RANDIS <span>×</span> BOX IT</div>
  <p class="muted small" style="text-align:center">إدارة الطلبيات والتوصيل</p>
  <h2>تسجيل الدخول</h2>
  <div class="role-options">
   <button id="storeChoice" class="role-option active" onclick="chooseRole('store')">Randis<br><small>المتجر</small></button>
   <button id="boxChoice" class="role-option" onclick="chooseRole('box')">Box It<br><small>التوصيل</small></button>
  </div>
  <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="username"></div>
  <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
  <button id="loginBtn" class="btn btn-primary btn-block" onclick="login()">دخول</button>
  <p id="loginError" class="small" style="color:var(--red);text-align:center;min-height:18px"></p>
 </div>
</div>

<div id="app" class="hidden">
 <header>
  <div class="brand">RANDIS <span>×</span> BOX IT</div>
  <div style="text-align:left">
   <div id="userLabel" class="small">-</div>
   <button class="btn btn-light btn-sm" onclick="logout()">خروج</button>
  </div>
 </header>
 <main class="container">
  <nav class="nav" id="nav"></nav>

  <section id="dashboardPage"></section>

  <section id="ordersPage" class="hidden">
   <div class="section-title"><h2>الطلبيات</h2><button class="btn btn-primary btn-sm" onclick="openOrderForm()">+ إضافة</button></div>
   <div class="toolbar">
    <input id="searchOrders" placeholder="ابحث بالاسم أو الهاتف أو الباركود" oninput="resetLimit()">
    <select id="filterStatus" onchange="resetLimit()"><option value="all">كل الحالات</option></select>
   </div>
   <div class="toolbar">
    <input id="dateFrom" type="date" onchange="resetLimit()" title="من تاريخ">
    <input id="dateTo" type="date" onchange="resetLimit()" title="إلى تاريخ">
    <select id="sortOrders" onchange="resetLimit()">
     <option value="new">الأحدث أولاً</option><option value="old">الأقدم أولاً</option>
     <option value="price">الأعلى سعراً</option><option value="name">الاسم</option>
    </select>
   </div>
   <div class="toolbar">
    <label class="check" style="margin:0"><input type="checkbox" id="showArchived" onchange="resetLimit()"> إظهار المؤرشفة</label>
    <button class="btn btn-accent" onclick="openScanner()">📷 مسح باركود</button>
    <button class="btn btn-light" onclick="manualBarcode()">⌨️ باركود يدوي</button>
   </div>
   <div id="ordersList"></div>
  </section>

  <section id="accountingPage" class="hidden"></section>

  <section id="transfersPage" class="hidden">
   <div class="section-title"><h2>الحوالات</h2><button id="addTransferBtn" class="btn btn-primary btn-sm" onclick="openTransferForm()">+ حوالة</button></div>
   <div id="transfersList"></div>
  </section>

  <section id="driversPage" class="hidden">
   <div class="section-title"><h2>المندوبون</h2><button id="addDriverBtn" class="btn btn-primary btn-sm" onclick="openDriverForm()">+ مندوب</button></div>
   <div id="driversList"></div>
  </section>

  <section id="reportsPage" class="hidden"></section>

  <section id="historyPage" class="hidden">
   <div class="section-title"><h2>أرشيف الحسابات</h2></div>
   <div id="historyList"></div>
  </section>
 </main>
</div>

<div id="modalBg" class="modal-bg hidden" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,setDoc,doc,updateDoc,onSnapshot,serverTimestamp,runTransaction,writeBatch,arrayUnion,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase configuration (unchanged) */
const firebaseConfig = {
 apiKey:"AIzaSyDUuf6K80I7HXiT_8CChLH9B5eDpmiDalk",
 authDomain:"order-manger-848ce.firebaseapp.com",
 projectId:"order-manger-848ce",
 storageBucket:"order-manger-848ce.firebasestorage.app",
 messagingSenderId:"174411866795",
 appId:"1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};
const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);
const $=id=>document.getElementById(id);

/* ---------- Roles & permissions (edit here) ---------- */
const ROLES={"rand@randis.app":"store","bahaa@boxit.app":"box"};
const PERMS={
 store:{createOrder:1,editOrder:1,settle:1,archive:1,correct:1,transfers:0,drivers:0,statuses:["NEW","PICKUP","CANCELLED"]},
 box:{createOrder:1,editOrder:0,settle:0,archive:0,correct:0,transfers:1,drivers:1,statuses:null}
};
const can=k=>!!(PERMS[currentRole]&&PERMS[currentRole][k]);

let selectedRole="store",currentUser=null,currentRole=null;
let orders=[],transfers=[],drivers=[],histories=[];
let loaded={orders:false,transfers:false,drivers:false,history:false};
let activeScanner=null,currentPage="dashboard",unsubscribe=[],ordersLimit=40;

const statuses={NEW:"طلب جديد",PICKUP:"استلام من المتجر",RECEIVED:"تم الاستلام",SORTED:"تم الفرز",LOADED:"خرج مع المندوب",PROGRESS:"قيد التوصيل",DELIVERED:"تم التسليم",PARTIAL:"استلام جزئي",RETURNED:"راجع",DEFERRED:"تأجيل",UNREACHABLE:"لا يرد",CANCELLED:"ملغي",DAMAGED:"تالف"};
const statusClass={DELIVERED:"green",PARTIAL:"orange",RETURNED:"red",CANCELLED:"red",DAMAGED:"red",PROGRESS:"blue",LOADED:"blue",RECEIVED:"blue",SORTED:"blue",PICKUP:"blue",DEFERRED:"orange",UNREACHABLE:"orange",NEW:"pink"};
const IN_PROGRESS=["PICKUP","RECEIVED","SORTED","LOADED","PROGRESS"];
const FINAL=["DELIVERED","PARTIAL","RETURNED"];
const PAGES=[["dashboard","🏠","الرئيسية"],["orders","📦","الطلبيات"],["accounting","🧾","الحسابات"],["transfers","💸","الحوالات"],["drivers","🛵","المندوبون"],["reports","📊","التقارير"],["history","🗂️","الأرشيف"]];

/* ---------- helpers ---------- */
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const money=v=>num(v).toFixed(2);
const plain=v=>String(parseFloat(num(v).toFixed(2)));
let toastTimer;
function toast(msg,type){const t=$("toast");t.textContent=msg;t.className="toast "+(type||"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add("hidden"),3500)}
function dateValue(v){if(!v)return 0;if(typeof v.seconds==="number")return v.seconds*1000;if(v.toDate)return v.toDate().getTime();const d=new Date(v);return isNaN(d)?0:d.getTime()}
function dateText(v){const n=dateValue(v);return n?new Date(n).toLocaleDateString("ar-JO"):"-"}
function dateTimeText(v){const n=dateValue(v);return n?new Date(n).toLocaleString("ar-JO"):"-"}
function isToday(v){const n=dateValue(v);return n&&new Date(n).toDateString()===new Date().toDateString()}
const loadingHtml='<div class="loading">جارٍ التحميل...</div>';
const codeOf=o=>o.barcode||o.trackingId||o.id;

function normalizeJordanPhone(phone){
 let p=String(phone||"").replace(/\D/g,"");
 if(p.startsWith("00"))p=p.slice(2);
 if(p.startsWith("962"))p=p.slice(3).replace(/^0+/,"");
 else if(p.startsWith("0"))p=p.slice(1);
 if(p.length===9&&p.startsWith("7"))return "962"+p;
 return p?("962"+p):"";
}
function validJordanMobile(phone){return /^9627\d{8}$/.test(normalizeJordanPhone(phone))}

/* ---------- auth ---------- */
window.chooseRole=role=>{
 selectedRole=role;
 $("storeChoice").classList.toggle("active",role==="store");
 $("boxChoice").classList.toggle("active",role==="box");
 $("loginEmail").value=role==="store"?"rand@randis.app":"bahaa@boxit.app";
 applyTheme(role);
};
function applyTheme(role){
 document.body.classList.toggle("theme-store",role==="store");
 $("themeMeta").setAttribute("content",role==="store"?"#741e3c":"#142b4a");
}
function authError(code){
 return ({"auth/invalid-email":"البريد الإلكتروني غير صحيح","auth/user-not-found":"الحساب غير موجود","auth/wrong-password":"كلمة المرور غير صحيحة","auth/invalid-credential":"بيانات الدخول غير صحيحة","auth/too-many-requests":"محاولات كثيرة، حاول لاحقاً","auth/network-request-failed":"تعذر الاتصال بالإنترنت","auth/api-key-not-valid.-please-pass-a-valid-api-key.":"مفتاح Firebase API غير صالح"})[code]||("تعذر تسجيل الدخول: "+code);
}
window.login=async()=>{
 const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
 $("loginError").textContent="";
 if(!email||!password){$("loginError").textContent="أدخل البريد الإلكتروني وكلمة المرور";return}
 $("loginBtn").disabled=true;$("loginBtn").textContent="جارٍ الدخول...";
 try{await signInWithEmailAndPassword(auth,email,password)}
 catch(e){$("loginError").textContent=authError(e.code)}
 finally{$("loginBtn").disabled=false;$("loginBtn").textContent="دخول"}
};
window.logout=async()=>{await signOut(auth)};

onAuthStateChanged(auth,user=>{
 if(user){
  const role=ROLES[(user.email||"").toLowerCase()];
  if(!role){signOut(auth);$("loginError").textContent="هذا الحساب غير مصرّح له باستخدام التطبيق";return}
  currentUser=user;currentRole=role;startApp();
 }else{
  stopListeners();currentUser=null;currentRole=null;
  loaded={orders:false,transfers:false,drivers:false,history:false};
  $("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");
  applyTheme(selectedRole);
 }
});
function stopListeners(){unsubscribe.forEach(fn=>fn());unsubscribe=[]}

function startApp(){
 $("loginScreen").classList.add("hidden");$("app").classList.remove("hidden");
 applyTheme(currentRole);
 $("userLabel").textContent=currentRole==="store"?"Randis - المتجر":"Box It - التوصيل";
 $("addTransferBtn").classList.toggle("hidden",!can("transfers"));
 $("addDriverBtn").classList.toggle("hidden",!can("drivers"));
 $("nav").innerHTML=PAGES.map(([k,i,l])=>`<button data-page="${k}" onclick="showPage('${k}')">${i} ${l}</button>`).join("");
 buildStatusFilter();
 stopListeners();
 const sub=(name,key,target,sorter)=>unsubscribe.push(onSnapshot(collection(db,name),snap=>{
  target(snap.docs.map(d=>({id:d.id,...d.data()})));loaded[key]=true;render();
 },err=>toast("خطأ تحميل "+name+": "+err.message,"err")));
 sub("orders","orders",l=>{orders=l.sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt))});
 sub("transfers","transfers",l=>{transfers=l.sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt))});
 sub("drivers","drivers",l=>{drivers=l});
 sub("accounting_history","history",l=>{histories=l.sort((a,b)=>dateValue(b.createdAt)-dateValue(a.createdAt))});
 showPage("dashboard");
}

/* ---------- navigation ---------- */
window.showPage=page=>{
 currentPage=page;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 PAGES.forEach(([p])=>$(p+"Page").classList.toggle("hidden",p!==page));
 render();window.scrollTo({top:0});
};
const renderers={};
function render(){if(renderers[currentPage]&&currentUser)renderers[currentPage]()}
const currentOrders=()=>orders.filter(o=>!o.archivedFromAccounting);

/* ---------- accounting helpers ---------- */
function snap(o){
 const hasC=o.accountedCollected!==undefined&&o.accountedCollected!==null;
 const hasF=o.accountedFee!==undefined&&o.accountedFee!==null;
 const c=hasC?num(o.accountedCollected):num(o.deliveredAmount);
 const f=hasF?num(o.accountedFee):num(o.deliveryFee);
 return {collected:c,fee:f,net:c-f};
}
function accountTotals(){
 const accounted=currentOrders().filter(o=>o.accounted);
 let collected=0,fees=0;
 accounted.forEach(o=>{const s=snap(o);collected+=s.collected;fees+=s.fee});
 const trs=transfers.filter(t=>!t.archivedFromAccounting);
 const paid=trs.reduce((s,t)=>s+num(t.amount),0);
 return {accounted,transfersList:trs,collected,fees,netDue:collected-fees,paid,remaining:collected-fees-paid};
}

/* ---------- dashboard ---------- */
const statCard=(l,v,c)=>`<div class="stat ${c||""}"><div class="label">${l}</div><div class="number">${v}</div></div>`;
function hbars(items){const max=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div class="hbar"><span class="hl">${esc(i.l)}</span><div class="ht"><div class="hf" style="width:${i.v/max*100}%"></div></div><b>${i.v}</b></div>`).join("")||'<div class="empty">لا بيانات</div>'}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);out.push(d)}return out}
renderers.dashboard=()=>{
 const el=$("dashboardPage");
 if(!loaded.orders){el.innerHTML=loadingHtml;return}

/* ---------- orders list ---------- */
function orderCard(o){
 const st=o.status||"NEW";
 return `<div class="order-card">
  <div class="order-top">
   <div onclick="showOrder('${o.id}')" style="cursor:pointer">
    <div class="order-name">${o.isUrgent?"🔥 ":""}${esc(o.customer||"بدون اسم")}</div>
    <div class="order-meta">${esc(o.phone||"")} · ${esc(o.area||"")}</div>
    <div class="order-meta">الباركود: ${esc(codeOf(o))}</div>
   </div>
   <div style="text-align:left"><span class="badge ${statusClass[st]||""}">${esc(statuses[st]||st)}</span>${o.accounted?'<div class="small muted" style="margin-top:4px">✔ مسوّاة</div>':""}</div>
  </div>
  <div class="amounts"><span>قيمة الطلب: <b>${money(o.price)} د.أ</b></span><span>أجرة التوصيل: <b>${money(o.deliveryFee)} د.أ</b></span></div>

function buildStatusFilter(){$("filterStatus").innerHTML='<option value="all">كل الحالات</option>'+Object.entries(statuses).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}
window.resetLimit=()=>{ordersLimit=40;render()};
window.moreOrders=()=>{ordersLimit+=40;render()};
renderers.orders=()=>{
 if(!loaded.orders){$("ordersList").innerHTML=loadingHtml;return}
 const term=$("searchOrders").value.trim().toLowerCase(),status=$("filterStatus").value;
 const from=$("dateFrom").value?new Date($("dateFrom").value+"T00:00:00").getTime():0;
 const to=$("dateTo").value?new Date($("dateTo").value+"T23:59:59.999").getTime():Infinity;
 const arch=$("showArchived").checked,sort=$("sortOrders").value;
 let list=orders.filter(o=>{
  if(!arch&&o.archivedFromAccounting)return false;
  const txt=[o.customer,o.phone,o.area,o.barcode,o.trackingId,o.id].join(" ").toLowerCase();
  const d=dateValue(o.createdAt);
  return (!term||txt.includes(term))&&(status==="all"||o.status===status)&&(!(from||to!==Infinity)||(d>=from&&d<=to));
 });
 if(sort==="old")list.sort((a,b)=>dateValue(a.createdAt)-dateValue(b.createdAt));
 else if(sort==="price")list.sort((a,b)=>num(b.price)-num(a.price));
 else if(sort==="name")list.sort((a,b)=>String(a.customer||"").localeCompare(String(b.customer||""),"ar"));
 const shown=list.slice(0,ordersLimit);
 $("ordersList").innerHTML=`<div class="small muted" style="margin-bottom:8px">${list.length} طلبية</div>`+(shown.map(orderCard).join("")||'<div class="empty">لا توجد نتائج</div>')+(list.length>shown.length?'<button class="btn btn-light btn-block" onclick="moreOrders()">عرض المزيد</button>':"");
};

/* ---------- modal ---------- */
function openModal(title,body){
 $("modalContent").innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}`;
 $("modalBg").classList.remove("hidden");

async function stopScanner(){
 if(activeScanner){const s=activeScanner;activeScanner=null;try{await s.stop()}catch(e){}try{await s.clear()}catch(e){}}
}
window.closeModal=async()=>{await stopScanner();$("modalBg").classList.add("hidden");$("modalContent").innerHTML=""};
const driverOptions=sel=>`<option value="">غير محدد</option>`+drivers.map(d=>`<option value="${esc(d.name)}" ${d.name===sel?"selected":""}>${esc(d.name)}</option>`).join("");

/* ---------- create / edit order ---------- */
function makeBarcode(){
 let c;
 do{c="BX-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase()}
 while(orders.some(o=>o.barcode===c||o.trackingId===c));
 return c;
}
function readOrderForm(f){
 const d={customer:f.get("customer").trim(),phone:f.get("phone").trim(),area:f.get("area").trim(),price:num(f.get("price")),deliveryFee:num(f.get("deliveryFee")),notes:f.get("notes").trim(),driver:f.get("driver")||"",isUrgent:f.get("isUrgent")==="on"};
 if(d.customer.length<2)throw new Error("اسم العميل مطلوب");
 if(!validJordanMobile(d.phone))throw new Error("رقم الهاتف غير صحيح (مثال: 0791234567)");
 if(!d.area)throw new Error("المنطقة مطلوبة");
 if(d.price<0||d.deliveryFee<0)throw new Error("المبالغ لا يمكن أن تكون سالبة");
 if(d.deliveryFee>d.price&&!confirm("أجرة التوصيل أكبر من سعر المنتجات. هل تريد المتابعة؟"))throw new Error("تم الإلغاء");
 return d;
}

window.openOrderForm=()=>{
 if(!can("createOrder"))return toast("لا تملك صلاحية إضافة طلبيات","err");
 openModal("إضافة طلبية",`<form id="orderForm">${orderFormFields()}<button class="btn btn-primary btn-block" type="submit">حفظ الطلبية</button></form>`);
 $("orderForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector("button[type=submit]");
  let d;try{d=readOrderForm(new FormData(e.target))}catch(err){return toast(err.message,"err")}
  btn.disabled=true;btn.textContent="جارٍ الحفظ...";
  const barcode=makeBarcode();
  try{
   await addDoc(collection(db,"orders"),{...d,barcode,trackingId:barcode,status:"NEW",feePaid:false,accounted:false,deliveredAmount:0,returnedAmount:0,
    statusHistory:[{status:"NEW",at:Date.now(),by:currentUser.email}],createdAt:serverTimestamp(),updatedAt:serverTimestamp(),createdBy:currentUser.uid});
   await closeModal();toast("تمت إضافة الطلبية. الباركود: "+barcode,"ok");
  }catch(err){toast("تعذر الحفظ: "+err.message,"err");btn.disabled=false;btn.textContent="حفظ الطلبية"}
 };
};

window.editOrder=id=>{
 const o=orders.find(x=>x.id===id);if(!o)return;
 if(!can("editOrder"))return toast("لا تملك صلاحية تعديل الطلبيات","err");
 if(o.accounted)return toast("طلبية مسوّاة. استخدم «تصحيح حسابي» من التفاصيل","err");
 openModal("تعديل الطلبية",`<form id="editForm">${orderFormFields(o)}<button class="btn btn-primary btn-block" type="submit">حفظ التعديل</button></form>`);
 $("editForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector("button[type=submit]");
  let d;try{d=readOrderForm(new FormData(e.target))}catch(err){return toast(err.message,"err")}
  btn.disabled=true;
  try{
   await runTransaction(db,async tx=>{
    const ref=doc(db,"orders",id),s=await tx.get(ref);
    if(!s.exists())throw new Error("الطلبية غير موجودة");
    if(s.data().accounted)throw new Error("الطلبية تمت تسويتها ولا يمكن تعديلها");
    tx.update(ref,{...d,updatedAt:serverTimestamp()});
   });
   await closeModal();toast("تم تعديل الطلبية","ok");
  }catch(err){toast(err.message,"err");btn.disabled=false}
 };
};

/* ---------- status ---------- */
function allowedStatuses(){return PERMS[currentRole].statuses||Object.keys(statuses)}
function canChangeStatus(o){return !o.accounted&&(PERMS[currentRole].statuses===null||allowedStatuses().includes(o.status||"NEW"))}
window.changeStatus=async id=>{
 const o=orders.find(x=>x.id===id);if(!o)return;
 if(o.accounted)return toast("هذه الطلبية تمت تسويتها ولا يمكن تغييرها","err");
 if(!canChangeStatus(o))return toast("لا تملك صلاحية تغيير حالة هذه الطلبية","err");
 await stopScanner();
 const opts=allowedStatuses().slice();if(!opts.includes(o.status))opts.push(o.status);
 openModal("تغيير حالة الطلبية",`
 <p class="muted small">${esc(o.customer)} · ${esc(codeOf(o))} · قيمة الطلب ${money(o.price)} د.أ</p>
 <div class="field"><label>الحالة الجديدة</label><select id="newStatus" onchange="statusPrefill('${id}')">${opts.map(k=>`<option value="${k}" ${o.status===k?"selected":""}>${statuses[k]}</option>`).join("")}</select></div>
 <div class="two-col">
  <div class="field"><label>المبلغ المحصّل من العميل</label><input id="collectedAmount" type="number" step="0.01" min="0" value="${num(o.deliveredAmount)}"></div>
  <div class="field"><label>المبلغ المرجّع</label><input id="returnedAmount" type="number" step="0.01" min="0" value="${num(o.returnedAmount)}"></div>
 </div>
 ${can("drivers")||currentRole==="box"?`<div class="field"><label>المندوب</label><select id="statusDriver">${driverOptions(o.driver)}</select></div>`:""}
 <p class="small muted">عند اختيار «تم التسليم» أو «راجع» أو «جزئي» تُعبَّأ المبالغ تلقائياً ويمكنك تعديلها.</p>
 <button class="btn btn-primary btn-block" onclick="saveStatus('${id}')">حفظ الحالة</button>`);
};
window.statusPrefill=id=>{
 const o=orders.find(x=>x.id===id),s=$("newStatus").value,p=num(o.price);
 if(s==="DELIVERED"){$("collectedAmount").value=p;$("returnedAmount").value=0}
 else if(s==="RETURNED"){$("collectedAmount").value=0;$("returnedAmount").value=p}
 else if(s==="PARTIAL"){const c=num($("collectedAmount").value);$("returnedAmount").value=Math.max(0,+(p-c).toFixed(2))}
};
window.saveStatus=async id=>{
 const o=orders.find(x=>x.id===id);if(!o)return;
 const status=$("newStatus").value,collected=num($("collectedAmount").value),returned=num($("returnedAmount").value);
 const driver=$("statusDriver")?$("statusDriver").value:(o.driver||"");
 if(collected<0||returned<0)return toast("المبالغ لا يمكن أن تكون سالبة","err");
 if(collected>num(o.price)&&!confirm("المبلغ المحصّل أكبر من قيمة الطلب. متابعة؟"))return;
 if(status==="DELIVERED"&&collected===0&&!confirm("الحالة «تم التسليم» والمبلغ المحصّل 0. متابعة؟"))return;
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,"orders",id),s=await tx.get(ref);
   if(!s.exists())throw new Error("الطلبية غير موجودة");
   if(s.data().accounted)throw new Error("الطلبية تمت تسويتها ولا يمكن تعديلها");
   tx.update(ref,{status,deliveredAmount:collected,returnedAmount:returned,driver,updatedAt:serverTimestamp(),
    statusHistory:arrayUnion({status,at:Date.now(),by:currentUser.email,collected,returned})});
  });
  await closeModal();toast("تم تحديث حالة الطلبية","ok");
 }catch(err){toast(err.message,"err")}
};

/* ---------- scanner ---------- */
function findByCode(code){
 const c=String(code||"").trim().toUpperCase();if(!c)return null;
 return orders.find(o=>String(o.barcode||"").toUpperCase()===c||String(o.trackingId||"").toUpperCase()===c||o.id===String(code).trim());
}
window.openScanner=async()=>{
 await stopScanner();
 openModal("مسح باركود الشحنة",`<div id="reader"></div><p id="scannerMessage" class="small muted" style="text-align:center">وجّه الكاميرا نحو الباركود</p><button class="btn btn-light btn-block" onclick="manualBarcode()">إدخال الباركود يدوياً</button>`);
 try{
  if(!window.isSecureContext)throw {name:"Insecure"};
  if(!window.Html5Qrcode)throw {name:"NoLib"};
  activeScanner=new Html5Qrcode("reader");
  await activeScanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},async text=>{
   const found=findByCode(text);
   if(!found){const m=$("scannerMessage");if(m)m.textContent="لم يتم العثور على الطلبية: "+text;return}
   await stopScanner();showOrder(found.id);
  });
 }catch(err){
  activeScanner=null;
  const msg={NotAllowedError:"تم رفض إذن الكاميرا. فعّله من إعدادات المتصفح ثم أعد المحاولة.",NotFoundError:"لا توجد كاميرا متاحة على هذا الجهاز.",NotReadableError:"الكاميرا مستخدمة من تطبيق آخر.",Insecure:"الكاميرا تتطلب اتصال HTTPS.",NoLib:"تعذر تحميل مكتبة الكاميرا (تحقق من الإنترنت)."}[err&&err.name]||"تعذر تشغيل الكاميرا. استخدم الإدخال اليدوي.";
  const m=$("scannerMessage");if(m)m.textContent=msg;
 }
};
window.manualBarcode=async()=>{
 await stopScanner();
 openModal("البحث عن شحنة",`<div class="field"><label>أدخل الباركود أو رقم التتبع أو رقم الطلبية</label><input id="manualCode" placeholder="BX-..." onkeydown="if(event.key==='Enter')findBarcode()"></div><button class="btn btn-primary btn-block" onclick="findBarcode()">بحث</button>`);
 setTimeout(()=>{const i=$("manualCode");if(i)i.focus()},100);
};
window.findBarcode=()=>{
 const code=$("manualCode").value.trim();
 if(!code)return toast("أدخل رقم الباركود","err");
 const found=findByCode(code);
 if(!found)return toast("لم يتم العثور على الطلبية","err");
 showOrder(found.id);
};

/* ---------- WhatsApp ---------- */
window.openWhatsApp=id=>{
 const o=orders.find(x=>x.id===id);if(!o)return;
 const phone=normalizeJordanPhone(o.phone);
 if(!phone)return toast("رقم الهاتف غير موجود","err");
 const message=`مرحباً ${o.customer||""} 🌸

window.accountOrder=async id=>{
 if(!can("settle"))return toast("لا تملك صلاحية اعتماد التسوية","err");
 const o=orders.find(x=>x.id===id);
 if(!o||o.accounted)return toast("تم اعتماد هذه الطلبية مسبقاً","err");
 if(!FINAL.includes(o.status))return toast("لا يمكن اعتماد هذه الحالة","err");
 const c=num(o.deliveredAmount),f=num(o.deliveryFee);
 if(!confirm(`اعتماد حساب ${o.customer}\nالمحصّل: ${money(c)}\nأجرة التوصيل: ${money(f)}\nالصافي للمتجر: ${money(c-f)} د.أ\n\nبعد الاعتماد لا يمكن تعديل الطلبية إلا بتصحيح حسابي صريح.`))return;
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,"orders",id),s=await tx.get(ref);
   if(!s.exists())throw new Error("الطلبية غير موجودة");
   const d=s.data();
   if(d.accounted)throw new Error("تم اعتماد الطلبية مسبقاً");
   if(!FINAL.includes(d.status))throw new Error("حالة الطلبية لا تسمح بالتسوية");
   const cc=num(d.deliveredAmount),ff=num(d.deliveryFee);
   tx.update(ref,{accounted:true,accountedCollected:cc,accountedFee:ff,accountedNet:cc-ff,accountedStatus:d.status,accountedAt:serverTimestamp(),accountedBy:currentUser.email,updatedAt:serverTimestamp()});
  });
  toast("تم اعتماد الطلبية","ok");
 }catch(err){toast(err.message,"err")}
};

window.correctOrder=async id=>{
 const o=orders.find(x=>x.id===id);if(!o)return;
 if(!can("correct"))return toast("لا تملك صلاحية التصحيح","err");
 if(o.archivedFromAccounting)return toast("الطلبية مؤرشفة ولا يمكن تصحيحها","err");
 await stopScanner();

 <div class="field"><label>سبب التصحيح (إلزامي)</label><textarea id="corrReason"></textarea></div>
 <button class="btn btn-danger btn-block" onclick="saveCorrection('${id}')">تأكيد التصحيح</button>`);
};
window.saveCorrection=async id=>{
 const reason=$("corrReason").value.trim();
 if(reason.length<3)return toast("اكتب سبب التصحيح","err");
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,"orders",id),s=await tx.get(ref);
   if(!s.exists())throw new Error("الطلبية غير موجودة");
   const d=s.data();
   if(!d.accounted)throw new Error("الطلبية غير مسوّاة");
   if(d.archivedFromAccounting)throw new Error("الطلبية مؤرشفة");
   const sn=snap(d);
   tx.update(ref,{accounted:false,accountedCollected:deleteField(),accountedFee:deleteField(),accountedNet:deleteField(),accountedStatus:deleteField(),accountedAt:deleteField(),accountedBy:deleteField(),
    accountingCorrections:arrayUnion({at:Date.now(),by:currentUser.email,reason,collected:sn.collected,fee:sn.fee}),updatedAt:serverTimestamp()});
  });
  await closeModal();toast("تم فتح الطلبية للتصحيح","ok");
 }catch(err){toast(err.message,"err")}
};

function driverStats(name){
 const L=orders.filter(o=>o.driver===name);
 const d=L.filter(o=>o.status==="DELIVERED").length,r=L.filter(o=>o.status==="RETURNED").length,p=L.filter(o=>o.status==="PARTIAL").length;
 const done=d+r+p;
 return {total:L.length,delivered:d,returned:r,partial:p,active:L.filter(o=>IN_PROGRESS.includes(o.status)).length,rate:done?Math.round((d+p)/done*100):0};
}

window.exportCSV=()=>{
 const cols=["id","customer","phone","area","price","deliveryFee","status","barcode","trackingId","driver","deliveredAmount","returnedAmount","accounted","archivedFromAccounting","notes","createdAt"];
 const cell=(c,o)=>{let v=c==="id"?o.id:(c==="createdAt"?(o.createdAt?new Date(dateValue(o.createdAt)).toISOString():""):o[c]);v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const rows=[cols.join(",")].concat(orders.map(o=>cols.map(c=>cell(c,o)).join(",")));
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"}));
 a.download="orders-"+new Date().toISOString().slice(0,10)+".csv";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

/* ---------- archive (chunked, resumable) ---------- */
window.archiveAccounting=async()=>{
 if(!can("archive"))return toast("لا تملك صلاحية الأرشفة","err");
 const pend=histories.find(h=>h.archiveStatus==="pending");
 let histRef,histId,ordIds,trIds;
 try{
  if(pend){
   if(!confirm("توجد دورة أرشفة غير مكتملة. هل تريد إكمالها؟"))return;
   histId=pend.id;histRef=doc(db,"accounting_history",histId);
   ordIds=(pend.orderIds||[]).filter(id=>{const o=orders.find(x=>x.id===id);return o&&!o.archivedFromAccounting});
   trIds=(pend.transferIds||[]).filter(id=>{const t=transfers.find(x=>x.id===id);return t&&!t.archivedFromAccounting});
  }else{
   const t=accountTotals();
   const toArch=t.accounted.filter(o=>FINAL.includes(o.status));
   if(!toArch.length&&!t.transfersList.length)return toast("لا توجد بيانات لإغلاق الدورة","err");
   const skipped=t.accounted.length-toArch.length;
   if(!confirm(`إغلاق الدورة الحالية؟\nالطلبيات: ${toArch.length}\nالحوالات: ${t.transfersList.length}\nالمستحق: ${money(t.netDue)} | الحوالات: ${money(t.paid)} | المتبقي: ${money(t.remaining)} د.أ\n${t.remaining!==0?"\n⚠️ المتبقي لا يُرحَّل تلقائياً للدورة الجديدة.\n":""}${skipped?`\n(${skipped} طلبية بحالة غير نهائية لن تُؤرشف)\n`:""}\nلن يُحذف أي سجل.`))return;
   const toArchSet=toArch;
   let collected=0,fees=0;toArchSet.forEach(o=>{const s=snap(o);collected+=s.collected;fees+=s.fee});
   const paid=t.paid;
   histRef=doc(collection(db,"accounting_history"));histId=histRef.id;
   ordIds=toArchSet.map(o=>o.id);trIds=t.transfersList.map(x=>x.id);
   const rec={collected,fees,transfers:paid,netDue:collected-fees,net:collected-fees-paid,ordersCount:ordIds.length,transfersCount:trIds.length,
    orderIds:ordIds,transferIds:trIds,archiveStatus:"pending",createdAt:serverTimestamp(),createdBy:currentUser.uid};
   if(ordIds.length<=1500){
    rec.ordersSnapshot=toArchSet.map(o=>{const s=snap(o);return {id:o.id,barcode:codeOf(o),customer:o.customer||"",status:o.accountedStatus||o.status||"",price:num(o.price),collected:s.collected,fee:s.fee,net:s.net}});
    rec.transfersSnapshot=t.transfersList.map(x=>({id:x.id,amount:num(x.amount),notes:x.notes||""}));
   }
   await setDoc(histRef,rec);
  }
  const ops=[...ordIds.map(id=>["orders",id]),...trIds.map(id=>["transfers",id])];
  for(let i=0;i<ops.length;i+=450){
   const b=writeBatch(db);
   ops.slice(i,i+450).forEach(([c,id])=>b.update(doc(db,c,id),{archivedFromAccounting:true,archiveId:histId}));
   await b.commit();
  }
  const fb=writeBatch(db);
  fb.update(histRef,{archiveStatus:"complete",completedAt:serverTimestamp()});
  fb.set(doc(db,"accounting","current"),{lastArchiveId:histId,updatedAt:serverTimestamp()},{merge:true});
  await fb.commit();
  toast("تم إغلاق دورة الحسابات بنجاح","ok");
 }catch(err){toast("تعذرت الأرشفة (يمكن إكمالها لاحقاً): "+err.message,"err")}
};

<!--
=====================================================================
قواعد Firestore (ما بتشتغل داخل الصفحة)
انسخ اللي بين الخطين والصقه بـ Firebase Console > Firestore > Rules
وجرّبه بـ Rules Playground قبل النشر
=====================================================================

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signed(){ return request.auth != null && request.auth.token.email != null; }
    function isRand(){ return signed() && request.auth.token.email == 'rand@randis.app'; }
    function isBahaa(){ return signed() && request.auth.token.email == 'bahaa@boxit.app'; }
    function staff(){ return isRand() || isBahaa(); }

    match /orders/{id} {
      allow read, create: if staff();
      allow update: if isRand() || (isBahaa() &&
        !request.resource.data.diff(resource.data).affectedKeys().hasAny([
          'price','deliveryFee','customer','phone','area','barcode','trackingId',
          'accounted','accountedCollected','accountedFee','accountedNet','accountedStatus',
          'accountedAt','accountedBy','archivedFromAccounting','archiveId','accountingCorrections']));
      allow delete: if false;
    }
    match /transfers/{id} {
      allow read: if staff();
      allow create: if isBahaa();
      allow update: if isRand();
      allow delete: if false;
    }
    match /drivers/{id} {
      allow read: if staff();
      allow create, update: if isBahaa();
      allow delete: if false;
    }
    match /accounting_history/{id} {
      allow read: if staff();
      allow create, update: if isRand();
      allow delete: if false;
    }
    match /accounting/{id} {
      allow read: if staff();
      allow write: if isRand();
    }
  }
}
=====================================================================
-->
