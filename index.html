<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12295a" id="themeMeta">
<title>Randis × Box It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--side-a:#13306a;--side-b:#0b1c42;--accent:#2f80ed;--accent2:#55b9e9;--dark:#12295a;--soft:#e8f2fe;--bg:#f2f6fb;--card:#fff;--text:#16233b;--muted:#7a879c;--border:#e6ebf3;--green:#12a150;--green-s:#e3f6ec;--red:#d9363e;--red-s:#fdeaea;--orange:#e08a1a;--orange-s:#fff1dc;--blue-s:#e3effd;--gray-s:#eceff4;--shadow:0 2px 14px rgba(20,40,90,.06)}
body.theme-store{--side-a:#7d1239;--side-b:#4a0922;--accent:#c2185b;--accent2:#ec6c9a;--dark:#7d1239;--soft:#fde8ef;--bg:#fcf5f7;--border:#f1e3e8;--blue-s:#e3effd;--shadow:0 2px 14px rgba(125,18,57,.07)}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.xs{font-size:11px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(150deg,var(--soft),#fff 55%,var(--soft))}
.login-card{background:#fff;width:100%;max-width:420px;padding:30px;border-radius:24px;box-shadow:0 20px 60px rgba(20,40,90,.12);animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lg-logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:26px;font-weight:800;color:var(--dark)}
.lg-logo svg{width:40px;height:40px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.tab2{padding:12px;border:2px solid var(--border);border-radius:14px;background:#fff;font-weight:700;text-align:center}
.tab2.active{border-color:var(--accent);background:var(--soft);color:var(--dark)}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea,.fi{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus,.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.field textarea{min-height:76px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:12px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:#fff}
.theme-store .btn-p{background:linear-gradient(135deg,#d6275f,#a81448)}
.btn-d{background:var(--dark);color:#fff}
.btn-o{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn-r{background:var(--red-s);color:var(--red)}
.btn-g{background:var(--green-s);color:var(--green)}
.btn-l{background:#eef1f6;color:var(--text)}
.btn-b{width:100%}.btn-sm{padding:7px 11px;font-size:12px;border-radius:9px}.btn-lg{padding:15px 22px;font-size:17px}

/* shell */
#sidebar{position:fixed;top:0;bottom:0;right:0;width:250px;background:linear-gradient(180deg,var(--side-a),var(--side-b));color:#fff;display:flex;flex-direction:column;z-index:40;overflow-y:auto;transition:transform .25s}
.sb-logo{display:flex;align-items:center;gap:10px;padding:22px 18px 14px}
.sb-logo .cube svg{width:44px;height:44px}
.sb-bt{font-size:24px;font-weight:800;line-height:1.1}
.sb-rt{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;line-height:1}
.sb-sub{font-size:12px;opacity:.8}
.sb-flower{font-size:34px}
.sb-user{margin:4px 14px 12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0}
.sb-user small{display:block;opacity:.75;font-size:11px;direction:ltr;text-align:right}
.nvs{padding:6px 12px;display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#fff;opacity:.88;font-weight:600;width:100%;text-align:right}
.nv:hover{background:rgba(255,255,255,.08)}
.nv.active{background:var(--accent);opacity:1}
.theme-store .nv.active{background:linear-gradient(135deg,#e5527d,#b81c55)}
.nv-badge{margin-right:auto;background:#fff;color:var(--accent);font-size:11px;font-weight:800;border-radius:12px;padding:1px 8px}
.sb-foot{margin-top:auto;padding:14px}
.sb-card{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;font-size:13px}
.sb-card button{margin-top:8px;width:100%;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:6px;font-size:12px}
.sb-art{margin-top:auto;min-height:210px;background:radial-gradient(circle at 50% 80%,rgba(255,170,200,.55),transparent 65%);display:grid;place-items:center;text-align:center;padding:10px}
.sb-art .bag{font-size:84px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.sb-art i{font-family:Georgia,serif;opacity:.9}
.main{margin-right:250px;min-height:100vh;padding-bottom:20px}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--card);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--border)}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;background:var(--bg);place-items:center}
.gs{flex:1;max-width:520px;position:relative}
.gs input{width:100%;padding:10px 40px 10px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);outline:none}
.gs svg{position:absolute;right:12px;top:11px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:12px;font-size:13px;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;background:var(--bg);color:var(--text);position:relative}
.ib.wa{background:var(--green-s);color:var(--green)}
.ib .dot{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:0 5px}
#view{padding:18px 22px 40px;max-width:1500px}
#sbBack{display:none;position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:35}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.ph h2{margin:0;font-size:22px;font-weight:800}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* cards */
.gr{display:grid;gap:14px;margin-bottom:14px}
.g6{grid-template-columns:repeat(6,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.row2{grid-template-columns:1fr 1.5fr}.row21{grid-template-columns:1fr 2fr}.row3{grid-template-columns:1fr 1fr 1fr}
.ltr-order{direction:ltr}.ltr-order>*{direction:rtl}
.pn{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.pn h3{margin:0 0 12px;font-size:16px;font-weight:800}
.pn-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.pn-h h3{margin:0}
.link{color:var(--accent);font-size:13px;font-weight:700}
.sc{--t:#e3effd;--tc:#2f80ed;--tb:#d7e6fb;border-radius:18px;padding:16px;background:linear-gradient(160deg,var(--t),#fff 75%);border:1px solid var(--tb);box-shadow:var(--shadow)}
.theme-store .sc{background:#fff;border:1px solid var(--border)}
.sc-ic{width:42px;height:42px;border-radius:50%;background:var(--t);color:var(--tc);display:grid;place-items:center;margin-bottom:8px}
.theme-store .sc-ic{background:var(--t)}
.sc-l{font-weight:700;color:var(--tc);font-size:14px}
.sc-v{font-size:28px;font-weight:800;line-height:1.2;color:var(--text)}
.sc-s{font-size:12px;color:var(--muted)}
.c-blue{--t:#e3effd;--tc:#2f80ed;--tb:#d7e6fb}.c-green{--t:#e3f6ec;--tc:#12a150;--tb:#cdeedc}.c-orange{--t:#fff1dc;--tc:#d9811a;--tb:#fbe2bd}.c-purple{--t:#f6e8f8;--tc:#9b3fa6;--tb:#ebd0f0}.c-navy{--t:#dfe6f5;--tc:#12295a;--tb:#cdd8ee}.c-red{--t:#fdeaea;--tc:#d9363e;--tb:#f8d3d4}.c-pink{--t:#fde8ef;--tc:#c2185b;--tb:#f6d0de}
.fin{background:#fde5ec;border-radius:18px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fin-i{display:flex;align-items:center;gap:10px}
.fin-i .sc-ic{background:#fff;color:var(--accent);margin:0;flex-shrink:0}
.fin-i small{display:block;color:var(--muted);font-size:12px}.fin-i b{font-size:22px}
.banner{background:linear-gradient(120deg,#dcecff,#c5dcfb);border-radius:18px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:300px;flex:1;max-width:620px;border:1px solid #cfe0f7}
.banner h3{margin:0;color:var(--dark);font-size:20px}.banner p{margin:2px 0 0;color:#4a5f86;font-size:13px}.banner .art{font-size:54px}
.hello{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.hello h2{margin:0;font-size:24px;font-weight:800}.hello p{margin:2px 0 0;color:var(--muted)}
.chart{width:100%;height:auto;direction:ltr}.ax{font-size:11px;fill:#8a96aa}
.donut-w{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.donut{width:180px;height:180px;flex-shrink:0}.dn{font-size:30px;font-weight:800;fill:var(--text)}.dl{font-size:11px;fill:#8a96aa}
.lg{flex:1;min-width:160px}.lg-r{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--border)}
.lg-r i{width:10px;height:10px;border-radius:50%;flex-shrink:0}.lg-r b{margin-right:auto}
.act{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.act-i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--soft);color:var(--accent)}
.act-i.g{background:var(--green-s);color:var(--green)}.act-i.r{background:var(--red-s);color:var(--red)}.act-i.o{background:var(--orange-s);color:var(--orange)}
.act time{margin-right:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.drv{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.drv .av{background:var(--soft);color:var(--accent)}
.drv small{display:block;color:var(--muted);font-size:11px}.drv .bd{margin-right:auto}
.qa{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.qa b{font-size:15px}.qa small{color:var(--muted)}.qa .ic{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.mini{display:flex;align-items:center;gap:12px}.mini .sc-ic{margin:0}.mini small{display:block;color:var(--muted);font-size:12px}.mini b{font-size:22px}
.bd{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-green{background:#cfeedb;color:#0e7a3d}.b-blue{background:#dbe9fd;color:#1c63c9}.b-pink{background:#fdd9e6;color:#b01553}.b-orange{background:#ffe5c2;color:#b86a0c}.b-red{background:#fbd5d5;color:#b32c33}.b-gray{background:#e4e8ef;color:#5a6679}.b-purple{background:#f0d9f4;color:#862f91}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.tbl th{background:var(--bg);color:var(--muted);font-weight:700;padding:10px;text-align:right;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);text-align:right;vertical-align:middle}
.tbl tr:hover td{background:#fafbfd}.tbl input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.acts-c{white-space:nowrap}.acts-c .ib{margin-left:4px}
.only-m{display:none}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.filters .fi{flex:1;min-width:130px;width:auto}
.cnt{margin:0 0 8px;font-weight:700}
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--accent);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.ocard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.ocard .top{display:flex;justify-content:space-between;gap:10px}
.ocard .nm{font-weight:800;font-size:16px}
.ocard .am{display:flex;gap:14px;flex-wrap:wrap;background:var(--bg);padding:8px 12px;border-radius:10px;margin:10px 0;font-size:13px}
.ocard .ac{display:flex;gap:8px;flex-wrap:wrap}
.empty,.loading{text-align:center;color:var(--muted);padding:34px;font-weight:600}
.loading:before{content:"";display:block;width:28px;height:28px;margin:0 auto 10px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px}.row span:first-child{color:var(--muted)}
.hist{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px dashed var(--border)}
.warn{background:var(--red-s);color:var(--red);padding:12px;border-radius:12px;font-weight:700;margin-bottom:10px}
.dellist{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:4px 12px;margin-bottom:10px}
.cust{cursor:pointer}
.bc{text-align:center;max-width:520px;margin:20px auto}.bc-ic{width:84px;height:84px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 10px}
.or{margin:14px 0;color:var(--muted)}.mi{display:flex;gap:8px}.mi .fi{flex:1}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:12px}
.modal{background:#fff;border-radius:20px;width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:20px;animation:rise .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:18px}.close{width:34px;height:34px;border-radius:9px;background:var(--bg);font-size:20px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#qrBox{display:flex;justify-content:center;padding:12px;background:var(--bg);border-radius:12px;margin:10px 0}
#reader{width:100%;max-width:400px;margin:auto;border-radius:12px;overflow:hidden}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;z-index:100;max-width:92vw;text-align:center;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}

/* driver */
body.is-driver #sidebar,body.is-driver .menu-btn,body.is-driver .gs{display:none}
body.is-driver .main{margin-right:0;padding-bottom:84px}
body.is-driver #view{padding:14px;max-width:720px;margin:auto}
#bnav{display:none;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--border);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
body.is-driver #bnav{display:grid;grid-template-columns:repeat(4,1fr)}
.bn-i{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted)}
.bn-i.active{color:var(--accent);background:var(--soft)}
.dcard{background:#fff;border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.dc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.dc-name{font-size:19px;font-weight:800}
.dc-amt{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:700}.dc-amt b{font-size:24px;color:var(--dark)}
.dc-note{background:var(--orange-s);border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.dc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.dbtn{border-radius:14px;padding:14px 8px;font-weight:800;font-size:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px}
.dbtn.call{background:var(--blue-s);color:#1c63c9}.dbtn.wa{background:var(--green-s);color:var(--green)}.dbtn.dt{background:var(--bg)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dgrid .dbtn.ok{background:var(--green);color:#fff;grid-column:1/-1;font-size:17px;min-height:58px}
.dgrid .dbtn.pr{background:var(--blue-s);color:#1c63c9}.dgrid .dbtn.pa{background:var(--orange-s);color:var(--orange)}.dgrid .dbtn.rt{background:var(--red-s);color:var(--red)}.dgrid .dbtn.df{background:var(--gray-s);color:#4a5568}
.big{padding:15px;font-size:17px}

@media(max-width:1100px){.g6,.g5{grid-template-columns:repeat(3,1fr)}.row3{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
 #sidebar{transform:translateX(100%)}#sidebar.open{transform:none}#sbBack.open{display:block}
 .main{margin-right:0}.menu-btn{display:grid}.topbar{padding:10px 12px}.chip.date{display:none}
 #view{padding:12px 12px 40px}.row2,.row21,.row3{grid-template-columns:1fr}
 .only-d{display:none}.only-m{display:block}
}
@media(max-width:640px){.g6,.g5,.g3{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.fin{grid-template-columns:1fr}.sc-v{font-size:24px}.banner{min-width:0;max-width:none}}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
 <div class="login-card">
  <div class="lg-logo"><svg viewBox="0 0 48 48"><polygon points="24,4 42,14 24,24 6,14" fill="#7cc4f5"/><polygon points="6,14 24,24 24,44 6,34" fill="#2f80ed"/><polygon points="42,14 24,24 24,44 42,34" fill="#1b5cc2"/></svg><span>Randis × Box It</span></div>
  <p class="muted small" style="text-align:center;margin:6px 0 0">نظام إدارة الطلبيات والتوصيل</p>
  <div class="tabs2">
   <button id="tabStore" class="tab2 active" onclick="chooseTab('store')">Randis<br><small class="muted">المتجر</small></button>
   <button id="tabBox" class="tab2" onclick="chooseTab('box')">Box It<br><small class="muted">التوصيل</small></button>
  </div>
  <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="username" dir="ltr"></div>
  <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" dir="ltr" onkeydown="if(event.key==='Enter')login()"></div>
  <button id="loginBtn" class="btn btn-p btn-b big" onclick="login()">تسجيل الدخول</button>

function snap(o){

 const c=hasC?num(o.accountedCollected):num(o.deliveredAmount);

}

 const paid=trs.reduce((s,t)=>s+num(t.amount),0);
 return{accounted,transfersList:trs,collected,fees,netDue:collected-fees,paid,remaining:collected-fees-paid};
}

 currentOrders().filter(o=>FINAL.includes(o.status)).forEach(o=>{const s=snap(o);collected+=s.collected;fees+=s.fee});

/* ---------- charts ---------- */
let gid=0;
function lineChart(labels,series){
 const W=640,H=230,pl=36,pr=12,pt=12,pb=30,n=labels.length;
 const top=Math.max(4,Math.ceil(Math.max(0,...series.flatMap(s=>s.data))/4)*4);
 const X=i=>pl+(n<2?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));
 const Y=v=>pt+(H-pt-pb)*(1-v/top);
 let g="";
 for(let k=0;k<=4;k++){const v=top*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e9edf4"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${v}</text>`}
 const step=Math.ceil(n/8);
 labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="ax">${esc(l)}</text>`});
 series.forEach(s=>{
  const id="lg"+(++gid),pts=s.data.map((v,i)=>[X(i),Y(v)]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const mx=(pts[i-1][0]+pts[i][0])/2;d+=` C${mx},${pts[i-1][1]} ${mx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`}
  const area=d+` L${pts[n-1][0]},${H-pb} L${pts[0][0]},${H-pb} Z`;
  g+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".28"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${s.c}" stroke-width="2"/>`).join("");
 });
 return`<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>`;
}

}

 }));

 try{
  if(!window.isSecureContext)throw{name:"Insecure"};
  if(!window.Html5Qrcode)throw{name:"NoLib"};
  activeScanner=new Html5Qrcode("reader");
  await activeScanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},async text=>{
   const found=findByCode(text);
   if(!found){const m=$("scannerMessage");if(m)m.textContent=isDriver()?"الشحنة غير موجودة أو غير مسندة إليك: "+text:"لم يتم العثور على الطلبية: "+text;return}

 }catch(err){

 }
}

/* ---------- status updates ---------- */
async function writeStatus(id,{status,collected,returned,reason,extra}){
 await runTransaction(db,async tx=>{
  const ref=doc(db,"orders",id),s=await tx.get(ref);
  if(!s.exists())throw new Error("الطلبية غير موجودة");
  if(s.data().accounted)throw new Error("الطلبية تمت تسويتها ولا يمكن تعديلها");
  const entry={status,at:Date.now(),by:user.email,collected,returned};if(reason)entry.reason=reason;
  tx.update(ref,{status,deliveredAmount:collected,returnedAmount:returned,statusReason:reason||"",...(extra||{}),updatedAt:serverTimestamp(),statusHistory:arrayUnion(entry)});
 });
}
async function changeStatus(id){
 const o=orders.find(x=>x.id===id);if(!o)return;
 if(!perm.adminStatus(o))return toast("لا يمكن تغيير حالة هذه الطلبية","err");
 await stopScanner();
 openModal("تغيير حالة الطلبية",`<p class="muted small">${esc(o.customer)} · #${esc(codeOf(o))} · قيمة الطلب ${money(o.price)} د.أ</p>
 <div class="field"><label>الحالة الجديدة</label><select id="nsStatus" onchange="statusPrefill('${id}')">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${o.status===k?"selected":""}>${v}</option>`).join("")}</select></div>
 <div class="two-col"><div class="field"><label>المبلغ المحصّل</label><input id="nsCol" type="number" step="0.01" min="0" value="${num(o.deliveredAmount)}"></div><div class="field"><label>المبلغ المرجّع</label><input id="nsRet" type="number" step="0.01" min="0" value="${num(o.returnedAmount)}"></div></div>
 <div class="field"><label>المندوب</label><select id="nsDriver" data-orig="${curDriverDoc(o)?curDriverDoc(o).id:""}">${driverOptions(o)}</select></div>
 <div class="field"><label>سبب / ملاحظة (إرجاع، تأجيل...)</label><textarea id="nsReason">${esc(o.statusReason||"")}</textarea></div>
 <button class="btn btn-p btn-b big" onclick="saveStatus('${id}')">حفظ الحالة</button>`);
}
function statusPrefill(id){
 const o=orders.find(x=>x.id===id),s=$("nsStatus").value,p=num(o.price);
 if(s==="DELIVERED"){$("nsCol").value=p;$("nsRet").value=0}
 else if(s==="RETURNED"){$("nsCol").value=0;$("nsRet").value=p}
 else if(s==="PARTIAL"){$("nsRet").value=Math.max(0,+(p-num($("nsCol").value)).toFixed(2))}
}
async function saveStatus(id){
 const o=orders.find(x=>x.id===id);if(!o)return;
 const status=$("nsStatus").value,collected=num($("nsCol").value),returned=num($("nsRet").value),reason=$("nsReason").value.trim();
 if(collected<0||returned<0)return toast("المبالغ لا يمكن أن تكون سالبة","err");
 if(collected>num(o.price)&&!confirm("المبلغ المحصّل أكبر من قيمة الطلب. متابعة؟"))return;
 if(status==="DELIVERED"&&collected===0&&!confirm("الحالة «تم التسليم» والمبلغ المحصّل 0. متابعة؟"))return;
 const sel=$("nsDriver").value,extra=sel!==$("nsDriver").dataset.orig?driverFields(sel):undefined;
 try{await writeStatus(id,{status,collected,returned,reason,extra});await closeModal();toast("تم تحديث حالة الطلبية","ok")}catch(e){toast(e.message,"err")}
}
const amtField=(l,v)=>`<div class="field"><label>${l}</label><input id="drAmt" type="number" step="0.01" min="0" value="${v}" inputmode="decimal" style="font-size:20px"></div>`;
const reasonField=(l,req)=>`<div class="field"><label>${l}${req?" (إلزامي)":""}</label><textarea id="drReason"></textarea></div>`;
function driverAction(id,st){
 const o=orders.find(x=>x.id===id);if(!o)return;
 if(!perm.driverAct(o))return toast("لا يمكن تغيير حالة هذه الشحنة","err");
 if(st==="PROGRESS"){
  if(!confirm("بدء توصيل هذه الشحنة؟"))return;
  writeStatus(id,{status:"PROGRESS",collected:num(o.deliveredAmount),returned:num(o.returnedAmount),reason:""}).then(()=>{closeModal();toast("تم تحديث الحالة","ok")}).catch(e=>toast(e.message,"err"));return;
 }
 const price=num(o.price);let body=`<p class="muted">${esc(o.customer)} · المطلوب ${money(price)} د.أ</p>`;
 if(st==="DELIVERED")body+=amtField("المبلغ المحصّل (د.أ)",price);
 if(st==="PARTIAL")body+=amtField("المبلغ المحصّل (د.أ)","")+reasonField("ماذا تم تسليمه وماذا أُرجع؟",true);
 if(st==="RETURNED")body+=reasonField("سبب الإرجاع",true);
 if(st==="DEFERRED")body+=reasonField("سبب التأجيل / الموعد الجديد",true);
 if(st==="UNREACHABLE")body+=reasonField("ملاحظة",false);
 openModal(statuses[st],body+`<button class="btn btn-p btn-b big" onclick="saveDriverAction('${id}','${st}')">تأكيد</button>`);
}
async function saveDriverAction(id,st){
 const o=orders.find(x=>x.id===id);if(!o)return;
 const price=num(o.price),amt=$("drAmt")?num($("drAmt").value):0,reason=$("drReason")?$("drReason").value.trim():"";
 let collected=0,returned=0;
 if(st==="DELIVERED"){collected=amt;if(amt<0)return toast("مبلغ غير صحيح","err");if(amt===0&&!confirm("المبلغ المحصّل 0. متابعة؟"))return}
 if(st==="PARTIAL"){if(!(amt>0&&amt<price))return toast("المبلغ الجزئي يجب أن يكون أكبر من صفر وأقل من قيمة الطلب","err");collected=amt;returned=+(price-amt).toFixed(2)}
 if(st==="RETURNED"){returned=price}
 if(["PARTIAL","RETURNED","DEFERRED"].includes(st)&&reason.length<2)return toast("اكتب السبب","err");
 try{await writeStatus(id,{status:st,collected,returned,reason});await closeModal();toast("تم تسجيل الحالة","ok")}catch(e){toast(e.message,"err")}
}
function cancelOrder(id){
 const o=orders.find(x=>x.id===id);if(!o||!perm.cancel(o))return;
 openModal("إلغاء الطلبية",`<p class="muted">${esc(o.customer)} · #${esc(codeOf(o))}</p><div class="field"><label>سبب الإلغاء</label><textarea id="cnReason"></textarea></div><button class="btn btn-r btn-b big" onclick="saveCancel('${id}')">تأكيد الإلغاء</button>`);

async function saveCancel(id){
 const reason=$("cnReason").value.trim();if(reason.length<2)return toast("اكتب سبب الإلغاء","err");
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,"orders",id),s=await tx.get(ref);
   if(!s.exists())throw new Error("الطلبية غير موجودة");

   tx.update(ref,{status:"CANCELLED",statusReason:reason,statusHistory:arrayUnion({status:"CANCELLED",at:Date.now(),by:user.email,reason}),updatedAt:serverTimestamp()});
  });
  await closeModal();toast("تم إلغاء الطلبية","ok");
 }catch(e){toast(e.message,"err")}
}

function askDelete(ids){
 if(!isAdmin())return toast("الحذف النهائي لإدارة Box It فقط","err");
 const L=[...ids].map(id=>orders.find(o=>o.id===id)).filter(Boolean),ok=L.filter(o=>!o.accounted),bad=L.filter(o=>o.accounted);

 delIds=ok.map(o=>o.id);

async function confirmDelete(){
 const targets=delIds.map(id=>orders.find(o=>o.id===id)).filter(o=>o&&!o.accounted);
 if(!targets.length)return toast("لا توجد طلبيات قابلة للحذف","err");
 let done=0;
 try{
  for(let i=0;i<targets.length;i+=200){
   const b=writeBatch(db);
   targets.slice(i,i+200).forEach(o=>{
    b.set(doc(collection(db,"deletion_log")),{orderId:o.id,barcode:codeOf(o),customer:o.customer||"",phone:o.phone||"",area:o.area||"",price:num(o.price),deliveryFee:num(o.deliveryFee),status:o.status||"",deliveredAmount:num(o.deliveredAmount),hadAccountingCorrections:!!(o.accountingCorrections&&o.accountingCorrections.length),deletedAt:serverTimestamp(),deletedBy:user.email});
    b.delete(doc(db,"orders",o.id));
   });
   await b.commit();done+=Math.min(200,targets.length-i);
  }
  selected.clear();await closeModal();toast(`تم حذف ${done} طلبية نهائياً`,"ok");
 }catch(e){toast(`تم حذف ${done} فقط. الخطأ: ${e.message}`,"err")}
}

function dashBox(){
 const S=stats(),fin=cycleFinance(),days=lastDays(7);
 const data=days.map(d=>weekFilter==="all"?S.L.filter(o=>sameDay(dateValue(o.createdAt),d)).length:S.L.filter(o=>o.status===weekFilter&&sameDay(weekFilter==="DELIVERED"?deliveredAt(o):dateValue(o.updatedAt),d)).length);
 const labels=days.map(d=>d.toLocaleDateString(LOC,{weekday:"short"}));
 const segs=[{l:"مسلّمة",v:S.delivered+S.partial,c:"#12a150"},{l:"قيد التوصيل",v:S.transit,c:"#f5a524"},{l:"بانتظار الاستلام",v:S.new+S.pickup,c:"#2f80ed"},{l:"مرتجعة",v:S.returned,c:"#9b3fa6"},{l:"أخرى",v:S.other,c:"#9aa5b8"}];

async function accountOrder(id){
 if(!isAdmin())return toast("اعتماد التسوية لإدارة Box It فقط","err");
 const o=orders.find(x=>x.id===id);if(!o||o.accounted)return toast("تم اعتماد هذه الطلبية مسبقاً","err");
 if(!FINAL.includes(o.status))return toast("لا يمكن اعتماد هذه الحالة","err");
 const c=num(o.deliveredAmount),f=num(o.deliveryFee);
 if(!confirm(`اعتماد حساب ${o.customer}\nالمحصّل: ${money(c)}\nأجرة التوصيل: ${money(f)}\nالصافي للمتجر: ${money(c-f)} د.أ\n\nبعد الاعتماد لا يمكن تعديل الطلبية إلا بتصحيح حسابي صريح.`))return;
 try{
  await runTransaction(db,async tx=>{
   const ref=doc(db,"orders",id),s=await tx.get(ref);
   if(!s.exists())throw new Error("الطلبية غير موجودة");
   const d=s.data();
   if(d.accounted)throw new Error("تم اعتماد الطلبية مسبقاً");
   if(!FINAL.includes(d.status))throw new Error("حالة الطلبية لا تسمح بالتسوية");
   const cc=num(d.deliveredAmount),ff=num(d.deliveryFee);
   tx.update(ref,{accounted:true,accountedCollected:cc,accountedFee:ff,accountedNet:cc-ff,accountedStatus:d.status,accountedAt:serverTimestamp(),accountedBy:user.email,updatedAt:serverTimestamp()});
  });
  toast("تم اعتماد الطلبية","ok");
 }catch(e){toast(e.message,"err")}
}

}
async function saveCorrection(id){

  });

 }catch(e){toast(e.message,"err")}
}

async function archiveAccounting(){
 if(!isAdmin())return toast("الأرشفة لإدارة Box It فقط","err");
 const pend=histories.find(h=>h.archiveStatus==="pending");let histRef,histId,ordIds,trIds;
 try{
  if(pend){
   if(!confirm("توجد دورة أرشفة غير مكتملة. هل تريد إكمالها؟"))return;
   histId=pend.id;histRef=doc(db,"accounting_history",histId);
   ordIds=(pend.orderIds||[]).filter(id=>{const o=orders.find(x=>x.id===id);return o&&!o.archivedFromAccounting});
   trIds=(pend.transferIds||[]).filter(id=>{const t=transfers.find(x=>x.id===id);return t&&!t.archivedFromAccounting});
  }else{
   const t=accountTotals(),toArch=t.accounted.filter(o=>FINAL.includes(o.status));
   if(!toArch.length&&!t.transfersList.length)return toast("لا توجد بيانات لإغلاق الدورة","err");
   const skipped=t.accounted.length-toArch.length;
   let collected=0,fees=0;toArch.forEach(o=>{const s=snap(o);collected+=s.collected;fees+=s.fee});
   const paid=t.paid;
   if(!confirm(`إغلاق الدورة الحالية؟\nالطلبيات: ${toArch.length}\nالحوالات: ${t.transfersList.length}\nالمستحق: ${money(collected-fees)} | الحوالات: ${money(paid)} | المتبقي: ${money(collected-fees-paid)} د.أ\n${collected-fees-paid!==0?"\n⚠️ المتبقي لا يُرحَّل تلقائياً للدورة الجديدة.\n":""}${skipped?`\n(${skipped} طلبية بحالة غير نهائية لن تُؤرشف)\n`:""}\nلن يُحذف أي سجل.`))return;
   histRef=doc(collection(db,"accounting_history"));histId=histRef.id;
   ordIds=toArch.map(o=>o.id);trIds=t.transfersList.map(x=>x.id);
   const rec={collected,fees,transfers:paid,netDue:collected-fees,net:collected-fees-paid,ordersCount:ordIds.length,transfersCount:trIds.length,orderIds:ordIds,transferIds:trIds,archiveStatus:"pending",createdAt:serverTimestamp(),createdBy:user.uid};
   if(ordIds.length<=1500){
    rec.ordersSnapshot=toArch.map(o=>{const s=snap(o);return{id:o.id,barcode:codeOf(o),customer:o.customer||"",status:o.accountedStatus||o.status||"",price:num(o.price),collected:s.collected,fee:s.fee,net:s.net}});
    rec.transfersSnapshot=t.transfersList.map(x=>({id:x.id,amount:num(x.amount),notes:x.notes||""}));
   }
   await setDoc(histRef,rec);
  }
  const ops=[...ordIds.map(id=>["orders",id]),...trIds.map(id=>["transfers",id])];
  for(let i=0;i<ops.length;i+=450){const b=writeBatch(db);ops.slice(i,i+450).forEach(([c,id])=>b.update(doc(db,c,id),{archivedFromAccounting:true,archiveId:histId}));await b.commit()}
  const fb=writeBatch(db);
  fb.update(histRef,{archiveStatus:"complete",completedAt:serverTimestamp()});
  fb.set(doc(db,"accounting","current"),{lastArchiveId:histId,updatedAt:serverTimestamp()},{merge:true});
  await fb.commit();toast("تم إغلاق دورة الحسابات بنجاح","ok");
 }catch(e){toast("تعذرت الأرشفة (يمكن إكمالها لاحقاً): "+e.message,"err")}
}
