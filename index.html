
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randis × Box It</title>
<meta name="theme-color" content="#172c48">
<style>
:root{--navy:#172c48;--blue:#2796d2;--pink:#d85d86;--burgundy:#70243e;--bg:#f4f6fa;--white:#fff;--text:#202b3c;--muted:#788397;--green:#16865c;--red:#c94d56;--orange:#c98228}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Tahoma,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
header{background:var(--navy);color:white;padding:16px}
header.store{background:var(--burgundy)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:21px;font-weight:800}
.brand small{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:4px}
.container{max-width:850px;margin:auto;padding:16px 13px 100px}
.muted{color:var(--muted);font-size:12px}
h2{font-size:19px;margin:20px 0 12px}
h3{font-size:16px;margin:0}
.btn{padding:12px 14px;border-radius:12px;font-weight:700;background:#e9edf3;color:var(--navy)}
.primary{background:var(--blue);color:white}
.store .primary{background:var(--pink)}
.dark{background:var(--navy);color:white}
.danger{background:#ffebed;color:var(--red)}
.success{background:#e5f5ed;color:var(--green)}
.outline{background:transparent;border:1px solid #dce2eb;color:inherit}
.small{padding:8px 10px;font-size:12px}
.full{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:white;border-radius:16px;padding:15px;box-shadow:0 2px 12px #172c480a;margin-bottom:12px}
.stat .number{font-size:24px;font-weight:800;margin-top:8px}
.stat .label{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions button{flex:1;min-width:105px}
.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 12px}
.tab{white-space:nowrap;border-radius:30px;padding:9px 13px;background:white;color:#536174;font-size:12px}
.tab.active{background:var(--navy);color:white}
.store .tab.active{background:var(--burgundy)}
input,select,textarea{width:100%;padding:12px;border:1px solid #dce2eb;border-radius:10px;background:white;margin:5px 0 12px;outline:none}
label{font-size:12px;font-weight:700;display:block}
textarea{min-height:75px;resize:vertical}
.order{border-right:4px solid var(--blue)}
.store .order{border-right-color:var(--pink)}
.order-top{display:flex;justify-content:space-between;gap:8px}
.order-name{font-weight:800}
.badge{font-size:11px;padding:6px 9px;border-radius:20px;background:#e9edf3;white-space:nowrap}
.b-new{background:#e5f1ff;color:#2872b6}
.b-progress{background:#fff2da;color:#a36a14}
.b-done{background:#e1f5e9;color:#16865c}
.b-return{background:#ffe8e8;color:#bd414b}
.b-delay{background:#f1eaff;color:#7954ae}
.b-cancel{background:#eee;color:#777}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e4e8ef;padding:10px;display:flex;gap:7px;justify-content:center;z-index:5}
.bottom button{flex:1;max-width:180px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:#10182799;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.modal{background:white;width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.login{max-width:420px;margin:12vh auto;padding:20px}
.login .card{padding:24px}
.toast{position:fixed;bottom:80px;left:15px;right:15px;max-width:400px;margin:auto;background:#172c48;color:white;padding:13px;border-radius:12px;text-align:center;z-index:20}
.line{height:1px;background:#edf0f4;margin:12px 0}
.timeline{border-right:2px solid #dce4ed;padding-right:14px;margin:15px 4px}
.event{position:relative;margin-bottom:16px;font-size:13px}
.event:before{content:"";position:absolute;right:-20px;top:3px;width:9px;height:9px;background:var(--blue);border-radius:50%}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal-bg{align-items:center}.modal{border-radius:20px}}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="card">
    <div class="brand" style="color:#172c48">Randis <small style="color:#788397">STORE × BOX IT DELIVERY</small></div>
    <h2>تسجيل الدخول</h2>
    <label>الحساب</label>
    <select id="account">
      <option value="rand">Randis – المتجر</option>
      <option value="bahaa">Box It – التوصيل</option>
    </select>
    <label>كلمة المرور</label>
    <input id="password" type="password" placeholder="كلمة المرور">
    <button class="btn primary full" id="loginBtn">تسجيل الدخول</button>
    <p id="loginError" class="muted"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header id="header">
    <div class="head">
      <div class="brand" id="brandName">Box It</div>
      <button class="btn outline small" id="logoutBtn">خروج</button>
    </div>
    <div id="roleInfo" class="muted" style="color:#ffffffb5;margin-top:8px"></div>
  </header>

  <main class="container">
    <div id="modeSwitch" class="actions hidden">
      <button class="btn dark" id="adminMode">وضع الإدارة</button>
      <button class="btn" id="driverMode">وضع السائق</button>
    </div>

    <div id="dashboard"></div>

    <div id="mainActions" class="actions"></div>

    <h2 id="listHeading">الطلبات</h2>
    <input id="search" placeholder="ابحث بالاسم أو الهاتف أو المنطقة أو رقم الشحنة">
    <div class="tabs" id="filters"></div>
    <div id="ordersList"></div>
  </main>

  <nav class="bottom">
    <button class="btn" data-page="home">⌂ الرئيسية</button>
    <button class="btn" data-page="orders">▤ الشحنات</button>
    <button class="btn primary" id="bottomAdd">＋ إضافة</button>
    <button class="btn" data-page="account">▣ الحساب</button>
  </nav>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,collection,addDoc,doc,updateDoc,onSnapshot,
 serverTimestamp,query,orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* إعدادات Firebase الحالية — لا تغيّرها */
const firebaseConfig={
 apiKey:"AIzaSyDUuf6K80I7HXiT_8CChLH9B5eDpmiDalk",
 authDomain:"order-manger-848ce.firebaseapp.com",
 projectId:"order-manger-848ce",
 storageBucket:"order-manger-848ce.firebasestorage.app",
 messagingSenderId:"174411866795",
 appId:"1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const fb=initializeApp(firebaseConfig);
const auth=getAuth(fb);
const db=getFirestore(fb);
const ordersRef=collection(db,"orders");

const accounts={
 rand:{email:"rand@randis.app",role:"store",name:"Randis"},
 bahaa:{email:"bahaa@boxit.app",role:"admin",name:"Box It"}
};

const S={
 NEW:"طلب جديد",
 PICKUP:"طلب استلام",
 RECEIVED:"تم الاستلام",
 SORTED:"تم الفرز",
 LOADED:"تم التحميل",
 PROGRESS:"قيد التوصيل",
 DELIVERED:"تم التسليم",
 PARTIAL:"استلام جزئي",
 RETURNED:"مرتجع",
 DEFERRED:"مؤجل",
 UNREACHABLE:"تعذر الوصول",
 CANCELLED:"ملغي",
 DAMAGED:"تالف"
};

let user=null;
let role="";
let mode="admin";
let orders=[];
let activeFilter="all";
let unsubscribe=null;
let selectedOrder=null;

const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toFixed(2)+" د.أ";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function toast(msg){
 $("toastHost").innerHTML=`<div class="toast">${esc(msg)}</div>`;
 setTimeout(()=>$("toastHost").innerHTML="",2800);
}

function statusClass(s){
 if([S.DELIVERED,S.PARTIAL].includes(s))return "b-done";
 if([S.RETURNED,S.DAMAGED].includes(s))return "b-return";
 if(s===S.DEFERRED)return "b-delay";
 if(s===S.NEW||s===S.PICKUP||s===S.RECEIVED)return "b-new";
 if(s===S.CANCELLED)return "b-cancel";
 return "b-progress";
}

function showLogin(){
 $("loginScreen").classList.remove("hidden");
 $("app").classList.add("hidden");
}

function showApp(){
 $("loginScreen").classList.add("hidden");
 $("app").classList.remove("hidden");
}

$("loginBtn").onclick=async()=>{
 const key=$("account").value;
 const password=$("password").value;
 $("loginError").textContent="";
 try{
  await signInWithEmailAndPassword(auth,accounts[key].email,password);
 }catch(e){
  $("loginError").textContent="تعذر تسجيل الدخول. تأكد من كلمة المرور.";
 }
};

$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 if(!u){
  if(unsubscribe)unsubscribe();
  user=null;
  showLogin();
  return;
 }
 user=u;
 const account=Object.values(accounts).find(a=>a.email===u.email);
 if(!account){
  await signOut(auth);
  return;
 }
 role=account.role;
 mode=role==="store"?"store":"admin";
 showApp();
 startOrders();
});

function startOrders(){
 if(unsubscribe)unsubscribe();
 const q=query(ordersRef,orderBy("createdAt","desc"));
 unsubscribe=onSnapshot(q,snap=>{
  orders=snap.docs.map(d=>({id:d.id,...d.data()}));
  render();
 },err=>{
  toast("تعذر تحميل البيانات: "+err.message);
 });
}

function isStore(){return role==="store"}
function isDriver(){return role==="admin"&&mode==="driver"}

function render(){
 const store=isStore();
 $("header").className=store?"store":"";
 $("brandName").innerHTML=store?
 "Randis <small>إدارة المتجر والشحنات</small>":
 "Box It <small>إدارة التوصيل والعمليات</small>";
 $("roleInfo").textContent=store?"حساب المتجر":"حساب شركة التوصيل";
 $("modeSwitch").classList.toggle("hidden",store);
 $("adminMode").className=mode==="admin"?"btn primary":"btn";
 $("driverMode").className=mode==="driver"?"btn primary":"btn";

 renderDashboard();
 renderActions();
 renderFilters();
 renderOrders();
}

$("adminMode").onclick=()=>{mode="admin";render()};
$("driverMode").onclick=()=>{mode="driver";render()};

function stat(label,value){
 return `<div class="card stat"><div class="label">${label}</div><div class="number">${value}</div></div>`;
}

function renderDashboard(){
 const delivered=orders.filter(o=>o.status===S.DELIVERED||o.status===S.PARTIAL);
 const returned=orders.filter(o=>o.status===S.RETURNED);
 const active=orders.filter(o=>![S.DELIVERED,S.PARTIAL,S.RETURNED,S.CANCELLED].includes(o.status));

 if(isStore()){
  $("dashboard").innerHTML=`
   <h2>لوحة Randis</h2>
   <div class="grid">
    ${stat("إجمالي الشحنات",orders.length)}
    ${stat("الشحنات الحالية",active.length)}
    ${stat("تم التسليم",delivered.length)}
    ${stat("المرتجعات",returned.length)}
    ${stat("قيمة الشحنات المسلّمة",money(delivered.reduce((a,o)=>a+Number(o.deliveredAmount??o.price??0),0)))}
    ${stat("طلبات الاستلام",orders.filter(o=>o.status===S.PICKUP).length)}
   </div>`;
 }else if(isDriver()){
  $("dashboard").innerHTML=`
   <h2>وضع السائق</h2>
   <div class="grid">
    ${stat("الشحنات الحالية",active.length)}
    ${stat("جاهزة للتوصيل",orders.filter(o=>[S.LOADED,S.PROGRESS].includes(o.status)).length)}
    ${stat("تم التسليم",delivered.length)}
    ${stat("المرتجعات",returned.length)}
   </div>`;
 }else{
  $("dashboard").innerHTML=`
   <h2>لوحة عمليات Box It</h2>
   <div class="grid">
    ${stat("إجمالي الشحنات",orders.length)}
    ${stat("طلبات جديدة",orders.filter(o=>o.status===S.NEW).length)}
    ${stat("طلبات الاستلام",orders.filter(o=>o.status===S.PICKUP).length)}
    ${stat("قيد التوصيل",orders.filter(o=>o.status===S.PROGRESS).length)}
    ${stat("تم التسليم",delivered.length)}
    ${stat("المرتجعات",returned.length)}
   </div>`;
 }
}

function renderActions(){
 let html="";
 if(isStore()){
  html=`
   <button class="btn primary" onclick="newOrder()">＋ إضافة شحنة</button>
   <button class="btn" onclick="requestPickup()">🚚 طلب استلام</button>
   <button class="btn" onclick="showStatement()">▤ كشف الحساب</button>`;
 }else if(isDriver()){
  html=`
   <button class="btn primary" onclick="scanHelp()">▦ مسح باركود</button>
   <button class="btn" onclick="setFilter('loaded')">الشحنات المحمّلة</button>
   <button class="btn" onclick="setFilter('progress')">قيد التوصيل</button>`;
 }else{
  html=`
   <button class="btn primary" onclick="newOrder()">＋ تسجيل شحنة</button>
   <button class="btn" onclick="setFilter('pickup')">طلبات الاستلام</button>
   <button class="btn" onclick="scanHelp()">▦ مسح باركود</button>
   <button class="btn" onclick="showStatement()">▤ الحسابات</button>`;
 }
 $("mainActions").innerHTML=html;
}

function renderFilters(){
 let tabs=isStore()?[
  ["all","الكل"],["active","الحالية"],["delivered","تم التسليم"],["returned","المرتجعات"],["pickup","طلبات الاستلام"]
 ]:isDriver()?[
  ["all","الكل"],["loaded","المحمّلة"],["progress","قيد التوصيل"],["delivered","تم التسليم"],["returned","المرتجعات"]
 ]:[
  ["all","الكل"],["new","جديدة"],["pickup","استلام"],["received","مستلمة"],["loaded","محمّلة"],["progress","قيد التوصيل"],["delivered","تم التسليم"],["returned","مرتجعات"]
 ];
 $("filters").innerHTML=tabs.map(([k,t])=>
 `<button class="tab ${activeFilter===k?"active":""}" onclick="setFilter('${k}')">${t}</button>`
 ).join("");
}

window.setFilter=k=>{
 activeFilter=k;
 renderFilters();
 renderOrders();
};

function filteredOrders(){
 let list=[...orders];
 if(activeFilter==="active")list=list.filter(o=>![S.DELIVERED,S.PARTIAL,S.RETURNED,S.CANCELLED].includes(o.status));
 if(activeFilter==="new")list=list.filter(o=>o.status===S.NEW);
 if(activeFilter==="pickup")list=list.filter(o=>o.status===S.PICKUP);
 if(activeFilter==="received")list=list.filter(o=>o.status===S.RECEIVED);
 if(activeFilter==="loaded")list=list.filter(o=>o.status===S.LOADED);
 if(activeFilter==="progress")list=list.filter(o=>o.status===S.PROGRESS);
 if(activeFilter==="delivered")list=list.filter(o=>[S.DELIVERED,S.PARTIAL].includes(o.status));
 if(activeFilter==="returned")list=list.filter(o=>o.status===S.RETURNED);
 const term=$("search").value.trim().toLowerCase();
 if(term)list=list.filter(o=>
  [o.customer,o.phone,o.area,o.trackingId,o.id].some(x=>String(x||"").toLowerCase().includes(term))
 );
 return list;
}

function renderOrders(){
 const list=filteredOrders();
 $("listHeading").textContent=isStore()?"شحنات Randis":isDriver()?"شحنات السائق":"إدارة الشحنات";
 if(!list.length){
  $("ordersList").innerHTML=`<div class="card empty">ما في شحنات بهذا القسم حالياً</div>`;
  return;
 }
 $("ordersList").innerHTML=list.map(o=>`
  <div class="card order">
   <div class="order-top">
    <div>
     <div class="order-name">${esc(o.customer||"بدون اسم")}</div>
     <div class="muted">${esc(o.area||"")} · ${esc(o.phone||"")}</div>
    </div>
    <span class="badge ${statusClass(o.status)}">${esc(o.status||S.NEW)}</span>
   </div>
   <div class="line"></div>
   <div class="muted">رقم الشحنة: ${esc(o.trackingId||o.id.slice(0,8))}</div>
   <div style="margin-top:7px;font-weight:bold">${money(o.price)}</div>
   <div class="actions">
    <button class="btn small" onclick="details('${o.id}')">التفاصيل</button>
    ${!isStore()?`<button class="btn primary small" onclick="changeStatus('${o.id}')">تحديث الحالة</button>`:""}
   </div>
  </div>`).join("");
}
$("search").addEventListener("input",renderOrders);

function modal(title,body){
 $("modalHost").innerHTML=`
 <div class="modal-bg" id="modalBg">
  <div class="modal">
   <div class="modal-head"><h3>${title}</h3><button class="btn small" onclick="closeModal()">إغلاق ✕</button></div>
   ${body}
  </div>
 </div>`;
 $("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal()};
}
window.closeModal=()=>{$("modalHost").innerHTML=""};

window.newOrder=()=>{
 modal("إضافة شحنة",`
  <label>اسم العميل</label><input id="fCustomer" placeholder="اسم المستلم">
  <label>رقم الهاتف</label><input id="fPhone" inputmode="tel" placeholder="07xxxxxxxx">
  <label>المنطقة</label><input id="fArea" placeholder="المنطقة / الحي">
  <label>قيمة الشحنة</label><input id="fPrice" type="number" step=".01">
  <label>أجرة التوصيل</label><input id="fFee" type="number" step=".01" value="2">
  <label>ملاحظات</label><textarea id="fNotes"></textarea>
  <label><input id="fUrgent" type="checkbox" style="width:auto"> شحنة مستعجلة</label>
  <button class="btn primary full" id="saveOrder">حفظ الشحنة</button>
 `);
 $("saveOrder").onclick=saveOrder;
};

async function saveOrder(){
 const customer=$("fCustomer").value.trim();
 const phone=$("fPhone").value.trim();
 const area=$("fArea").value.trim();
 const price=Number($("fPrice").value);
 const deliveryFee=Number($("fFee").value||0);
 if(!customer||!phone||!area||!Number.isFinite(price)){
  toast("عبّي الاسم والهاتف والمنطقة والسعر");
  return;
 }
 try{
  await addDoc(ordersRef,{
   customer,phone,area,price,deliveryFee,
   notes:$("fNotes").value.trim(),
   isUrgent:$("fUrgent").checked,
   status:isStore()?S.NEW:S.RECEIVED,
   feePaid:false,
   accounted:false,
   createdBy:user.uid,
   createdAt:serverTimestamp(),
   events:[{
    status:isStore()?S.NEW:S.RECEIVED,
    note:"إنشاء الشحنة",
    by:user.email,
    at:new Date().toISOString()
   }]
  });
  closeModal();
  toast("تم حفظ الشحنة");
 }catch(e){toast("تعذر الحفظ: "+e.message)}
}

window.details=id=>{
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 selectedOrder=o;
 const events=Array.isArray(o.events)?o.events:[];
 modal("تفاصيل الشحنة",`
  <div class="card">
   <h3>${esc(o.customer||"")}</h3>
   <p>${esc(o.phone||"")}</p>
   <p>${esc(o.area||"")}</p>
   <p>رقم الشحنة: ${esc(o.trackingId||o.id)}</p>
   <p>قيمة الشحنة: <b>${money(o.price)}</b></p>
   <p>أجرة التوصيل: ${money(o.deliveryFee)}</p>
   <p>الحالة: <b>${esc(o.status||"")}</b></p>
   <p>الملاحظات: ${esc(o.notes||"لا يوجد")}</p>
  </div>
  <div class="actions">
   <a class="btn success" href="tel:${encodeURIComponent(o.phone||"")}">اتصال</a>
   <a class="btn" target="_blank" href="https://wa.me/${String(o.phone||"").replace(/\D/g,"")}">واتساب</a>
  </div>
  <h3 style="margin-top:20px">سجل حركة الشحنة</h3>
  <div class="timeline">
   ${events.length?events.map(e=>`
    <div class="event"><b>${esc(e.status||"تحديث")}</b>
    <div class="muted">${esc(e.note||"")}</div>
    <div class="muted">${esc(e.by||"")} · ${esc(e.at||"")}</div></div>
   `).join(""):`<div class="muted">لا يوجد سجل حركة سابق.</div>`}
  </div>
  ${isStore()&&o.status===S.NEW?`<button class="btn full" onclick="editOrder('${o.id}')">تعديل الشحنة</button>`:""}
 `);
};

window.editOrder=id=>{
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 modal("تعديل الشحنة",`
  <label>اسم العميل</label><input id="eCustomer" value="${esc(o.customer)}">
  <label>الهاتف</label><input id="ePhone" value="${esc(o.phone)}">
  <label>المنطقة</label><input id="eArea" value="${esc(o.area)}">
  <label>السعر</label><input id="ePrice" type="number" value="${Number(o.price||0)}">
  <label>ملاحظات</label><textarea id="eNotes">${esc(o.notes||"")}</textarea>
  <button class="btn primary full" onclick="saveEdit('${o.id}')">حفظ التعديلات</button>
 `);
};

window.saveEdit=async id=>{
 try{
  await updateDoc(doc(db,"orders",id),{
   customer:$("eCustomer").value.trim(),
   phone:$("ePhone").value.trim(),
   area:$("eArea").value.trim(),
   price:Number($("ePrice").value),
   notes:$("eNotes").value.trim()
  });
  closeModal();toast("تم تعديل الشحنة");
 }catch(e){toast("تعذر التعديل: "+e.message)}
};

window.changeStatus=id=>{
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 const choices=isDriver()
 ?[S.PROGRESS,S.DELIVERED,S.PARTIAL,S.RETURNED,S.DEFERRED,S.UNREACHABLE,S.DAMAGED]
 :[S.PICKUP,S.RECEIVED,S.SORTED,S.LOADED,S.PROGRESS,S.DELIVERED,S.PARTIAL,S.RETURNED,S.DEFERRED,S.UNREACHABLE,S.CANCELLED,S.DAMAGED];

 modal("تحديث حالة الشحنة",`
  <label>الحالة الجديدة</label>
  <select id="newStatus">${choices.map(s=>`<option>${s}</option>`).join("")}</select>
  <label>مبلغ تم تحصيله</label><input id="collected" type="number" step=".01" value="${Number(o.deliveredAmount||0)}">
  <label>ملاحظات التحديث</label><textarea id="statusNote" placeholder="اكتب ملاحظة إن وجدت"></textarea>
  <button class="btn primary full" onclick="saveStatus('${id}')">تأكيد تحديث الحالة</button>
 `);
};

window.saveStatus=async id=>{
 const o=orders.find(x=>x.id===id);
 const status=$("newStatus").value;
 const note=$("statusNote").value.trim();
 const amount=Number($("collected").value||0);
 const events=Array.isArray(o.events)?[...o.events]:[];
 events.push({
  status,note,by:user.email,at:new Date().toISOString()
 });
 const changes={status,notes:note||o.notes||"",events};
 if(status===S.DELIVERED||status===S.PARTIAL)changes.deliveredAmount=amount;
 if(status===S.RETURNED)changes.returnedAmount=Number(o.price||0);
 try{
  await updateDoc(doc(db,"orders",id),changes);
  closeModal();toast("تم تحديث حالة الشحنة");
 }catch(e){toast("تعذر التحديث: "+e.message)}
};

window.requestPickup=async()=>{
 const pending=orders.filter(o=>o.status===S.NEW);
 if(!pending.length){toast("ما في شحنات جديدة لطلب استلامها");return}
 modal("طلب استلام الشحنات",`
  <p>عدد الشحنات الجديدة: <b>${pending.length}</b></p>
  <p class="muted">سيتم إرسال طلب الاستلام لشركة Box It عند التأكيد.</p>
  <button class="btn primary full" id="confirmPickup">تأكيد طلب الاستلام</button>
 `);
 $("confirmPickup").onclick=async()=>{
  try{
   for(const o of pending){
    const events=Array.isArray(o.events)?[...o.events]:[];
    events.push({status:S.PICKUP,note:"طلب استلام من المتجر",by:user.email,at:new Date().toISOString()});
    await updateDoc(doc(db,"orders",o.id),{status:S.PICKUP,events});
   }
   closeModal();toast("تم إرسال طلب الاستلام");
  }catch(e){toast("تعذر إرسال الطلب: "+e.message)}
 };
};

window.showStatement=()=>{
 const delivered=orders.filter(o=>[S.DELIVERED,S.PARTIAL].includes(o.status));
 const total=delivered.reduce((a,o)=>a+Number(o.deliveredAmount??o.price??0),0);
 const fees=delivered.reduce((a,o)=>a+Number(o.deliveryFee||0),0);
 modal("كشف حساب الشحنات",`
  <div class="grid">
   ${stat("عدد الشحنات المسلّمة",delivered.length)}
   ${stat("إجمالي المبالغ المحصلة",money(total))}
   ${stat("إجمالي أجور التوصيل",money(fees))}
  </div>
  <p class="muted">هذا ملخص تشغيلي مبدئي، وليس كشف تسوية نهائي. لا يتم اعتماد دفعات مالية أو خصومات من هذا الملخص.</p>
 `);
};

window.scanHelp=()=>{
 modal("مسح الباركود",`
  <p>يمكن استخدام كاميرا الهاتف لمسح باركود الشحنة بعد إضافة وحدة المسح وربطها بتحديث الشحنة.</p>
  <p class="muted">ميزة المسح بالكاميرا غير مفعّلة في هذه النسخة؛ لن أعرض زر مسح يوهمك بأنه يعمل وهو غير مربوط.</p>
  <label>رقم الشحنة / الباركود</label>
  <input id="manualBarcode" placeholder="أدخل رقم الشحنة">
  <button class="btn primary full" onclick="findBarcode()">بحث عن الشحنة</button>
 `);
};

window.findBarcode=()=>{
 const code=$("manualBarcode").value.trim();
 const o=orders.find(x=>x.trackingId===code||x.id===code);
 if(!o){toast("لم يتم العثور على الشحنة");return}
 closeModal();details(o.id);
};

$("bottomAdd").onclick=()=>newOrder();
document.querySelectorAll("[data-page]").forEach(b=>{
 b.onclick=()=>{
  if(b.dataset.page==="home"){activeFilter="all";render()}
  if(b.dataset.page==="orders"){activeFilter="all";renderFilters();renderOrders()}
  if(b.dataset.page==="account")showStatement();
 };
});

</script>
</body>
</html>
