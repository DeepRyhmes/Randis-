body.theme-store{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;line-height:1.5}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}

/* Header */
header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.brand{font-size:18px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.brand span{color:var(--accent)}

.container{max-width:1100px;margin:auto;padding:16px}

/* Login Screen */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--soft),var(--bg))}
.login-card{background:var(--card-bg);width:100%;max-width:400px;padding:32px;border-radius:24px;box-shadow:var(--shadow-lg);animation:rise .4s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.login-logo{text-align:center;font-size:28px;font-weight:900;color:var(--primary);margin-bottom:4px}
.login-logo span{color:var(--accent)}
.role-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.role-option{padding:14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--card-bg);font-weight:700;transition:all .2s ease;text-align:center}
.role-option.active{border-color:var(--accent);background:var(--accent-glow);color:var(--primary);box-shadow:0 0 0 4px var(--accent-glow)}

/* Fields & Inputs */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--card-bg);color:var(--text);outline:none;transition:all .2s ease}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);border-radius:6px}
