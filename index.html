<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123B68">
<title>Randis × Box It</title>

<style>
:root{
  --navy:#123B68;
  --blue:#2585C5;
  --sky:#DFF3FF;
  --bg:#F4F8FC;
  --white:#fff;
  --text:#172B3D;
  --muted:#718096;
  --green:#16845B;
  --red:#D92D3A;
  --orange:#BD6B09;
  --border:#E3EDF4;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
  background:linear-gradient(120deg,var(--navy),#1b6095);
  color:white;
  padding:18px;
  border-radius:0 0 22px 22px;
}
.header-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:21px;font-weight:900}
.logo small{
  display:block;
  font-size:10px;
  font-weight:400;
  letter-spacing:1px;
}
.user-info{font-size:12px;margin-top:10px;opacity:.9}

.container{
  max-width:1050px;
  margin:auto;
  padding:15px 13px 85px;
}
h2{font-size:18px}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:18px 2px 12px;
}
.panel,.card{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 5px 18px #123b680d;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  min-height:85px;
}
.stat small{color:var(--muted)}
.stat strong{
  display:block;
  font-size:21px;
  margin-top:7px;
  color:var(--navy);
  overflow-wrap:anywhere;
}
.green strong{color:var(--green)}
.red strong{color:var(--red)}

.nav-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.nav-card{
  text-align:right;
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px 13px;
  min-height:100px;
  color:var(--navy);
  box-shadow:0 5px 18px #123b680d;
}
.nav-card span{font-size:25px}
.nav-card b{display:block;margin-top:8px}
.nav-card small{color:var(--muted)}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:bold;
}
.primary{background:var(--blue);color:white}
.dark{background:var(--navy);color:white}
.soft{background:var(--sky);color:var(--navy)}
.danger{background:#feecee;color:var(--red)}
.outline{background:white;border:1px solid var(--border);color:var(--navy)}
.small{padding:7px 10px;font-size:12px}
.full{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:7px}

.field{margin:11px 0}
.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}
.field input,.field select,.field textarea,.search{
  width:100%;
  border:1px solid #d8e4ed;
  border-radius:10px;
  padding:11px;
  background:white;
  color:var(--text);
}
.field textarea{min-height:75px}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 9px;
}

.order{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  margin:10px 0;
}
.order.urgent{border:2px solid var(--red)}
.order-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.order-name{font-size:16px;font-weight:bold}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 12px;
  font-size:12px;
  color:var(--muted);
  margin:9px 0;
}
.badge{
  display:inline-block;
  border-radius:20px;
  padding:5px 9px;
  font-size:11px;
  font-weight:bold;
  background:#edf4f9;
  color:var(--navy);
}
.badge.done{background:#e5f7ef;color:#08734a}
.badge.return{background:#feecee;color:#b21f2b}
.badge.progress{background:#fff1d8;color:#995500}
.order-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}
.order-actions button{font-size:12px}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px 0;
}
.tab{
  white-space:nowrap;
  border:1px solid var(--border);
  border-radius:20px;
  padding:8px 12px;
  background:white;
  color:var(--navy);
  font-size:12px;
}
.tab.active{background:var(--navy);color:white}

.money-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}
.muted{color:var(--muted);font-size:12px}
.empty{
  text-align:center;
  padding:25px 12px;
  color:var(--muted);
  background:white;
  border:1px dashed #cbdbe7;
  border-radius:14px;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#ffffffed;
  border-top:1px solid var(--border);
  padding:9px 13px;
}
.modal-back{
  position:fixed;
  inset:0;
  background:#10283d80;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
  z-index:20;
}
.modal{
  background:white;
  width:min(100%,520px);
  max-height:92vh;
  overflow:auto;
  border-radius:17px;
  padding:17px;
}
.toast{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  background:var(--navy);
  color:white;
  padding:12px;
  text-align:center;
  border-radius:11px;
  z-index:50;
}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px;font-size:12px}
td,th{padding:10px;border-bottom:1px solid var(--border);text-align:right}
th{background:var(--sky);color:var(--navy)}

@media(min-width:650px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .nav-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" style="max-width:420px;margin:9vh auto;padding:15px">
  <div class="panel">
    <div class="logo" style="color:#123B68">
      Randis × Box It
      <small style="color:#718096">LOGISTICS MANAGEMENT</small>
    </div>

    <h2 style="margin-top:25px">تسجيل الدخول</h2>

    <div class="field">
      <label>الحساب</label>
      <select id="loginAccount">
        <option value="rand">Randis – المتجر</option>
        <option value="bahaa">Box It – الإدارة</option>

<!-- التطبيق -->
<div id="appScreen" class="hidden">

  <header>
    <div class="header-line">
      <div class="logo">
        Randis × Box It
        <small>LOGISTICS MANAGEMENT</small>
      </div>
      <button class="btn outline small" id="logoutButton">خروج</button>
    </div>
    <div class="user-info" id="userInfo"></div>
  </header>

  <main class="container">
    <div id="page"></div>
  </main>

  <div class="bottom hidden" id="bottomBar">
    <button class="btn dark full" id="homeButton">⌂ الرئيسية</button>
  </div>

</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script type="module">

  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* إعدادات مشروع Firebase الحالي */
const firebaseConfig = {
  apiKey: "AIzaSyDUuf6K7I7HXiT_8CChLH9B5eDpmiDalk",
  authDomain: "order-manger-848ce.firebaseapp.com",
  projectId: "order-manger-848ce",
  storageBucket: "order-manger-848ce.firebasestorage.app",
  messagingSenderId: "174411866795",
  appId: "1:174411866795:web:68f53f6fd06c6cd5e7cdee"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* الحسابات */
const ACCOUNTS = {
  rand: {
    email: "rand@randis.app",
    role: "store",
    name: "Randis"
  },
  bahaa: {
    email: "bahaa@boxit.app",
    role: "admin",
    name: "Box It"
  }
};

/* مجموعات قاعدة البيانات الحالية */
const DB = {
  orders: collection(db,"orders"),
  drivers: collection(db,"drivers"),
  transfers: collection(db,"transfers"),
  history: collection(db,"accounting_history"),
  events: collection(db,"order_events")
};

/* حالات الطلب */
const STATUS = {
  NEW:"طلب جديد",
  ASSIGNED:"مُسند للسائق",
  PICKUP:"طلب استلام",
  RECEIVED:"تم الاستلام",
  SORTED:"تم الفرز",
  LOADED:"تم التحميل",
  OUT:"خرج للتوصيل",
  PROGRESS:"قيد التوصيل",
  DELIVERED:"تم التسليم",
  PARTIAL:"تسليم جزئي",
  RETURNED:"مرتجع",
  DEFERRED:"مؤجل",
  UNREACHABLE:"تعذّر الوصول",
  CANCELLED:"ملغي",
  DAMAGED:"تالف"
};

const TERMINAL = [
  STATUS.DELIVERED,
  STATUS.PARTIAL,
  STATUS.RETURNED,
  STATUS.CANCELLED,
  STATUS.DAMAGED
];

/* بيانات التطبيق */
let currentUser = null;
let currentRole = null;
let currentPage = "home";
let orders = [];
let drivers = [];
let transfers = [];
let history = [];
let accounting = {
  collected:0,
  deliveryFees:0,
  net:0,
  cycleId:"0001"
};
let selectedDriver = "";
let activeFilter = "all";
let listeners = [];

/* أدوات مساعدة */
const $ = id => document.getElementById(id);

const money = n =>
  Number(n || 0).toFixed(2) + " د.أ";

const escapeHTML = value =>
  String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));

function toast(message){
  $("toastHost").innerHTML =
    `<div class="toast">${escapeHTML(message)}</div>`;

  setTimeout(()=>{
    $("toastHost").innerHTML = "";
  },3000);
}

function showModal(title,content,callback){
  $("modalHost").innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">
        <div class="section-head">
          <h3>${title}</h3>
          <button class="btn outline small" id="closeModal">إغلاق</button>
        </div>
        ${content}
      </div>
    </div>
  `;

  $("closeModal").onclick = closeModal;

  $("modalBack").onclick = e => {
    if(e.target.id === "modalBack") closeModal();
  };

  if(callback) callback();
}

function closeModal(){
  $("modalHost").innerHTML = "";
}

function go(page){
  currentPage = page;
  activeFilter = "all";
  render();
}

function dateValue(value){
  if(value?.toDate) return value.toDate();
  if(value?.seconds) return new Date(value.seconds * 1000);

  const date = new Date(value);
  return isNaN(date) ? null : date;
}

function orderDate(order){
  return dateValue(
    order.updatedAt ||
    order.createdAt ||
    order.originalDate
  );
}

function statusStyle(status){
  if([STATUS.DELIVERED,STATUS.PARTIAL].includes(status))
    return "done";

  if(status === STATUS.RETURNED || status === STATUS.DAMAGED)
    return "return";

  if([
    STATUS.ASSIGNED,
    STATUS.PROGRESS,
    STATUS.OUT,
    STATUS.LOADED,
    STATUS.RECEIVED
  ].includes(status))
    return "progress";

  return "";
}
