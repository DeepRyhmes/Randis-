
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172c48">
<title>Randis × Box It | Logistics OS</title>

<style>
:root{--navy:#172c48;--blue:#2796d2;--pink:#d85d86;--burgundy:#70243e;--bg:#f3f6fa;--white:#fff;--text:#202b3c;--muted:#788397;--green:#16865c;--red:#c94d56;--orange:#c98228;--line:#e7ebf1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Tahoma,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
header{background:var(--navy);color:#fff;padding:15px 17px;position:sticky;top:0;z-index:4}
.store-head{background:var(--burgundy)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:21px;font-weight:800}
.brand small{display:block;font-size:11px;font-weight:400;opacity:.78;margin-top:4px}
.container{max-width:1180px;margin:auto;padding:16px 14px 95px}
.muted{color:var(--muted);font-size:12px}
h2{font-size:19px;margin:19px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.btn{padding:11px 13px;border-radius:11px;font-weight:700;background:#e9edf3;color:var(--navy)}
.primary{background:var(--blue);color:#fff}
.store-head~* .primary{background:var(--pink)}
.dark{background:var(--navy);color:#fff}
.danger{background:#ffebed;color:var(--red)}
.success{background:#e5f5ed;color:var(--green)}
.outline{background:transparent;border:1px solid #dce2eb;color:inherit}
.small{padding:7px 9px;font-size:12px}
.full{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 12px #172c4809;margin-bottom:11px}
.stat .number{font-size:23px;font-weight:800;margin-top:7px}
.stat .label{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.actions button{flex:1;min-width:105px}
.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 12px}
.tab{white-space:nowrap;border-radius:25px;padding:9px 13px;background:#fff;color:#536174;font-size:12px}
.tab.active{background:var(--navy);color:#fff}
input,select,textarea{width:100%;padding:11px;border:1px solid #dce2eb;border-radius:10px;background:#fff;margin:5px 0 12px;outline:none;color:var(--text)}
label{font-size:12px;font-weight:700;display:block}
textarea{min-height:72px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.order{border-right:4px solid var(--blue)}
.store-order{border-right-color:var(--pink)}
.order-top{display:flex;justify-content:space-between;gap:8px}
.order-name{font-weight:800}
.badge{font-size:11px;padding:6px 9px;border-radius:20px;background:#e9edf3;white-space:nowrap}
.b-new{background:#e5f1ff;color:#2872b6}
.b-progress{background:#fff2da;color:#a36a14}
.b-done{background:#e1f5e9;color:#16865c}
.b-return{background:#ffe8e8;color:#bd414b}
.b-delay{background:#f1eaff;color:#7954ae}
.b-cancel{background:#eee;color:#777}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e8ef;padding:9px;display:flex;gap:7px;justify-content:center;z-index:5}
.bottom button{flex:1;max-width:210px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:#10182799;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:19px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.login{max-width:420px;margin:12vh auto;padding:16px}
.login .card{padding:24px}
.toast{position:fixed;bottom:80px;left:15px;right:15px;max-width:430px;margin:auto;background:#172c48;color:#fff;padding:13px;border-radius:12px;text-align:center;z-index:20}
.line{height:1px;background:#edf0f4;margin:11px 0}
.timeline{border-right:2px solid #dce4ed;padding-right:14px;margin:14px 4px}
.event{position:relative;margin-bottom:14px;font-size:13px}
.event:before{content:"";position:absolute;right:-20px;top:3px;width:9px;height:9px;background:var(--blue);border-radius:50%}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.side-tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}
.side-tabs button{white-space:nowrap}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700}
.notice{padding:11px;border-radius:10px;background:#fff6df;color:#8a621b;font-size:12px;line-height:1.7}
.login-brand{color:var(--navy)}
.pill{display:inline-block;border-radius:30px;padding:4px 8px;background:#edf1f6;font-size:11px}
@media(min-width:700px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.modal-bg{align-items:center}
.modal{border-radius:20px}
.container{padding-top:22px}
}
</style>
</head>

<body>

<div id="loginScreen" class="login">
<div class="card">
<div class="brand login-brand">
Randis × Box It
<small class="muted">LOGISTICS & DELIVERY MANAGEMENT</small>
</div>
<h2>تسجيل الدخول</h2>
<label>الحساب</label>
<select id="account">
<option value="rand">Randis – المتجر</option>
<option value="bahaa">Box It – الإدارة</option>
</select>
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button class="btn primary full" id="loginBtn">تسجيل الدخول</button>
<p id="loginError" class="muted"></p>
</div>
</div>

<div id="app" class="hidden">
<header id="header">
<div class="head">
<div class="brand" id="brandName">Box It</div>
<button class="btn outline small" id="logoutBtn">خروج</button>
</div>
<div id="roleInfo" class="muted" style="color:#ffffffb5;margin-top:7px"></div>
</header>

<main class="container">
<div id="modeSwitch" class="actions hidden">
<button class="btn dark" id="adminMode">وضع الإدارة</button>
<button class="btn" id="driverMode">وضع السائق</button>
</div>
<div class="side-tabs" id="navTabs"></div>
<section id="pageContent"></section>
</main>

<nav class="bottom">
<button class="btn" data-page="home">⌂ الرئيسية</button>
<button class="btn" data-page="orders">▤ الشحنات</button>
<button class="btn primary" id="bottomAdd">＋ إضافة</button>
<button class="btn" data-page="finance">▣ الحسابات</button>
</nav>
</div>

<div id="modalHost"></div>
<div id="toastHost"></div>

<script type="module">

import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,collection,addDoc,doc,updateDoc,onSnapshot,serverTimestamp,query,where}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig={
apiKey:'AIzaSyDUuf6K80I7HXiT_8CChLH9B5eDpmiDalk',
authDomain:'order-manger-848ce.firebaseapp.com',
projectId:'order-manger-848ce',
storageBucket:'order-manger-848ce.firebasestorage.app',
messagingSenderId:'174411866795',
appId:'1:174411866795:web:68f53f6fd06c6cd5e7cdee'
};

const fb=initializeApp(firebaseConfig);
const auth=getAuth(fb);
const db=getFirestore(fb);

const refs={
orders:collection(db,'orders'),
drivers:collection(db,'drivers'),
transfers:collection(db,'transfers'),
expenses:collection(db,'expenses'),
accounting:collection(db,'accounting_history'),
complaints:collection(db,'complaints')
};

const accounts={
rand:{email:'rand@randis.app',role:'store',name:'Randis'},
bahaa:{email:'bahaa@boxit.app',role:'admin',name:'Box It'}
};

const S={
NEW:'طلب جديد',
PICKUP:'طلب استلام',
RECEIVED:'تم الاستلام',
SORTED:'تم الفرز',
LOADED:'تم التحميل',
PROGRESS:'قيد التوصيل',
DELIVERED:'تم التسليم',
PARTIAL:'استلام جزئي',
RETURNED:'مرتجع',
DEFERRED:'مؤجل',
UNREACHABLE:'تعذر الوصول',
CANCELLED:'ملغي',
DAMAGED:'تالف'
};

let user=null,role='',mode='admin',page='home';
let orders=[],drivers=[],transfers=[],expenses=[],unsubs=[];
let activeFilter='all',searchTerm='';

const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toFixed(2)+' د.أ';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const isStore=()=>role==='store';
const isDriver=()=>role==='admin'&&mode==='driver';

function canEditOrderValue(o){
return (role==='admin'&&mode==='admin')||
(role==='store'&&o.createdBy===user?.uid);
}

function toast(m){
$('toastHost').innerHTML=`<div class="toast">${esc(m)}</div>`;
setTimeout(()=>$('toastHost').innerHTML='',3000);
}

function closeModal(){
$('modalHost').innerHTML='';
}
window.closeModal=closeModal;

function modal(title,html){
$('modalHost').innerHTML=`
<div class="modal-bg" id="modalBg">
<div class="modal">
<div class="modal-head">
<h3>${title}</h3>
<button class="btn small" onclick="closeModal()">إغلاق ✕</button>
</div>
${html}
</div>
</div>`;
$('modalBg').onclick=e=>{
if(e.target.id==='modalBg')closeModal();
};
}

function statusClass(s){
if([S.DELIVERED,S.PARTIAL].includes(s))return'b-done';
if([S.RETURNED,S.DAMAGED].includes(s))return'b-return';
if(s===S.DEFERRED)return'b-delay';
if([S.NEW,S.PICKUP,S.RECEIVED].includes(s))return'b-new';
if(s===S.CANCELLED)return'b-cancel';
return'b-progress';
}

$('loginBtn').onclick=async()=>{
let a=accounts[$('account').value];
$('loginError').textContent='';
try{
await signInWithEmailAndPassword(auth,a.email,$('password').value);
}catch(e){
$('loginError').textContent='تعذر تسجيل الدخول. تأكد من كلمة المرور وأن الحساب موجود في Firebase Authentication.';
}
};

$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
unsubs.forEach(f=>f());
unsubs=[];

if(!u){
user=null;
$('loginScreen').classList.remove('hidden');
$('app').classList.add('hidden');
return;
}

user=u;
let a=Object.values(accounts).find(x=>x.email===u.email);

if(!a){
await signOut(auth);
return;
}

role=a.role;
mode=role==='store'?'store':'admin';

$('loginScreen').classList.add('hidden');
$('app').classList.remove('hidden');
subscribeData();
});

function subscribeData(){

let oq=isStore()
?query(refs.orders,where('createdBy','==',user.uid))
:query(refs.orders);

unsubs.push(onSnapshot(oq,s=>{
orders=s.docs.map(d=>({id:d.id,...d.data()}))
.sort((a,b)=>dateMs(b.createdAt)-dateMs(a.createdAt));
render();
},e=>toast('خطأ تحميل الطلبات: '+e.message)));

if(!isStore()){

unsubs.push(onSnapshot(refs.drivers,s=>{
drivers=s.docs.map(d=>({id:d.id,...d.data()}));
if(page==='drivers')render();
},e=>console.warn(e)));

unsubs.push(onSnapshot(refs.transfers,s=>{
transfers=s.docs.map(d=>({id:d.id,...d.data()}));
if(page==='finance')render();
},e=>console.warn(e)));

unsubs.push(onSnapshot(refs.expenses,s=>{
expenses=s.docs.map(d=>({id:d.id,...d.data()}));
if(page==='finance'||page==='reports')render();
},e=>console.warn(e)));

}
}

function dateMs(v){
if(!v)return 0;
if(v.toDate)return v.toDate().getTime();
let d=new Date(v);
return isNaN(d)?0:d.getTime();
}

function dateText(v){
return dateMs(v)?new Date(dateMs(v)).toLocaleString('ar-JO'):'—';
}

function tabs(){

let t=isStore()
?[
['home','الرئيسية'],
['orders','الشحنات'],
['finance','كشف الحساب'],
['complaints','الشكاوى']
]
:[
['home','الرئيسية'],
['orders','الشحنات'],
['drivers','المندوبون'],
['warehouse','المستودع'],
['finance','المالية'],
['reports','التقارير'],
['complaints','الشكاوى']
];

$('navTabs').innerHTML=t.map(([k,n])=>
`<button class="tab ${page===k?'active':''}" onclick="go('${k}')">${n}</button>`
).join('');

}

window.go=p=>{
page=p;
render();
};

function stat(l,v){
return`<div class="card stat"><div class="label">${l}</div><div class="number">${v}</div></div>`;
}

function delivered(){
return orders.filter(o=>[S.DELIVERED,S.PARTIAL].includes(o.status));
}

function active(){
return orders.filter(o=>![S.DELIVERED,S.PARTIAL,S.RETURNED,S.CANCELLED].includes(o.status));
}

function render(){

if(!user)return;

$('header').className=isStore()?'store-head':'';
$('brandName').innerHTML=isStore()
?'Randis<small>STORE PORTAL</small>'
:'Box It<small>LOGISTICS OPERATIONS</small>';

$('roleInfo').textContent=isStore()?'بوابة التاجر':'إدارة العمليات والتوصيل';
$('modeSwitch').classList.toggle('hidden',isStore());

$('adminMode').className=mode==='admin'?'btn primary':'btn';
$('driverMode').className=mode==='driver'?'btn primary':'btn';

tabs();

let c=$('pageContent');

if(page==='home')c.innerHTML=homeHtml();
else if(page==='orders')c.innerHTML=ordersHtml();
else if(page==='drivers')c.innerHTML=driversHtml();
else if(page==='warehouse')c.innerHTML=warehouseHtml();
else if(page==='finance')c.innerHTML=financeHtml();
else if(page==='reports')c.innerHTML=reportsHtml();
else if(page==='complaints')c.innerHTML=complaintsHtml();
}

function homeHtml(){

let d=delivered(),a=active();

return`
<h2>${isStore()?'لوحة Randis':'لوحة عمليات Box It'}</h2>
<div class="grid">
${stat('إجمالي الشحنات',orders.length)}
${stat('الشحنات النشطة',a.length)}
${stat('تم التسليم',d.length)}
${stat('المرتجعات',orders.filter(o=>o.status===S.RETURNED).length)}
${stat('مبالغ التحصيل المسجلة',money(d.reduce((x,o)=>x+Number(o.collectedAmount??o.deliveredAmount??0),0)))}
${stat('أجور التوصيل للشحنات المسلّمة',money(d.reduce((x,o)=>x+Number(o.deliveryFee||0),0)))}
</div>
<div class="card">
<h3>إجراءات سريعة</h3>
<div class="actions">
<button class="btn primary" onclick="newOrder()">＋ إنشاء شحنة</button>
<button class="btn" onclick="go('orders')">عرض الشحنات</button>
${!isStore()?'<button class="btn" onclick="newDriver()">＋ إضافة مندوب</button><button class="btn" onclick="newExpense()">＋ تسجيل مصروف</button>':''}
</div>
</div>
<div class="notice">
تنبيه محاسبي: قيمة COD ليست إيراداً للشركة؛ أجرة التوصيل والرسوم المتفق عليها هي إيراد Box It. لا تعتمد أي تسوية نهائية قبل مطابقة المبالغ المحصلة فعلياً والعهدة.
</div>`;
}

function ordersHtml(){

let list=[...orders];

if(activeFilter!=='all'){
let map={
new:S.NEW,pickup:S.PICKUP,received:S.RECEIVED,
loaded:S.LOADED,progress:S.PROGRESS,
delivered:'done',returned:S.RETURNED
};
let f=map[activeFilter];
list=list.filter(o=>f==='done'
?[S.DELIVERED,S.PARTIAL].includes(o.status)
:o.status===f);
}

if(searchTerm){
list=list.filter(o=>
[o.customer,o.phone,o.area,o.trackingId,o.id]
.some(v=>String(v||'').toLowerCase().includes(searchTerm))
);
}

let fs=[
['all','الكل'],['new','جديدة'],['pickup','استلام'],
['received','مستلمة'],['loaded','محمّلة'],
['progress','قيد التوصيل'],['delivered','مسلمة'],
['returned','مرتجعة']
];

return`
<h2>إدارة الشحنات</h2>
<div class="actions">
<button class="btn primary" onclick="newOrder()">＋ شحنة جديدة</button>
${!isStore()?'<button class="btn" onclick="requestPickup()">تأكيد استلام طلبات المتجر</button>':''}
<button class="btn" onclick="exportOrders()">تصدير CSV</button>
</div>
<input id="orderSearch" placeholder="بحث بالاسم أو الهاتف أو المنطقة أو رقم التتبع"
value="${esc(searchTerm)}" oninput="setSearch(this.value)">
<div class="tabs">
${fs.map(([k,n])=>`<button class="tab ${activeFilter===k?'active':''}" onclick="setFilter('${k}')">${n}</button>`).join('')}
</div>
${list.length?list.map(orderCard).join(''):'<div class="card empty">لا توجد شحنات في هذا القسم</div>'}`;
}

function orderCard(o){

return`
<div class="card order ${isStore()?'store-order':''}">
<div class="order-top">
<div>
<div class="order-name">${esc(o.customer||'بدون اسم')}</div>
<div class="muted">${esc(o.area||'')} · ${esc(o.phone||'')}</div>
</div>
<span class="badge ${statusClass(o.status)}">${esc(o.status||S.NEW)}</span>
</div>
<div class="line"></div>
<div class="muted">تتبع: ${esc(o.trackingId||o.id.slice(0,9))} · ${dateText(o.createdAt)}</div>
<b>${money(o.price)}</b>
<div class="actions">
<button class="btn small" onclick="details('${o.id}')">التفاصيل</button>
${!isStore()?`
<button class="btn primary small" onclick="changeStatus('${o.id}')">تحديث الحالة</button>
<button class="btn small" onclick="assignDriver('${o.id}')">إسناد لمندوب</button>`:''}
${canEditOrderValue(o)?`<button class="btn small" onclick="editOrderValue('${o.id}')">تعديل قيمة الطلب</button>`:''}
</div>
</div>`;
}

window.setFilter=k=>{
activeFilter=k;
render();
};

window.setSearch=v=>{
searchTerm=v.toLowerCase();
let p=$('orderSearch');
let pos=p?.selectionStart;
render();
let np=$('orderSearch');
np?.focus();
if(pos!==undefined)np?.setSelectionRange(pos,pos);
};

/* إنشاء شحنة - تم إصلاح ربط زر الحفظ */
window.newOrder=()=>{

modal('إنشاء شحنة',`
<div class="row">
<div><label>اسم المستلم</label><input id="fCustomer"></div>
<div><label>رقم الهاتف</label><input id="fPhone" inputmode="tel"></div>
</div>
<div class="row">
<div><label>المنطقة</label><input id="fArea"></div>
<div><label>قيمة التحصيل COD</label><input id="fPrice" type="number" min="0" step=".01"></div>
</div>
<div class="row">
<div><label>أجرة التوصيل</label><input id="fFee" type="number" min="0" step=".01" value="2"></div>
<div>
<label>طريقة التحصيل</label>
<select id="fPay">
<option>نقداً</option><option>محفظة إلكترونية</option><option>تحويل بنكي</option>
</select>
</div>
</div>
<label>ملاحظات وعنوان تفصيلي</label>
<textarea id="fNotes"></textarea>
<label><input id="fUrgent" type="checkbox" style="width:auto"> شحنة مستعجلة</label>
<button class="btn primary full" id="saveOrder">حفظ الشحنة</button>
`);

/* الربط صار بعد إنشاء الزر داخل النافذة */
$('saveOrder').onclick=saveOrder;
};

async function saveOrder(){

let customer=$('fCustomer').value.trim();
let phone=$('fPhone').value.trim();
let area=$('fArea').value.trim();
let price=Number($('fPrice').value);
let fee=Number($('fFee').value||0);

if(!customer||!phone||!area||!Number.isFinite(price)||price<0||fee<0)
return toast('أكمل البيانات وتأكد من المبالغ');

let now=new Date().toISOString();

try{
let ref=await addDoc(refs.orders,{
customer,phone,area,price,deliveryFee:fee,
paymentMethod:$('fPay').value,
notes:$('fNotes').value.trim(),
isUrgent:$('fUrgent').checked,
status:isStore()?S.NEW:S.RECEIVED,
feePaid:false,accounted:false,collectedAmount:0,
createdBy:user.uid,createdByEmail:user.email,
createdAt:serverTimestamp(),
events:[{
status:isStore()?S.NEW:S.RECEIVED,
note:'إنشاء الشحنة',by:user.email,at:now
}]
});

await updateDoc(doc(db,'orders',ref.id),{
trackingId:'BX'+Date.now().toString().slice(-9)
});

closeModal();
toast('تم إنشاء الشحنة');
}catch(e){
toast('تعذر الحفظ: '+e.message);
}
}

/* تعديل قيمة COD */
window.editOrderValue=id=>{

let o=orders.find(x=>x.id===id);
if(!o||!canEditOrderValue(o))return toast('غير مصرح بتعديل قيمة هذا الطلب');

modal('تعديل قيمة الطلب',`
<div class="notice">قيمة التحصيل COD الحالية: ${money(o.price)}</div>

window.saveOrderValue=async id=>{

let o=orders.find(x=>x.id===id);
if(!o||!canEditOrderValue(o))return toast('غير مصرح بتعديل القيمة');

let price=Number($('editCOD').value);
if(!Number.isFinite(price)||price<0)return toast('أدخل قيمة صحيحة');

let patch={price,updatedAt:serverTimestamp()};

if([S.DELIVERED,S.PARTIAL].includes(o.status)){
patch.collectedAmount=price;
patch.deliveredAmount=price;
}

try{
await updateDoc(doc(db,'orders',id),patch);
closeModal();
toast('تم تعديل قيمة الطلب');
}catch(e){toast('تعذر تعديل القيمة: '+e.message);}
};

/* تحديث الحالة */
window.changeStatus=id=>{

let o=orders.find(x=>x.id===id);
if(!o)return;

let choices=isDriver()
?[S.PROGRESS,S.DELIVERED,S.PARTIAL,S.RETURNED,S.DEFERRED,S.UNREACHABLE,S.DAMAGED]
:Object.values(S);

modal('تحديث حالة الشحنة',`
<label>الحالة</label>
<select id="newStatus">
${choices.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
</select>
<div class="notice">
عند اختيار "${S.DELIVERED}" أو "${S.PARTIAL}" سيتم اعتماد قيمة COD المسجلة في الطلب تلقائياً، دون إدخال مبلغ التحصيل يدوياً.
</div>
<label>ملاحظة</label>
<textarea id="statusNote"></textarea>
<button class="btn primary full" onclick="saveStatus('${id}')">حفظ التحديث</button>
`);
};

window.saveStatus=async id=>{

let o=orders.find(x=>x.id===id);
if(!o)return;

if(isStore())return toast('غير مصرح بتغيير حالة الشحنة');

let status=$('newStatus').value;
let note=$('statusNote').value.trim();

let ev=[
...(o.events||[]),
{status,note,by:user.email,at:new Date().toISOString()}
];

let patch={status,events:ev,updatedAt:serverTimestamp()};

if([S.DELIVERED,S.PARTIAL].includes(status)){
patch.collectedAmount=Number(o.price||0);
patch.deliveredAmount=Number(o.price||0);
}

try{
await updateDoc(doc(db,'orders',id),patch);
closeModal();
toast('تم تحديث الحالة واعتماد قيمة COD');
}catch(e){toast('فشل التحديث: '+e.message);}
};

/* تصدير الطلبات CSV */
window.exportOrders=()=>{

let rows=[
['رقم التتبع','الاسم','الهاتف','المنطقة','قيمة COD','أجرة التوصيل','المبلغ المحصل','الحالة','المندوب'],
...orders.map(o=>[
o.trackingId||o.id,o.customer,o.phone,o.area,o.price,o.deliveryFee,
o.collectedAmount??o.deliveredAmount??0,o.status,o.driverName||''
])
];

let csv='\uFEFF'+rows.map(r=>
r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')
).join('\n');

let a=document.createElement('a');
let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
a.href=url;
a.download='boxit-orders.csv';
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};
